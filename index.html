<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e0f2fe">
    <title>Kids Teacher - Welcome</title>

    <link rel="preload" href="welcome_bg.png" as="image" fetchpriority="high">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; background-color: #e0f2fe; overflow: hidden; }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: #e0f2fe; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.3s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #ffffff; border-top: 5px solid #FF6B35;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-family: 'Fredoka', sans-serif; font-size: 20px; color: #8B3A00; font-weight: 600; }

        /* Welcome Content */
        #welcome-content {
            display: none; position: relative; width: 100vw; height: 100vh; height: 100dvh;
            flex-direction: column; justify-content: flex-end; align-items: center;
            background-color: #fce7f3; background-image: url('welcome_bg.png');
            background-size: cover; background-position: center top; background-repeat: no-repeat;
        }

        /* Niche se nikalne wala Glass Bar */
        .bottom-glass-bar {
            position: relative; width: 100%; max-width: 500px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 40px 40px 0 0;
            padding: 30px 20px 40px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1), inset 0 2px 2px rgba(255,255,255,0.8);
            /* Animation */
            transform: translateY(100%);
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 0.2s;
            border-top: 1px solid rgba(255,255,255,0.9);
        }

        @keyframes slideUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }

        .text-content { margin-bottom: 20px; }
        .text-content h1 {
            font-family: 'Fredoka', sans-serif; font-size: clamp(24px, 6vw, 32px);
            color: #8B3A00; font-weight: 700; line-height: 1.2; margin-bottom: 8px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }
        .text-content p { font-family: 'Nunito', sans-serif; font-size: clamp(13px, 4vw, 16px); color: #6B5B4D; font-weight: 700; }

        .start-btn {
            position: relative; width: 100%; max-width: 350px; padding: 18px 20px;
            font-size: 20px; font-family: 'Fredoka', sans-serif; font-weight: 700; color: white;
            background: #FF6B35; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 0 #cc4e20, 0 10px 20px rgba(255, 107, 53, 0.4);
            transition: transform 0.1s; animation: pulseBtn 2s infinite;
        }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #cc4e20; animation: none; }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="spinner"></div>
        <div class="loading-text">Loading Adventure...</div>
    </div>

    <div id="welcome-content">
        <!-- Glass Bar (Neeche se aayega) -->
        <div class="bottom-glass-bar">
            <div class="text-content">
                <h1>Learning Is an<br>Adventure!</h1>
                <p>Explore, discover and grow every day.</p>
            </div>
            <button class="start-btn" id="startBtn">Let's Start →</button>
        </div>
    </div>

    <script>
        const splash = document.getElementById('splash-screen');
        const welcomeContent = document.getElementById('welcome-content');

        function showWelcome() {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                welcomeContent.style.display = 'flex';
            }, 220);
        }

        const bgImg = new Image();
        bgImg.fetchPriority = "high";
        bgImg.src = 'welcome_bg.png';

        if (bgImg.complete) { showWelcome(); } 
        else { bgImg.onload = showWelcome; bgImg.onerror = showWelcome; }
        setTimeout(() => { if (splash.style.display !== 'none') showWelcome(); }, 500);

        document.getElementById('startBtn').addEventListener('click', () => {
            window.location.href = 'login.html'; // Seedha login page
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(console.log); });
        }
    </script>
</body>
</html>
