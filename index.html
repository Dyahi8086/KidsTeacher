<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Teacher - Welcome</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #e0f2fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Container - Fast Load */
        .welcome-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Mobile fit */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 40px; 
            
            /* Aapki Original Background */
            background-image: url('welcome_bg.png');
            background-size: cover; 
            background-position: top center; 
            background-repeat: no-repeat;
        }

        /* Text Area */
        .text-content {
            text-align: center;
            margin-bottom: 20px;
            width: 90%;
            z-index: 10;
        }

        .text-content h1 {
            font-size: 24px; 
            color: #ff5733; /* Orange color */
            margin-bottom: 5px;
            font-weight: 800;
        }

        .text-content p {
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }

        /* Button */
        .start-btn {
            width: 85%;
            max-width: 320px;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 800;
            color: white;
            background: linear-gradient(145deg, #ff7a59, #ff5733); 
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 8px 0 #c0392b, 0 10px 15px rgba(0,0,0,0.2);
            transition: all 0.1s ease; 
        }

        /* Button Click Effect */
        .start-btn:active {
            transform: translateY(8px); 
            box-shadow: 0 0px 0 #c0392b, 0 5px 10px rgba(0,0,0,0.2);
        }
    </style>

    <!-- Image Preload -->
    <link rel="preload" as="image" href="welcome_bg.png">
</head>
<body>

    <div class="welcome-container">
        
        <div class="text-content">
            <h1>Welcome to Kids Teacher</h1>
            <p>A magical learning journey for your little ones</p>
        </div>

        <!-- YAHAN CLICK KARNE PAR LOGIN PAGE KHULEGA -->
        <button class="start-btn" onclick="goToLogin()">Let's Start 🚀</button>

    </div>

    <script>
        function goToLogin() {
            // Yeh line aapke login page (login.html) par le jayegi
            window.location.href = "login.html"; 
        }
    </script>
</body>
</html>
