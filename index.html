<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4511E">
<title>Kids Teacher</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#F4511E}
#splash-screen{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,#FF7043 0%,#F4511E 48%,#E64A19 100%);isolation:isolate}
#splash-screen:before{content:"";position:absolute;width:85vw;height:85vw;max-width:520px;max-height:520px;border-radius:50%;background:rgba(255,255,255,.09);top:-28%;right:-22%}
#splash-screen:after{content:"";position:absolute;width:110vw;height:110vw;max-width:680px;max-height:680px;border-radius:50%;background:rgba(255,190,120,.12);bottom:-62%;left:-25%}
.brand{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;animation:brandReveal 3.8s cubic-bezier(.2,.7,.25,1) both}
.logo-mark{width:clamp(104px,30vw,142px);height:clamp(104px,30vw,142px);border:4px solid rgba(255,255,255,.95);border-radius:36px;display:grid;place-items:center;background:rgba(255,255,255,.13);box-shadow:0 16px 40px rgba(130,35,10,.18),inset 0 2px 14px rgba(255,255,255,.22);font:900 clamp(65px,19vw,88px)/1 Nunito,sans-serif;letter-spacing:-5px}
.brand-name{font:900 clamp(37px,11vw,54px)/.98 Nunito,sans-serif;letter-spacing:1px;margin-top:24px;color:#fff;text-shadow:0 4px 14px rgba(120,35,10,.18)}
.brand-name span{display:block}
.loading{display:flex;gap:8px;margin-top:34px}
.loading i{display:block;width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse .9s ease-in-out infinite}
.loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.55;transform:scale(.7)}40%{opacity:1;transform:scale(1.2)}}
@keyframes brandReveal{0%{opacity:0;transform:scale(.78)}18%{opacity:1;transform:scale(1.04)}30%,78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.13)}}
@media(prefers-reduced-motion:reduce){.brand{animation:none;opacity:1}.loading i{animation:none}}
</style>
</head>
<body>
<div id="splash-screen" aria-label="Kids Teacher">
 <div class="brand">
  <div class="logo-mark" aria-hidden="true">K</div>
  <div class="brand-name"><span>KIDS</span><span>TEACHER</span></div>
  <div class="loading" aria-label="Loading"><i></i><i></i><i></i></div>
 </div>
</div>
<script>
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(()=>window.location.replace('index-home.html'),reduced?700:3800);
</script>
</body>
</html>
