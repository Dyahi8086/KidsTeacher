<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Teacher - Welcome</title>
    
    <!-- Google Fonts (Advanced: Variable Font for premium look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        /* --- ADVANCED CSS VARIABLES --- */
        :root {
            --primary-color: #ff5733;
            --primary-shadow: #c0392b;
            --text-color: #3b2a5c;
            --glass-bg: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', sans-serif; /* Advanced Font */
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #e0f2fe;
            overflow: hidden;
        }

        .welcome-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Advanced Mobile Fit */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 5vh; 
            
            background-image: url('welcome_bg.png');
            background-size: cover; 
            background-position: top center; 
            background-repeat: no-repeat;
        }

        /* --- ADVANCED GLASSMORPHISM TEXT BOX --- */
        .text-content {
            text-align: center;
            margin-bottom: 20px;
            width: 90%;
            padding: 15px 10px;
            /* Glass Effect */
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* Instant Load but Premium Glow Animation */
            animation: softGlow 3s infinite alternate;
        }

        .text-content h1 {
            font-size: 26px;
            color: var(--text-color);
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .text-content p {
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }

        /* --- ADVANCED 3D BUTTON WITH RIPPLE --- */
        .start-btn {
            position: relative;
            width: 85%;
            max-width: 320px;
            padding: 18px 20px;
            font-size: 20px;
            font-weight: 900;
            color: white;
            background: linear-gradient(145deg, #ff7a59, var(--primary-color)); 
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            z-index: 10;
            overflow: hidden; /* For Ripple effect */
            
            /* 3D Look */
            box-shadow: 0 8px 0 var(--primary-shadow), 0 15px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .start-btn:active {
            transform: translateY(8px); 
            box-shadow: 0 0px 0 var(--primary-shadow), 0 5px 10px rgba(0,0,0,0.2);
        }

        /* Advanced Ripple Animation */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* Advanced Soft Glow Keyframe */
        @keyframes softGlow {
            0% { box-shadow: 0 0 10px rgba(255,255,255,0.2); }
            100% { box-shadow: 0 0 20px rgba(255,255,255,0.6); }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        
        <!-- Text with Glass Effect -->
        <div class="text-content">
            <h1>Welcome to Kids Teacher</h1>
            <p>A magical learning journey for your little ones</p>
        </div>

        <!-- Button -->
        <button class="start-btn" id="startBtn">Let's Start 🚀</button>

    </div>

    <script>
        // ADVANCED JAVASCRIPT: Haptic Feedback & Ripple Effect
        const btn = document.getElementById('startBtn');

        btn.addEventListener('click', function(e) {
            // 1. Haptic Feedback (Phone vibrate hoga)
            if (navigator.vibrate) {
                navigator.vibrate(50); // 50 milliseconds ki vibration
            }

            // 2. Advanced Ripple Effect (Lehar banega)
            let x = e.clientX - e.target.offsetLeft;
            let y = e.clientY - e.target.offsetTop;
            
            let ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.width = ripple.style.height = `20px`; // Starting size
            
            this.appendChild(ripple);

            // Ripple ko thodi der baad hata do
            setTimeout(() => { ripple.remove(); }, 600);

            // 3. App Start Logic (0.3 sec delay taaki animation dikh jaye)
            setTimeout(() => {
                // window.location.href = "login.html"; // Aapka login page
                alert("App Starting..."); 
            }, 300);
        });
    </script>
</body>
</html>
