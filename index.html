<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#ff3b00">
    <title>Kids Teacher</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ff3b00;
        }

        /* =========================================
           STAGE 1-3: RED ORANGE SPLASH SCREEN
           ========================================= */

        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99990;
            overflow: hidden;

            background: linear-gradient(
                145deg,
                #ff3b00 0%,
                #ff4b00 48%,
                #ff2600 100%
            );
        }

        /* STEP 1: BUNNY K LOGO (Appears, holds, then shrinks out) */
        .kt-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 142px;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 132px;
            font-weight: 900;
            line-height: .88;
            letter-spacing: -12px;
            padding-right: 10px;

            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);

            animation: logoSequence 0.95s cubic-bezier(.22, 1, .36, 1) 0.1s forwards;
        }

        .kt-ears {
            position: absolute;
            width: 76px;
            height: 58px;
            top: 0;
            left: 39px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            z-index: 2;
        }

        .kt-ear {
            width: 29px;
            height: 59px;
            border: 10px solid #fff;
            border-radius: 50% 50% 45% 45%;
            background: transparent;
        }

        .kt-ear:first-child {
            transform: rotate(-12deg);
        }

        .kt-ear:last-child {
            transform: rotate(13deg);
        }

        .kt-face {
            position: absolute;
            z-index: 3;
            top: 75px;
            left: 57px;
            width: 38px;
            height: 28px;
            pointer-events: none;
        }

        .kt-eyes {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }

        .kt-eyes span {
            width: 6px;
            height: 9px;
            border-radius: 50%;
            background: #ff3b00;
        }

        .kt-smile {
            width: 17px;
            height: 9px;
            margin: 1px auto 0;
            border-bottom: 3px solid #ff3b00;
            border-radius: 0 0 15px 15px;
        }

        @keyframes logoSequence {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.55);
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.04);
            }
            38%, 75% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.25);
            }
        }

        /* STEP 2: APP NAME EXPANDS IN CENTER, THEN COLLAPSES INTO DOT */
        .kt-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: #fff;
            font-family: 'Nunito', Arial, sans-serif;
            font-size: clamp(24px, 6.8vw, 34px);
            font-weight: 900;
            letter-spacing: 1.5px;
            text-align: center;
            white-space: nowrap;

            opacity: 0;
            clip-path: inset(0 50% 0 50%);

            animation: titleSequence 1.05s cubic-bezier(.4, 0, .2, 1) 0.9s forwards;
        }

        @keyframes titleSequence {
            0% {
                opacity: 0;
                clip-path: inset(0 50% 0 50%);
                transform: translate(-50%, -50%) scale(0.92);
            }
            28% {
                opacity: 1;
                clip-path: inset(0 0% 0 0%);
                transform: translate(-50%, -50%) scale(1);
            }
            72% {
                opacity: 1;
                clip-path: inset(0 0% 0 0%);
                transform: translate(-50%, -50%) scale(1);
            }
            96% {
                opacity: 1;
                clip-path: inset(0 49% 0 49%);
                transform: translate(-50%, -50%) scale(0.35);
            }
            100% {
                opacity: 0;
                clip-path: inset(0 50% 0 50%);
                transform: translate(-50%, -50%) scale(0.1);
            }
        }

        /* STEP 3: GLOWING STAR-BURST — replaces the plain white dot */
        .kt-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 34px;
            height: 34px;
            opacity: 0;
            background: #fff;
            clip-path: polygon(
                50% 0%, 61% 36%, 100% 50%, 61% 64%,
                50% 100%, 39% 64%, 0% 50%, 39% 36%
            );
            filter:
                drop-shadow(0 0 7px #fff)
                drop-shadow(0 0 18px #ffe7a3)
                drop-shadow(0 0 34px #fff);
            transform: translate(-50%, -50%) scale(.15) rotate(0deg);
            animation: starBurstLaunch 0.9s cubic-bezier(.2,.8,.2,1) 1.88s both;
        }

        .kt-dot::before,
        .kt-dot::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            opacity: .9;
        }

        .kt-dot::before { transform: rotate(45deg) scale(.45, 1.5); }
        .kt-dot::after  { transform: rotate(-45deg) scale(.45, 1.5); }

        @keyframes starBurstLaunch {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.12) rotate(0deg);
            }
            18% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.25) rotate(35deg);
            }
            42% {
                opacity: 1;
                transform: translate(-50%, 105px) scale(.85) rotate(95deg);
            }
            72% {
                opacity: 1;
                transform: translate(-50%, -18vh) scale(1.8) rotate(190deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -42vh) scale(3.2) rotate(280deg);
            }
        }

    </style>
</head>

<body>

    <!-- KIDS TEACHER SPLASH SCREEN -->
    <div id="splash-screen" aria-label="Kids Teacher loading screen">

        <!-- 1. Bunny K Logo -->
        <div class="kt-mark" aria-hidden="true">
            K
            <div class="kt-ears">
                <span class="kt-ear"></span>
                <span class="kt-ear"></span>
            </div>
            <div class="kt-face">
                <div class="kt-eyes">
                    <span></span>
                    <span></span>
                </div>
                <div class="kt-smile"></div>
            </div>
        </div>

        <!-- 2. Brand Title -->
        <div class="kt-title">KIDS TEACHER</div>

        <!-- 3. Glowing Star-Burst Effect -->
        <div class="kt-dot" aria-hidden="true"></div>

    </div>

    <!-- AUTH CHECK: returning users with a complete profile go straight to Home -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
            authDomain: "kids-teacher-4387e.firebaseapp.com",
            projectId: "kids-teacher-4387e",
            storageBucket: "kids-teacher-4387e.firebasestorage.app",
            messagingSenderId: "420221167346",
            appId: "1:420221167346:web:da7ac80acdfd52339d526b",
            measurementId: "G-VJVS2ZMNLY"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const { getFirestore, doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
            const db = getFirestore(app);
            onAuthStateChanged(auth, async (user) => {
                window.__ktAuthResolved = true;
                window.__ktDestination = "./login.html";
                if (user) {
                    try {
                        const profile = await getDoc(doc(db, "users", user.uid));
                        const data = profile.exists() ? profile.data() : {};
                        if (data.childName) localStorage.setItem("kt_child_name", data.childName);
                        if (data.buddy?.id) localStorage.setItem("kt_selected_buddy", JSON.stringify(data.buddy));
                        window.__ktDestination = !data.childName
                            ? "./child-name.html"
                            : (data.buddy?.id ? "./index-home.html" : "./buddy-selection.html");
                    } catch (error) {
                        console.error("Profile routing check failed:", error);
                        let localBuddy = {};
                        try { localBuddy = JSON.parse(localStorage.getItem("kt_selected_buddy") || "{}"); } catch {}
                        window.__ktDestination = (localStorage.getItem("kt_child_name") && localBuddy.id)
                            ? "./index-home.html"
                            : (localStorage.getItem("kt_child_name") ? "./buddy-selection.html" : "./child-name.html");
                    }
                }
                if (window.__ktSplashFinished) window.location.replace(window.__ktDestination);
            }, (error) => {
                console.error("Splash auth check failed:", error);
                window.__ktAuthResolved = true;
                window.__ktDestination = "./login.html";
                if (window.__ktSplashFinished) window.location.replace(window.__ktDestination);
            });
        } catch (error) {
            console.error("Firebase splash initialization failed:", error);
            window.__ktAuthResolved = true;
            window.__ktDestination = "./login.html";
            if (window.__ktSplashFinished) window.location.replace(window.__ktDestination);
        }
    </script>

    <script>
        // Preserve the original splash animation. Route only after Firebase
        // confirms whether this visitor already has a saved login session.
        const dot = document.querySelector('.kt-dot');
        let routeStarted = false;

        function finishSplash() {
            window.__ktSplashFinished = true;
            if (routeStarted) return;
            if (window.__ktAuthResolved) {
                routeStarted = true;
                window.location.replace(
                    window.__ktDestination || './login.html'
                );
            }
        }

        if (dot) {
            dot.addEventListener('animationend', (event) => {
                if (event.animationName === 'starBurstLaunch') finishSplash();
            }, { once: true });
        }

        // Safety fallback if the browser skips the animation event.
        window.setTimeout(finishSplash, 3000);

        // If Firebase takes unusually long, do not leave the splash stuck.
        window.setTimeout(() => {
            if (!routeStarted && window.__ktSplashFinished && !window.__ktAuthResolved) {
                routeStarted = true;
                window.location.replace(window.__ktDestination || './login.html');
            }
        }, 5500);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
                    registration.update().catch(() => {});
                    if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (!sessionStorage.getItem('kt_sw_reloaded')) {
                            sessionStorage.setItem('kt_sw_reloaded', '1');
                            window.location.reload();
                        }
                    });
                } catch (error) {
                    console.log('Service Worker registration failed:', error);
                }
            });
        }
    </script>

</body>
</html>
