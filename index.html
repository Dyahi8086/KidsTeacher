<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#fff8eb">
<title>Kids Teacher | Parent Login</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fff8eb;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

button, input {
  font: inherit;
}

.app {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  overflow: hidden;
  background: #fff8eb;
}

.login-image {
  display: block;
  width: 100%;
  height: auto;
}

/*
  Transparent click zones positioned over the buttons
  in the original parent_login_ui.png image.

  These percentages are initial estimates based on the
  screenshot. Adjust them if your PNG has different dimensions
  or the buttons are positioned differently.
*/

.touch-zone {
  position: absolute;
  z-index: 5;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
}

/* Google button location in the original image */
#googleZone {
  left: 18%;
  top: 70.1%;
  width: 64%;
  height: 5.3%;
}

/* Email button location in the original image */
#emailZone {
  left: 18%;
  top: 76.0%;
  width: 64%;
  height: 5.3%;
}

/*
  The Google iframe is transparent to the image underneath.
  It receives taps directly, while the original image remains
  visually unchanged.
*/
#googleButtonHost {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 40px;
}

#googleButtonHost iframe {
  max-width: 100% !important;
}

.status {
  position: fixed;
  z-index: 50;
  left: 5%;
  right: 5%;
  bottom: max(16px, env(safe-area-inset-bottom));
  max-width: 500px;
  margin: auto;
  padding: 13px 16px;
  border-radius: 14px;
  background: #fff6e8;
  color: #68432e;
  box-shadow: 0 5px 22px #0002;
  font-size: 14px;
  line-height: 1.5;
  display: none;
  overflow-wrap: anywhere;
}

.status.show {
  display: block;
}

.email-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #24160dcc;
}

.email-overlay.show {
  display: flex;
}

.email-card {
  width: 100%;
  max-width: 380px;
  padding: 24px;
  border-radius: 24px;
  background: #fffaf0;
  color: #593b29;
  box-shadow: 0 10px 40px #0003;
}

.email-card h2 {
  text-align: center;
  margin: 0 0 10px;
}

.email-card p {
  font-size: 14px;
  line-height: 1.5;
}

.email-card input {
  width: 100%;
  min-height: 52px;
  margin: 8px 0;
  padding: 12px;
  border: 1px solid #dac8b8;
  border-radius: 12px;
  background: white;
  color: #38271d;
  font-size: 16px;
}

.email-card button {
  width: 100%;
  min-height: 50px;
  margin-top: 10px;
  border: 0;
  border-radius: 14px;
  background: #f39470;
  color: white;
  font-weight: bold;
}

.email-card .close {
  background: #eadfd5;
  color: #593b29;
}

.email-message {
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.5;
}

.fallback {
  display: none;
  padding: 30px 20px;
  text-align: center;
  color: #593b29;
}

.fallback button {
  min-height: 50px;
  padding: 12px 20px;
  border: 0;
  border-radius: 30px;
  background: #f39470;
  color: white;
}

@media (max-width: 380px) {
  #googleZone,
  #emailZone {
    height: 6%;
  }
}
</style>
</head>

<body>

<main class="app" id="app">

  <!-- Keep this image in the same repository folder as index.html -->
  <img
    class="login-image"
    id="loginImage"
    src="./parent_login_ui.png"
    alt="Kids Teacher Parent Login"
  >

  <!-- Original image's Google button: transparent hit area -->
  <div
    class="touch-zone"
    id="googleZone"
    role="group"
    aria-label="Continue with Google"
  >
    <div id="googleButtonHost"></div>
  </div>

  <!-- Original image's Email button: transparent hit area -->
  <button
    class="touch-zone"
    id="emailZone"
    type="button"
    aria-label="Login with Email"
  ></button>

</main>

<div id="status" class="status" role="status" aria-live="polite"></div>

<!-- Email form -->
<div class="email-overlay" id="emailOverlay" role="dialog"
     aria-modal="true" aria-labelledby="emailTitle">
  <section class="email-card">
    <h2 id="emailTitle">Parent Login</h2>

    <p>
      Email login needs a secure authentication service.
      The form below is a user-interface placeholder until
      Firebase Auth or Supabase Auth is connected.
    </p>

    <form id="emailForm">
      <input
        id="emailInput"
        type="email"
        autocomplete="email"
        placeholder="Email address"
        required
      >

      <input
        id="passwordInput"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        required
      >

      <button type="submit">Continue</button>
    </form>

    <div id="emailMessage" class="email-message" aria-live="polite"></div>

    <button class="close" id="closeEmail" type="button">Close</button>
  </section>
</div>

<div class="fallback" id="fallback">
  <h1>📚 Kids Teacher</h1>
  <p>The parent login image could not be loaded.</p>
  <p>Make sure <b>parent_login_ui.png</b> exists beside index.html.</p>
</div>

<script>
(() => {
  "use strict";

  const CLIENT_ID =
    "232165749609-3443t410rpk35a5d9jik4rg54ot0v8ej.apps.googleusercontent.com";

  const image = document.getElementById("loginImage");
  const app = document.getElementById("app");
  const fallback = document.getElementById("fallback");
  const googleZone = document.getElementById("googleZone");
  const googleHost = document.getElementById("googleButtonHost");
  const emailZone = document.getElementById("emailZone");
  const status = document.getElementById("status");
  const emailOverlay = document.getElementById("emailOverlay");
  const emailForm = document.getElementById("emailForm");
  const emailMessage = document.getElementById("emailMessage");

  let initialized = false;
  let resizeTimer = null;

  function showStatus(message) {
    status.textContent = message;
    status.classList.add("show");
  }

  function hideStatus() {
    status.textContent = "";
    status.classList.remove("show");
  }

  function syncImageLayout() {
    /*
      Keep the invisible click zones aligned with the full image.
      Since zones use percentage coordinates, they scale with it.
    */
    if (!image.naturalWidth) return;

    app.style.width = "100%";
  }

  image.addEventListener("load", syncImageLayout);

  image.addEventListener("error", () => {
    app.style.display = "none";
    fallback.style.display = "block";
  });

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(syncImageLayout, 150);
  });

  window.addEventListener("offline", () => {
    showStatus("Internet connection is off. Reconnect and try again.");
  });

  window.addEventListener("online", hideStatus);

  function decodeCredential(token) {
    try {
      const payload = token.split(".")[1];
      const base64 = payload
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
      return JSON.parse(atob(padded));
    } catch (_) {
      return null;
    }
  }

  function handleGoogleResponse(response) {
    hideStatus();

    if (!response || !response.credential) {
      showStatus("Google sign-in did not complete. Please tap the Google button again.");
      return;
    }

    const user = decodeCredential(response.credential);

    if (!user) {
      showStatus("Could not read the Google response. Please try again.");
      return;
    }

    /*
      IMPORTANT:
      This is not a secure application login by itself.
      The ID token must be sent to a trusted backend or handled
      by Firebase/Supabase Auth. Do not grant access to private
      child data based only on the decoded token.
    */
    showStatus(
      "Google account selected: " +
      (user.name || user.email || "Parent") +
      ". Secure login needs backend authentication."
    );

    console.info("Google credential received. Verify it server-side.");
  }

  function initializeGoogle() {
    if (initialized) return;

    if (!navigator.onLine) {
      showStatus("Internet connection is off. Reconnect and reload.");
      return;
    }

    if (!window.google ||
        !google.accounts ||
        !google.accounts.id) {
      showStatus("Google Sign-In is still loading. Wait a moment and try again.");
      return;
    }

    try {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleGoogleResponse,
        auto_select: false,
        cancel_on_tap_outside: true
      });

      initialized = true;
      renderGoogleButton();
    } catch (error) {
      console.error(error);
      showStatus("Google Sign-In could not initialize. Check OAuth settings.");
    }
  }

  function renderGoogleButton() {
    if (!initialized || !googleHost) return;

    googleHost.innerHTML = "";

    const width = Math.max(
      180,
      Math.floor(googleZone.getBoundingClientRect().width)
    );

    google.accounts.id.renderButton(googleHost, {
      type: "standard",
      theme: "outline",
      size: "large",
      text: "continue_with",
      shape: "pill",
      logo_alignment: "left",
      width: width,
      locale: "en"
    });
  }

  /*
    Wait for Google's external script to load.
    Avoid calling One Tap prompt manually; the visible button is
    the reliable user-initiated sign-in entry point.
  */
  let attempts = 0;

  function waitForGoogle() {
    if (window.google &&
        google.accounts &&
        google.accounts.id) {
      initializeGoogle();
      return;
    }

    attempts++;

    if (attempts < 60) {
      setTimeout(waitForGoogle, 250);
    } else {
      showStatus(
        navigator.onLine
          ? "Google Sign-In did not load. Check internet and OAuth configuration, then reload."
          : "Internet connection is off."
      );
    }
  }

  window.addEventListener("load", waitForGoogle);

  /*
    Email button: one tap opens the email form.
    This form is not a working authentication system until
    a real provider is connected.
  */
  emailZone.addEventListener("click", () => {
    emailOverlay.classList.add("show");
    emailMessage.textContent = "";
    setTimeout(() => {
      document.getElementById("emailInput").focus();
    }, 100);
  });

  document.getElementById("closeEmail").addEventListener("click", () => {
    emailOverlay.classList.remove("show");
  });

  emailOverlay.addEventListener("click", event => {
    if (event.target === emailOverlay) {
      emailOverlay.classList.remove("show");
    }
  });

  emailForm.addEventListener("submit", event => {
    event.preventDefault();

    emailMessage.textContent =
      "Email/password authentication is not connected yet. Do not enter a real password until a secure authentication provider is configured.";
  });

  syncImageLayout();
})();
</script>

</body>
</html>
