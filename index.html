<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Kids Teacher App UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      padding: 20px;
    }

    /* App Phone Frame */
    .app-screen {
      width: 100%;
      max-width: 390px;
      height: 780px;
      position: relative;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      
      /* STEP 1: APNI NEW 3D FAMILY IMAGE LAGAYEIN */
      /* Note: Replace 'image_2.png' with your actual image file name */
      background: url('image_2.png') no-repeat center top;
      background-size: cover;
      background-color: #fce8d5;
    }

    /* Bottom Clay Card Overlay */
    .clay-card-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0 10px 10px 10px;
      z-index: 10;
    }

    /* Green 3D Leaves (Clay style) */
    .leaf {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #4ade80;
      border-radius: 0 70% 0 70%;
      box-shadow: inset -3px -3px 0 #16a34a, 0 6px 12px rgba(0,0,0,0.15);
      z-index: 4;
    }
    .leaf-left-1 { top: -15px; left: 15px; transform: rotate(-25deg); }
    .leaf-right-1 { top: -15px; right: 15px; transform: rotate(75deg); }

    .clay-card {
      background: #ffffff;
      border-radius: 35px 35px 30px 30px;
      padding: 25px 20px 20px 20px;
      text-align: center;
      position: relative;
      z-index: 5;
      box-shadow: 
        0 -10px 25px rgba(0, 0, 0, 0.1),
        inset 0 -6px 0 #f1f5f9,
        inset 0 4px 10px rgba(255, 255, 255, 1);
    }

    /* 3D Sun Badge overlapping */
    .sun-badge {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-radius: 50%;
      margin: -58px auto 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 
        0 6px 0 #d97706,
        0 10px 15px rgba(217, 119, 6, 0.3);
      position: relative;
      border: 3px solid #ffffff;
    }

    .app-title {
      font-size: 28px;
      color: #451a03;
      font-weight: 700;
      margin-bottom: 18px;
    }

    /* Buttons */
    .btn-3d {
      width: 100%;
      padding: 13px;
      border-radius: 18px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      transition: all 0.1s ease;
    }

    .btn-google {
      background: #ffffff;
      color: #334155;
      box-shadow: 0 5px 0 #cbd5e1, 0 8px 12px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }

    .btn-email {
      background: linear-gradient(135deg, #ff7e5f, #ff6b4a);
      color: #ffffff;
      box-shadow: 0 5px 0 #c2410c, 0 8px 15px rgba(255, 126, 95, 0.35);
    }

    .btn-3d:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 transparent !important;
    }

    /* Feature Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 15px;
    }

    .feature-card {
      border-radius: 14px;
      padding: 10px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.04);
    }

    .feature-card span {
      font-size: 9.5px;
      font-weight: 700;
      color: #334155;
    }

    .f-blue   { background: #e0f2fe; border: 1px solid #bae6fd; }
    .f-yellow { background: #fef9c3; border: 1px solid #fef08a; }
    .f-green  { background: #dcfce7; border: 1px solid #bbf7d0; }
    .f-pink   { background: #ffe4e6; border: 1px solid #fecdd3; }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <div class="clay-card-wrapper">
      <!-- Leaves -->
      <div class="leaf leaf-left-1"></div>
      <div class="leaf leaf-right-1"></div>

      <!-- Card -->
      <div class="clay-card">
        <div class="sun-badge">☀️</div>
        <h1 class="app-title">Kids Teacher</h1>

        <button class="btn-3d btn-google">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>

        <button class="btn-3d btn-email">
          ✉️ Login with Email
        </button>

        <div class="features-grid">
          <div class="feature-card f-blue">
            <div style="font-size: 18px;">📊</div>
            <span>Track Progress</span>
          </div>
          <div class="feature-card f-yellow">
            <div style="font-size: 18px;">👁️</div>
            <span>Monitor Activities</span>
          </div>
          <div class="feature-card f-green">
            <div style="font-size: 18px;">🛡️</div>
            <span>Safe & Secure</span>
          </div>
          <div class="feature-card f-pink">
            <div style="font-size: 18px;">💖</div>
            <span>Support Child</span>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
