<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Teacher - Main Dashboard</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      min-height: 100dvh;
      background: #fce8d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      margin-top: 40px;
    }

    .welcome-title {
      font-family: 'Fredoka', 'Baloo 2', cursive, sans-serif;
      font-size: 32px;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .welcome-subtitle {
      font-size: 14px;
      color: #475569;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      border: 1.5px solid rgba(255,255,255,0.8);
      margin-bottom: 20px;
      text-align: left;
    }

    .card h3 {
      font-family: 'Baloo 2', cursive;
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 13.5px;
      color: #475569;
      font-weight: 600;
    }

    /* Logout Button Style */
    .btn-logout {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-family: 'Baloo 2', cursive, sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 0 #991b1b, 0 8px 15px rgba(239, 68, 68, 0.3);
      transition: transform 0.1s ease;
      margin-top: 20px;
    }

    .btn-logout:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #991b1b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="welcome-title">Kids Teacher Hub 🌟</h1>
    <p class="welcome-subtitle">Welcome to your child's learning dashboard!</p>

    <div class="card">
      <h3>📚 Learning Modules</h3>
      <p>Alphabets, Numbers, Rhymes, and Interactive Quizzes are ready here for your kids.</p>
    </div>

    <div class="card">
      <h3>🔒 Parent Controls</h3>
      <p>You are successfully logged in and authenticated securely via Firebase.</p>
    </div>

    <!-- Logout Button -->
    <button type="button" class="btn-logout" onclick="logoutUser()">Log Out 🚪</button>
  </div>

  <!-- Firebase Authentication & Security Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidkZxQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b",
      measurementId: "G-VJVS2ZMNLY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Security Check: Agar user logged-in nahi hai, toh automatic login.html par bhej do
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    // Global Logout Function
    window.logoutUser = function() {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      }).catch((error) => {
        console.error("Sign out error", error);
      });
    }
  </script>
</body>
</html>
