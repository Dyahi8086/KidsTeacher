
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
        authDomain: "kids-teacher-4387e.firebaseapp.com",
        projectId: "kids-teacher-4387e",
        storageBucket: "kids-teacher-4387e.firebasestorage.app",
        messagingSenderId: "420221167346",
        appId: "1:420221167346:web:da7ac80acdfd52339d526b"
    };

    const splash = document.getElementById("splash-screen");
    const welcome = document.getElementById("welcome-content");
    const startBtn = document.getElementById("startBtn");

    let pageOpened = false;
    let authResolved = false;
    let authUnsubscribe = null;
    let fallbackTimer = null;

    // Show welcome page and stop loader
    function showWelcome() {
        if (pageOpened) return;

        pageOpened = true;

        if (fallbackTimer) {
            clearTimeout(fallbackTimer);
        }

        splash.style.display = "none";
        splash.style.opacity = "0";

        welcome.style.display = "flex";
    }

    // Navigate only once
    function openPage(url) {
        if (pageOpened) return;

        pageOpened = true;

        if (fallbackTimer) {
            clearTimeout(fallbackTimer);
        }

        window.location.replace(url);
    }

    // Firebase auth check
    async function checkFirebaseAuth() {
        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            authUnsubscribe = onAuthStateChanged(
                auth,

                (user) => {
                    authResolved = true;

                    if (fallbackTimer) {
                        clearTimeout(fallbackTimer);
                    }

                    if (user) {
                        const savedAge =
                            localStorage.getItem("kidsAgeGroup");

                        openPage(
                            savedAge
                                ? "index-home.html"
                                : "age-select.html"
                        );
                    } else {
                        showWelcome();
                    }
                },

                (error) => {
                    console.error("Firebase Auth Error:", error);

                    authResolved = true;
                    showWelcome();
                }
            );

        } catch (error) {
            console.error("Firebase Initialization Error:", error);
            showWelcome();
        }
    }

    // Do not allow infinite loading
    fallbackTimer = setTimeout(() => {
        if (!authResolved) {
            console.warn("Firebase timeout. Showing welcome page.");
            showWelcome();
        }
    }, 8000);

    // Start Firebase check
    checkFirebaseAuth();

    // Start button
    startBtn.addEventListener("click", () => {
        window.location.href = "login.html";
    });

    // Service worker registration
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
            try {
                await navigator.serviceWorker.register(
                    "./service-worker.js"
                );
                console.log("Service Worker registered");
            } catch (error) {
                console.error("Service Worker Error:", error);
            }
        });
    }

    // Cleanup
    window.addEventListener("pagehide", () => {
        if (fallbackTimer) {
            clearTimeout(fallbackTimer);
        }

        if (authUnsubscribe) {
            authUnsubscribe();
        }
    });
</script>
