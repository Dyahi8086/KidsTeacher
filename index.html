<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8eb">
<title>Kids Teacher - Parent Login</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fff8eb;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  line-height: 0;
}

#loginImage {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
}

/* Invisible touch areas over the original image buttons */
.touch-area {
  position: absolute;
  z-index: 10;
  display: block;
  padding: 0;
  margin: 0;
  border: 0;
  outline: none;
  background: transparent;
  touch-action: manipulation;
  cursor: pointer;
}

/*
  Position estimates based on your screenshot.
  The areas scale with the image on mobile.
*/
#googleTouch {
  left: 18%;
  top: 70.1%;
  width: 64%;
  height: 5.2%;
}

#emailTouch {
  left: 18%;
  top: 76%;
  width: 64%;
  height: 5.2%;
}

.message {
  display: none;
  position: fixed;
  z-index: 100;
  left: 5%;
  right: 5%;
  bottom: max(16px, env(safe-area-inset-bottom));
  padding: 14px 16px;
  max-width: 500px;
  margin: auto;
  border-radius: 14px;
  background: #fff9ed;
  color: #603e29;
  box-shadow: 0 5px 20px #0003;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.message.show {
  display: block;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  padding: 20px;
  background: #0009;
  align-items: center;
  justify-content: center;
}

.overlay.show {
  display: flex;
}

.dialog {
  width: 100%;
  max-width: 380px;
  padding: 24px;
  border-radius: 22px;
  background: #fff9ed;
  color: #603e29;
  line-height: 1.5;
  box-shadow: 0 8px 35px #0003;
}

.dialog h2 {
  margin: 0 0 12px;
  text-align: center;
}

.dialog p {
  font-size: 14px;
}

.dialog input {
  width: 100%;
  min-height: 52px;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #dcc8b6;
  border-radius: 12px;
  background: white;
  font-size: 16px;
}

.dialog button {
  width: 100%;
  min-height: 50px;
  margin-top: 10px;
  border: 0;
  border-radius: 14px;
  background: #f39470;
  color: white;
  font-weight: bold;
}

.dialog .close {
  background: #eadfd5;
  color: #603e29;
}

.dialog-note {
  font-size: 13px;
  overflow-wrap: anywhere;
}

.fallback {
  display: none;
  padding: 24px;
  text-align: center;
  color: #603e29;
  line-height: 1.5;
}

@media (max-width: 380px) {
  #googleTouch,
  #emailTouch {
    height: 5.8%;
  }
}
</style>
</head>

<body>

<main class="app" id="app">

  <!-- Keep parent_login_ui.png beside index.html -->
  <img
    id="loginImage"
    src="./parent_login_ui.png"
    alt="Kids Teacher Parent Login"
  >

  <!-- These are invisible; no duplicate buttons are displayed -->
  <button
    id="googleTouch"
    class="touch-area"
    type="button"
    aria-label="Continue with Google">
  </button>

  <button
    id="emailTouch"
    class="touch-area"
    type="button"
    aria-label="Login with Email">
  </button>

</main>

<div id="message" class="message" role="status" aria-live="polite"></div>

<!-- Email dialog -->
<div id="emailOverlay" class="overlay" role="dialog"
     aria-modal="true" aria-labelledby="emailTitle">

  <section class="dialog">
    <h2 id="emailTitle">Parent Login</h2>

    <p>
      Email login is not connected to an authentication provider yet.
      Connect Firebase Authentication or Supabase Auth before using
      real parent accounts.
    </p>

    <form id="emailForm">
      <input
        type="email"
        id="email"
        placeholder="Parent email"
        autocomplete="email"
        required>

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required>

      <button type="submit">Continue</button>
    </form>

    <div id="emailNote" class="dialog-note" aria-live="polite"></div>

    <button type="button" class="close" id="closeEmail">Close</button>
  </section>
</div>

<div id="fallback" class="fallback">
  <h2>Kids Teacher</h2>
  <p>Parent login image could not be loaded.</p>
  <p>Check that parent_login_ui.png exists in the same folder as index.html.</p>
</div>

<script>
(() => {
  "use strict";

  const GOOGLE_CLIENT_ID =
    "232165749609-3443t410rpk35a5d9jik4rg54ot0v8ej.apps.googleusercontent.com";

  const app = document.getElementById("app");
  const image = document.getElementById("loginImage");
  const fallback = document.getElementById("fallback");
  const googleTouch = document.getElementById("googleTouch");
  const emailTouch = document.getElementById("emailTouch");
  const message = document.getElementById("message");
  const emailOverlay = document.getElementById("emailOverlay");
  const emailForm = document.getElementById("emailForm");
  const emailNote = document.getElementById("emailNote");

  let googleReady = false;
  let googleFailed = false;
  let waitCount = 0;

  function showMessage(text) {
    message.textContent = text;
    message.classList.add("show");
  }

  function hideMessage() {
    message.textContent = "";
    message.classList.remove("show");
  }

  image.addEventListener("error", () => {
    app.style.display = "none";
    fallback.style.display = "block";
  });

  window.addEventListener("offline", () => {
    showMessage("Internet is off. Reconnect and try again.");
  });

  window.addEventListener("online", hideMessage);

  function readCredential(token) {
    try {
      const part = token.split(".")[1];
      const normalized = part.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      return JSON.parse(atob(padded));
    } catch (_) {
      return null;
    }
  }

  function onGoogleResponse(response) {
    if (!response || !response.credential) {
      showMessage("Google sign-in did not complete. Please try again.");
      return;
    }

    const profile = readCredential(response.credential);

    if (!profile) {
      showMessage("Google returned an invalid response. Please try again.");
      return;
    }

    /*
      Decoding a token does not verify it.
      A secure backend or Firebase/Supabase Auth must verify
      the token before granting access to private information.
    */
    showMessage(
      "Google account selected: " +
      (profile.name || profile.email || "Parent") +
      ". Secure login still requires backend authentication."
    );

    console.info("Google credential received. Server-side verification is required.");
  }

  function waitForGoogle() {
    if (window.google &&
        google.accounts &&
        google.accounts.id) {
      initializeGoogle();
      return;
    }

    waitCount++;

    if (waitCount >= 60) {
      googleFailed = true;
      return;
    }

    setTimeout(waitForGoogle, 250);
  }

  function initializeGoogle() {
    if (googleReady) return;

    try {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: onGoogleResponse,
        auto_select: false,
        cancel_on_tap_outside: true
      });

      googleReady = true;
    } catch (error) {
      console.error("Google initialization failed:", error);
      googleFailed = true;
    }
  }

  /*
    A custom image button cannot safely imitate Google's real
    sign-in button. Use Google's supported button UI for sign-in.

    Since the original Google button is part of a PNG, Google
    Sign-In does not provide a supported way to attach its official
    iframe invisibly to that artwork. We do not create duplicate
    visible buttons or trigger One Tap manually here.
  */
  googleTouch.addEventListener("click", () => {
    if (!navigator.onLine) {
      showMessage("Internet is off. Reconnect and try again.");
      return;
    }

    if (!googleReady) {
      showMessage(
        "Google Sign-In is not ready. Reload the page and try again."
      );
      return;
    }

    /*
      The Google Identity Services API does not expose a method
      to launch the official button flow from an arbitrary custom
      image click. Render its official button or integrate Firebase
      Auth to complete this action reliably.
    */
    showMessage(
      "Google sign-in needs the official Google button or Firebase Auth integration. The original image has been preserved."
    );
  });

  emailTouch.addEventListener("click", () => {
    emailNote.textContent = "";
    emailOverlay.classList.add("show");
    setTimeout(() => {
      document.getElementById("email").focus();
    }, 100);
  });

  document.getElementById("closeEmail").addEventListener("click", () => {
    emailOverlay.classList.remove("show");
  });

  emailOverlay.addEventListener("click", event => {
    if (event.target === emailOverlay) {
      emailOverlay.classList.remove("show");
    }
  });

  emailForm.addEventListener("submit", event => {
    event.preventDefault();

    emailNote.textContent =
      "This form is only a UI. Secure email/password authentication has not been connected. Do not enter real account passwords until a secure authentication provider is configured.";
  });

  waitForGoogle();
})();
</script>

</body>
</html>
