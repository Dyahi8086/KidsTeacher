<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FF6B35">
    <title>Kids Teacher - Welcome</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100vh; 
            height: 100dvh; 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #FF8C42 0%, #FF5E3A 50%, #D9381E 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Liquid Glass Card */
        .glass-card {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.8);
            padding: 50px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            
            /* Slide Up Animation */
            animation: slideUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: translateY(50px);
            opacity: 0;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .app-title { 
            font-family: 'Fredoka', sans-serif; 
            font-size: 36px; 
            color: #ffffff; 
            font-weight: 700; 
            line-height: 1.2; 
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .app-subtitle {
            font-family: 'Nunito', sans-serif; 
            font-size: 16px; 
            color: rgba(255, 255, 255, 0.9); 
            font-weight: 700;
            margin-bottom: 40px;
        }

        .start-btn {
            position: relative; 
            width: 100%; 
            max-width: 300px; 
            padding: 18px 20px;
            font-size: 20px; 
            font-family: 'Fredoka', sans-serif; 
            font-weight: 700; 
            color: #9a3412;
            background: #ffffff; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 8px 0 #cbd5e1, 0 15px 25px rgba(0,0,0,0.2);
            transition: transform 0.1s; 
        }

        .start-btn:active { 
            transform: translateY(6px); 
            box-shadow: 0 0px 0 #cbd5e1; 
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 class="app-title">Learning Is an<br>Adventure!</h1>
        <p class="app-subtitle">Explore, discover and grow every day.</p>
        <button class="start-btn" id="startBtn">Let's Start →</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
          authDomain: "kids-teacher-4387e.firebaseapp.com",
          projectId: "kids-teacher-4387e",
          storageBucket: "kids-teacher-4387e.firebasestorage.app",
          messagingSenderId: "420221167346",
          appId: "1:420221167346:web:da7ac80acdfd52339d526b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const savedAge = localStorage.getItem('kidsAgeGroup');
                window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
            }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            window.location.href = 'login.html';
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js'); });
        }
    </script>
</body>
</html>
