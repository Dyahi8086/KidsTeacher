<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7e9">
<title>Kids Teacher - Parent Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff7e9;
  color: #613d2d;
  font-family: Arial, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#app {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  min-height: 100vh;
}

/* Original 3D image */
#imageWrap {
  position: relative;
  width: 100%;
  line-height: 0;
}

#parentImage {
  display: block;
  width: 100%;
  height: auto;
}

/*
  Invisible clickable areas placed over the buttons
  already drawn inside the original image.
  They do not create any extra visible buttons.
*/

.imageButton {
  position: absolute;
  display: block;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  border-radius: 50px;
  z-index: 5;
  line-height: normal;
  color: transparent;
  outline: none;
}

.imageButton:focus-visible {
  outline: 3px solid #2879e8;
  outline-offset: 2px;
}

/*
  Position percentages are based on the full image.
  If your image file has different proportions,
  adjust these percentages.
*/

#googleHotspot {
  left: 19%;
  top: 79.5%;
  width: 62%;
  height: 5.2%;
}

#emailHotspot {
  left: 19%;
  top: 85.6%;
  width: 62%;
  height: 5.2%;
}

#status {
  margin: 14px 16px 24px;
  padding: 14px;
  border-radius: 18px;
  background: #fffaf1;
  box-shadow: 0 5px 18px #6c4a301c;
  text-align: center;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

#status:empty {
  display: none;
}

.error {
  color: #a12626;
}

.success {
  color: #176b38;
}

#loader {
  display: none;
  text-align: center;
  padding: 12px;
  line-height: 1.5;
}

.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 3px solid #e9cbb9;
  border-top-color: #ef8e6c;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  vertical-align: middle;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#emailPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #0009;
  padding: 18px;
  overflow-y: auto;
  align-items: center;
  justify-content: center;
}

#emailCard {
  width: 100%;
  max-width: 440px;
  padding: 25px 20px;
  border-radius: 25px;
  background: #fffaf0;
  box-shadow: 0 10px 35px #0003;
  line-height: 1.5;
}

#emailCard h2 {
  text-align: center;
  margin-top: 0;
}

#emailCard label {
  display: block;
  margin-top: 8px;
}

input {
  width: 100%;
  min-height: 52px;
  padding: 13px;
  margin: 7px 0;
  border: 1px solid #d9c8b8;
  border-radius: 13px;
  background: white;
  color: #34251d;
  outline-color: #ef9876;
}

.action {
  width: 100%;
  min-height: 50px;
  margin-top: 10px;
  border: 0;
  border-radius: 14px;
  background: #f29572;
  color: white;
  font-weight: bold;
}

.secondary {
  background: #eee2d5;
  color: #603f2e;
}

.action:disabled {
  opacity: .6;
  cursor: wait;
}

#accountPanel {
  display: none;
  margin: 16px;
  padding: 22px;
  border-radius: 22px;
  background: #fffaf0;
  text-align: center;
  line-height: 1.5;
}

#profileImage {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
}

.small {
  font-size: 13px;
  overflow-wrap: anywhere;
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation: none;
  }
}
</style>
</head>

<body>

<main id="app">

  <!-- Original design image -->
  <div id="imageWrap">

    <img
      id="parentImage"
      src="./parent_login_ui.png"
      alt="Kids Teacher Parent Login"
    >

    <!-- Invisible overlay: original Google button area -->
    <button
      id="googleHotspot"
      class="imageButton"
      type="button"
      aria-label="Continue with Google"
      title="Continue with Google"
    ></button>

    <!-- Invisible overlay: original Email button area -->
    <button
      id="emailHotspot"
      class="imageButton"
      type="button"
      aria-label="Login with Email"
      title="Login with Email"
    ></button>

  </div>

  <div id="loader" aria-live="polite">
    <span class="spinner"></span>
    <span id="loaderText"> Please wait...</span>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <!-- Email login modal -->
  <section id="emailPanel" aria-label="Parent email login">
    <div id="emailCard">

      <h2>Parent Login</h2>

      <p class="small">
        Sign in to your parent account or create a new account.
      </p>

      <form id="emailForm">

        <label for="email">Parent email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Password (minimum 6 characters)"
          minlength="6"
          required
        >

        <button class="action" type="submit">
          Login
        </button>

      </form>

      <button class="action" id="createAccount" type="button">
        Create New Parent Account
      </button>

      <button class="action secondary" id="resetPassword" type="button">
        Forgot Password?
      </button>

      <button class="action secondary" id="closeEmail" type="button">
        Close
      </button>

    </div>
  </section>

  <!-- Parent account after successful login -->
  <section id="accountPanel">

    <img id="profileImage" alt="Profile picture" hidden>

    <h2 id="profileName">Parent Account</h2>

    <p id="profileEmail"></p>

    <p class="small">
      You are signed in to Kids Teacher.
    </p>

    <button class="action" id="signOutButton" type="button">
      Sign Out
    </button>

  </section>

</main>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


/* Firebase project configuration */
const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b",
  measurementId: "G-VJVS2ZMNLY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

googleProvider.setCustomParameters({
  prompt: "select_account"
});


/* Elements */
const $ = id => document.getElementById(id);

const googleHotspot = $("googleHotspot");
const emailHotspot = $("emailHotspot");
const emailPanel = $("emailPanel");
const accountPanel = $("accountPanel");
const statusBox = $("status");
const loader = $("loader");
const loaderText = $("loaderText");

let busy = false;


/* Messages */
function message(text, type = "") {
  statusBox.textContent = text;
  statusBox.className = type;
}

function loading(active, text = "Please wait...") {
  busy = active;

  loader.style.display = active ? "block" : "none";
  loaderText.textContent = " " + text;

  document.querySelectorAll(".action").forEach(button => {
    button.disabled = active;
  });

  googleHotspot.style.pointerEvents = active ? "none" : "auto";
  emailHotspot.style.pointerEvents = active ? "none" : "auto";
}


/* Friendly Firebase errors */
function errorMessage(error) {
  const messages = {
    "auth/invalid-email":
      "Email address sahi nahi hai.",

    "auth/invalid-credential":
      "Email ya password galat hai.",

    "auth/user-not-found":
      "Account nahi mila. Pehle account banao.",

    "auth/email-already-in-use":
      "Is email ka account pehle se hai. Login karo.",

    "auth/weak-password":
      "Password kam se kam 6 characters ka rakho.",

    "auth/too-many-requests":
      "Bahut attempts hue. Thodi der baad try karo.",

    "auth/network-request-failed":
      "Internet connection check karo.",

    "auth/unauthorized-domain":
      "Firebase Authentication ke Authorized domains mein dyahi8086.github.io add karo.",

    "auth/operation-not-allowed":
      "Firebase Console mein Google aur Email/Password providers enable karo.",

    "auth/popup-blocked":
      "Sign-in block hua. Dobara try karo."
  };

  return messages[error.code] ||
    "Login nahi hua: " +
    (error.message || error.code || "Unknown error");
}


/* Email panel */
function openEmailPanel() {
  if (auth.currentUser) return;

  emailPanel.style.display = "flex";
  message("");
}

function closeEmailPanel() {
  emailPanel.style.display = "none";
}


/* Account screen */
function showAccount(user) {
  emailPanel.style.display = "none";
  accountPanel.style.display = "block";

  $("profileName").textContent =
    user.displayName || "Parent Account";

  $("profileEmail").textContent =
    user.email || "";

  const photo = $("profileImage");

  if (user.photoURL) {
    photo.src = user.photoURL;
    photo.hidden = false;
  } else {
    photo.hidden = true;
    photo.removeAttribute("src");
  }

  message("Login successful.", "success");
}


/* Return to login screen */
function showLogin() {
  accountPanel.style.display = "none";
}


/* Google sign-in */
googleHotspot.addEventListener("click", async () => {
  if (busy) return;

  if (!navigator.onLine) {
    message(
      "Internet band hai. Connection check karke dobara try karo.",
      "error"
    );
    return;
  }

  try {
    loading(true, "Opening Google sign-in...");

    await signInWithRedirect(auth, googleProvider);

  } catch (error) {
    loading(false);
    message(errorMessage(error), "error");
  }
});


/* Email button inside the original image */
emailHotspot.addEventListener("click", () => {
  if (busy) return;
  openEmailPanel();
});


/* Login with email and password */
$("emailForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  if (!navigator.onLine) {
    message("Internet band hai. Connection check karo.", "error");
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;

  try {
    loading(true, "Signing in...");

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch (error) {
    message(errorMessage(error), "error");
  } finally {
    loading(false);
  }
});


/* Create parent account */
$("createAccount").addEventListener("click", async () => {
  if (busy) return;

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    message("Pehle email aur password bharo.", "error");
    return;
  }

  if (password.length < 6) {
    message(
      "Password kam se kam 6 characters ka hona chahiye.",
      "error"
    );
    return;
  }

  if (!navigator.onLine) {
    message("Internet connection check karo.", "error");
    return;
  }

  try {
    loading(true, "Creating account...");

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch (error) {
    message(errorMessage(error), "error");
  } finally {
    loading(false);
  }
});


/* Password reset */
$("resetPassword").addEventListener("click", async () => {
  if (busy) return;

  const email = $("email").value.trim();

  if (!email) {
    message("Pehle email box mein apna email bharo.", "error");
    return;
  }

  try {
    loading(true, "Sending reset email...");

    await sendPasswordResetEmail(auth, email);

    message(
      "Password reset email bhej diya gaya hai. Apna inbox check karo.",
      "success"
    );

  } catch (error) {
    message(errorMessage(error), "error");
  } finally {
    loading(false);
  }
});


/* Close email modal */
$("closeEmail").addEventListener("click", closeEmailPanel);

emailPanel.addEventListener("click", event => {
  if (event.target === emailPanel) {
    closeEmailPanel();
  }
});


/* Sign out */
$("signOutButton").addEventListener("click", async () => {
  if (busy) return;

  try {
    loading(true, "Signing out...");

    await signOut(auth);

    message("You have signed out.", "success");

  } catch (error) {
    message(errorMessage(error), "error");
  } finally {
    loading(false);
  }
});


/* Handle Google redirect result */
try {
  loading(true, "Checking login...");

  await getRedirectResult(auth);

} catch (error) {
  message(errorMessage(error), "error");
} finally {
  loading(false);
}


/* Keep screen synced with Firebase login status */
onAuthStateChanged(auth, user => {
  loading(false);

  if (user) {
    showAccount(user);
  } else {
    showLogin();
  }
});


/* Offline warning only when actually offline */
window.addEventListener("offline", () => {
  message("Internet connection lost.", "error");
});

window.addEventListener("online", () => {
  if (auth.currentUser) {
    message("Internet connection restored.", "success");
  } else {
    message("");
  }
});


/* Missing image warning */
$("parentImage").addEventListener("error", () => {
  message(
    "parent_login_ui.png nahi mili. GitHub mein file ka naam aur location check karo.",
    "error"
  );
});

</script>
</body>
</html>
