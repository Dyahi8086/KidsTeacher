
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#ff3b00">
    <title>Kids Teacher</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ff321e;
        }

        /* RED ORANGE SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99990;
            overflow: hidden;
            background: #ff321e;
        }

        /* 1. SIMPLE WHITE BRAND MARK */
        .kt-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 76px;
            height: 76px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 76px;
            font-weight: 900;
            line-height: .88;
            letter-spacing: -7px;
            padding-right: 6px;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            animation: logoSequence 0.72s cubic-bezier(.22, 1, .36, 1) 0.05s forwards;
        }

        .kt-ears { display: none;\n
            position: absolute;
            width: 76px;
            height: 58px;
            top: 0;
            left: 39px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            z-index: 2;
        }

        .kt-ear {
            width: 29px;
            height: 59px;
            border: 10px solid #fff;
            border-radius: 50% 50% 45% 45%;
            background: transparent;
        }

        .kt-ear:first-child { transform: rotate(-12deg); }
        .kt-ear:last-child { transform: rotate(13deg); }

        .kt-face { display: none;\n
            position: absolute;
            z-index: 3;
            top: 75px;
            left: 57px;
            width: 38px;
            height: 28px;
            pointer-events: none;
        }

        .kt-eyes {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }

        .kt-eyes span {
            width: 6px;
            height: 9px;
            border-radius: 50%;
            background: #ff321e;
        }

        .kt-smile {
            width: 17px;
            height: 9px;
            margin: 1px auto 0;
            border-bottom: 3px solid #ff3b00;
            border-radius: 0 0 15px 15px;
        }

        @keyframes logoSequence {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.12); }
            25% { opacity: 1; transform: translate(-50%, -50%) scale(0.27); }
            48%, 72% { opacity: 1; transform: translate(-50%, -50%) scale(0.25); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.06); }
        }

        /* 2. BRAND TITLE */
        .kt-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'Nunito', Arial, sans-serif;
            font-size: clamp(10px, 2.8vw, 13px);
            font-weight: 900;
            letter-spacing: .15px;
            text-align: center;
            white-space: nowrap;
            opacity: 0;
            clip-path: inset(0 50% 0 50%);
            animation: titleSequence 0.72s cubic-bezier(.4, 0, .2, 1) 0.78s forwards;
        }

        @keyframes titleSequence {
            0% { opacity: 0; clip-path: inset(0 50% 0 50%); transform: translate(-50%, -50%) scale(0.92); }
            28% { opacity: 1; clip-path: inset(0 0% 0 0%); transform: translate(-50%, -50%) scale(1); }
            72% { opacity: 1; clip-path: inset(0 0% 0 0%); transform: translate(-50%, -50%) scale(1); }
            96% { opacity: 1; clip-path: inset(0 49% 0 49%); transform: translate(-50%, -50%) scale(0.35); }
            100% { opacity: 0; clip-path: inset(0 50% 0 50%); transform: translate(-50%, -50%) scale(0.1); }
        }

        /* 3. WHITE DOT JUMP */
        .kt-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            animation: dotJumpSequence 1.08s cubic-bezier(.45, .05, .55, .95) 1.72s forwards;
        }

        @keyframes dotJumpSequence {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
            18% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            58% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -36vh) scale(1.15); }
        }

        /* 4. SOFT PINK PORTAL TO LOGIN */
        #transition-portal {
            position: fixed;
            inset: 0;
            z-index: 99995;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #F7EBEF;
            clip-path: circle(0% at 50% 14%);
            pointer-events: none;
        }

        #transition-portal.reveal {
            animation: portalExpand 0.65s cubic-bezier(.35, 0, .15, 1) forwards;
        }

        @keyframes portalExpand {
            0% { clip-path: circle(20px at 50% 14%); }
            100% { clip-path: circle(150% at 50% 14%); }
        }
    </style>
</head>

<body>

    <div id="splash-screen" aria-label="Kids Teacher loading screen">
        <div class="kt-mark" aria-hidden="true">
            K
            <div class="kt-ears">
                <span class="kt-ear"></span>
                <span class="kt-ear"></span>
            </div>
            <div class="kt-face">
                <div class="kt-eyes">
                    <span></span>
                    <span></span>
                </div>
                <div class="kt-smile"></div>
            </div>
        </div>

        <div class="kt-title">KIDS TEACHER</div>
        <div class="kt-dot" aria-hidden="true"></div>
    </div>

    <div id="transition-portal" aria-hidden="true"></div>

    <script>
        const portal = document.getElementById('transition-portal');
        const themeColorMeta = document.getElementById('themeColorMeta');

        function goToLogin() {
            window.location.replace('login.html');
        }

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            setTimeout(goToLogin, 500);
        } else {
            setTimeout(() => {
                portal.classList.add('reveal');
                if (themeColorMeta) {
                    themeColorMeta.setAttribute('content', '#F7EBEF');
                }
            }, 2800);

            setTimeout(goToLogin, 3450);
        }
    </script>

</body>
</html>
