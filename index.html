<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e0f2fe"> 
    <title>Kids Teacher - Welcome</title>
    
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100%; width: 100%;
            background-color: #e0f2fe; 
            overflow: hidden; 
        }

        .welcome-container {
            position: relative;
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 40px; 
            
            /* YEH BACKGROUND KO STRETCH KAREGA BINA CUT KIYE */
            background-image: url('welcome_bg.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Agar Image load na ho toh fallback color */
        .welcome-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #e0f2fe;
            z-index: -1;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 20px;
        }

        .text-content {
            text-align: center; 
            margin-bottom: 20px;
        }

        .text-content h1 {
            font-family: 'Fredoka', sans-serif; 
            font-size: clamp(24px, 6vw, 32px); 
            color: #8B3A00; 
            font-weight: 700; 
            line-height: 1.2; 
            margin-bottom: 8px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.1);
        }

        .text-content p {
            font-family: 'Nunito', sans-serif; 
            font-size: clamp(13px, 4vw, 16px); 
            color: #6B5B4D; 
            font-weight: 700;
        }

        /* BUTTON HILTA HUVA (PULSE EFFECT) */
        .start-btn {
            position: relative; 
            width: 100%; 
            max-width: 350px; 
            padding: 16px 20px;
            font-size: 20px; 
            font-family: 'Fredoka', sans-serif; 
            font-weight: 700; 
            color: white;
            background: #FF6B35; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 6px 0 #cc4e20, 0 10px 20px rgba(255, 107, 53, 0.4);
            transition: transform 0.1s;
            
            /* Animation */
            animation: pulseBtn 2s infinite;
        }

        .start-btn:active { 
            transform: translateY(6px); 
            box-shadow: 0 0px 0 #cc4e20; 
            animation: none; 
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="content-wrapper">
            <div class="text-content">
                <h1>Learning Is an<br>Adventure!</h1>
                <p>Explore, discover and grow every day.</p>
            </div>
            <button class="start-btn" onclick="window.location.href='login.html'">Let's Start →</button>
        </div>
    </div>

</body>
</html>
