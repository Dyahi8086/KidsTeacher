<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Theme color same rakha hai taaki upar orange patti na aaye -->
    <meta name="theme-color" content="#e0f2fe"> 
    <title>Kids Teacher - Welcome</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100%; width: 100%;
            background-color: #e0f2fe; 
            overflow: hidden;
        }

        .welcome-container {
            position: relative;
            width: 100vw; height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center;
            /* Button ko upar shift karne ke liye padding badhayi hai */
            padding-bottom: 8vh; 
            overflow: hidden;
        }

        /* Background Image with Zoom */
        .bg-image-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('welcome_bg.png');
            background-size: cover; background-position: center top;
            z-index: 1;
            animation: slowZoom 20s ease-in-out infinite alternate;
        }

        @keyframes slowZoom { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .text-content {
            text-align: center; margin-bottom: 20px; z-index: 10;
            animation: popUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: translateY(30px) scale(0.9);
        }

        .text-content h1 {
            font-family: 'Fredoka', sans-serif; font-size: 28px; color: #8B3A00; 
            font-weight: 700; line-height: 1.2; margin-bottom: 8px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.1);
        }

        .text-content p {
            font-family: 'Nunito', sans-serif; font-size: 15px; color: #6B5B4D; font-weight: 700;
        }

        .start-btn {
            position: relative; width: 88%; max-width: 350px; padding: 16px 20px;
            font-size: 20px; font-family: 'Fredoka', sans-serif; font-weight: 700; color: white;
            background: #FF6B35; border: none; border-radius: 50px; cursor: pointer; z-index: 10;
            box-shadow: 0 6px 0 #cc4e20, 0 10px 20px rgba(255, 107, 53, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            opacity: 0; transform: translateY(20px);
            animation: slideUp 0.8s ease-out forwards 0.3s;
        }

        .start-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #cc4e20, 0 4px 10px rgba(0,0,0,0.2); }

        @keyframes popUp { to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .ripple { position: absolute; background: rgba(255, 255, 255, 0.4); border-radius: 50%; transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none; }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="bg-image-layer"></div>
        <div class="text-content">
            <h1>Learning Is an<br>Adventure!</h1>
            <p>Explore, discover and grow every day.</p>
        </div>
        <button class="start-btn" id="startBtn">Let's Start →</button>
    </div>

    <script>
        const btn = document.getElementById('startBtn');
        btn.addEventListener('click', function(e) {
            if (navigator.vibrate) navigator.vibrate([40, 30, 40]); 
            let rect = this.getBoundingClientRect();
            let ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.left = `${e.clientX - rect.left}px`;
            ripple.style.top = `${e.clientY - rect.top}px`;
            ripple.style.width = ripple.style.height = `30px`; 
            this.appendChild(ripple);
            setTimeout(() => { ripple.remove(); }, 600);
            setTimeout(() => { window.location.href = "login.html"; }, 250); 
        });
    </script>
</body>
</html>
