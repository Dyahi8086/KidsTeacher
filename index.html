<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#ff3b00">
    <title>Kids Teacher</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4efff;font-family:'Nunito',Arial,sans-serif}
#splash-screen{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;z-index:99990;overflow:hidden;background:linear-gradient(145deg,#f3ecff 0%,#f8f3ff 48%,#e8f7f0 100%)}
.splash-scene{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.splash-halo{position:absolute;width:min(82vw,390px);height:min(82vw,390px);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.88) 0%,rgba(255,255,255,.35) 55%,transparent 72%);filter:blur(2px);animation:haloPulse 3.2s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}
.float-shape{position:absolute;border-radius:50%;opacity:.18;animation:floatUp 8s ease-in-out infinite}
.float-shape:nth-child(2){animation-delay:-2s;animation-duration:10s}
.float-shape:nth-child(3){animation-delay:-4s;animation-duration:7s}
.float-shape:nth-child(4){animation-delay:-1s;animation-duration:9s}
.float-shape:nth-child(5){animation-delay:-3s;animation-duration:11s}
.float-shape:nth-child(6){animation-delay:-5s;animation-duration:6s}
@keyframes floatUp{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}33%{transform:translateY(-30px) rotate(120deg) scale(1.1)}66%{transform:translateY(15px) rotate(240deg) scale(.9)}}
.star{position:absolute;width:5px;height:5px;border-radius:50%;background:#f4bd58;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
.character-container{position:relative;z-index:2;width:180px;height:240px;transform:translateX(-300px);animation:walkIn 1.8s cubic-bezier(.34,1.56,.64,1) .5s forwards;filter:drop-shadow(0 16px 18px rgba(75,45,122,.12))}
@keyframes walkIn{0%{transform:translateX(-300px)}60%{transform:translateX(10px)}80%{transform:translateX(-5px)}100%{transform:translateX(0)}}
#leftLeg{animation:legWalk .6s ease-in-out .5s 3;transform-origin:42px 140px}
#rightLeg{animation:legWalk .6s ease-in-out .8s 3 reverse;transform-origin:72px 140px}
@keyframes legWalk{0%,100%{transform:rotateZ(0)}50%{transform:rotateZ(25deg)}}
#leftArm{animation:armWalk .6s ease-in-out .5s 3;transform-origin:24px 95px}
#rightArm{animation:waveArm .6s ease-in-out 2.35s infinite;transform-origin:106px 95px}
@keyframes armWalk{0%,100%{transform:rotateZ(0)}50%{transform:rotateZ(-20deg)}}
@keyframes waveArm{0%,100%{transform:rotateZ(0)}50%{transform:rotateZ(-35deg)}}
.char-body{animation:bodyBounce .6s ease-in-out .5s 3}
@keyframes bodyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bag{position:absolute;bottom:45px;right:5px;transform-origin:center top}
.bag-strap{animation:strapSwing .6s ease-in-out .5s 3;transform-origin:30px 5px}
@keyframes strapSwing{0%,100%{transform:rotateZ(0)}50%{transform:rotateZ(-8deg)}}
.eye{animation:blink 3s ease-in-out infinite}
@keyframes blink{0%,85%,100%{transform:scaleY(1)}88%,95%{transform:scaleY(.1)}}
.mouth{animation:smile .5s ease-in-out 2.2s forwards}
@keyframes smile{0%{d:path("M 55 74 Q 65 80 75 74")}100%{d:path("M 50 74 Q 65 88 80 74")}}
.kt-title{position:relative;z-index:3;margin-top:4px;color:#4a2d7a;font-size:clamp(27px,7vw,36px);font-weight:900;letter-spacing:.3px;text-align:center;opacity:0;transform:translateY(14px) scale(.92);animation:titleIn .8s cubic-bezier(.34,1.56,.64,1) 2s forwards;text-shadow:0 3px 0 rgba(255,255,255,.7)}
@keyframes titleIn{to{opacity:1;transform:translateY(0) scale(1)}}
.kt-subtitle{position:relative;z-index:3;margin-top:8px;color:#8b78aa;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:0;animation:subtitleIn .7s ease 2.45s forwards}
@keyframes subtitleIn{to{opacity:1}}
.kt-dot{position:absolute;top:50%;left:50%;width:24px;height:24px;opacity:0;background:#fff;clip-path:polygon(50% 0%,61% 36%,100% 50%,61% 64%,50% 100%,39% 64%,0 50%,39% 36%);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #c4a5ff);transform:translate(-50%,-50%) scale(.12);animation:starBurstLaunch .75s cubic-bezier(.2,.8,.2,1) 4.25s both}
@keyframes starBurstLaunch{0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(0)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(35deg)}55%{opacity:1;transform:translate(-50%,80px) scale(.9) rotate(120deg)}100%{opacity:0;transform:translate(-50%,-42vh) scale(2.8) rotate(280deg)}}
@media(max-height:650px){.character-container{transform:scale(.82) translateX(-300px);margin-top:-18px}.kt-title{margin-top:-4px}}
@media(prefers-reduced-motion:reduce){.float-shape,.star,.splash-halo,.character-container,#leftLeg,#rightLeg,#leftArm,#rightArm,.char-body,.bag-strap,.eye,.mouth,.kt-title,.kt-subtitle,.kt-dot{animation:none!important}.character-container{transform:none;opacity:1}.kt-title,.kt-subtitle{opacity:1;transform:none}.kt-dot{display:none}}
</style>
</head>

    <div class="float-shape" style="width:64px;height:64px;bottom:18%;left:17%;background:#9bd8bd"></div>

        <rect x="72" y="140" width="16" height="45" rx="8" fill="#5b4a8a" />
        <ellipse cx="82" cy="186" rx="14" ry="8" fill="#7c3aed" />
        <ellipse cx="82" cy="183" rx="14" ry="5" fill="#8b5cf6" />
       </g> <!-- Body (shirt) --> <rect x="32" y="90" width="66" height="58" rx="20" fill="#8b5cf6" /> <rect x="38" y="95" width="54" height="48" rx="16" fill="#a78bfa" /> <!-- Shirt pocket --> <rect x="46" y="105" width="18" height="14" rx="4" fill="#7c3aed" opacity="0.3" /> <!-- Arms --> <g id="leftArm">
        <rect x="15" y="95" width="18" height="40" rx="9" fill="#fbbf80" />

        <rect x="97" y="95" width="18" height="40" rx="9" fill="#fbbf80" />
        <circle cx="106" cy="138" r="8" fill="#fdd8a8" />
       </g> <!-- Head --> <circle cx="65" cy="60" r="38" fill="#fdd8a8" /> <!-- Hair --> <path d="M 27 55 Q 30 15 65 18 Q 100 15 103 55" fill="#4a2d7a" /> <path d="M 30 48 Q 35 25 65 22 Q 95 25 100 48" fill="#5b3a94" /> <!-- Hair tufts --> <path d="M 55 20 Q 60 8 68 18" fill="#4a2d7a" stroke="#4a2d7a" stroke-width="2" /> <path d="M 62 18 Q 70 6 75 20" fill="#4a2d7a" stroke="#4a2d7a" stroke-width="2" /> <!-- Face --> <!-- Eyes --> <g class="eye" style="transform-origin: 50px 58px;">
        <ellipse cx="50" cy="58" rx="7" ry="8" fill="white" />
        <ellipse cx="52" cy="59" rx="4" ry="5" fill="#2d1b4e" />

       </g> <g class="eye" style="transform-origin: 80px 58px; animation-delay: 0.1s;">
        <ellipse cx="80" cy="58" rx="7" ry="8" fill="white" />
        <ellipse cx="78" cy="59" rx="4" ry="5" fill="#2d1b4e" />
        <ellipse cx="77" cy="57" rx="1.5" ry="2" fill="white" />
       </g> <!-- Eyebrows --> <path d="M 42 47 Q 50 43 57 47" stroke="#4a2d7a" stroke-width="2.5" fill="none" stroke-linecap="round" /> <path d="M 73 47 Q 80 43 88 47" stroke="#4a2d7a" stroke-width="2.5" fill="none" stroke-linecap="round" /> <!-- Cheeks (blush) --> <ellipse cx="38" cy="70" rx="8" ry="5" fill="#f9a8d4" opacity="0.5" /> <ellipse cx="92" cy="70" rx="8" ry="5" fill="#f9a8d4" opacity="0.5" /> <!-- Mouth --> <path class="mouth" d="M 55 74 Q 65 80 75 74" stroke="#c2185b" stroke-width="2.5" fill="none" stroke-linecap="round" id="mouth" /> <!-- Nose --> <circle cx="65" cy="68" r="2" fill="#e8b88a" />
      </svg><!-- School bag on shoulder -->
      <div class="bag" id="schoolBag">
       <svg viewBox="0 0 50 55" width="50" height="55"><rect x="5" y="10" width="40" height="38" rx="8" fill="#7c3aed" /> <rect x="10" y="15" width="30" height="28" rx="5" fill="#8b5cf6" /> <!-- Bag flap --> <g class="bag-flap" id="bagFlap">
         <rect x="5" y="10" width="40" height="12" rx="6" fill="#6d28d9" />
         <ellipse cx="25" cy="16" rx="18" ry="5" fill="#5b21b6" opacity="0.4" />
        </g> <!-- Bag strap --> <g class="bag-strap" id="bagStrap">
         <path d="M 20 10 Q 10 0 5 15" stroke="#5b21b6" stroke-width="3" fill="none" stroke-linecap="round" />
        </g> <!-- Pocket --> <rect x="15" y="22" width="14" height="10" rx="3" fill="#6d28d9" opacity="0.5" /> <circle cx="25" cy="27" r="2" fill="#fbbf24" />
       </svg>
      </div></div>

    <div class="kt-title">Kids Teacher</div>

    <!-- SUPABASE AUTH CHECK: route returning users using their Supabase profile -->
    <script type="module">
        import { supabase } from "./supabase-client.js";

        try {
            const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
            if (sessionError) throw sessionError;

            const user = sessionData.session?.user || null;
            window.__ktDestination = "./login.html";

            if (user) {
                const { data: profile, error } = await supabase
                    .from("profiles")
                    .select("child_name,buddy")
                    .eq("id", user.id)
                    .maybeSingle();

                if (error) throw error;

                window.__ktDestination = !profile?.child_name
                    ? "./child-name.html"
                    : (profile.buddy?.id ? "./index-home.html" : "./buddy-selection.html");
            }

            window.__ktAuthResolved = true;
            if (window.__ktSplashFinished) {
                window.location.replace(window.__ktDestination);
            }
        } catch (error) {
            console.error("Supabase splash profile check failed:", error);
            window.__ktAuthResolved = true;
            window.__ktDestination = "./login.html";
            if (window.__ktSplashFinished) {
                window.location.replace(window.__ktDestination);
            }
        }
    </script>

    <script>
        // Preserve the original splash animation. Route after Supabase resolves
        // the current session and saved profile.
        const dot = document.querySelector('.kt-dot');
        let routeStarted = false;

        function finishSplash() {
            window.__ktSplashFinished = true;
            if (routeStarted) return;
            if (window.__ktAuthResolved) {
                routeStarted = true;
                window.location.replace(
                    window.__ktDestination || './login.html'
                );
            }
        }

        if (dot) {
            dot.addEventListener('animationend', (event) => {
                if (event.animationName === 'starBurstLaunch') finishSplash();
            }, { once: true });
        }

        // Safety fallback if the browser skips the animation event.
        window.setTimeout(finishSplash, 5100);

        // If Firebase takes unusually long, do not leave the splash stuck.
        window.setTimeout(() => {
            if (!routeStarted && window.__ktSplashFinished && !window.__ktAuthResolved) {
                routeStarted = true;
                window.location.replace(window.__ktDestination || './login.html');
            }
        }, 6800);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
                    registration.update().catch(() => {});
                    if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (!sessionStorage.getItem('kt_sw_reloaded')) {
                            sessionStorage.setItem('kt_sw_reloaded', '1');
                            window.location.reload();
                        }
                    });
                } catch (error) {
                    console.log('Service Worker registration failed:', error);
                }
            });
        }
    </script>
