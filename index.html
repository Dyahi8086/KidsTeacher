  </section></main><script>
const networkMessage = document.getElementById("networkMessage");
const parentImage = document.getElementById("parentImage");
const backup = document.getElementById("backup");

let slowTimer;
let testController;

function showMessage(text) {
  networkMessage.textContent = text;
  networkMessage.style.display = "block";
}

function hideMessage() {
  networkMessage.style.display = "none";
}

function showBackup() {
  parentImage.style.display = "none";
  backup.style.display = "block";
}

parentImage.addEventListener("error", showBackup);

if (parentImage.complete && parentImage.naturalWidth === 0) {
  showBackup();
}

async function checkConnection() {
  clearTimeout(slowTimer);

  if (!navigator.onLine) {
    showMessage("⚠️ No Internet Connection");
    return;
  }

  showMessage("⚠️ Checking network...");

  if (testController) {
    testController.abort();
  }

  testController = new AbortController();

  slowTimer = setTimeout(() => {
    showMessage("⚠️ Slow Network. Please wait...");
  }, 1500);

  try {
    const response = await fetch(
      "https://www.gstatic.com/generate_204?check=" + Date.now(),
      {
        method: "GET",
        cache: "no-store",
        signal: testController.signal
      }
    );

    clearTimeout(slowTimer);

    if (!navigator.onLine) {
      showMessage("⚠️ No Internet Connection");
    } else if (!response.ok) {
      showMessage("⚠️ Slow Network. Please wait...");
    } else {
      hideMessage();
    }
  } catch (error) {
    clearTimeout(slowTimer);

    if (!navigator.onLine) {
      showMessage("⚠️ No Internet Connection");
    } else if (error.name !== "AbortError") {
      showMessage("⚠️ Slow Network. Please wait...");
    }
  }
}

window.addEventListener("offline", () => {
  clearTimeout(slowTimer);

  if (testController) {
    testController.abort();
  }

  showMessage("⚠️ No Internet Connection");
});

window.addEventListener("online", checkConnection);

window.addEventListener("load", () => {
  if (!navigator.onLine) {
    showMessage("⚠️ No Internet Connection");
  } else {
    checkConnection();
  }
});
</script></body>
