<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Teacher - Welcome</title>
    <style>
        /* --- 1. CSS RESET & BASE SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #e0f2fe;
            /* Font change kiya hai taaki thoda modern lage */
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif; 
        }

        /* --- 2. MAIN CONTAINER (Mobile Fit) --- */
        .welcome-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Advanced mobile fit */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 5vh; /* Bottom se space */
            
            background-image: url('welcome_bg.png');
            background-size: cover; 
            background-position: top center; 
            background-repeat: no-repeat;
        }

        /* --- 3. TEXT CONTENT (Advanced Animations) --- */
        .text-content {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            width: 90%;
            /* Animation add ki hai */
            animation: slideUpFade 1.2s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .text-content h1 {
            font-size: 22px; /* Size chota kiya */
            color: #6A5ACD; /* Naya Color: Slate Blue (Purple-Blue mix) */
            margin-bottom: 6px;
            font-weight: 800;
            letter-spacing: 0.5px;
            /* Text Shadow for premium look */
            text-shadow: 1px 1px 0px #fff, 2px 2px 5px rgba(106, 90, 205, 0.3); 
        }

        .text-content p {
            font-size: 13px; /* Size chota kiya */
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            font-style: italic;
        }

        /* --- 4. ADVANCED 3D BUTTON --- */
        .start-btn {
            width: 85%;
            max-width: 320px;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 800;
            color: white;
            background: linear-gradient(145deg, #ff7a59, #ff5733); 
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            z-index: 10;
            
            /* 3D Shadow Effect */
            box-shadow: 0 8px 0 #c0392b, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1); 
            
            /* Button Animation */
            animation: slideUpFade 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .start-btn:active {
            transform: translateY(8px); 
            box-shadow: 0 0px 0 #c0392b, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* --- 5. PRELOADER --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e0f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #cce5ff;
            border-top: 5px solid #ff5733;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animation Keyframes */
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <!-- Preload image for faster loading -->
    <link rel="preload" as="image" href="welcome_bg.png">
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <!-- Main Screen -->
    <div class="welcome-container">
        
        <!-- Upar shift kiya gaya, naye color ke saath -->
        <div class="text-content">
            <h1>Start Your Magical Journey ✨</h1>
            <p>Fun learning for little explorers!</p>
        </div>

        <button class="start-btn" onclick="startApp()">Let's Start 🚀</button>

    </div>

    <script>
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            preloader.classList.add('hidden');
            setTimeout(() => { preloader.style.display = 'none'; }, 500);
        });

        function startApp() {
            // Yahan apna login page link daalein
            // window.location.href = "login.html"; 
            alert("Welcome! Let's go to Login.");
        }

        // Backup timer for slow internet
        setTimeout(function() {
            const preloader = document.getElementById('preloader');
            if(preloader) {
                preloader.classList.add('hidden');
                setTimeout(() => { preloader.style.display = 'none'; }, 500);
            }
        }, 3000);
    </script>
</body>
</html>
