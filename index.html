<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Teacher - Welcome</title>
    
    <!-- Advanced Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. ADVANCED CSS SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Fredoka', sans-serif; 
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #e0f2fe;
            overflow: hidden;
        }

        .welcome-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Content ko niche rakhega */
            align-items: center;
            padding-bottom: 80px; /* Button ko thoda upar kiya */
            
            background-image: url('welcome_bg.png');
            background-size: cover; 
            background-position: top center; 
            background-repeat: no-repeat;
        }

        /* --- 2. ADVANCED BUTTON WITH BREATHING & GLOW --- */
        .start-btn {
            position: relative;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            font-size: 22px;
            font-weight: 700;
            color: white;
            background: linear-gradient(145deg, #ff7a59, #ff5733); 
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            z-index: 10;
            overflow: hidden; 
            
            /* 3D Shadow */
            box-shadow: 0 10px 0 #b83b23, 0 20px 30px rgba(255, 87, 51, 0.4);
            
            /* Breathing & Glow Animation */
            animation: breathe 3s infinite alternate ease-in-out, glow 3s infinite alternate ease-in-out;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Button dabane par andar jayega */
        .start-btn:active {
            transform: translateY(10px); 
            box-shadow: 0 0px 0 #b83b23, 0 5px 10px rgba(0,0,0,0.2);
            /* Animation ko pause karega jab click ho */
            animation: none; 
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        /* --- 3. KEYFRAMES FOR ANIMATIONS --- */
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* Button ka saans lene wala effect */
        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* Button ke peeche glow */
        @keyframes glow {
            0% { box-shadow: 0 10px 0 #b83b23, 0 0px 20px rgba(255, 122, 89, 0.4); }
            100% { box-shadow: 0 10px 0 #b83b23, 0 0px 40px rgba(255, 122, 89, 0.8); }
        }
    </style>
</head>
<body>

    <div class="welcome-container" id="parallaxContainer">
        
        <!-- Koi Text Nahi, Bas Ek Solid Button -->
        <button class="start-btn" id="startBtn">Let's Start 🚀</button>

    </div>

    <!-- --- ADVANCED JAVASCRIPT --- -->
    <script>
        const btn = document.getElementById('startBtn');
        
        // 1. Continuous Haptic Feedback (Jab touch karein)
        btn.addEventListener('touchstart', function() {
            if (navigator.vibrate) {
                navigator.vibrate([20, 30, 20]); // Halka sa vibrate hoga
            }
        });

        // 2. Button Click Logic
        btn.addEventListener('click', function(e) {
            // Ripple Effect Calculate
            let rect = this.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            let ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.width = ripple.style.height = `30px`; 
            
            this.appendChild(ripple);

            setTimeout(() => { ripple.remove(); }, 600);

            // Login Page par Redirect
            setTimeout(() => {
                window.location.href = "login.html"; 
            }, 200); 
        });

        // 3. Advanced Parallax (Touch par background halka sa move hoga)
        const container = document.getElementById('parallaxContainer');
        document.addEventListener('touchmove', function(e) {
            let touch = e.touches[0];
            let x = (touch.clientX / window.innerWidth - 0.5) * 15; 
            let y = (touch.clientY / window.innerHeight - 0.5) * 15;
            container.style.backgroundPosition = `calc(50% + ${x}px) calc(0% + ${y}px)`;
        });
    </script>
</body>
</html>
