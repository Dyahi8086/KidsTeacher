<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kids Teacher - Parent Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #38251c;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-screen {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    .app-screen img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <main class="app-screen">
    <img
      src="parent_login_ui.png"
      alt="Kids Teacher Parent Login"
    >
  </main>
</body>
</html>
