<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e0f2fe">

    <title>Kids Teacher - Welcome</title>

    <link rel="preload" href="welcome_bg.png" as="image">

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            background-color: #e0f2fe;
            overflow: hidden;
        }

        /* LOADING SCREEN */

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;

            background: #e0f2fe;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            z-index: 9999;

            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;

            border: 5px solid #ffffff;
            border-top: 5px solid #FF6B35;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin-bottom: 15px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 20px;
            color: #8B3A00;
            font-weight: 600;
        }

        /* WELCOME SCREEN */

        #welcome-content {
            display: none;

            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            flex-direction: column;
            justify-content: flex-end;
            align-items: center;

            padding-bottom: 40px;

            background-image: url('./welcome_bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;

            background-color: #fce7f3;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;

            padding: 0 20px;
        }

        .text-content {
            text-align: center;
            margin-bottom: 20px;
        }

        .text-content h1 {
            font-family: 'Fredoka', sans-serif;

            font-size: clamp(24px, 6vw, 32px);

            color: #8B3A00;

            font-weight: 700;
            line-height: 1.2;

            margin-bottom: 8px;

            text-shadow:
                1px 1px 0px rgba(255,255,255,0.8),
                2px 2px 5px rgba(0,0,0,0.1);
        }

        .text-content p {
            font-family: 'Nunito', sans-serif;

            font-size: clamp(13px, 4vw, 16px);

            color: #6B5B4D;

            font-weight: 700;
        }

        /* START BUTTON */

        .start-btn {
            position: relative;

            width: 100%;
            max-width: 350px;

            padding: 16px 20px;

            font-size: 20px;

            font-family: 'Fredoka', sans-serif;
            font-weight: 700;

            color: white;

            background: #FF6B35;

            border: none;
            border-radius: 50px;

            cursor: pointer;

            box-shadow:
                0 6px 0 #cc4e20,
                0 10px 20px rgba(255, 107, 53, 0.4);

            transition: transform 0.1s;

            animation: pulseBtn 2s infinite;
        }

        .start-btn:active {
            transform: translateY(6px);

            box-shadow: 0 0px 0 #cc4e20;

            animation: none;
        }

        .start-btn:disabled {
            opacity: 0.8;
            cursor: wait;
            animation: none;
        }

        @keyframes pulseBtn {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- LOADING -->

    <div id="splash-screen">

        <div class="spinner"></div>

        <div class="loading-text">
            Loading Adventure...
        </div>

    </div>


    <!-- WELCOME -->

    <div id="welcome-content">

        <div class="content-wrapper">

            <div class="text-content">

                <h1>
                    Learning Is an<br>
                    Adventure!
                </h1>

                <p>
                    Explore, discover and grow every day.
                </p>

            </div>

            <button
                class="start-btn"
                id="startBtn"
                type="button"
            >
                Let's Start →
            </button>

        </div>

    </div>


    <!-- FIREBASE + REDIRECT -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        /* FIREBASE CONFIG */

        const firebaseConfig = {

            apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",

            authDomain: "kids-teacher-4387e.firebaseapp.com",

            projectId: "kids-teacher-4387e",

            storageBucket: "kids-teacher-4387e.firebasestorage.app",

            messagingSenderId: "420221167346",

            appId: "1:420221167346:web:da7ac80acdfd52339d526b"

        };


        /* INITIALIZE FIREBASE */

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        /* ELEMENTS */

        const splash = document.getElementById("splash-screen");

        const welcomeContent = document.getElementById("welcome-content");

        const startBtn = document.getElementById("startBtn");


        /* WELCOME SCREEN */

        let welcomeShown = false;

        function showWelcome() {

            if (welcomeShown) {
                return;
            }

            welcomeShown = true;

            splash.style.opacity = "0";

            setTimeout(() => {

                splash.style.display = "none";

                welcomeContent.style.display = "flex";

            }, 250);

        }


        /* BACKGROUND IMAGE */

        const bgImg = new Image();

        bgImg.src = "./welcome_bg.png";

        bgImg.onload = showWelcome;

        bgImg.onerror = showWelcome;


        /* FALLBACK */

        setTimeout(() => {

            showWelcome();

        }, 800);


        /* AUTH STATE */

        let authReady = false;

        let currentUser = null;

        let redirecting = false;


        /* CHECK LOGIN STATUS */

        startBtn.disabled = true;

        startBtn.textContent = "Checking...";


        onAuthStateChanged(

            auth,

            (user) => {

                currentUser = user;

                authReady = true;

                startBtn.disabled = false;

                startBtn.textContent = "Let's Start →";

            },

            (error) => {

                console.error(
                    "Firebase Auth Error:",
                    error
                );

                currentUser = null;

                authReady = true;

                startBtn.disabled = false;

                startBtn.textContent = "Let's Start →";

            }

        );


        /* BUTTON CLICK */

        startBtn.addEventListener("click", () => {

            if (redirecting) {
                return;
            }


            /* WAIT FOR FIREBASE */

            if (!authReady) {

                startBtn.textContent = "Please wait...";

                return;

            }


            redirecting = true;

            startBtn.disabled = true;

            startBtn.textContent = "Opening...";


            /* USER ALREADY LOGGED IN */

            if (currentUser) {

                const savedAge = localStorage.getItem(
                    "kidsAgeGroup"
                );


                if (savedAge) {

                    window.location.href =
                        "./index-home.html";

                } else {

                    window.location.href =
                        "./age-select.html";

                }

            }


            /* USER NOT LOGGED IN */

            else {

                window.location.href =
                    "./login.html";

            }

        });


        /* SERVICE WORKER */

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("./service-worker.js")
                    .catch((error) => {

                        console.log(
                            "Service Worker Error:",
                            error
                        );

                    });

            });

        }

    </script>

</body>
</html>
