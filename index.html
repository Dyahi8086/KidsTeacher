
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no,
          viewport-fit=cover">

    <meta name="theme-color" content="#e0f2fe">

    <title>Kids Teacher - Welcome</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">

    <link rel="icon"
          type="image/png"
          href="./icons/icon-192.png">

    <link rel="apple-touch-icon"
          href="./icons/icon-192.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap"
          rel="stylesheet">

    <!-- Original PNG preload -->
    <link rel="preload"
          as="image"
          href="./welcome_bg.png">

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #e0f2fe;
        }

        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            position: fixed;
            inset: 0;

            background: #e0f2fe;

            font-family: 'Fredoka', sans-serif;
        }

        /* =========================
           FULL SCREEN SPLASH
        ========================= */

        #splash-screen {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            height: 100vh;
            height: 100dvh;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            background: #e0f2fe;

            z-index: 9999;

            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;

            border: 5px solid #ffffff;

            border-top: 5px solid #FF6B35;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin-bottom: 15px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-family: 'Fredoka', sans-serif;

            font-size: 20px;

            color: #8B3A00;

            font-weight: 600;
        }

        /* =========================
           WELCOME SCREEN
        ========================= */

        #welcome-content {

            display: none;

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            height: 100vh;
            height: 100dvh;

            overflow: hidden;

            flex-direction: column;

            justify-content: flex-end;

            align-items: center;

            background-color: #fce7f3;

            /*
              Original PNG.
              Image will not be cropped.
            */

            background-image: url("./welcome_bg.png");

            background-size: 100% 100%;

            background-position: center center;

            background-repeat: no-repeat;

            /*
              Safe area support
            */

            padding-top: env(safe-area-inset-top);

            padding-left: env(safe-area-inset-left);

            padding-right: env(safe-area-inset-right);

            padding-bottom: calc(
                25px + env(safe-area-inset-bottom)
            );

            /*
              Important:
              Do not use 100vw/100vh
              for child layout sizing.
            */

            isolation: isolate;
        }

        /* =========================
           CONTENT
        ========================= */

        .content-wrapper {

            position: relative;

            z-index: 10;

            display: flex;

            flex-direction: column;

            align-items: center;

            width: 100%;

            padding-left: 20px;

            padding-right: 20px;

            flex-shrink: 0;
        }

        /* =========================
           TEXT
        ========================= */

        .text-content {

            width: 100%;

            text-align: center;

            margin-bottom: 20px;
        }

        .text-content h1 {

            font-family: 'Fredoka', sans-serif;

            font-size: clamp(
                24px,
                6vw,
                32px
            );

            color: #8B3A00;

            font-weight: 700;

            line-height: 1.2;

            margin-bottom: 8px;

            text-shadow:
                1px 1px 0px rgba(255,255,255,0.8),
                2px 2px 5px rgba(0,0,0,0.1);
        }

        .text-content p {

            font-family: 'Nunito', sans-serif;

            font-size: clamp(
                14px,
                4vw,
                16px
            );

            color: #6B5B4D;

            font-weight: 700;

            line-height: 1.4;
        }

        /* =========================
           START BUTTON
        ========================= */

        .start-btn {

            position: relative;

            width: 100%;

            max-width: 350px;

            padding: 18px 20px;

            font-size: 20px;

            font-family: 'Fredoka', sans-serif;

            font-weight: 700;

            color: white;

            background: #FF6B35;

            border: none;

            border-radius: 50px;

            cursor: pointer;

            box-shadow:
                0 6px 0 #cc4e20,
                0 10px 20px rgba(255,107,53,0.4);

            transition: transform 0.1s;

            animation: pulseBtn 2s infinite;

            flex-shrink: 0;

            -webkit-appearance: none;

            appearance: none;
        }

        .start-btn:active {

            transform: translateY(6px);

            box-shadow:
                0 0 0 #cc4e20;

            animation: none;
        }

        @keyframes pulseBtn {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================
           SHORT SCREEN FIX
        ========================= */

        @media (max-height: 650px) {

            #welcome-content {

                padding-bottom: calc(
                    15px + env(safe-area-inset-bottom)
                );
            }

            .text-content {

                margin-bottom: 12px;
            }

            .text-content h1 {

                font-size: 24px;

                margin-bottom: 5px;
            }

            .text-content p {

                font-size: 14px;
            }

            .start-btn {

                padding: 14px 18px;

                font-size: 18px;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            .start-btn {

                animation: none;
            }

            .spinner {

                animation-duration: 2s;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         LOADING SCREEN
    ========================= -->

    <div id="splash-screen">

        <div class="spinner"></div>

        <div class="loading-text">
            Loading...
        </div>

    </div>


    <!-- =========================
         WELCOME SCREEN
    ========================= -->

    <div id="welcome-content">

        <div class="content-wrapper">

            <div class="text-content">

                <h1>
                    Learning Is an<br>
                    Adventure!
                </h1>

                <p>
                    Explore, discover and grow every day.
                </p>

            </div>

            <button
                class="start-btn"
                id="startBtn"
                type="button">

                Let's Start →

            </button>

        </div>

    </div>


    <!-- =========================
         FIREBASE
    ========================= -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",

            authDomain: "kids-teacher-4387e.firebaseapp.com",

            projectId: "kids-teacher-4387e",

            storageBucket: "kids-teacher-4387e.firebasestorage.app",

            messagingSenderId: "420221167346",

            appId: "1:420221167346:web:da7ac80acdfd52339d526b"

        };


        /* =========================
           INITIALIZE FIREBASE
        ========================= */

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        /* =========================
           ELEMENTS
        ========================= */

        const splash = document.getElementById(
            "splash-screen"
        );

        const welcomeContent = document.getElementById(
            "welcome-content"
        );

        const startBtn = document.getElementById(
            "startBtn"
        );


        /* =========================
           SHOW WELCOME SCREEN
        ========================= */

        function showWelcome() {

            splash.style.opacity = "0";

            setTimeout(() => {

                splash.style.display = "none";

                welcomeContent.style.display = "flex";

            }, 300);

        }


        /* =========================
           FIREBASE AUTH STATE
        ========================= */

        onAuthStateChanged(auth, (user) => {

            if (user) {

                const savedAge = localStorage.getItem(
                    "kidsAgeGroup"
                );

                window.location.replace(
                    !savedAge
                        ? "age-select.html"
                        : "index-home.html"
                );

            } else {

                showWelcome();

            }

        });


        /* =========================
           START BUTTON
        ========================= */

        startBtn.addEventListener("click", () => {

            window.location.href = "login.html";

        });


        /* =========================
           SERVICE WORKER
        ========================= */

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register(
                    "./service-worker.js"
                ).catch((error) => {

                    console.error(
                        "Service Worker registration failed:",
                        error
                    );

                });

            });

        }

    </script>

</body>
</html>
