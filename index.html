<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Teacher - Welcome</title>
  <!-- Google Fonts: Playful & Rounded -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      padding: 15px;
    }

    /* Phone Outer Frame */
    .app-screen {
      width: 100%;
      max-width: 390px;
      height: 780px;
      position: relative;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      background-color: #fef08a;
    }

    /* Background Image (3D Cloud Classroom) */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      /* Duolingo style Floating Animation */
      animation: floatBg 5s ease-in-out infinite;
    }

    @keyframes floatBg {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Bottom Overlay Card Wrapper */
    .bottom-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      text-align: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(255, 248, 240, 0) 0%, rgba(255, 248, 240, 0.85) 25%, #fff8f0 100%);
      border-radius: 40px 40px 0 0;
      backdrop-filter: blur(2px);
    }

    /* Title Text */
    .hero-title {
      font-size: 27px;
      color: #9a3412;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 8px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
    }

    /* Subtitle Description */
    .hero-subtitle {
      font-size: 13.5px;
      color: #475569;
      font-weight: 600;
      margin-bottom: 22px;
    }

    /* 3D Big Orange Button (Let's Start) */
    .btn-start {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff7e33, #f97316);
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 
        0 6px 0 #c2410c, 
        0 12px 20px rgba(249, 115, 22, 0.4);
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c2410c, 0 4px 10px rgba(249, 115, 22, 0.3) !important;
    }

    /* Slider Dots */
    .dots-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .dot {
      width: 100%;
      max-width: 10px;
      height: 10px;
      background: #fdba74;
      border-radius: 50%;
    }

    .dot.active {
      max-width: 22px;
      background: #f97316;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <!-- Background Image -->
    <img src="welcome_bg.png" alt="Kids Teacher Cloud Classroom" class="bg-image">

    <!-- Bottom Content Overlay -->
    <div class="bottom-wrapper">
      <h1 class="hero-title">Learning Is an<br>Adventure!</h1>
      <p class="hero-subtitle">Explore, discover and grow every day.</p>

      <!-- 3D Action Button linking to login.html -->
      <a href="login.html" class="btn-start">
        Let's Start ➔
      </a>

      <!-- Carousel Pagination Dots -->
      <div class="dots-container">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

  </div>

</body>
</html>
