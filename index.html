<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kids Teacher - Welcome</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #faf08a;
      overflow: hidden;
      position: fixed;
    }

    .app-screen {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
      background-color: #faf08a;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .bottom-wrapper {
      position: relative;
      width: 100%;
      padding: 24px 20px 36px 20px;
      text-align: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(255, 248, 240, 0) 0%, rgba(255, 248, 240, 0.92) 25%, #fff8f0 100%);
      border-radius: 35px 35px 0 0;
      backdrop-filter: blur(4px);
    }

    .hero-title {
      font-size: 26px;
      color: #9a3412;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 14px;
      color: #475569;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .btn-start {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff7e5f, #f97316);
      color: #ffffff;
      border: none;
      border-radius: 22px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 0 #c2410c, 0 10px 20px rgba(249, 115, 22, 0.35);
      text-decoration: none;
      transition: transform 0.1s ease;
    }

    .btn-start:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c2410c;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <img src="welcome_bg.png" alt="Kids Teacher" class="bg-image">
    
    <div class="bottom-wrapper">
      <h1 class="hero-title">Welcome to Kids Teacher! 🌟</h1>
      <p class="hero-subtitle">A magical learning journey for your little ones</p>
      
      <a href="login.html" class="btn-start">
        Let's Start 🚀
      </a>
    </div>
  </div>

</body>
</html>
