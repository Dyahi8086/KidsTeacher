<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Clay Kids Teacher UI - Pure CSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e293b;
      padding: 20px;
    }

    /* Outer Phone Frame */
    .app-screen {
      width: 100%;
      max-width: 390px;
      height: 780px;
      position: relative;
      border-radius: 40px;
      overflow: hidden;
      background: #f5d0a9; /* Soft Wooden Floor Color */
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ----------------------------------------------------
       1. TOP SECTION: 3D Classroom Background (Pure CSS)
    ---------------------------------------------------- */
    .classroom-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: linear-gradient(180deg, #fce8d5 0%, #f3c89d 100%);
      overflow: hidden;
    }

    /* Blackboard in background */
    .blackboard {
      position: absolute;
      top: 25px;
      right: 20px;
      width: 150px;
      height: 100px;
      background: #2d4a3e;
      border: 6px solid #8c532b;
      border-radius: 12px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }
    .blackboard::after {
      content: "☁️ ☀️ 💖";
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 18px;
      opacity: 0.8;
    }

    /* Bookshelf in background */
    .bookshelf {
      position: absolute;
      top: 30px;
      left: 20px;
      width: 80px;
      height: 120px;
      background: #a66a38;
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
    }
    .shelf-line {
      width: 100%;
      height: 6px;
      background: #6e421f;
      margin-top: 35px;
    }

    /* 3D Toy Cubes on Floor */
    .toy-blocks {
      position: absolute;
      bottom: 220px;
      right: 25px;
      display: flex;
      gap: 5px;
      z-index: 2;
    }
    .block {
      width: 28px;
      height: 28px;
      background: #38bdf8;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 5px 0 #0284c7, 0 8px 10px rgba(0,0,0,0.2);
    }
    .block.yellow { background: #facc15; box-shadow: 0 5px 0 #ca8a04; }
    .block.red { background: #f87171; box-shadow: 0 5px 0 #dc2626; }

    /* 3D Stacked Books on Floor */
    .stacked-books {
      position: absolute;
      bottom: 210px;
      left: 25px;
      z-index: 2;
    }
    .book {
      width: 55px;
      height: 12px;
      border-radius: 3px;
      margin-bottom: 2px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .b1 { background: #ef4444; }
    .b2 { background: #3b82f6; }
    .b3 { background: #eab308; }

    /* ----------------------------------------------------
       2. BOTTOM SECTION: 3D Claymorphism Login Card
    ---------------------------------------------------- */
    .clay-card-wrapper {
      position: relative;
      z-index: 5;
      margin-top: auto;
      padding: 0 15px 15px 15px;
    }

    /* Decorative Clay Leaves behind Card */
    .leaf {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #4ade80;
      border-radius: 0 70% 0 70%;
      box-shadow: inset -3px -3px 0 #16a34a, 0 6px 12px rgba(0,0,0,0.15);
      z-index: 4;
    }
    .leaf-left-1 { top: -20px; left: 10px; transform: rotate(-20deg); }
    .leaf-left-2 { top: 30px; left: -5px; transform: rotate(-50deg); }
    .leaf-right-1 { top: -20px; right: 10px; transform: rotate(70deg); }
    .leaf-right-2 { top: 30px; right: -5px; transform: rotate(100deg); }

    .clay-card {
      background: #ffffff;
      border-radius: 40px;
      padding: 30px 20px 20px 20px;
      text-align: center;
      position: relative;
      /* Soft Claymorphism 3D Shadow Effect */
      box-shadow: 
        0 20px 30px rgba(0, 0, 0, 0.15),
        inset 0 -8px 0 #f1f5f9,
        inset 0 4px 12px rgba(255, 255, 255, 1);
      border: 4px solid #ffffff;
    }

    /* 3D Sun Badge */
    .sun-badge {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-radius: 50%;
      margin: -55px auto 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 
        0 8px 0 #d97706,
        0 12px 20px rgba(217, 119, 6, 0.3);
      position: relative;
    }

    .app-title {
      font-size: 30px;
      color: #451a03;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 0 2px 0 rgba(255,255,255,0.8);
    }

    /* 3D Clay Buttons */
    .btn-3d {
      width: 100%;
      padding: 14px;
      border-radius: 20px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      transition: all 0.1s ease;
    }

    .btn-google {
      background: #ffffff;
      color: #334155;
      box-shadow: 
        0 6px 0 #cbd5e1,
        0 10px 15px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
    }

    .btn-email {
      background: linear-gradient(135deg, #ff7e5f, #ff6b4a);
      color: #ffffff;
      box-shadow: 
        0 6px 0 #c2410c,
        0 10px 18px rgba(255, 126, 95, 0.4);
    }

    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 transparent !important;
    }

    /* Bottom 4 Feature Cards */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .feature-card {
      border-radius: 16px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.06);
    }

    .feature-card span {
      font-size: 10px;
      font-weight: 700;
      color: #334155;
      line-height: 1.1;
    }

    .f-blue   { background: #e0f2fe; border: 1px solid #bae6fd; }
    .f-yellow { background: #fef9c3; border: 1px solid #fef08a; }
    .f-green  { background: #dcfce7; border: 1px solid #bbf7d0; }
    .f-pink   { background: #ffe4e6; border: 1px solid #fecdd3; }

  </style>
</head>
<body>

  <div class="app-screen">
    
    <!-- 1. Background Classroom Scene (Pure CSS) -->
    <div class="classroom-bg">
      <div class="bookshelf">
        <div class="shelf-line"></div>
        <div class="shelf-line"></div>
      </div>
      <div class="blackboard"></div>
    </div>

    <!-- 3D Toys & Books on Floor -->
    <div class="stacked-books">
      <div class="book b1"></div>
      <div class="book b2"></div>
      <div class="book b3"></div>
    </div>

    <div class="toy-blocks">
      <div class="block">A</div>
      <div class="block yellow">B</div>
      <div class="block red">C</div>
    </div>

    <!-- 2. Claymorphism Card & UI Overlay -->
    <div class="clay-card-wrapper">
      
      <!-- Clay Leaves -->
      <div class="leaf leaf-left-1"></div>
      <div class="leaf leaf-left-2"></div>
      <div class="leaf leaf-right-1"></div>
      <div class="leaf leaf-right-2"></div>

      <!-- Main Card -->
      <div class="clay-card">
        
        <!-- 3D Sun Icon -->
        <div class="sun-badge">☀️</div>

        <h1 class="app-title">Kids Teacher</h1>

        <!-- 3D Buttons -->
        <button class="btn-3d btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>

        <button class="btn-3d btn-email">
          ✉️ Login with Email
        </button>

        <!-- Feature Grid -->
        <div class="features-grid">
          <div class="feature-card f-blue">
            <div style="font-size: 20px;">📊</div>
            <span>Track Progress</span>
          </div>
          <div class="feature-card f-yellow">
            <div style="font-size: 20px;">👁️</div>
            <span>Monitor Activities</span>
          </div>
          <div class="feature-card f-green">
            <div style="font-size: 20px;">🛡️</div>
            <span>Safe & Secure</span>
          </div>
          <div class="feature-card f-pink">
            <div style="font-size: 20px;">💖</div>
            <span>Support Child</span>
          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
