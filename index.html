<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Teacher</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      /* इमेज को सीधे स्क्रीन का फुल कवर बैकग्राउंड बना दिया है, कोई गैप नहीं बचेगा */
      background: url('welcome_bg.png') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 16px;
      font-family: 'Quicksand', sans-serif;
      position: relative;
    }

    /* बादलों की स्मूथ एनिमेशन ऊपर से चलेगी */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 300%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><path fill="rgba(255,255,255,0.2)" d="M100,150 Q130,110 160,150 Q190,100 230,130 Q270,110 300,150 Z M700,250 Q730,210 760,250 Q790,200 830,230 Q870,210 900,250 Z"/></svg>');
      background-repeat: repeat-x;
      animation: moveCloudsSmooth 40s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes moveCloudsSmooth {
      0% { transform: translateX(0); }
      100% { transform: translateX(33.33%); }
    }

    .welcome-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 10px;
    }

    .welcome-text-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .welcome-heading {
      font-family: 'Baloo 2', cursive;
      font-size: 21px;
      font-weight: 800;
      color: #9a3412;
      margin-bottom: 2px;
    }

    .welcome-subtext {
      font-size: 12px;
      color: #334155;
      font-weight: 700;
    }

    .btn-get-started {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff7e5f, #f97316);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-size: 18px;
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #c2410c, 0 8px 16px rgba(249, 115, 22, 0.4);
      text-decoration: none;
      display: block;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .btn-get-started:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c2410c;
    }
  </style>
</head>
<body>

  <div class="welcome-container">
    <div class="welcome-text-box">
      <h1 class="welcome-heading">Learning Is an Adventure!</h1>
      <p class="welcome-subtext">Explore, discover and grow every day.</p>
    </div>

    <a href="login.html" class="btn-get-started">Let's Start →</a>
  </div>

</body>
</html>
