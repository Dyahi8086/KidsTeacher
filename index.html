<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#315CEB">
<title>Kids Teacher</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#315CEB}
#splash-screen{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;isolation:isolate;background:radial-gradient(ellipse at 50% 34%,#7DEBFF 0%,transparent 38%),linear-gradient(160deg,#2448C9 0%,#5267ED 47%,#27B9E6 100%);z-index:99990}
#splash-screen:before{content:"";position:absolute;inset:-20%;z-index:-2;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.28),transparent 23%),radial-gradient(circle at 88% 65%,rgba(255,219,105,.3),transparent 22%);animation:ambient 7s ease-in-out infinite alternate}
#splash-screen:after{content:"";position:absolute;z-index:-1;left:-15%;right:-15%;bottom:-18%;height:38%;border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(151,255,191,.95),#57D58C);box-shadow:0 -15px 55px rgba(67,255,193,.25)}
@keyframes ambient{to{transform:translate3d(2%, -2%,0) scale(1.08)}}
.scene{position:relative;width:100%;height:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px 60px}
.cloud{position:absolute;width:105px;height:35px;border-radius:40px;background:linear-gradient(180deg,#fff,#d9f4ff);filter:drop-shadow(0 8px 8px rgba(28,61,158,.12));opacity:.9;animation:cloudDrift 5s ease-in-out infinite alternate}
.cloud:before,.cloud:after{content:"";position:absolute;bottom:8px;border-radius:50%;background:inherit}
.cloud:before{width:48px;height:48px;left:15px}.cloud:after{width:38px;height:38px;right:14px}
.cloud.one{top:12%;left:5%;transform:scale(.8)}.cloud.two{top:22%;right:3%;transform:scale(.65);animation-delay:-2s}
@keyframes cloudDrift{to{translate:12px -8px}}
.spark{position:absolute;font-size:clamp(20px,6vw,32px);filter:drop-shadow(0 4px 7px rgba(29,44,130,.18));animation:twinkle 2s ease-in-out infinite}
.spark.s1{top:16%;left:13%;color:#FFE36E}.spark.s2{top:12%;right:17%;animation-delay:.6s}.spark.s3{top:43%;right:9%;animation-delay:1s}.spark.s4{top:47%;left:8%;animation-delay:1.4s}
@keyframes twinkle{0%,100%{transform:scale(.8) rotate(-10deg);opacity:.7}50%{transform:scale(1.2) rotate(12deg);opacity:1}}
.float-icon{position:absolute;font-size:clamp(27px,7vw,38px);filter:drop-shadow(0 8px 8px rgba(23,40,120,.2));animation:bob 3s ease-in-out infinite}
.float-icon.abc{top:29%;left:7%;animation-delay:-.5s}.float-icon.book{top:35%;right:7%;animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(-12px) rotate(5deg)}}
.mascot-wrap{position:relative;width:clamp(150px,43vw,205px);height:clamp(150px,43vw,205px);display:grid;place-items:center;margin-top:-8px;animation:mascotIn .9s cubic-bezier(.2,.9,.25,1.2) both}
.mascot-halo{position:absolute;inset:2%;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(188,240,255,.35));border:4px solid rgba(255,255,255,.85);box-shadow:0 18px 45px rgba(28,48,155,.25),inset 0 5px 14px #fff;animation:haloPulse 3s ease-in-out infinite}
.mascot{position:relative;font-size:clamp(105px,31vw,145px);line-height:1;filter:drop-shadow(0 13px 8px rgba(27,45,125,.2));animation:bunnyWave 2.4s ease-in-out infinite}
.cap{position:absolute;top:5%;left:51%;transform:translateX(-50%) rotate(-8deg);font-size:clamp(42px,12vw,54px);filter:drop-shadow(0 5px 4px rgba(20,35,100,.25));z-index:2}
@keyframes haloPulse{50%{transform:scale(1.045);box-shadow:0 22px 55px rgba(28,48,155,.3),inset 0 5px 14px #fff}}
@keyframes bunnyWave{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes mascotIn{from{opacity:0;transform:scale(.45) translateY(35px)}to{opacity:1;transform:scale(1) translateY(0)}}
.brand{margin-top:24px;text-align:center;animation:brandIn .8s .25s both}
.brand-kids,.brand-teacher{font-family:Nunito,system-ui,sans-serif;font-weight:900;line-height:.98;letter-spacing:-1.5px}
.brand-kids{font-size:clamp(46px,13vw,64px);color:#FFE65C;text-shadow:0 4px 0 #E99B25,0 8px 0 rgba(41,47,133,.35),0 13px 22px rgba(21,38,112,.3);-webkit-text-stroke:1px rgba(255,255,255,.7)}
.brand-teacher{display:inline-block;margin-top:7px;padding:5px 22px 9px;border-radius:22px;background:linear-gradient(180deg,#B94EFF,#7737D5);border:3px solid #fff;color:#fff;text-shadow:0 3px 0 #5B24AD,0 6px 10px rgba(31,24,110,.3);font-size:clamp(35px,10vw,49px);box-shadow:0 9px 0 #4A2A9B,0 16px 25px rgba(24,37,117,.3),inset 0 3px 5px rgba(255,255,255,.5)}
@keyframes brandIn{from{opacity:0;transform:translateY(25px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
.tagline{margin-top:18px;color:#fff;font:800 clamp(13px,3.8vw,16px) Nunito,sans-serif;letter-spacing:.4px;text-shadow:0 2px 7px rgba(24,44,125,.3);animation:brandIn .7s .55s both}
.book-badge{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);font-size:32px;filter:drop-shadow(0 7px 6px rgba(35,50,130,.2));animation:bob 2.6s ease-in-out infinite}
.loading{position:absolute;bottom:7%;display:flex;align-items:center;gap:9px}
.loading span{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(24,44,125,.2);animation:dot 1s ease-in-out infinite}
.loading span:nth-child(2){animation-delay:.16s}.loading span:nth-child(3){animation-delay:.32s}
@keyframes dot{0%,80%,100%{transform:scale(.65);opacity:.55}40%{transform:scale(1.2);opacity:1}}
#transition-portal{position:fixed;inset:0;z-index:99995;width:100vw;height:100vh;height:100dvh;background:#FAFAFC;clip-path:circle(0% at 50% 14%);pointer-events:none}
#transition-portal.reveal{animation:portalExpand .65s cubic-bezier(.35,0,.15,1) forwards}
@keyframes portalExpand{0%{clip-path:circle(20px at 50% 14%)}100%{clip-path:circle(150% at 50% 14%)}}
@media(max-height:680px){.scene{padding-top:15px;padding-bottom:45px}.mascot-wrap{width:125px;height:125px}.mascot{font-size:96px}.cap{font-size:38px}.brand{margin-top:13px}.brand-kids{font-size:44px}.brand-teacher{font-size:34px}.tagline{margin-top:10px}.float-icon.abc{top:24%}.float-icon.book{top:31%}.book-badge{bottom:10%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="splash-screen" aria-label="Kids Teacher loading screen">
 <div class="scene">
  <div class="cloud one"></div><div class="cloud two"></div>
  <div class="spark s1">✦</div><div class="spark s2">✧</div><div class="spark s3">✦</div><div class="spark s4">✧</div>
  <div class="float-icon abc">🔤</div><div class="float-icon book">📚</div>
  <div class="mascot-wrap"><div class="mascot-halo"></div><div class="cap">🎓</div><div class="mascot">🐰</div></div>
  <div class="brand"><div class="brand-kids">KIDS</div><div class="brand-teacher">Teacher</div></div>
  <div class="tagline">A little learning, a lot of fun ✨</div>
  <div class="book-badge">📖</div>
  <div class="loading" aria-label="Loading"><span></span><span></span><span></span></div>
 </div>
</div>
<div id="transition-portal" aria-hidden="true"></div>
<script>
const portal=document.getElementById('transition-portal');
const themeColorMeta=document.getElementById('themeColorMeta');
function goToLogin(){window.location.replace('login.html')}
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){setTimeout(goToLogin,500)}
else{
 setTimeout(()=>{portal.classList.add('reveal');if(themeColorMeta)themeColorMeta.setAttribute('content','#FAFAFC')},3800);
 setTimeout(goToLogin,4450);
}
</script>
</body>
</html>
