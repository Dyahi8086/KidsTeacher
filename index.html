<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Teacher - Welcome</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, #dbeafe 0%, #fef08a 50%, #fed7aa 100%);
      padding: 24px 16px;
      font-family: 'Quicksand', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Moving Clouds Background Animation */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 300%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><path fill="rgba(255,255,255,0.4)" d="M100,150 Q130,110 160,150 Q190,100 230,130 Q270,110 300,150 Z M700,250 Q730,210 760,250 Q790,200 830,230 Q870,210 900,250 Z"/></svg>');
      background-repeat: repeat-x;
      animation: moveCloudsSmooth 40s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes moveCloudsSmooth {
      0% { transform: translateX(0); }
      100% { transform: translateX(33.33%); }
    }

    .welcome-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
      justify-content: space-between;
    }

    .header-branding {
      width: 100%;
    }

    .hero-image-container {
      width: 100%;
      margin: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
    }

    .welcome-text-box {
      margin: 10px 0;
    }

    .welcome-heading {
      font-family: 'Baloo 2', cursive;
      font-size: 26px;
      font-weight: 800;
      color: #9a3412;
      margin-bottom: 4px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.9);
    }

    .welcome-subtext {
      font-size: 14px;
      color: #334155;
      font-weight: 700;
    }

    .btn-get-started {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff7e5f, #f97316);
      color: #ffffff;
      border: none;
      border-radius: 22px;
      font-size: 18px;
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 #c2410c, 0 10px 20px rgba(249, 115, 22, 0.4);
      transition: transform 0.1s ease;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    .btn-get-started:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c2410c;
    }
  </style>
</head>
<body>

  <div class="welcome-container">
    <div class="header-branding">
      <h2 style="font-family: 'Baloo 2', cursive; font-size: 28px; color: #1e3a8a; font-weight: 800; text-shadow: 0 2px 4px rgba(255,255,255,0.8);">Kid's Teacher</h2>
    </div>

    <div class="hero-image-container">
      <img src="welcome_bg.png" alt="Kids Learning Playground" class="hero-image">
    </div>

    <div class="welcome-text-box">
      <h1 class="welcome-heading">Little Steps, Big Dreams! ✨</h1>
      <p class="welcome-subtext">A magical learning journey for your little ones</p>
    </div>

    <div style="width: 100%;">
      <a href="login.html" class="btn-get-started">Let's Start 🚀</a>
    </div>
  </div>

</body>
</html>
