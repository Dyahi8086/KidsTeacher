<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Teacher - Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fredoka', 'Quicksand', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      padding: 0;
    }

    .app-screen {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      position: relative;
      overflow: hidden;
      background-color: #fef08a;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      animation: floatBg 5s ease-in-out infinite;
    }

    @keyframes floatBg {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .bottom-wrapper {
      position: relative;
      width: 100%;
      padding: 24px 20px 30px 20px;
      text-align: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(255, 248, 240, 0) 0%, rgba(255, 248, 240, 0.9) 20%, #fff8f0 100%);
      border-radius: 35px 35px 0 0;
      backdrop-filter: blur(3px);
    }

    .hero-title {
      font-size: 26px;
      color: #9a3412;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 14px;
      color: #475569;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .btn-start {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff7e33, #f97316);
      color: #ffffff;
      border: none;
      border-radius: 22px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 5px 0 #c2410c, 0 10px 18px rgba(249, 115, 22, 0.4);
      text-decoration: none;
      transition: transform 0.1s ease;
    }

    .btn-start:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c2410c;
    }

    .dots-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #fdba74;
      border-radius: 50%;
    }

    .dot.active {
      width: 20px;
      background: #f97316;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <img src="welcome_bg.png" alt="Welcome Background" class="bg-image">

    <div class="bottom-wrapper">
      <h1 class="hero-title">Learning Is an<br>Adventure!</h1>
      <p class="hero-subtitle">Explore, discover and grow every day.</p>

      <a href="login.html" class="btn-start">
        Let's Start ➔
      </a>

      <div class="dots-container">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

</body>
</html>
