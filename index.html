<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Teacher - Welcome</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, #dbeafe 0%, #fef08a 50%, #fed7aa 100%);
      background-size: cover;
      background-position: center;
      padding: 24px 16px;
      font-family: 'Quicksand', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Moving Clouds Background Animation */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><path fill="rgba(255,255,255,0.4)" d="M100,100 Q130,70 160,100 Q190,60 230,90 Q270,70 300,100 Z M800,200 Q830,170 860,200 Q890,160 930,190 Q970,170 1000,200 Z"/></svg>');
      background-repeat: repeat-x;
      animation: moveCloudsSlow 35s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes moveCloudsSlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }

    .welcome-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
      justify-content: space-between;
      padding: 10px 0;
    }

    .header-branding {
      width: 100%;
    }

    .main-title-img {
      max-width: 260px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1));
    }

    .hero-card-wrapper {
      width: 100%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 20px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      margin: 15px 0;
    }

    .hero-image {
      width: 100%;
      border-radius: 20px;
      height: auto;
      display: block;
    }

    .welcome-text-box {
      margin: 15px 0;
    }

    .welcome-heading {
      font-family: 'Baloo 2', cursive;
      font-size: 26px;
      font-weight: 800;
      color: #9a3412;
      text-shadow: 0 2px 4px rgba(255,255,255,0.8);
      margin-bottom: 6px;
    }

    .welcome-subtext {
      font-size: 14px;
      color: #334155;
      font-weight: 700;
    }

    .btn-get-started {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff7e5f, #f97316);
      color: #ffffff;
      border: none;
      border-radius: 22px;
      font-size: 18px;
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 #c2410c, 0 10px 20px rgba(249, 115, 22, 0.4);
      transition: transform 0.1s ease;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    .btn-get-started:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c2410c;
    }
  </style>
</head>
<body>

  <div class="welcome-container">
    <div class="header-branding">
      <!-- Agar upar text ya logo image hai toh yahan aayegi -->
      <h2 style="font-family: 'Baloo 2', cursive; font-size: 32px; color: #1e3a8a; font-weight: 800; text-shadow: 0 2px 4px rgba(255,255,255,0.8);">Kid's Teacher</h2>
    </div>

    <div class="hero-card-wrapper">
      <!-- Aapki 3D App ki photo jo screenshot 4 mein hai -->
      <img src="your_kids_teacher_hero_image.png" alt="Kids Learning Playground" class="hero-image">
      
      <div class="welcome-text-box">
        <h1 class="welcome-heading">Welcome to Kids Teacher! ✨</h1>
        <p class="welcome-subtext">A magical learning journey for your little ones</p>
      </div>
    </div>

    <div style="width: 100%;">
      <a href="login.html" class="btn-get-started">Let's Start 🚀</a>
    </div>
  </div>

</script>
</body>
</html>
