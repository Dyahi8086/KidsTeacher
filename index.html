<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF956B">
  <meta name="description" content="Kids Teacher — Learn, Play and Grow Together">
  <title>Kids Teacher - Parent Login</title>  <link rel="manifest" href="./manifest.json">  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #FFF4DF;
      color: #60341F;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #FFF4DF;
    }

    #parentImage {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
    }

    #backup {
      display: none;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 18px;
      text-align: center;
      background: linear-gradient(#FFF4DF, #FFD7A5);
    }

    .sun {
      font-size: 65px;
      margin: 20px 0 12px;
    }

    h1 {
      font-size: clamp(27px, 7vw, 36px);
      margin: 12px 0;
      font-weight: 800;
    }

    .subtitle {
      font-size: 15px;
      margin: 12px 0 25px;
    }

    .login-button {
      display: block;
      width: 100%;
      max-width: 390px;
      min-height: 56px;
      margin: 14px auto;
      padding: 12px;
      border: 0;
      border-radius: 32px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #D9B18A;
    }

    .google {
      color: #60341F;
      background: #FFFFFF;
    }

    .email {
      color: #FFFFFF;
      background: #FF956B;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 390px;
      margin: 28px auto 20px;
    }

    .feature {
      padding: 16px 6px;
      background: #FFFFFF;
      border-radius: 18px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 3px 8px #D7B99B;
    }

    .icon {
      display: block;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .books {
      font-size: 23px;
      line-height: 1.8;
      margin-top: 20px;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #855D42;
    }
  </style></head><body>
  <main class="screen"><img
  id="parentImage"
  src="./parent_login_ui.png"
  alt="Kids Teacher Parent Login"
>

<section id="backup">
  <div class="sun">🌞🛡️</div>

  <h1>Parent Login 💗</h1>

  <p class="subtitle">
    Learn • Play • Grow Together
  </p>

  <button
    class="login-button google"
    type="button"
    onclick="alert('Google login abhi setup nahi hai.')"
  >
    🌐 Continue with Google
  </button>

  <button
    class="login-button email"
    type="button"
    onclick="alert('Email login abhi setup nahi hai.')"
  >
    ✉️ Login with Email
  </button>

  <div class="features">
    <div class="feature">
      <span class="icon">📊</span>
      Track Progress
    </div>

    <div class="feature">
      <span class="icon">👁️</span>
      Monitor Activities
    </div>

    <div class="feature">
      <span class="icon">🔒</span>
      Safe &amp; Secure
    </div>

    <div class="feature">
      <span class="icon">💗</span>
      Support Your Child
    </div>
  </div>

  <div class="books">
    📚 Learn • Practice • Grow<br>
    🔎 Discover • Achieve 🎒
  </div>

  <p class="note">
    Welcome to Kids Teacher!
  </p>
</section>

  </main>  <script>
    const parentImage = document.getElementById("parentImage");
    const backup = document.getElementById("backup");

    function showBackup() {
      parentImage.style.display = "none";
      backup.style.display = "block";
    }

    parentImage.addEventListener("error", showBackup);

    if (parentImage.complete && parentImage.naturalWidth === 0) {
      showBackup();
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(function (error) {
            console.log("Offline support registration failed:", error);
          });
      });
    }
  </script></body>
</html>
