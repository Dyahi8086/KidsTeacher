<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kids Teacher - Welcome Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Body ko scroll karne do */
        body {
            background-color: #e0f2fe;
            overflow-x: hidden;
            overflow-y: auto; 
            font-family: 'Nunito', sans-serif;
        }

        /* --- PAGE 1: WELCOME (Full Screen) --- */
        .welcome-page {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fce7f3;
            position: relative;
        }

        .welcome-page h1 {
            font-family: 'Fredoka', sans-serif;
            color: #8B3A00;
            font-size: 32px;
            text-align: center;
            padding: 0 20px;
        }
        
        /* Neeche scroll karne ka hint */
        .scroll-down-btn {
            position: absolute;
            bottom: 30px;
            background: #FF6B35;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.4);
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- PAGE 2: SCROLL TEST (Card Section) --- */
        .test-page {
            min-height: 100vh;
            background: #fce7f3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .test-page h2 {
            font-family: 'Fredoka', sans-serif;
            color: #8B3A00;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* Card Container */
        .card-container {
            width: 280px;
            height: 400px;
            perspective: 1200px; /* 3D ke liye */
            position: relative;
        }

        .card {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .image-wrapper {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-text {
            padding: 10px;
            text-align: center;
        }
        .card-text h3 { font-family: 'Fredoka'; font-size: 20px; color: #333; }
        .card-text p { font-size: 14px; color: #777; font-weight: bold; }

        /* Pixel Effect */
        .pixel-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            pointer-events: none;
            z-index: 10;
        }

        .pixel-box {
            background-color: #fce7f3; /* Background color se match */
            transform: scale(0); /* Chhupa hua */
        }
    </style>
</head>
<body>

    <!-- PAGE 1: Welcome -->
    <div class="welcome-page">
        <h1>Welcome to Kids Teacher</h1>
        <a href="#card-section" class="scroll-down-btn">↓ Scroll Down ↓</a>
    </div>

    <!-- PAGE 2: Card Test -->
    <div class="test-page" id="card-section">
        <h2>Scroll Effect Test</h2>
        
        <div class="card-container" id="cardContainer">
            <div class="card" id="card">
                
                <div class="image-wrapper">
                    <!-- Yahan tumhari jo bhi image hai uska naam daalo (e.g. welcome_bg.png) -->
                    <img src="welcome_bg.png" alt="Image" class="card-image">
                    <!-- Pixel Grid -->
                    <div class="pixel-grid" id="pixelGrid"></div>
                </div>

                <div class="card-text">
                    <h3>Kids Teacher</h3>
                    <p>Learn & Grow</p>
                </div>

            </div>
        </div>
    </div>

    <!-- GSAP Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // Pixel Grid Banane ka code
        const pixelGrid = document.getElementById('pixelGrid');
        const totalPixels = 100; // 10x10 = 100

        for (let i = 0; i < totalPixels; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel-box');
            pixelGrid.appendChild(pixel);
        }

        // GSAP Setup
        gsap.registerPlugin(ScrollTrigger);

        // 1. Card Rotate Animation (Scroll pe ghumega)
        gsap.to('#card', {
            scrollTrigger: {
                trigger: '#cardContainer',
                start: 'top bottom', // Jab card screen pe aaye
                end: 'bottom top',   // Jab card screen se nikle
                scrub: 1, // Scroll ke sath smoothly chalega
            },
            rotationY: 360,
            rotationX: 10,
            scale: 1.05
        });

        // 2. Pixel Bikhrane ka Animation
        const pixels = document.querySelectorAll('.pixel-box');
        
        gsap.to(pixels, {
            scrollTrigger: {
                trigger: '#cardContainer',
                start: 'top 60%', // Jab card screen ke thoda upar aaye
                end: 'bottom top',
                scrub: 1,
            },
            scale: 1,
            stagger: {
                amount: 0.5,
                from: 'random'
            }
        });
    </script>
</body>
</html>
