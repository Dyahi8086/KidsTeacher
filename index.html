  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      sendPasswordResetEmail, 
      GoogleAuthProvider, 
      signInWithPopup, 
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidkZxQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b",
      measurementId: "G-VJVS2ZMNLY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    setPersistence(auth, browserLocalPersistence).catch((error) => {
      console.error("Persistence error:", error);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    window.togglePasswordVisibility = function() {
      const passwordInput = document.getElementById('password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = type;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';
    }

    function setLoading(isLoading, text = '') {
      const submitBtn = document.getElementById('submitBtn');
      const signupBtn = document.getElementById('signupBtn');
      const googleBtn = document.getElementById('googleBtn');
      
      submitBtn.disabled = isLoading;
      signupBtn.disabled = isLoading;
      googleBtn.disabled = isLoading;
      if (isLoading) {
        submitBtn.textContent = text;
      } else {
        submitBtn.textContent = "Log In ➔";
      }
    }

    function getFriendlyErrorMessage(errorCode) {
      switch (errorCode) {
        case 'auth/invalid-email': return "Please enter a valid email address.";
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return "Incorrect email or password. Please try again.";
        case 'auth/email-already-in-use': return "This email is already registered. Please log in.";
        case 'auth/weak-password': return "Password must be at least 6 characters.";
        case 'auth/too-many-requests': return "Too many unsuccessful attempts. Please try again later.";
        case 'auth/network-request-failed': return "Please check your internet connection.";
        case 'auth/popup-closed-by-user': return "Sign-in cancelled. Please try again.";
        default: return "An error occurred. Please try again.";
      }
    }

    window.handleFormSubmit = async function(event) {
      event.preventDefault();
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert("Please fill in all fields.");
        return;
      }

      setLoading(true, "Logging in...");
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }

    window.handleCreateAccount = async function() {
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert("Please enter email and password to create an account.");
        return;
      }

      setLoading(true, "Creating account...");
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        window.location.href = "index.html";
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }

    // Google Sign In using Popup (Best for mobile Chrome & automatic account creation)
    window.handleGoogleLogin = async function() {
      hideAlert();
      setLoading(true, "Signing in with Google...");
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
        window.location.href = "index.html";
      } catch (error) {
        setLoading(false);
        if (error.code !== 'auth/popup-closed-by-user') {
          showAlert(getFriendlyErrorMessage(error.code));
        }
      }
    }

    window.handleForgotPassword = async function() {
      hideAlert();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showAlert("Please enter your email address above first.");
        return;
      }

      setLoading(true, "Sending reset email...");
      try {
        await sendPasswordResetEmail(auth, email);
        setLoading(false);
        showAlert("Password reset email sent! Check your inbox.", "success");
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }
  </script>
