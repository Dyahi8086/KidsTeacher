<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#ff3b00">
    <title>Kids Teacher</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ff3b00;
        }

        /* =========================================
           STAGE 1-3: RED ORANGE SPLASH SCREEN
           ========================================= */

        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99990;
            overflow: hidden;

            background: linear-gradient(
                145deg,
                #ff3b00 0%,
                #ff4b00 48%,
                #ff2600 100%
            );
        }

        /* STEP 1: BUNNY K LOGO (Appears, holds, then shrinks out) */
        .kt-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 142px;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 132px;
            font-weight: 900;
            line-height: .88;
            letter-spacing: -12px;
            padding-right: 10px;

            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);

            animation: logoSequence 0.95s cubic-bezier(.22, 1, .36, 1) 0.1s forwards;
        }

        .kt-ears {
            position: absolute;
            width: 76px;
            height: 58px;
            top: 0;
            left: 39px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            z-index: 2;
        }

        .kt-ear {
            width: 29px;
            height: 59px;
            border: 10px solid #fff;
            border-radius: 50% 50% 45% 45%;
            background: transparent;
        }

        .kt-ear:first-child {
            transform: rotate(-12deg);
        }

        .kt-ear:last-child {
            transform: rotate(13deg);
        }

        .kt-face {
            position: absolute;
            z-index: 3;
            top: 75px;
            left: 57px;
            width: 38px;
            height: 28px;
            pointer-events: none;
        }

        .kt-eyes {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }

        .kt-eyes span {
            width: 6px;
            height: 9px;
            border-radius: 50%;
            background: #ff3b00;
        }

        .kt-smile {
            width: 17px;
            height: 9px;
            margin: 1px auto 0;
            border-bottom: 3px solid #ff3b00;
            border-radius: 0 0 15px 15px;
        }

        @keyframes logoSequence {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.55);
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.04);
            }
            38%, 75% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.25);
            }
        }

        /* STEP 2: APP NAME EXPANDS IN CENTER, THEN COLLAPSES INTO DOT */
        .kt-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: #fff;
            font-family: 'Nunito', Arial, sans-serif;
            font-size: clamp(24px, 6.8vw, 34px);
            font-weight: 900;
            letter-spacing: 1.5px;
            text-align: center;
            white-space: nowrap;

            opacity: 0;
            clip-path: inset(0 50% 0 50%);

            animation: titleSequence 1.05s cubic-bezier(.4, 0, .2, 1) 0.9s forwards;
        }

        @keyframes titleSequence {
            0% {
                opacity: 0;
                clip-path: inset(0 50% 0 50%);
                transform: translate(-50%, -50%) scale(0.92);
            }
            28% {
                opacity: 1;
                clip-path: inset(0 0% 0 0%);
                transform: translate(-50%, -50%) scale(1);
            }
            72% {
                opacity: 1;
                clip-path: inset(0 0% 0 0%);
                transform: translate(-50%, -50%) scale(1);
            }
            96% {
                opacity: 1;
                clip-path: inset(0 49% 0 49%);
                transform: translate(-50%, -50%) scale(0.35);
            }
            100% {
                opacity: 0;
                clip-path: inset(0 50% 0 50%);
                transform: translate(-50%, -50%) scale(0.1);
            }
        }

        /* STEP 3: GLOWING STAR-BURST — replaces the plain white dot */
        .kt-dot {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 99999;
            opacity: 1;
            pointer-events: none;
            background: #fff;
            clip-path: circle(0% at 50% 50%);
            animation: starBurstLaunch .62s cubic-bezier(.2,.8,.2,1) 1.88s forwards;
        }

        .kt-dot::before {
            content: "✦";
            position: absolute;
            left: 50%;
            top: 50%;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 34px;
            line-height: 1;
            text-shadow: 0 0 8px #fff, 0 0 20px #fff, 0 0 36px #ffe7a3;
            transform: translate(-50%,-50%) scale(.15) rotate(0deg);
            animation: centerStar .62s cubic-bezier(.2,.8,.2,1) 1.88s forwards;
        }

        @keyframes centerStar {
            0% { opacity: 0; transform: translate(-50%,-50%) scale(.15) rotate(0deg); }
            20% { opacity: 1; transform: translate(-50%,-50%) scale(1.3) rotate(35deg); }
            55% { opacity: 1; transform: translate(-50%,-50%) scale(2.2) rotate(95deg); }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(3) rotate(150deg); }
        }

        @keyframes starBurstLaunch {
            0% { clip-path: circle(0% at 50% 50%); }
            22% { clip-path: circle(5% at 50% 50%); }
            100% { clip-path: circle(150% at 50% 50%); }
        }

    </style>
</head>

<body>

    <!-- KIDS TEACHER SPLASH SCREEN -->
    <div id="splash-screen" aria-label="Kids Teacher loading screen">

        <!-- 1. Bunny K Logo -->
        <div class="kt-mark" aria-hidden="true">
            K
            <div class="kt-ears">
                <span class="kt-ear"></span>
                <span class="kt-ear"></span>
            </div>
            <div class="kt-face">
                <div class="kt-eyes">
                    <span></span>
                    <span></span>
                </div>
                <div class="kt-smile"></div>
            </div>
        </div>

        <!-- 2. Brand Title -->
        <div class="kt-title">KIDS TEACHER</div>

        <!-- 3. Glowing Star-Burst Effect -->
        <div class="kt-dot" aria-hidden="true"></div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Keep the original splash animation, then open Google Login directly.
        // The welcome screen is intentionally skipped.
        const splash = document.getElementById('splash-screen');
        const dot = document.querySelector('.kt-dot');
        let loginOpened = false;

        function openLogin() {
            if (loginOpened) return;
            loginOpened = true;
            window.location.replace('./login.html');
        }

        // The star expands to cover the screen; Login opens as the star fills the display.
        if (dot) {
            dot.addEventListener('animationend', (event) => {
                if (event.animationName === 'starBurstLaunch') openLogin();
            }, { once: true });
        }

        // Safety fallback in case the browser skips animationend.
        window.setTimeout(openLogin, 2600);

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('./service-worker.js')
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>

</body>
</html>
