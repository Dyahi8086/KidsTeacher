<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7e9">
  <title>Kids Teacher - Parent Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7e9;
      color: #613d2d;
      font-family: Arial, sans-serif;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
    }

    #parentImage {
      display: block;
      width: 100%;
      height: auto;
    }

    #status {
      margin: 12px 16px 24px;
      padding: 14px;
      border-radius: 16px;
      background: #fffaf1;
      box-shadow: 0 5px 18px #6c4a301c;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #status:empty {
      display: none;
    }

    #googleButton {
      display: block;
      width: calc(100% - 40px);
      max-width: 400px;
      margin: 15px auto;
      min-height: 52px;
      border: 0;
      border-radius: 30px;
      background: white;
      color: #493527;
      font-weight: bold;
      box-shadow: 0 4px 10px #0002;
    }

    #googleButton:disabled,
    .action:disabled {
      opacity: .6;
      cursor: wait;
    }

    #emailPanel {
      display: none;
      margin: 16px;
      padding: 24px 18px;
      border-radius: 24px;
      background: #fffaf0;
      box-shadow: 0 10px 35px #0002;
    }

    #emailPanel h2 {
      text-align: center;
      margin-top: 0;
    }

    input {
      width: 100%;
      min-height: 54px;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #d9c8b8;
      border-radius: 14px;
      background: #fff;
      color: #34251d;
      outline-color: #ef9876;
    }

    .action {
      width: 100%;
      min-height: 52px;
      margin-top: 10px;
      border: 0;
      border-radius: 14px;
      background: #f29572;
      color: white;
      font-weight: bold;
    }

    .secondary {
      background: #eee2d5;
      color: #603f2e;
    }

    #accountPanel {
      display: none;
      margin: 16px;
      padding: 22px;
      border-radius: 22px;
      background: #fffaf0;
      text-align: center;
    }

    #accountPanel img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
    }

    #loader {
      display: none;
      text-align: center;
      padding: 12px;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid #e9cbb9;
      border-top-color: #ef8e6c;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      color: #a12626;
    }

    .success {
      color: #176b38;
    }

    .small {
      font-size: 13px;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>

<body>
  <main id="app">

    <!-- Original 3D Parent Login design -->
    <img
      id="parentImage"
      src="./parent_login_ui.png"
      alt="Kids Teacher Parent Login"
    >

    <!-- Actual Google sign-in button -->
    <button id="googleButton" type="button">
      🌐 Continue with Google
    </button>

    <div id="loader" aria-live="polite">
      <span class="spinner"></span>
      <span id="loaderText"> Please wait...</span>
    </div>

    <div id="status" role="status" aria-live="polite"></div>

    <!-- Email/password login -->
    <section id="emailPanel">
      <h2>Parent Login</h2>

      <p class="small">
        Sign in with your parent account, or create a new account.
      </p>

      <form id="emailForm">
        <label for="email">Parent email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="Enter email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password (minimum 6 characters)"
          minlength="6"
          required
        >

        <button class="action" type="submit">
          Login
        </button>
      </form>

      <button class="action" id="createAccount" type="button">
        Create New Parent Account
      </button>

      <button class="action secondary" id="resetPassword" type="button">
        Forgot Password?
      </button>

      <button class="action secondary" id="closeEmail" type="button">
        Close
      </button>
    </section>

    <!-- Signed-in account -->
    <section id="accountPanel">
      <img id="profileImage" alt="Profile picture" hidden>
      <h2 id="profileName">Parent Account</h2>
      <p id="profileEmail"></p>
      <p class="small">
        You are signed in to Kids Teacher.
      </p>
      <button class="action" id="signOutButton" type="button">
        Sign Out
      </button>
    </section>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b",
      measurementId: "G-VJVS2ZMNLY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    const $ = id => document.getElementById(id);

    const googleButton = $("googleButton");
    const emailPanel = $("emailPanel");
    const accountPanel = $("accountPanel");
    const statusBox = $("status");
    const loader = $("loader");
    const loaderText = $("loaderText");

    let busy = false;

    function message(text, type = "") {
      statusBox.textContent = text;
      statusBox.className = type;
    }

    function loading(active, text = "Please wait...") {
      busy = active;
      loader.style.display = active ? "block" : "none";
      loaderText.textContent = " " + text;
      googleButton.disabled = active;
      document.querySelectorAll(".action").forEach(button => {
        button.disabled = active;
      });
    }

    function errorMessage(error) {
      const messages = {
        "auth/invalid-email": "Email address sahi nahi hai.",
        "auth/invalid-credential": "Email ya password galat hai.",
        "auth/user-not-found": "Account nahi mila. Pehle account banao.",
        "auth/email-already-in-use": "Is email ka account pehle se hai. Login karo.",
        "auth/weak-password": "Password kam se kam 6 characters ka rakho.",
        "auth/too-many-requests": "Bahut attempts hue. Thodi der baad try karo.",
        "auth/network-request-failed": "Internet connection check karo.",
        "auth/popup-blocked": "Sign-in redirect block hua. Dobara try karo.",
        "auth/unauthorized-domain": "Firebase mein website domain authorize nahi hai.",
        "auth/operation-not-allowed": "Firebase Console mein sign-in provider enable karo."
      };

      return messages[error.code] ||
        "Login nahi hua: " + (error.message || error.code || "Unknown error");
    }

    function showAccount(user) {
      emailPanel.style.display = "none";
      accountPanel.style.display = "block";
      googleButton.style.display = "none";

      $("profileName").textContent =
        user.displayName || "Parent Account";
      $("profileEmail").textContent = user.email || "";

      const photo = $("profileImage");
      if (user.photoURL) {
        photo.src = user.photoURL;
        photo.hidden = false;
      } else {
        photo.hidden = true;
        photo.removeAttribute("src");
      }

      message("Login successful.", "success");
    }

    function showLogin() {
      accountPanel.style.display = "none";
      googleButton.style.display = "block";
    }

    // Google sign-in: redirect is generally more reliable on mobile.
    googleButton.addEventListener("click", async () => {
      if (busy) return;

      if (!navigator.onLine) {
        message("Internet band hai. Connection check karke dobara try karo.", "error");
        return;
      }

      try {
        loading(true, "Google sign-in opening...");
        await signInWithRedirect(auth, googleProvider);
      } catch (error) {
        loading(false);
        message(errorMessage(error), "error");
      }
    });

    // Process Google redirect result when returning to the page.
    try {
      loading(true, "Checking sign-in...");
      const result = await getRedirectResult(auth);

      if (result?.user) {
        message("Google login successful.", "success");
      }
    } catch (error) {
      message(errorMessage(error), "error");
    } finally {
      loading(false);
    }

    // Email login.
    $("emailForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!navigator.onLine) {
        message("Internet band hai. Connection check karo.", "error");
        return;
      }

      const email = $("email").value.trim();
      const password = $("password").value;

      try {
        loading(true, "Signing in...");
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        message(errorMessage(error), "error");
      } finally {
        loading(false);
      }
    });

    // Create a new parent account.
    $("createAccount").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        message("Pehle email aur password bharo.", "error");
        return;
      }

      if (password.length < 6) {
        message("Password kam se kam 6 characters ka hona chahiye.", "error");
        return;
      }

      try {
        loading(true, "Creating account...");
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (error) {
        message(errorMessage(error), "error");
      } finally {
        loading(false);
      }
    });

    // Password reset.
    $("resetPassword").addEventListener("click", async () => {
      const email = $("email").value.trim();

      if (!email) {
        message("Pehle email box mein apna email bharo.", "error");
        return;
      }

      try {
        loading(true, "Sending reset email...");
        await sendPasswordResetEmail(auth, email);
        message("Password reset email bhej diya gaya hai.", "success");
      } catch (error) {
        message(errorMessage(error), "error");
      } finally {
        loading(false);
      }
    });

    $("closeEmail").addEventListener("click", () => {
      emailPanel.style.display = "none";
      message("");
    });

    $("signOutButton").addEventListener("click", async () => {
      try {
        loading(true, "Signing out...");
        await signOut(auth);
        message("You have signed out.", "success");
      } catch (error) {
        message(errorMessage(error), "error");
      } finally {
        loading(false);
      }
    });

    // Allow opening email login from the original image's button area.
    // Coordinates correspond approximately to the Login with Email button.
    const image = $("parentImage");

    image.addEventListener("click", event => {
      const rect = image.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;

      if (x >= 0.15 && x <= 0.85 && y >= 0.77 && y <= 0.84) {
        emailPanel.style.display = "block";
        emailPanel.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });

    // Only show an offline warning when the device is actually offline.
    window.addEventListener("offline", () => {
      message("Internet connection lost.", "error");
    });

    window.addEventListener("online", () => {
      if (!auth.currentUser) message("Internet connection restored.", "success");
    });

    // Keep login screen/account screen in sync with Firebase.
    onAuthStateChanged(auth, user => {
      loading(false);
      if (user) {
        showAccount(user);
      } else {
        showLogin();
      }
    });

    // If the original image cannot load, show a clear error.
    image.addEventListener("error", () => {
      message(
        "parent_login_ui.png file nahi mili. GitHub mein filename aur location check karo.",
        "error"
      );
    });
  </script>
</body>
</html>
