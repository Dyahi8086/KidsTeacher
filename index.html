<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Teacher - Parent Login</title>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FF956B">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Arial,sans-serif}
body{background:#ffe9bd;color:#60341f}
.screen{width:100%;min-height:100vh;position:relative;overflow:hidden}
#parentImage{display:block;width:100%;height:100vh;height:100dvh;object-fit:cover;object-position:center}
#backup{display:none;min-height:100vh;min-height:100dvh;padding:28px 20px 20px;text-align:center;background:linear-gradient(#fff3d2,#ffd99c)}
.sun{font-size:78px;margin:18px auto 8px}
h1{font-size:34px;margin:12px 0}
.subtitle{font-size:16px;margin-bottom:26px}
button{width:100%;max-width:380px;min-height:58px;border:0;border-radius:32px;font-size:17px;font-weight:bold;margin:9px auto;box-shadow:0 5px 0 #d9b18a;display:block}
.google{background:#fff;color:#60341f}
.email{background:#ff956b;color:#fff}
.features{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:30px auto 24px;max-width:430px}
.feature{background:#fff0d6;border-radius:16px;padding:14px 3px;font-size:12px;font-weight:bold}
.icon{font-size:28px;display:block;margin-bottom:8px}
.books{font-size:25px;line-height:1.8;margin-top:20px}
.note{font-size:12px;margin-top:22px;color:#855d42}
</style>
</head>
<body>
<main class="screen">
<img id="parentImage" src="./parent_login_ui.png" alt="Kids Teacher Parent Login">
<section id="backup">
<div class="sun">🌞🛡️</div>
<h1>Parent Login 💗</h1>
<p class="subtitle">Learn • Play • Grow Together</p>
<button class="google" type="button" onclick="alert('Google login abhi setup nahi hai.')">🌐 Continue with Google</button>
<button class="email" type="button" onclick="alert('Email login abhi setup nahi hai.')">✉️ Login with Email</button>
<div class="features">
<div class="feature"><span class="icon">📊</span>Track Progress</div>
<div class="feature"><span class="icon">👁️</span>Monitor Activities</div>
<div class="feature"><span class="icon">🔒</span>Safe & Secure</div>
<div class="feature"><span class="icon">💗</span>Support Your Child</div>
</div>
<div class="books">📚 Learn • Practice • Grow<br>🔎 Discover • Achieve 🎒</div>
<p class="note">Welcome to Kids Teacher!</p>
</section>
</main>
<script>
const img=document.getElementById('parentImage');
const backup=document.getElementById('backup');
function showBackup(){img.style.display='none';backup.style.display='block';}
img.addEventListener('error',showBackup);
if(img.complete && img.naturalWidth===0)showBackup();
</script>
</body>
</html>
