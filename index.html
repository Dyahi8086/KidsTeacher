<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e0f2fe"> 
    <title>Kids Teacher - Welcome</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100%; width: 100%;
            background-color: #e0f2fe; 
            overflow: hidden; 
        }

        /* Loader */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: #e0f2fe;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.3s ease;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #ffffff; border-top: 5px solid #FF6B35;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-family: 'Fredoka'; font-size: 20px; color: #8B3A00; font-weight: 600; }

        /* Welcome Content */
        #welcome-content {
            display: none;
            position: relative;
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 40px;
            
            background-image: url('./welcome_bg.png');
            background-size: cover; 
            background-position: center top;
            background-repeat: no-repeat;
            background-color: #fce7f3; 
        }

        .content-wrapper {
            position: relative; 
            z-index: 10;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            width: 100%; 
            padding: 0 20px;
        }

        .text-content { text-align: center; margin-bottom: 20px; }

        .text-content h1 {
            font-family: 'Fredoka', sans-serif; 
            font-size: clamp(24px, 6vw, 32px); 
            color: #8B3A00; 
            font-weight: 700; 
            line-height: 1.2; 
            margin-bottom: 8px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.1);
        }

        .text-content p {
            font-family: 'Nunito', sans-serif; 
            font-size: clamp(13px, 4vw, 16px); 
            color: #6B5B4D; 
            font-weight: 700;
        }

        /* ORANGE START BUTTON */
        .start-btn {
            position: relative; 
            width: 100%; 
            max-width: 350px; 
            padding: 16px 20px;
            font-size: 20px; 
            font-family: 'Fredoka', sans-serif; 
            font-weight: 700; 
            color: white;
            background: #FF6B35; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 6px 0 #cc4e20, 0 10px 20px rgba(255, 107, 53, 0.4);
            transition: transform 0.1s; 
            animation: pulseBtn 2s infinite; 
        }

        .start-btn:active { 
            transform: translateY(6px); 
            box-shadow: 0 0px 0 #cc4e20; 
            animation: none; 
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .btn-link {
            width: 100%;
            display: flex;
            justify-content: center;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>

    <div id="welcome-content">
        <div class="content-wrapper">
            <div class="text-content">
                <h1>Learning Is an<br>Adventure!</h1>
                <p>Explore, discover and grow every day.</p>
            </div>
            
            <a href="login.html" class="btn-link">
                <button class="start-btn" type="button">Let's Start →</button>
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
          authDomain: "kids-teacher-4387e.firebaseapp.com",
          projectId: "kids-teacher-4387e",
          storageBucket: "kids-teacher-4387e.firebasestorage.app",
          messagingSenderId: "420221167346",
          appId: "1:420221167346:web:da7ac80acdfd52339d526b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const splash = document.getElementById('splash-screen');
        const welcomeContent = document.getElementById('welcome-content');

        // BUG FIX: Timeout to prevent infinite loading spinner
        let isLoading = true;
        setTimeout(() => {
            if (isLoading) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    welcomeContent.style.display = 'flex';
                }, 300);
            }
        }, 3500); // 3.5 seconds max wait

        onAuthStateChanged(auth, (user) => {
            isLoading = false; // Firebase responded, stop timeout
            if (user) {
                const savedAge = localStorage.getItem('kidsAgeGroup');
                window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
            } else {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    welcomeContent.style.display = 'flex';
                }, 300);
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js'); });
        }
    </script>
</body>
</html>
