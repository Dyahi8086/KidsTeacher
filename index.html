<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Teacher - Welcome</title>
    <style>
        /* --- 1. CSS RESET & BASE SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Mobile me click par blue box nahi aayega */
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Scroll bar nahi aayega */
            background-color: #e0f2fe; /* Fallback color agar image load na ho */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- 2. MAIN CONTAINER (Mobile Fit) --- */
        .welcome-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Advanced: Mobile browser ki address bar ko adjust karta hai */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Text aur Button ko niche push karega */
            align-items: center;
            padding-bottom: 50px; /* Niche se thoda gap */
            
            /* BACKGROUND IMAGE SETUP */
            background-image: url('welcome_bg.png');
            background-size: cover; /* Image puri screen cover karegi, stretch nahi hogi */
            background-position: top center; /* Image ka upar wala hissa (Kids Teacher text) dikhega */
            background-repeat: no-repeat;
        }

        /* --- 3. TEXT & BUTTON STYLES (Glassmorphism) --- */
        .text-content {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            width: 90%;
        }

        .text-content h1 {
            font-size: 28px;
            color: #4a2c11; /* Dark brown text */
            margin-bottom: 8px;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .text-content p {
            font-size: 15px;
            color: #555;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* --- 4. ADVANCED 3D BUTTON --- */
        .start-btn {
            width: 85%;
            max-width: 350px;
            padding: 18px 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #ff7a59, #ff5733); /* Orange Gradient */
            border: none;
            border-radius: 50px; /* Gol button */
            cursor: pointer;
            z-index: 10;
            
            /* 3D Shadow Effect */
            box-shadow: 0 8px 0 #c0392b, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1); /* Smooth click animation */
        }

        /* Button dabane par ka effect */
        .start-btn:active {
            transform: translateY(8px); /* Button niche jayega */
            box-shadow: 0 0px 0 #c0392b, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* --- 5. ADVANCED: PRELOADER (Bina net ke bhi instantly dikhega) --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e0f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        /* Spinner Design */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #cce5ff;
            border-top: 5px solid #ff5733;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Hide Class */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <!-- ADVANCED TRICK: Background image ko pehle hi load karna (Bina net ke bhi cache se aayega) -->
    <link rel="preload" as="image" href="welcome_bg.png">
</head>
<body>

    <!-- Preloader (Jab tak image download ho rahi hai tab tak dikhega) -->
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <!-- Main Welcome Screen -->
    <div class="welcome-container" id="welcomeScreen">
        
        <!-- Text Content (Aapki photo ke hisaab se) -->
        <div class="text-content">
            <h1>Welcome to Kids Teacher! 🌟</h1>
            <p>A magical learning journey for your little ones</p>
        </div>

        <!-- Start Button -->
        <button class="start-btn" onclick="startApp()">Let's Start 🚀</button>

    </div>

    <!-- ADVANCED JAVASCRIPT LOGIC -->
    <script>
        // 1. Page load hone par kya karna hai
        window.addEventListener('load', function() {
            // Jab saari files (image + code) load ho jayein, toh preloader hata do
            const preloader = document.getElementById('preloader');
            preloader.classList.add('hidden');
            
            // 500ms baad preloader ko poora remove kar do DOM se
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        });

        // 2. Start Button ka function
        function startApp() {
            // Yahan aap login page par redirect kar sakte hain
            // alert("Welcome! Let's go to Login.");
            
            // Example: Login page par jane ke liye
            window.location.href = "login.html"; // Agar aapka login page alag file hai
        }

        // 3. ADVANCED TRICK: Agar internet bahut slow hai aur image load nahi ho rahi
        // Toh 3 second baad preloader forcefully hata do taaki user atka na rahe.
        setTimeout(function() {
            const preloader = document.getElementById('preloader');
            if(preloader) {
                preloader.classList.add('hidden');
                setTimeout(() => { preloader.style.display = 'none'; }, 500);
            }
        }, 3000);
    </script>
</body>
</html>
