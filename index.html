<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e0f2fe">
    <title>Kids Teacher - Welcome</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <!-- PRELOAD IMAGE: Ye line image ko sabse pehle download karwana shuru karegi -->
    <link rel="preload" as="image" href="welcome_bg.png">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #fce7f3; /* Pink background fallback */
            overflow: hidden;
        }

        /* Splash Screen (Loading) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #e0f2fe;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ffffff;
            border-top: 5px solid #FF6B35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 20px;
            color: #8B3A00;
            font-weight: 600;
        }

        /* Welcome Content */
        #welcome-content {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
            background-color: #fce7f3;
            
            /* Shuru me content thoda invisible rahega */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Background Image (Absolute) */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            z-index: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 20px;
        }

        .text-content {
            text-align: center;
            margin-bottom: 20px;
        }

        .text-content h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(24px, 6vw, 32px);
            color: #8B3A00;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8),
                         2px 2px 5px rgba(0,0,0,0.1);
        }

        .text-content p {
            font-family: 'Nunito', sans-serif;
            font-size: clamp(13px, 4vw, 16px);
            color: #6B5B4D;
            font-weight: 700;
        }

        .start-btn {
            position: relative;
            width: 100%;
            max-width: 350px;
            padding: 16px 20px;
            font-size: 20px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: white;
            background: #FF6B35;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #cc4e20,
                        0 10px 20px rgba(255, 107, 53, 0.4);
            transition: transform 0.1s;
            animation: pulseBtn 2s infinite;
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #cc4e20;
            animation: none;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>

    <!-- Welcome Content -->
    <div id="welcome-content">
        <!-- Background Image (ab img tag me hai taaki load track ho sake) -->
        <img src="welcome_bg.png" alt="Welcome Background" class="bg-image" id="bgImage">
        
        <div class="content-wrapper">
            <div class="text-content">
                <h1>Learning Is an<br>Adventure!</h1>
                <p>Explore, discover and grow every day.</p>
            </div>

            <button class="start-btn" id="startBtn">
                Let's Start →
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
            authDomain: "kids-teacher-4387e.firebaseapp.com",
            projectId: "kids-teacher-4387e",
            storageBucket: "kids-teacher-4387e.firebasestorage.app",
            messagingSenderId: "420221167346",
            appId: "1:420221167346:web:da7ac80acdfd52339d526b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const splash = document.getElementById('splash-screen');
        const welcomeContent = document.getElementById('welcome-content');
        const bgImage = document.getElementById('bgImage');

        // --- IMAGE LOAD LOGIC ---
        // Jab image poori tarah load ho jaye, tabhi splash screen hatao
        function hideSplash() {
            splash.style.opacity = '0';
            welcomeContent.style.opacity = '1';
            setTimeout(() => {
                splash.style.display = 'none';
            }, 400); // Fade out animation ke baad display none
        }

        // Check karo image load hui ya nahi
        if (bgImage.complete) {
            // Agar cache se turant load ho gayi
            hideSplash();
        } else {
            // Agar load ho rahi hai, toh load hone ka wait karo
            bgImage.onload = hideSplash;
            // Agar image load fail ho jaye (internet issue), toh bhi 3 second baad page dikha do
            bgImage.onerror = () => {
                setTimeout(hideSplash, 3000); 
            };
        }

        // --- BUTTON LOGIC ---
        document.getElementById('startBtn').addEventListener('click', () => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // Logged-in user
                    const savedAge = localStorage.getItem('kidsAgeGroup');
                    window.location.replace(
                        !savedAge ? "age-select.html" : "index-home.html"
                    );
                } else {
                    // Not logged-in user
                    window.location.href = 'login.html';
                }
            });
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }
    </script>

</body>
</html>
