<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Teacher - Claymorphism Login</title>
  <!-- Google Fonts: Rounded font for playful feel -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* 1. Global Reset & Playful Font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #fce7f3 0%, #fef3c7 50%, #e0f2fe 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 2. Main Outer Container */
    .app-screen {
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    /* 3. Claymorphism Card UI */
    .clay-card {
      background: #ffffff;
      border-radius: 40px;
      padding: 35px 25px 25px 25px;
      /* Soft Clay Shadow (Outset + Inset) */
      box-shadow: 
        0 20px 30px rgba(186, 117, 160, 0.15),
        inset 0 -8px 0 rgba(0, 0, 0, 0.04),
        inset 0 4px 10px rgba(255, 255, 255, 0.9);
      border: 4px solid #ffffff;
      text-align: center;
      position: relative;
    }

    /* Top Sun Icon Wrapper */
    .badge-icon {
      width: 70px;
      height: 70px;
      background: #fef08a;
      border-radius: 50%;
      margin: 0 auto 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 
        0 8px 15px rgba(234, 179, 8, 0.25),
        inset 0 -4px 0 rgba(202, 138, 4, 0.2);
    }

    /* Header Title */
    .app-title {
      font-size: 32px;
      font-weight: 700;
      color: #451a03;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    /* 4. Action Buttons */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }

    .btn-clay {
      width: 100%;
      padding: 14px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    /* Google Button Style */
    .btn-google {
      background: #f1f5f9;
      color: #334155;
      box-shadow: 
        0 6px 12px rgba(148, 163, 184, 0.2),
        inset 0 -4px 0 #cbd5e1;
    }

    /* Email Button Style */
    .btn-email {
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      color: #ffffff;
      box-shadow: 
        0 8px 16px rgba(255, 126, 95, 0.35),
        inset 0 -4px 0 rgba(194, 65, 12, 0.25);
    }

    .btn-clay:active {
      transform: translateY(3px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 5. Bottom Grid Section (4 Features) */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .feature-box {
      border-radius: 18px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 
        0 6px 12px rgba(0, 0, 0, 0.05),
        inset 0 -3px 0 rgba(0, 0, 0, 0.05);
    }

    .feature-box span {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      line-height: 1.2;
    }

    .feature-icon {
      font-size: 22px;
    }

    /* Colorful Backgrounds for Features */
    .bg-blue   { background: #dbeafe; }
    .bg-yellow { background: #fef3c7; }
    .bg-green  { background: #dcfce7; }
    .bg-pink   { background: #ffe4e6; }

  </style>
</head>
<body>

  <div class="app-screen">
    <!-- Main Card -->
    <div class="clay-card">
      
      <!-- Sun Badge -->
      <div class="badge-icon">☀️</div>

      <!-- App Title -->
      <h1 class="app-title">Kids Teacher</h1>

      <!-- Buttons -->
      <div class="btn-container">
        <button class="btn-clay btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>

        <button class="btn-clay btn-email">
          ✉️ Login with Email
        </button>
      </div>

      <!-- Features Grid -->
      <div class="features-grid">
        <div class="feature-box bg-blue">
          <div class="feature-icon">📊</div>
          <span>Track Progress</span>
        </div>
        <div class="feature-box bg-yellow">
          <div class="feature-icon">👁️</div>
          <span>Monitor Activities</span>
        </div>
        <div class="feature-box bg-green">
          <div class="feature-icon">🛡️</div>
          <span>Safe & Secure</span>
        </div>
        <div class="feature-box bg-pink">
          <div class="feature-icon">💖</div>
          <span>Support Child</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
