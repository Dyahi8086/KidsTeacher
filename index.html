<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Teacher - Welcome</title>
    
    <!-- Advanced Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. ADVANCED CSS SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Fredoka', sans-serif; 
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #e0f2fe;
            overflow: hidden; /* Scroll lock */
        }

        /* --- 2. MAIN CONTAINER WITH PARALLAX --- */
        .welcome-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 60px; 
            
            background-image: url('welcome_bg.png');
            background-size: cover; 
            background-position: top center; 
            background-repeat: no-repeat;
            
            /* Smooth transition for parallax */
            transition: background-position 0.1s ease-out;
        }

        /* --- 3. ADVANCED TEXT ANIMATIONS --- */
        .text-content {
            text-align: center;
            margin-bottom: 25px; 
            z-index: 10;
            position: relative;
        }

        /* Spring Animation (Load hote waqt bounce) */
        .spring-in {
            animation: springBounce 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
        }

        .text-content h1 {
            font-size: 34px; 
            color: #4a2c11; /* Dark Brown */
            font-weight: 700;
            line-height: 1.1;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.9), 4px 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: default;
        }

        /* Text ko touch karne par 3D press effect */
        .text-content h1:active {
            transform: scale(0.95);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.9);
        }

        /* --- 4. ADVANCED BUTTON --- */
        .start-btn {
            position: relative;
            width: 85%;
            max-width: 320px;
            padding: 18px 20px;
            font-size: 22px;
            font-weight: 700;
            color: white;
            background: linear-gradient(145deg, #ff7a59, #ff5733); 
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            z-index: 10;
            overflow: hidden; 
            
            /* 3D Shadow */
            box-shadow: 0 8px 0 #b83b23, 0 15px 25px rgba(255, 87, 51, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Button dabane par andar jayega */
        .start-btn:active {
            transform: translateY(8px); 
            box-shadow: 0 0px 0 #b83b23, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        /* --- 5. KEYFRAMES FOR ANIMATIONS --- */
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        @keyframes springBounce {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            60% { opacity: 1; transform: scale(1.05) translateY(-5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="welcome-container" id="parallaxContainer">
        
        <!-- Text Sirf Ek Line, No Niche Wala Text -->
        <div class="text-content spring-in" style="animation-delay: 0.1s;">
            <h1>Ignite Your<br>Child's Potential</h1>
        </div>

        <!-- Button with Spring Animation -->
        <button class="start-btn spring-in" id="startBtn" style="animation-delay: 0.3s;">Let's Start 🚀</button>

    </div>

    <!-- --- ADVANCED JAVASCRIPT --- -->
    <script>
        // 1. PARALLAX TOUCH/MOUSE EFFECT (Background move hoga)
        const container = document.getElementById('parallaxContainer');
        
        document.addEventListener('touchmove', function(e) {
            let touch = e.touches[0];
            let x = (touch.clientX / window.innerWidth - 0.5) * 20; // 20px move
            let y = (touch.clientY / window.innerHeight - 0.5) * 20;
            
            // Background ko halka sa move karega (Depth effect)
            container.style.backgroundPosition = `calc(50% + ${x}px) calc(0% + ${y}px)`;
        });

        // 2. ADVANCED BUTTON CLICK (Haptic + Ripple + Redirect)
        const btn = document.getElementById('startBtn');

        btn.addEventListener('click', function(e) {
            // Haptic Vibration
            if (navigator.vibrate) {
                navigator.vibrate([50, 30, 50]); // Double vibrate for premium feel
            }

            // Ripple Effect Calculate
            let rect = this.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            let ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.width = ripple.style.height = `30px`; 
            
            this.appendChild(ripple);

            setTimeout(() => { ripple.remove(); }, 600);

            // Redirect to login page
            setTimeout(() => {
                window.location.href = "login.html"; 
            }, 200); 
        });
    </script>
</body>
</html>
