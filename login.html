<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parents Login - Kids Teacher</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Box ko niche rakhega */
      background: linear-gradient(180deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* --- ANIMATED FLOATING CLOUDS (Pure CSS) --- */
    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.8;
      filter: blur(4px);
      z-index: 1;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .cloud-1 { width: 150px; height: 60px; top: 10%; left: -20px; animation: floatCloud 8s infinite alternate; }
    .cloud-2 { width: 200px; height: 80px; top: 25%; right: -50px; animation: floatCloud 12s infinite alternate-reverse; }
    .cloud-3 { width: 120px; height: 50px; top: 40%; left: 10%; animation: floatCloud 10s infinite alternate; }
    
    /* Cute floating stars */
    .star {
      position: absolute;
      color: #FFD700;
      font-size: 24px;
      z-index: 1;
      animation: twinkle 2s infinite alternate;
    }
    .star-1 { top: 15%; left: 20%; }
    .star-2 { top: 35%; right: 15%; animation-delay: 1s; }
    .star-3 { top: 5%; right: 30%; animation-delay: 0.5s; }

    @keyframes floatCloud {
      0% { transform: translateX(0) translateY(0); }
      100% { transform: translateX(30px) translateY(-10px); }
    }
    @keyframes twinkle {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    /* --- MASCOT SPACE (Agar aapke paas image ho toh yahan aayegi) --- */
    .mascot-container {
      position: absolute;
      top: -80px; /* Box ke bahar nikal kar baithega */
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border: 4px solid #fff;
      z-index: 20;
      animation: bounce 2s infinite alternate;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-10px); }
    }

    /* --- MAIN LOGIN SHEET (Bottom Sheet Style) --- */
    .login-sheet {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 40px 40px 0 0; /* Sirf upar gol corners */
      padding: 60px 24px 40px 24px;
      box-shadow: 0 -15px 40px rgba(0,0,0,0.1);
      position: relative;
      z-index: 10;
      animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* --- HEADER --- */
    .brand-header { text-align: center; margin-bottom: 25px; }
    
    .app-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #2d3748;
      letter-spacing: -0.5px;
    }

    .app-subtitle {
      font-size: 14px;
      color: #718096;
      font-weight: 800;
      margin-top: 5px;
    }

    /* --- INPUT FIELDS (Chunky 3D Style) --- */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-icon {
      position: absolute;
      left: 20px; top: 50%; transform: translateY(-50%);
      font-size: 22px; z-index: 2;
    }

    .form-input {
      width: 100%;
      padding: 20px 20px 20px 56px; /* Extra padding for icons */
      background: #f7fafc;
      border: 3px solid #e2e8f0;
      border-radius: 24px; /* Motay gol corners */
      font-size: 16px;
      color: #1a202c;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #e2e8f0; /* 3D Shadow for input */
    }

    .form-input:focus {
      border-color: #ff7e5f;
      background: #fff;
      box-shadow: 0 4px 0 #ff7e5f, 0 0 0 4px rgba(255, 126, 95, 0.2);
    }
    .form-input::placeholder { color: #a0aec0; font-weight: 800; }

    .toggle-password {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      background: #f7fafc; border: none; cursor: pointer; font-size: 20px;
      width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* --- BUTTONS --- */
    .forgot-link {
      display: block; text-align: right; font-size: 14px; color: #718096;
      font-weight: 900; background: none; border: none; cursor: pointer;
      margin-bottom: 20px; width: 100%;
    }
    .forgot-link:active { color: #ff7e5f; }

    .btn-login {
      width: 100%; padding: 18px;
      background: linear-gradient(180deg, #ff9a9e 0%, #ff7e5f 100%); /* 3D Gradient */
      color: #ffffff; border: none; border-radius: 24px;
      font-size: 20px; font-family: 'Fredoka', sans-serif; font-weight: 700;
      cursor: pointer;
      /* 3D Button Shadow */
      box-shadow: 0 8px 0 #e05a40, 0 15px 20px rgba(255, 126, 95, 0.3);
      transition: all 0.1s ease;
      margin-bottom: 20px;
      position: relative; overflow: hidden;
    }

    .btn-login:active { transform: translateY(8px); box-shadow: 0 0 0 #e05a40, 0 5px 10px rgba(0,0,0,0.1); }

    /* Ripple */
    .ripple { position: absolute; background: rgba(255,255,255,0.4); border-radius: 50%; transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none; }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    /* Divider */
    .divider {
      display: flex; align-items: center; text-align: center;
      margin: 20px 0; color: #a0aec0; font-size: 14px; font-weight: 900;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 3px solid #edf2f7; }
    .divider::before { margin-right: 12px; } .divider::after { margin-left: 12px; }

    /* Google Button */
    .btn-google {
      width: 100%; padding: 16px; background: #ffffff; color: #4a5568;
      border: 3px solid #e2e8f0; border-radius: 24px; font-size: 16px; font-weight: 900;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 5px 0 #e2e8f0; transition: all 0.1s ease; margin-bottom: 25px;
    }
    .btn-google:active { transform: translateY(5px); box-shadow: 0 0 0 #e2e8f0; }

    .bottom-signup { text-align: center; font-size: 15px; color: #718096; font-weight: 900; }
    .bottom-signup button { color: #ff7e5f; background: none; border: none; cursor: pointer; font-weight: 900; font-size: 15px; }
  </style>
</head>
<body>

  <!-- 3D Background Elements -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="star star-1">⭐</div>
  <div class="star star-2">✨</div>
  <div class="star star-3">⭐</div>

  <!-- Mascot / Logo Circle (Upar nikal kar baitha hai) -->
  <div class="mascot-container">
    <!-- Agar aapke paas 3D image hai, toh yahan <img src="mascot.png"> daal dein -->
    <span style="font-size: 50px;">🦉</span>
  </div>

  <div class="login-sheet">
    <div class="brand-header">
      <h1 class="app-title">Parents Login</h1>
      <p class="app-subtitle">Guide your child's learning journey</p>
    </div>

    <div id="alertBox" style="display:none; padding:10px; background:#fee2e2; color:#b91c1c; border-radius:10px; margin-bottom:15px; font-size:13px; font-weight:bold; text-align:center;"></div>

    <form id="authForm" onsubmit="handleFormSubmit(event)">
      
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" class="form-input" placeholder="Email Address" required>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" class="form-input" placeholder="Password" required>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
      </div>

      <button type="button" class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</button>

      <button type="submit" id="submitBtn" class="btn-login">Log In</button>
    </form>

    <div class="divider">OR</div>

    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
      <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>

    <div class="bottom-signup">
      New here? <button type="button" id="signupBtn" onclick="handleCreateAccount()">Create Account</button>
    </div>
  </div>

  <!-- Firebase Script (Same as before, no changes needed) -->
  <script type="module">
    // ... (Aapka pichla pura Firebase wala script yahan aayega) ...
    // Main isko chhota kar raha hoon, aap apna purana script yahan paste kar dein.
    // Bas yaad rakhein, loader wali line hata dein agar aap chahte hain ki yeh design turant dikhe.
  </script>
</body>
</html>
