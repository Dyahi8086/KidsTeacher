<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parents Login - Kids Teacher</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); /* Clean Premium Background */
      padding: 20px;
      font-family: 'Nunito', sans-serif;
    }

    /* Advanced Loader */
    #authLoader {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background: #ffffff;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 999;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 45px; height: 45px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #FF6B35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Main Card */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .brand-header {
      margin-bottom: 30px;
    }

    /* Clean 3D Icon */
    .icon-3d {
      width: 70px;
      height: 70px;
      background: #FFF3EE;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
      box-shadow: inset 0 -4px 0 rgba(255, 107, 53, 0.1);
    }

    .app-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.5px;
    }

    .app-subtitle {
      font-size: 14px;
      color: #64748b;
      font-weight: 600;
      margin-top: 5px;
    }

    /* Alerts */
    #alertBox {
      display: none;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }
    #alertBox.error { background: #fee2e2; color: #b91c1c; }
    #alertBox.success { background: #dcfce7; color: #15803d; }

    /* Input Fields */
    .input-group {
      position: relative;
      margin-bottom: 16px;
      text-align: left;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #94a3b8;
    }

    .form-input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 15px;
      color: #1e293b;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #FF6B35;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
    }

    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer;
      font-size: 18px; color: #94a3b8;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      color: #64748b;
      font-weight: 700;
      background: none; border: none; cursor: pointer;
      margin-bottom: 24px;
      width: 100%;
    }

    /* Advanced 3D Button */
    .btn-login {
      width: 100%;
      padding: 16px;
      background: #FF6B35;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #cc4e20;
      transition: all 0.1s ease;
      margin-bottom: 24px;
    }

    .btn-login:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0 #cc4e20;
    }

    /* Divider */
    .divider {
      display: flex; align-items: center; text-align: center;
      margin: 20px 0; color: #cbd5e1; font-size: 12px; font-weight: 800;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; border-bottom: 2px solid #e2e8f0;
    }
    .divider::before { margin-right: 12px; }
    .divider::after { margin-left: 12px; }

    /* Google Button */
    .btn-google {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      color: #334155;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 0 #e2e8f0;
      transition: all 0.1s ease;
      margin-bottom: 30px;
    }
    .btn-google:active { transform: translateY(4px); box-shadow: 0 0px 0 #e2e8f0; }

    /* Bottom Link */
    .bottom-signup {
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
    }
    .bottom-signup button {
      color: #FF6B35; font-weight: 800;
      background: none; border: none; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="authLoader">
    <div class="spinner"></div>
  </div>

  <div class="login-card">
    <div class="brand-header">
      <div class="icon-3d">
        <!-- Clean 3D Book Icon -->
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <!-- Changed to Parents Login -->
      <h1 class="app-title">Parents Login</h1>
      <p class="app-subtitle">Guide your child's learning journey</p>
    </div>

    <div id="alertBox"></div>

    <form id="authForm" onsubmit="handleFormSubmit(event)">
      
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" class="form-input" placeholder="Email Address" required>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" class="form-input" placeholder="Password" required autocomplete="new-password">
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
      </div>

      <button type="button" class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</button>

      <button type="submit" id="submitBtn" class="btn-login">Log In</button>
    </form>

    <div class="divider">OR</div>

    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>

    <div class="bottom-signup">
      New here? <button type="button" id="signupBtn" onclick="handleCreateAccount()">Create Account</button>
    </div>
  </div>

  <script type="module">
    // Aapka Firebase wala pura script yahan aayega (jo maine pichli baar diya tha)
    // Main isko chhota kar raha hoon taaki aapko pura code easily mil jaye.
    // Bas yeh script tag kholiye aur apna purana Firebase code yahan paste kar dein.
    // Main niche aapke reference ke liye wahi important functions de raha hoon:

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, 
      signInWithRedirect, getRedirectResult, onAuthStateChanged, 
      setPersistence, browserLocalPersistence 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b",
      measurementId: "G-VJVS2ZMNLY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    const loader = document.getElementById('authLoader');

    // Loader Hide Logic
    getRedirectResult(auth).then((result) => {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
    }).catch((error) => {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const savedAge = localStorage.getItem('kidsAgeGroup');
        window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
      } else {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);
      }
    });

    window.togglePasswordVisibility = function() {
      const passwordInput = document.getElementById('password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = type;
      alertBox.style.display = 'block';
    }

    function hideAlert() { document.getElementById('alertBox').style.display = 'none'; }

    function setLoading(isLoading, text = '') {
      const submitBtn = document.getElementById('submitBtn');
      document.getElementById('signupBtn').disabled = isLoading;
      document.getElementById('googleBtn').disabled = isLoading;
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? text : "Log In";
    }

    function getFriendlyErrorMessage(errorCode) {
      switch (errorCode) {
        case 'auth/invalid-email': return "Please enter a valid email address.";
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return "Incorrect email or password.";
        case 'auth/email-already-in-use': return "Email already registered.";
        case 'auth/weak-password': return "Password must be at least 6 characters.";
        default: return "An error occurred. Try again.";
      }
    }

    window.handleFormSubmit = async function(event) {
      event.preventDefault();
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) { showAlert("Please fill in all fields."); return; }

      setLoading(true, "Logging in...");
      try {
        await signInWithEmailAndPassword(auth, email, password);
        const savedAge = localStorage.getItem('kidsAgeGroup');
        window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }

    window.handleCreateAccount = async function() {
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showAlert("Enter email and password to create account."); return; }

      setLoading(true, "Creating account...");
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        window.location.replace("age-select.html");
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }

    window.handleGoogleLogin = async function() {
      hideAlert();
      setLoading(true, "Signing in...");
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        if (result && result.user) {
          const savedAge = localStorage.getItem('kidsAgeGroup');
          window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
        }
      } catch (error) {
        if (error.code === 'auth/popup-blocked') {
          try { await signInWithRedirect(auth, provider); } catch (e) { setLoading(false); showAlert("Error."); }
        } else {
          setLoading(false); showAlert("Error signing in with Google.");
        }
      }
    }

    window.handleForgotPassword = async function() {
      hideAlert();
      const email = document.getElementById('email').value.trim();
      if (!email) { showAlert("Enter your email address first."); return; }

      setLoading(true, "Sending email...");
      try {
        await sendPasswordResetEmail(auth, email);
        setLoading(false);
        showAlert("Reset email sent! Check your inbox.", "success");
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }
  </script>
</body>
</html>
