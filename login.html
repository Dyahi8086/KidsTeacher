<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
        font-family: 'Nunito', sans-serif;
        /* Background ko welcome page jaisa dikhaya aur blur kiya */
        background: url('welcome_bg.png') center/cover no-repeat, #fce7f3;
        display: flex; align-items: center; justify-content: center;
        position: relative;
    }

    /* White Blur Overlay jaisa screenshot me hai */
    body::before {
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        z-index: 1;
    }

    /* Login Card / Popup */
    .login-card {
        position: relative; z-index: 10;
        width: 90%; max-width: 400px;
        background: #ffffff;
        border-radius: 35px;
        padding: 40px 25px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        text-align: center;
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .icon-3d { font-size: 50px; margin-bottom: 10px; }
    .app-title { font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .app-subtitle { font-family: 'Nunito', sans-serif; font-size: 14px; color: #64748b; font-weight: 700; margin-bottom: 25px; }

    /* Google Button */
    .btn-google {
        width: 100%; padding: 15px; 
        background: #ffffff; color: #1e293b;
        border: 1.5px solid #e2e8f0; border-radius: 50px; 
        font-size: 16px; font-family: 'Nunito', sans-serif; font-weight: 800;
        cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        transition: background 0.2s, transform 0.1s;
        margin-bottom: 20px;
    }
    .btn-google:active { transform: scale(0.98); background: #f8fafc; }
    .btn-google:disabled { opacity: 0.6; cursor: wait; }
    .google-icon-svg { width: 20px; height: 20px; }

    .privacy-text { font-size: 11px; color: #94a3b8; font-weight: 600; line-height: 1.5; margin-top: 20px; }
    
    /* Loading Overlay */
    #loadingOverlay {
        display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.9);
        z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
    }
    .spinner {
        width: 45px; height: 45px; border: 4px solid #ffedd5; border-top: 4px solid #FF5E3A;
        border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
    <div class="icon-3d">🎓</div>
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">Guide your child's learning journey</p>

    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
        <svg class="google-icon-svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Continue with Google</span>
    </button>

    <p class="privacy-text">By continuing, you agree to our<br><a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a></p>
</div>

<div id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const overlay = document.getElementById("loadingOverlay");
const googleBtn = document.getElementById("googleBtn");

setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));

// Login successful hone par yaha aayega
function handleLoginSuccess() {
    const savedAge = localStorage.getItem('kidsAgeGroup');
    
    // Agar age save nahi hai, toh Age Select pe bhejo. Warna Home page.
    if (!savedAge) {
        window.location.replace("age-select.html");
    } else {
        window.location.replace("index-home.html");
    }
}

// Redirect wapas aane par
getRedirectResult(auth).then(result => {
  if (result && result.user) {
    overlay.style.display = "flex";
    setTimeout(handleLoginSuccess, 500);
  }
}).catch(err => {
  console.error(err);
  overlay.style.display = "none";
});

// Check karo pehle se login hai kya
onAuthStateChanged(auth, user => {
  if (user) {
    overlay.style.display = "flex";
    setTimeout(handleLoginSuccess, 500);
  } else {
    overlay.style.display = "none";
  }
});

// Google Login Button Click
window.handleGoogleLogin = async function(){
  if (googleBtn.disabled) return;
  googleBtn.disabled = true;
  googleBtn.innerHTML = "<span>Connecting...</span>";

  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  try {
    await signInWithRedirect(auth, provider);
  } catch (error) {
    overlay.style.display = "none";
    googleBtn.disabled = false;
    googleBtn.innerHTML = "Continue with Google";
    alert("Login failed: " + error.message);
  }
};
</script>
</body>
</html>
