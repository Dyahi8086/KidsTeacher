
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#55A9E8">

<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;

    position: relative;

    font-family: 'Nunito', sans-serif;

    background-color: #75B9F1;

    background-image:
        linear-gradient(
            180deg,
            rgba(75,160,235,0.04),
            rgba(100,190,245,0.10)
        ),
        url("https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=1400&auto=format&fit=crop");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

/* SKY LIGHT EFFECT */
.sky-glow {
    position: absolute;
    top: 10%;
    left: -20%;
    width: 140%;
    height: 45%;

    background: radial-gradient(
        ellipse,
        rgba(255,255,255,0.20),
        transparent 70%
    );

    pointer-events: none;
}

/* GLASS LOGIN CARD */
.login-popup-box {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 500px;

    height: 56vh;
    height: 56dvh;

    min-height: 450px;
    max-height: 720px;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;

    padding:
        clamp(65px, 12vh, 155px)
        24px
        max(35px, env(safe-area-inset-bottom));

    background: linear-gradient(
        145deg,
        rgba(210,244,255,0.62),
        rgba(255,255,255,0.34) 48%,
        rgba(105,202,255,0.48)
    );

    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);

    border-radius: 45px 45px 0 0;

    border-top: 2px solid rgba(255,255,255,0.95);
    border-left: 1px solid rgba(255,255,255,0.55);
    border-right: 1px solid rgba(255,255,255,0.55);

    box-shadow:
        0 -15px 50px rgba(25,100,170,0.14),
        inset 0 2px 8px rgba(255,255,255,0.85),
        inset 0 -15px 35px rgba(255,255,255,0.15);

    animation: slideUp 0.85s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes slideUp {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

/* TOP PULL BAR */
.login-popup-box::before {
    content: "";

    position: absolute;
    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: 80px;
    height: 7px;

    border-radius: 20px;

    background: rgba(255,255,255,0.82);

    box-shadow: 0 2px 8px rgba(255,255,255,0.35);
}

/* 3D ICON */
.icon-3d {
    font-size: 76px;
    line-height: 1;

    margin-bottom: 24px;

    filter: drop-shadow(
        0 9px 12px rgba(0,0,0,0.18)
    );

    animation: floating 3s ease-in-out infinite;
}

@keyframes floating {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

/* HEADING */
.app-title {
    font-family: 'Fredoka', sans-serif;

    font-size: clamp(29px, 7vw, 43px);
    font-weight: 700;

    color: #10264b;

    line-height: 1.15;
    margin-bottom: 10px;

    text-shadow: 0 3px 8px rgba(255,255,255,0.4);
}

/* SUBTITLE */
.app-subtitle {
    font-family: 'Nunito', sans-serif;

    font-size: clamp(13px, 3.8vw, 17px);

    color: #19375b;
    font-weight: 900;

    line-height: 1.5;
    margin-bottom: 48px;
}

/* GOOGLE BUTTON */
.google-btn {
    width: 100%;
    max-width: 440px;
    min-height: 70px;

    padding: 14px 20px;

    position: relative;
    isolation: isolate;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;

    border: none;
    border-radius: 50px;

    background: #090a0e;
    color: #ffffff;

    font-family: 'Fredoka', sans-serif;
    font-size: clamp(16px, 4.5vw, 21px);
    font-weight: 700;

    box-shadow:
        0 8px 22px rgba(0,0,0,.28),
        inset 0 1px 2px rgba(255,255,255,.20);

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

/* ROTATING RAINBOW BORDER */
.google-btn::before {
    content: "";

    position: absolute;
    z-index: -2;

    width: 220%;
    height: 500%;

    background: conic-gradient(
        from 0deg,
        #00d4ff,
        #3867ff,
        #a855f7,
        #ff36a5,
        #ff8a24,
        #ffe44d,
        #00e5a8,
        #00d4ff
    );

    animation: rainbowRotate 4s linear infinite;
}

/* INNER BLACK GLASS */
.google-btn::after {
    content: "";

    position: absolute;
    z-index: -1;

    inset: 2px;

    border-radius: inherit;

    background: linear-gradient(
        145deg,
        #24252b,
        #090a0e 55%,
        #17181e
    );

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,.10),
        inset 0 -3px 8px rgba(0,0,0,.5);
}

/* RAINBOW ANIMATION */
@keyframes rainbowRotate {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* BUTTON PRESS */
.google-btn:active {
    transform: scale(.97);

    box-shadow:
        0 3px 12px rgba(0,0,0,.3);
}

.google-btn:disabled {
    opacity: .65;
    cursor: wait;
}

/* BUTTON CONTENT */
.google-icon-svg {
    width: 28px;
    height: 28px;
    flex-shrink: 0;

    position: relative;
    z-index: 1;
}

.btn-text {
    position: relative;
    z-index: 1;
}

/* PRIVACY TEXT */
.privacy-text {
    font-family: 'Nunito', sans-serif;

    font-size: 14px;
    color: #142c4d;

    font-weight: 900;
    line-height: 1.65;

    margin-top: 35px;
    padding: 0 8px;
}

.privacy-text a {
    color: #142c4d;

    text-decoration: none;

    border-bottom: 2px solid #142c4d;
}

/* ERROR MESSAGE */
#errorBox {
    display: none;

    width: 100%;
    max-width: 440px;

    padding: 12px 15px;
    margin-top: 15px;

    border-radius: 15px;

    background: rgba(255,225,225,.95);
    border: 1px solid #ef9999;

    color: #9f2020;

    font-size: 13px;
    font-weight: 800;

    overflow-wrap: anywhere;
}

/* LOADING */
#loadingOverlay {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 9999;

    background: rgba(225,244,255,.72);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.spinner {
    width: 52px;
    height: 52px;

    border: 5px solid rgba(255,255,255,.7);
    border-top: 5px solid #168bd1;

    border-radius: 50%;

    animation: spin .8s linear infinite;

    margin-bottom: 18px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-text {
    font-family: 'Fredoka', sans-serif;

    color: #123c65;
    font-size: 20px;
    font-weight: 600;
}

/* SMALL SCREEN */
@media (max-height: 720px) {
    .login-popup-box {
        height: 61dvh;
        min-height: 420px;
        padding-top: 65px;
    }

    .icon-3d {
        font-size: 62px;
        margin-bottom: 15px;
    }

    .app-subtitle {
        margin-bottom: 28px;
    }

    .google-btn {
        min-height: 60px;
    }

    .privacy-text {
        margin-top: 22px;
    }
}

@media (max-width: 360px) {
    .login-popup-box {
        padding-left: 18px;
        padding-right: 18px;
    }

    .app-title {
        font-size: 29px;
    }

    .privacy-text {
        font-size: 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .icon-3d,
    .login-popup-box,
    .google-btn::before {
        animation: none !important;
    }
}
</style>
</head>

<body>

<div class="sky-glow"></div>

<!-- LOGIN CARD -->
<main class="login-popup-box">

    <div class="icon-3d" aria-hidden="true">🎓</div>

    <h1 class="app-title">Parents Login</h1>

    <p class="app-subtitle">
        Guide your child's learning journey
    </p>

    <!-- GOOGLE LOGIN BUTTON -->
    <button
        type="button"
        id="googleBtn"
        class="google-btn"
        aria-label="Continue with Google"
    >

        <svg
            class="google-icon-svg"
            viewBox="0 0 48 48"
            aria-hidden="true"
        >
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>

        <span class="btn-text" id="btnText">
            Continue with Google
        </span>

    </button>

    <div id="errorBox" role="alert" aria-live="polite"></div>

    <!-- PRIVACY -->
    <p class="privacy-text">
        By continuing, you agree to our<br>
        <a href="./privacy-policy.html">Privacy Policy</a>
        and
        <a href="./terms.html">Terms of Service</a>
    </p>

</main>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay">

    <div class="spinner"></div>

    <p class="loading-text">
        Logging you in...
    </p>

</div>


<!-- FIREBASE AUTHENTICATION -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


/* FIREBASE CONFIG */
const firebaseConfig = {
    apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
    authDomain: "kids-teacher-4387e.firebaseapp.com",
    projectId: "kids-teacher-4387e",
    storageBucket: "kids-teacher-4387e.firebasestorage.app",
    messagingSenderId: "420221167346",
    appId: "1:420221167346:web:da7ac80acdfd52339d526b",
    measurementId: "G-VJVS2ZMNLY"
};


/* INITIALIZE FIREBASE */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
    prompt: "select_account"
});


/* ELEMENTS */
const googleBtn = document.getElementById("googleBtn");
const btnText = document.getElementById("btnText");
const overlay = document.getElementById("loadingOverlay");
const errorBox = document.getElementById("errorBox");


let isBusy = false;
let redirectHandled = false;


/* HOME PAGE */
const HOME_PAGE = "./index-home.html";


/* ERROR MESSAGE */
function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function hideError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
}


/* FRIENDLY FIREBASE ERRORS */
function friendlyError(error) {

    const code = error?.code || "";

    if (
        code === "auth/api-key-not-valid" ||
        code === "auth/invalid-api-key"
    ) {
        return "Firebase API key invalid hai. Firebase Project Settings se Web App ki API key verify karo.";
    }

    if (code === "auth/unauthorized-domain") {
        return "GitHub Pages domain Firebase Authorized Domains mein add karo.";
    }

    if (code === "auth/operation-not-allowed") {
        return "Firebase Console mein Google Sign-In enable karo.";
    }

    if (code === "auth/network-request-failed") {
        return "Internet connection check karo aur dobara try karo.";
    }

    if (code === "auth/too-many-requests") {
        return "Too many attempts. Thodi der baad try karo.";
    }

    if (code === "auth/web-storage-unsupported") {
        return "Browser storage support nahi kar raha. Normal browser mein try karo.";
    }

    return "Login failed: " +
        (code || error.message || "Unknown error");
}


/* LOADING */
function setLoading(active) {

    isBusy = active;

    googleBtn.disabled = active;

    overlay.style.display =
        active ? "flex" : "none";

    btnText.textContent =
        active ? "Connecting..." : "Continue with Google";
}


/* LOGIN SUCCESS */
function goToHome() {

    if (redirectHandled) return;

    redirectHandled = true;

    setLoading(true);

    window.location.replace(
        new URL(HOME_PAGE, window.location.href).href
    );
}


/* GOOGLE LOGIN BUTTON */
googleBtn.addEventListener("click", async () => {

    if (isBusy) return;

    hideError();

    if (navigator.vibrate) {
        navigator.vibrate(40);
    }

    try {

        setLoading(true);

        await setPersistence(
            auth,
            browserLocalPersistence
        );

        await signInWithRedirect(
            auth,
            provider
        );

    } catch (error) {

        console.error("Google Login Error:", error);

        setLoading(false);

        showError(friendlyError(error));
    }

});


/* CHECK REDIRECT RESULT */
async function checkRedirectResult() {

    try {

        const result = await getRedirectResult(auth);

        if (result && result.user) {
            goToHome();
        }

    } catch (error) {

        console.error("Redirect Login Error:", error);

        setLoading(false);

        showError(friendlyError(error));
    }
}


/* RESTORE EXISTING LOGIN */
onAuthStateChanged(auth, user => {

    if (user) {
        goToHome();
    }

});


/* INITIALIZE AUTH */
async function initializeLogin() {

    try {

        await setPersistence(
            auth,
            browserLocalPersistence
        );

        await checkRedirectResult();

    } catch (error) {

        console.error("Firebase Initialization Error:", error);

        setLoading(false);

        showError(friendlyError(error));
    }

}

initializeLogin();


/* SERVICE WORKER */
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./service-worker.js")
            .catch(error => {
                console.error("Service Worker Error:", error);
            });

    });

}

</script>

</body>
</html>
