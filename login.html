<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  font-family: 'Nunito', sans-serif;
  position: relative;
  background: linear-gradient(180deg, #38BDF8 0%, #7DD3FC 55%, #BAE6FD 100%);
}

/* ========== SKY CANVAS ========== */
#cloud-canvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; z-index: 0; pointer-events: none;
}

/* ========== RAINBOW ARCH ========== */
.rainbow-arch {
  position: fixed;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  width: 90vw;
  max-width: 520px;
  height: 45vh;
  z-index: 2;
  pointer-events: none;
  opacity: 0.85;
  animation: rainbowGlow 6s ease-in-out infinite;
}
@keyframes rainbowGlow {
  0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
  50% { opacity: 0.95; filter: drop-shadow(0 0 16px rgba(255,255,255,0.7)); }
}
.rainbow-arch svg { width: 100%; height: 100%; }

/* ========== BUTTERFLIES ========== */
.butterfly {
  position: fixed;
  z-index: 3;
  pointer-events: none;
  font-size: 26px;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.15));
  will-change: transform;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
.butterfly .wing {
  display: inline-block;
  animation: flap 0.28s ease-in-out infinite alternate;
  transform-origin: center;
}
@keyframes flap {
  from { transform: scaleX(1); }
  to   { transform: scaleX(0.55); }
}

/* Butterfly flight paths */
.butterfly.b1 { top: 15%; left: -10%; font-size: 28px; animation: fly1 22s infinite; }
.butterfly.b2 { top: 30%; left: -10%; font-size: 22px; animation: fly2 28s infinite; animation-delay: -6s; }
.butterfly.b3 { top: 45%; left: -10%; font-size: 24px; animation: fly3 25s infinite; animation-delay: -12s; }
.butterfly.b4 { top: 22%; left: -10%; font-size: 20px; animation: fly4 30s infinite; animation-delay: -18s; }

@keyframes fly1 {
  0%   { transform: translate(0, 0) rotate(6deg); }
  25%  { transform: translate(35vw, -8vh) rotate(-10deg); }
  50%  { transform: translate(60vw, 6vh) rotate(12deg); }
  75%  { transform: translate(85vw, -4vh) rotate(-6deg); }
  100% { transform: translate(115vw, 10vh) rotate(8deg); }
}
@keyframes fly2 {
  0%   { transform: translate(0, 0) rotate(-8deg); }
  30%  { transform: translate(28vw, 10vh) rotate(14deg); }
  60%  { transform: translate(55vw, -6vh) rotate(-12deg); }
  100% { transform: translate(118vw, 8vh) rotate(6deg); }
}
@keyframes fly3 {
  0%   { transform: translate(0, 0) rotate(10deg); }
  20%  { transform: translate(22vw, -6vh) rotate(-14deg); }
  55%  { transform: translate(58vw, 12vh) rotate(16deg); }
  80%  { transform: translate(88vw, -3vh) rotate(-8deg); }
  100% { transform: translate(120vw, 5vh) rotate(4deg); }
}
@keyframes fly4 {
  0%   { transform: translate(0, 0) rotate(-4deg); }
  35%  { transform: translate(40vw, 8vh) rotate(10deg); }
  70%  { transform: translate(75vw, -6vh) rotate(-10deg); }
  100% { transform: translate(118vw, 6vh) rotate(8deg); }
}

/* ========== LOGIN ========== */
.login-container {
  position: relative; width: 100%; height: 100%; height: 100dvh;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  z-index: 10; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-bottom: env(safe-area-inset-bottom);
}
.login-card {
  width: 100%; max-width: 450px; min-height: 55vh;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);
  border-radius: 40px 40px 0 0;
  border-top: 1px solid rgba(255,255,255,0.8);
  border-left: 1px solid rgba(255,255,255,0.4);
  border-right: 1px solid rgba(255,255,255,0.4);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,1),
    inset 0 -1px 20px rgba(255,255,255,0.3),
    0 -15px 40px rgba(0,0,0,0.2);
  padding: 40px 25px calc(40px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; position: relative;
  animation: bounceUp 0.9s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  transform: translateY(100%);
}
@keyframes bounceUp {
  0%   { transform: translateY(100%); }
  60%  { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}
.login-card::before {
  content: ''; position: absolute; top: 12px;
  width: 50px; height: 5px;
  background: rgba(255,255,255,0.6); border-radius: 10px;
}
.icon-3d {
  font-size: 60px; margin-top: 10px; margin-bottom: 10px;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
}
.app-title {
  font-family: 'Fredoka', sans-serif;
  font-size: 34px; font-weight: 700; letter-spacing: -0.5px;
  margin-bottom: 8px; color: #0f172a;
}
.app-subtitle {
  font-family: 'Nunito', sans-serif; font-size: 15px;
  color: #334155; font-weight: 700; margin-bottom: 30px;
  padding: 0 10px; line-height: 1.4;
}
.btn-google {
  width: 100%; padding: 18px 15px;
  background: rgba(255,255,255,0.9); color: #0f172a;
  border: 1px solid rgba(255,255,255,1); border-radius: 50px;
  font-size: 17px; font-family: 'Fredoka', sans-serif; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  position: relative; overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1), inset 0 2px 2px rgba(255,255,255,1);
  transition: transform 0.15s ease;
  margin-bottom: 25px; z-index: 100;
}
.btn-google span { display: inline-block; animation: textBounce 2s infinite ease-in-out; }
@keyframes textBounce {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-3px); }
}
.btn-google::after {
  content: ''; position: absolute; top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0));
  transform: skewX(-25deg); animation: shine 3s infinite; pointer-events: none;
}
@keyframes shine {
  0%   { left: -100%; }
  20%  { left: 200%; }
  100% { left: 200%; }
}
.btn-google:active { transform: translateY(3px); }
.btn-google:disabled { opacity: 0.7; cursor: wait; }
.google-icon-svg { width: 22px; height: 22px; flex-shrink: 0; }

.privacy-text {
  font-family: 'Nunito', sans-serif; font-size: 12px;
  color: #334155; font-weight: 800; line-height: 1.5;
  text-align: center; padding: 0 10px;
}
.privacy-text a { color: #0f172a; text-decoration: underline; }

#loadingOverlay {
  display: none; position: fixed; inset: 0;
  width: 100%; height: 100%; height: 100dvh;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
  z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
}
.spinner {
  width: 50px; height: 50px;
  border: 5px solid #ffedd5; border-top: 5px solid #FF5E3A;
  border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
.loading-text {
  font-family: 'Fredoka', sans-serif; font-size: 22px;
  color: #9a3412; font-weight: 600;

@media (max-height: 650px) {

  .app-subtitle { margin-bottom: 20px; }
  .btn-google { padding: 15px; margin-bottom: 20px; }
  .rainbow-arch { top: 4%; height: 32vh; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>

<!-- ========== CLOUD SHADER (unchanged) ========== -->
<script>
(() => {
  const canvas = document.getElementById("cloud-canvas");
  if (!canvas) return;
  const gl = canvas.getContext("webgl", { alpha: false, antialias: false, premultipliedAlpha: false });
  if (!gl) { console.warn("WebGL unavailable."); return; }

  const vertexShaderSource = `
    attribute vec2 a_pos;
    varying vec2 v_uv;
    void main() {
      v_uv = a_pos * 0.5 + 0.5;
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision highp float;
    varying vec2 v_uv;
    uniform vec2 u_res;
    uniform float u_time;
    const mat2 ROT = mat2(0.80,0.60,-0.60,0.80);
    float hash(vec2 p){ return fract(sin(dot(p, vec2(41.31,289.17)))*26737.367); }
    float noise(vec2 p){
      vec2 i=floor(p); vec2 f=fract(p);
      f=f*f*(3.0-2.0*f);
      float a=hash(i); float b=hash(i+vec2(1.0,0.0));
      float c=hash(i+vec2(0.0,1.0)); float d=hash(i+vec2(1.0,1.0));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }
    float fbm(vec2 p){
      float v=0.0; float a=0.5;
      for(int i=0;i<4;i++){ v+=a*noise(p); p=ROT*p*2.03+19.19; a*=0.5; }
      return v;
    }
    float billow(vec2 p){
      float v=0.0; float a=0.5;
      for(int i=0;i<5;i++){ v+=a*(1.0-abs(2.0*noise(p)-1.0)); p=ROT*p*2.11+13.37; a*=0.5; }
      return v;
    }
    float cloudDensity(vec2 p, vec2 center, vec2 radius, float seed, float time){
      vec2 q=p-center;
      float ry = q.y>0.0 ? radius.y : radius.y*0.42;
      float envelope = 1.0 - length(vec2(q.x/radius.x, q.y/ry));
      if(envelope < -0.35) return 0.0;
      vec2 dp = q*(2.4/radius.x) + vec2(seed);
      dp += 0.6 * vec2(fbm(dp*1.4+time*0.04), fbm(dp*1.4+7.7-time*0.03));
      float detail = billow(dp*1.6);
      return envelope + (detail-0.62)*0.62;
    }
    vec3 shadeCloud(vec3 color, vec2 p, vec2 center, vec2 radius, float seed, float time){
      float density = cloudDensity(p,center,radius,seed,time);
      if(density < 0.02) return color;
      float upperDensity = cloudDensity(p+vec2(0.0,radius.y*0.55), center, radius, seed, time);
      float occlusion = clamp((upperDensity-density)*1.1 + density*0.55, 0.0, 1.0);
      vec3 cloudLight = vec3(1.0,0.99,0.97);
      vec3 cloudShadow = vec3(0.72,0.86,0.96);
      vec3 cloudColor = mix(cloudLight, cloudShadow, occlusion*0.85);
      float alpha = smoothstep(0.02,0.38,density);
      float rim = smoothstep(0.02,0.14,density)*(1.0-smoothstep(0.14,0.40,density));
      cloudColor += rim*0.10;
      return mix(color, cloudColor, alpha);
    }
    vec3 cloudPass(vec3 color, vec2 p, float aspect, float time, float speed, float phase, float y, vec2 radius, float seed){
      float progress = fract(time*speed + phase);
      float centerX = mix(-radius.x-0.25, aspect+radius.x+0.25, progress);
      float centerY = y + sin(time*0.05 + phase*6.2831)*0.012;
      return shadeCloud(color, p, vec2(centerX,centerY), radius, seed, time);
    }
    void main(){
      float aspect = u_res.x/u_res.y;
      vec2 p = vec2(v_uv.x*aspect, v_uv.y);
      float time = u_time;
      vec3 skyTop = vec3(0.10,0.62,0.98);
      vec3 skyBottom = vec3(0.48,0.84,1.00);
      vec3 color = mix(skyBottom, skyTop, v_uv.y);
      vec2 sunPosition = vec2(aspect*0.78, 0.92);
      float sunDistance = length(p-sunPosition);
      color += vec3(1.0,0.96,0.82)*exp(-sunDistance*sunDistance*5.0)*0.18;
      float cirrusBand = smoothstep(0.55,0.80,v_uv.y)*(1.0-smoothstep(0.90,1.0,v_uv.y));
      float streak = fbm(vec2(p.x*1.6-time*0.006, p.y*12.0));
      float wisps = smoothstep(0.52,0.78,streak)*cirrusBand;
      color = mix(color, vec3(0.96,0.98,1.0), wisps*0.25);
      color = cloudPass(color,p,aspect,time,0.006,0.10,0.84,vec2(0.20,0.10),43.7);
      color = cloudPass(color,p,aspect,time,0.008,0.62,0.73,vec2(0.24,0.12),71.3);
      color = cloudPass(color,p,aspect,time,0.011,0.33,0.60,vec2(0.34,0.16),17.3);
      color = cloudPass(color,p,aspect,time,0.013,0.80,0.47,vec2(0.30,0.15),29.9);
      color = cloudPass(color,p,aspect,time,0.016,0.05,0.35,vec2(0.46,0.20),91.1);
      color = cloudPass(color,p,aspect,time,0.020,0.48,0.20,vec2(0.56,0.24),57.2);
      gl_FragColor = vec4(color,1.0);
    }
  `;

  function compileShader(type, source){
    const shader = gl.createShader(type);
    if(!shader) throw new Error("Unable to create shader");
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if(!gl.getShaderParameter(shader, gl.COMPILE_STATUS)){
      const err = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error("Shader compile failed: "+err);
    }
    return shader;
  }

  let program;
  let animationFrame = 0;

  try {
    const vs = compileShader(gl.VERTEX_SHADER, vertexShaderSource);
    const fs = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);
    program = gl.createProgram();
    if(!program) throw new Error("Unable to create WebGL program");
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if(!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error("Program link failed: "+gl.getProgramInfoLog(program));
    gl.useProgram(program);

    const posLoc = gl.getAttribLocation(program, "a_pos");
    const resLoc = gl.getUniformLocation(program, "u_res");
    const timeLoc = gl.getUniformLocation(program, "u_time");

    const buffer = gl.createBuffer();
    if(!buffer) throw new Error("Unable to create buffer");
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    function resizeCanvas(){
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      const w = Math.max(1, Math.floor(canvas.clientWidth*dpr));
      const h = Math.max(1, Math.floor(canvas.clientHeight*dpr));
      if(canvas.width!==w || canvas.height!==h){
        canvas.width=w; canvas.height=h;
        gl.viewport(0,0,w,h);
      }
      gl.useProgram(program);
      gl.uniform2f(resLoc, canvas.width, canvas.height);
    }

    const ro = new ResizeObserver(resizeCanvas);
    ro.observe(canvas);
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const startTime = performance.now();
    function draw(now){
      if(gl.isContextLost()) return;
      const elapsed = (now-startTime)/1000;
      gl.useProgram(program);
      gl.uniform1f(timeLoc, elapsed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      animationFrame = requestAnimationFrame(draw);
    }
    animationFrame = requestAnimationFrame(draw);

    document.addEventListener("visibilitychange", () => {
      if(document.hidden) cancelAnimationFrame(animationFrame);
      else animationFrame = requestAnimationFrame(draw);
    });
  } catch(err){
    console.error("Cloud background error:", err);
    canvas.style.display = "none";
  }
})();
</script>
