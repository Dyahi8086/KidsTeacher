<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E7DFD3">

<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: 'Nunito', sans-serif;
  position: relative;
  background-color: #E7DFD3;
}

/* =========================
   EFFECTS BEACH BACKGROUND
========================= */

.beach-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background-image: 
    radial-gradient(circle at 50% 50%, transparent 75%, rgba(255,244,190,0.5) 100%),
    linear-gradient(180deg,
      rgba(205, 235, 250, 1) 0%,
      rgba(255, 244, 224, 1) 35%,
      rgba(255, 226, 194, 1) 70%,
      rgba(255, 198, 142, 1) 80%,
      rgba(245, 145, 115, 1) 90%,
      rgba(190, 91, 91, 1) 100%
    );
}

/* =========================
   LOGIN CONTAINER
========================= */

.login-container {
  position: relative;
  width: 100%;
  height: 100%;
  height: 100dvh;

  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;

  z-index: 10;

  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;

  padding-bottom: env(safe-area-inset-bottom);
}

/* =========================
   LOGIN CARD
========================= */

.login-card {
  width: 100%;
  max-width: 450px;
  min-height: 55vh;

  background: rgba(255, 255, 255, 0.35);

  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);

  border-radius: 40px 40px 0 0;

  border-top: 1px solid rgba(255, 255, 255, 0.9);
  border-left: 1px solid rgba(255, 255, 255, 0.5);
  border-right: 1px solid rgba(255, 255, 255, 0.5);

  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 1),
    inset 0 -1px 20px rgba(255, 255, 255, 0.4),
    0 -15px 40px rgba(0, 0, 0, 0.15);

  padding: 40px 25px calc(40px + env(safe-area-inset-bottom));

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  position: relative;

  animation: bounceUp 0.9s cubic-bezier(
    0.175,
    0.885,
    0.32,
    1.275
  ) forwards;

  transform: translateY(100%);
}

@keyframes bounceUp {
  0% {
    transform: translateY(100%);
  }

  60% {
    transform: translateY(-15px);
  }

  100% {
    transform: translateY(0);
  }
}

/* Pull bar */

.login-card::before {
  content: '';

  position: absolute;
  top: 12px;

  width: 50px;
  height: 5px;

  background: rgba(255, 255, 255, 0.7);

  border-radius: 10px;
}

/* =========================
   ICON
========================= */

.icon-3d {
  font-size: 60px;

  margin-top: 10px;
  margin-bottom: 10px;

  filter: drop-shadow(
    0 8px 12px rgba(0, 0, 0, 0.2)
  );
}

/* =========================
   TEXT
========================= */

.app-title {
  font-family: 'Fredoka', sans-serif;

  font-size: 34px;
  font-weight: 700;

  letter-spacing: -0.5px;

  margin-bottom: 8px;

  color: #0f172a;
}

.app-subtitle {
  font-family: 'Nunito', sans-serif;

  font-size: 15px;

  color: #334155;

  font-weight: 700;

  margin-bottom: 30px;

  padding: 0 10px;

  line-height: 1.4;
}

/* =========================
   GOOGLE BUTTON
========================= */

.btn-google {
  width: 100%;

  padding: 18px 15px;

  background: rgba(255, 255, 255, 0.95);

  color: #0f172a;

  border: 1px solid rgba(255, 255, 255, 1);

  border-radius: 50px;

  font-size: 17px;

  font-family: 'Fredoka', sans-serif;

  font-weight: 700;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 10px;

  position: relative;
  overflow: hidden;

  box-shadow:
    0 8px 20px rgba(0, 0, 0, 0.1),
    inset 0 2px 2px rgba(255, 255, 255, 1);

  transition: transform 0.15s ease;

  margin-bottom: 25px;

  z-index: 100;
}

.btn-google span {
  display: inline-block;

  animation: textBounce 2s infinite ease-in-out;
}

@keyframes textBounce {
  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-3px);
  }
}

/* Button shine */

.btn-google::after {
  content: '';

  position: absolute;

  top: 0;
  left: -100%;

  width: 50%;
  height: 100%;

  background: linear-gradient(
    to right,
    rgba(255,255,255,0),
    rgba(255,255,255,0.8),
    rgba(255,255,255,0)
  );

  transform: skewX(-25deg);

  animation: shine 3s infinite;

  pointer-events: none;
}

@keyframes shine {
  0% {
    left: -100%;
  }

  20% {
    left: 200%;
  }

  100% {
    left: 200%;
  }
}

.btn-google:active {
  transform: translateY(3px);
}

.btn-google:disabled {
  opacity: 0.7;
  cursor: wait;
}

.google-icon-svg {
  width: 22px;
  height: 22px;

  flex-shrink: 0;
}

/* =========================
   PRIVACY
========================= */

.privacy-text {
  font-family: 'Nunito', sans-serif;

  font-size: 12px;

  color: #334155;

  font-weight: 800;

  line-height: 1.5;

  text-align: center;

  padding: 0 10px;
}

.privacy-text a {
  color: #0f172a;
  text-decoration: underline;
}

/* =========================
   LOADING
========================= */

#loadingOverlay {
  display: none;

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;
  height: 100dvh;

  background: rgba(255, 255, 255, 0.9);

  backdrop-filter: blur(10px);

  z-index: 9999;

  flex-direction: column;

  justify-content: center;
  align-items: center;
}

.spinner {
  width: 50px;
  height: 50px;

  border: 5px solid #ffedd5;

  border-top: 5px solid #FF5E3A;

  border-radius: 50%;

  animation: spin 1s linear infinite;

  margin-bottom: 20px;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.loading-text {
  font-family: 'Fredoka', sans-serif;

  font-size: 22px;

  color: #9a3412;

  font-weight: 600;
}

/* =========================
   SMALL MOBILE
========================= */

@media (max-height: 650px) {
  .login-card {
    min-height: auto;

    padding-top: 30px;
    padding-bottom: calc(25px + env(safe-area-inset-bottom));
  }

  .icon-3d {
    font-size: 48px;
    margin-top: 5px;
    margin-bottom: 5px;
  }

  .app-title {
    font-size: 29px;
  }

  .app-subtitle {
    margin-bottom: 20px;
  }

  .btn-google {
    padding: 15px;
    margin-bottom: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- BEACH BACKGROUND -->
<div class="beach-bg"></div>

<!-- LOGIN -->
<div class="login-container">
  <div class="login-card">
    <div class="icon-3d">🎓</div>
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">
      Guide your child's learning journey
    </p>

    <button
      type="button"
      id="googleBtn"
      class="btn-google"
    >
      <svg
        class="google-icon-svg"
        viewBox="0 0 48 48"
        aria-hidden="true"
      >
        <path
          fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
        />
        <path
          fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
        />
        <path
          fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
        />
        <path
          fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
        />
      </svg>
      <span>Continue with Google</span>
    </button>

    <p class="privacy-text">
      By continuing, you agree to our<br>
      <a href="#">Privacy Policy</a>
      and
      <a href="#">Terms of Service</a>
    </p>
  </div>
</div>

<!-- LOADING -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <p class="loading-text">Logging you in...</p>
</div>

<!-- =========================
     FIREBASE LOGIN SCRIPT
========================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const overlay = document.getElementById("loadingOverlay");
const googleBtn = document.getElementById("googleBtn");

setPersistence(auth, browserLocalPersistence).catch(error => {
  console.error("Persistence error:", error);
});

onAuthStateChanged(auth, user => {
  if (!user) {
    overlay.style.display = "none";
    return;
  }

  overlay.style.display = "flex";
  const savedAge = localStorage.getItem("kidsAgeGroup");

  setTimeout(() => {
    const destination = !savedAge ? "age-select.html" : "index-home.html";
    window.location.replace(destination);
  }, 800);
}, error => {
  console.error("Authentication state error:", error);
  overlay.style.display = "none";
});

googleBtn.addEventListener('click', async () => {
  if (googleBtn.disabled) return;

  if (navigator.vibrate) {
    navigator.vibrate(50);
  }

  const originalHTML = googleBtn.innerHTML;
  googleBtn.disabled = true;
  googleBtn.innerHTML = "<span>Connecting...</span>";

  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  try {
    overlay.style.display = "flex";
    await signInWithPopup(auth, provider);
  } catch (error) {
    console.error("Google login error:", error);
    overlay.style.display = "none";
    googleBtn.innerHTML = originalHTML;
    googleBtn.disabled = false;

    if (error.code !== "auth/popup-closed-by-user") {
      alert("Login failed. Please try again.");
    }
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(error => {
      console.error("Service worker registration failed:", error);
    });
  });
}
</script>

</body>
</html>
