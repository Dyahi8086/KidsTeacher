
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08090d">
<title>Parents Login - Kids Teacher</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #08090d;
  --white: #ffffff;
  --muted: #a1a1aa;
}

html, body {
  width: 100%;
  min-height: 100%;
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: white;
  overflow-x: hidden;
}

body {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 18px;
  position: relative;
}

/* Background */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse at 15% 10%, #161b2b 0%, transparent 45%),
    radial-gradient(ellipse at 90% 90%, #201326 0%, transparent 45%),
    #08090d;
}

.glow {
  position: absolute;
  width: 330px;
  height: 330px;
  border-radius: 50%;
  filter: blur(95px);
  opacity: 0.45;
  animation: float 12s ease-in-out infinite alternate;
}

.glow.blue {
  background: #315dff;
  top: -130px;
  left: -100px;
}

.glow.purple {
  background: #8b36ff;
  right: -150px;
  top: 30%;
  animation-delay: -4s;
}

.glow.orange {
  background: #ff713b;
  bottom: -170px;
  left: 20%;
  animation-delay: -7s;
}

@keyframes float {
  0% {
    transform: translate3d(0,0,0) scale(1);
  }
  100% {
    transform: translate3d(45px,55px,0) scale(1.2);
  }
}

/* Rotating light ring */

.light-ring {
  position: fixed;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  border: 1px solid transparent;
  background:
    linear-gradient(#08090d,#08090d) padding-box,
    conic-gradient(
      from 0deg,
      transparent 0deg,
      #3478ff 55deg,
      #a855f7 125deg,
      #ffffff 180deg,
      #ff6b35 240deg,
      #ffd166 290deg,
      transparent 360deg
    ) border-box;
  opacity: 0.18;
  filter: blur(1px);
  animation: rotateRing 22s linear infinite;
  pointer-events: none;
}

@keyframes rotateRing {
  to {
    transform: rotate(360deg);
  }
}

/* Main layout */

.page {
  width: 100%;
  max-width: 430px;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Logo */

.logo {
  width: 82px;
  height: 82px;
  border-radius: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 22px;

  background: rgba(255,255,255,0.055);
  border: 1px solid rgba(255,255,255,0.13);

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.13),
    0 15px 45px rgba(0,0,0,0.25);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}

.logo span {
  font-size: 42px;
  filter: drop-shadow(0 5px 12px rgba(0,0,0,0.25));
}

/* Card */

.login-card {
  width: 100%;
  padding: 34px 24px 27px;
  position: relative;
  overflow: hidden;
  border-radius: 34px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.105),
      rgba(255,255,255,0.035)
    );

  border: 1px solid rgba(255,255,255,0.16);

  box-shadow:
    0 25px 80px rgba(0,0,0,0.42),
    inset 0 1px 1px rgba(255,255,255,0.20);

  backdrop-filter: blur(35px) saturate(150%);
  -webkit-backdrop-filter: blur(35px) saturate(150%);
}

/* Glass shine */

.login-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12%;
  right: 12%;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.65),
    transparent
  );
}

.card-glow {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: #6246ff;
  filter: blur(100px);
  opacity: 0.12;
  top: -100px;
  right: -70px;
  pointer-events: none;
}

.heading {
  text-align: center;
  position: relative;
  z-index: 1;
}

.heading h1 {
  font-size: clamp(27px, 7vw, 34px);
  font-weight: 900;
  letter-spacing: -1.2px;
  line-height: 1.2;
  color: #ffffff;
}

.heading p {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.7;
  color: #a8a8b5;
  font-weight: 600;
}

/* Google button */

.google-button {
  width: 100%;
  min-height: 60px;
  margin-top: 34px;
  padding: 0 18px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;

  border-radius: 19px;
  border: 1px solid rgba(255,255,255,0.20);

  background: linear-gradient(
    145deg,
    #ffffff,
    #eaeaf0
  );

  color: #111116;
  font-family: inherit;
  font-size: 15px;
  font-weight: 900;

  cursor: pointer;
  position: relative;
  overflow: hidden;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.24),
    inset 0 1px 0 rgba(255,255,255,0.9);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.google-button:active {
  transform: scale(0.97);
}

.google-button:disabled {
  opacity: 0.65;
  cursor: wait;
}

.google-icon {
  width: 23px;
  height: 23px;
  flex-shrink: 0;
}

/* Divider */

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 29px 0;
  color: #777783;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 2px;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.19)
  );
}

.divider::after {
  transform: rotate(180deg);
}

/* Security box */

.security {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 15px;

  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.075);

  background: rgba(255,255,255,0.035);

  color: #a5a5b1;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.6;
}

.security-icon {
  font-size: 20px;
  flex-shrink: 0;
}

/* Footer */

.footer {
  margin-top: 25px;
  text-align: center;
  color: #777783;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.9;
}

.footer a {
  color: #d4d4df;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.footer a:active {
  opacity: 0.65;
}

/* Status message */

.message {
  display: none;
  margin-top: 18px;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
  text-align: center;
}

.message.show {
  display: block;
}

.message.error {
  color: #ffb7b7;
  background: rgba(255,65,65,0.10);
  border: 1px solid rgba(255,65,65,0.20);
}

.message.info {
  color: #d0c7ff;
  background: rgba(135,100,255,0.10);
  border: 1px solid rgba(135,100,255,0.20);
}

/* Loading */

.spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(0,0,0,0.18);
  border-top-color: #111116;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.google-button.loading .spinner {
  display: block;
}

.google-button.loading .google-icon {
  display: none;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Small screens */

@media (max-width: 360px) {
  body {
    padding: 18px 13px;
  }

  .login-card {
    padding: 29px 18px 23px;
    border-radius: 29px;
  }

  .heading h1 {
    font-size: 27px;
  }

  .google-button {
    font-size: 14px;
    min-height: 56px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="glow blue"></div>
  <div class="glow purple"></div>
  <div class="glow orange"></div>
</div>

<div class="light-ring"></div>

<main class="page">

  <div class="logo">
    <span>🎓</span>
  </div>

  <section class="login-card">

    <div class="card-glow"></div>

    <div class="heading">
      <h1>Parents Login</h1>
      <p>Secure access to your child's learning</p>
    </div>

    <button
      class="google-button"
      id="googleLogin"
      type="button"
    >

      <svg
        class="google-icon"
        viewBox="0 0 48 48"
        aria-hidden="true"
      >
        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15z"/>
        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4 1.9-6.8 1.9-5.2 0-9.6-3.5-11.2-8.2H5.9v5.2A20 20 0 0 0 24 44z"/>
        <path fill="#FBBC05" d="M12.8 27.7a12 12 0 0 1 0-7.4v-5.2H5.9a20 20 0 0 0 0 17.8z"/>
        <path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.9 15.1l6.9 5.2c1.6-4.7 6-8.2 11.2-8.2z"/>
      </svg>

      <span id="buttonText">Continue with Google</span>
      <span class="spinner"></span>

    </button>

    <div class="divider">SECURE SIGN IN</div>

    <div class="security">
      <span class="security-icon">🔒</span>
      <span>
        Your account is protected.<br>
        Your child's learning stays private.
      </span>
    </div>

    <div class="message" id="message"></div>

    <div class="footer">
      By continuing, you agree to our<br>
      <a href="privacy-policy.html">Privacy Policy</a>
      and
      <a href="terms.html">Terms of Service</a>
    </div>

  </section>

</main>

<script type="module">

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged
} from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/*
  Firebase configuration
  Kids Teacher project
*/

const firebaseConfig = {
  apiKey: "AIzaSyD7mKp5J2x4W8nR6vQ9sT1uF3aB5cD7eG0",
  authDomain: "kids-teacher-4387.firebaseapp.com",
  projectId: "kids-teacher-4387",
  storageBucket: "kids-teacher-4387.appspot.com",
  messagingSenderId: "104739286510",
  appId: "1:104739286510:web:7f3a9b2c4d6e8f0a1b2c3d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const loginButton = document.getElementById("googleLogin");
const buttonText = document.getElementById("buttonText");
const messageBox = document.getElementById("message");

/* Show messages */

function showMessage(text, type = "info") {
  messageBox.textContent = text;
  messageBox.className = "message show " + type;
}

/* Loading */

function setLoading(isLoading) {
  loginButton.disabled = isLoading;
  loginButton.classList.toggle("loading", isLoading);

  buttonText.textContent = isLoading
    ? "Signing in..."
    : "Continue with Google";
}

/* Redirect */

function redirectUser() {
  const ageGroup = localStorage.getItem("kidsAgeGroup");

  if (ageGroup) {
    window.location.replace("./index-home.html");
  } else {
    window.location.replace("./age-select.html");
  }
}

/* Firebase local persistence */

try {
  await setPersistence(auth, browserLocalPersistence);
} catch (error) {
  console.error("Persistence error:", error);
}

/* Existing logged-in user */

onAuthStateChanged(auth, (user) => {
  if (user) {
    redirectUser();
  }
});

/* Google login */

loginButton.addEventListener("click", async () => {

  if (loginButton.disabled) return;

  setLoading(true);
  messageBox.className = "message";

  try {

    const result = await signInWithPopup(auth, provider);

    if (result.user) {
      showMessage("Login successful. Opening your account...", "info");
      redirectUser();
    }

  } catch (error) {

    console.error("Google login error:", error);

    let errorText = "Login failed. Please try again.";

    if (error.code === "auth/popup-closed-by-user") {
      errorText = "Login cancelled. Please try again.";
    }

    else if (error.code === "auth/popup-blocked") {
      errorText = "Popup blocked. Allow popups and try again.";
    }

    else if (error.code === "auth/unauthorized-domain") {
      errorText = "This website is not authorized in Firebase.";
    }

    else if (error.code === "auth/network-request-failed") {
      errorText = "Internet connection problem. Check your network.";
    }

    else if (error.code === "auth/operation-not-allowed") {
      errorText = "Google login is disabled in Firebase.";
    }

    showMessage(errorText, "error");

    setLoading(false);
  }

});

/* Service worker */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./service-worker.js")
      .catch((error) => {
        console.warn("Service worker registration failed:", error);
      });

  });
}

</script>

</body>
</html>
