<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
        font-family: 'Nunito', sans-serif;
        background: #f8fafc; 
        /* Peeche ka soft background jisme blur hoga */
        background-image: 
            radial-gradient(circle at 10% 10%, rgba(255, 107, 53, 0.2) 0%, transparent 40%),
            radial-gradient(circle at 90% 90%, rgba(56, 189, 248, 0.2) 0%, transparent 40%),
            radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, rgba(240, 245, 255, 1) 100%);
        display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
        position: relative;
    }

    /* ========================================= */
    /* NICHE SE NIKALNE WALA GLASS BOX           */
    /* ========================================= */
    .login-popup-box {
        position: relative; z-index: 10;
        width: 100%; max-width: 450px; 
        min-height: 60vh; /* Box ki height */
        
        /* Glass Effect */
        background: rgba(255, 255, 255, 0.85); 
        backdrop-filter: blur(30px) saturate(200%);
        -webkit-backdrop-filter: blur(30px) saturate(200%);
        
        border-radius: 40px 40px 0 0;
        padding: 40px 30px calc(20px + env(safe-area-inset-bottom));
        
        border-top: 1px solid rgba(255, 255, 255, 0.9);
        border-left: 1px solid rgba(255, 255, 255, 0.4);
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 -10px 40px rgba(0,0,0,0.08), inset 0 2px 2px rgba(255,255,255,1);
        
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        
        /* Neeche se slide hone ki animation */
        transform: translateY(100%);
        animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes slideUp {
        0% { transform: translateY(100%); }
        100% { transform: translateY(0); }
    }

    /* Upar ka pull bar */
    .login-popup-box::before {
        content: ''; position: absolute; top: 15px; 
        width: 50px; height: 5px; background: rgba(0,0,0,0.1); border-radius: 10px;
    }

    .icon-3d { font-size: 60px; margin-top: 10px; margin-bottom: 10px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .app-title { font-family: 'Fredoka', sans-serif; font-size: 36px; font-weight: 700; color: #0f172a; margin-bottom: 5px; }
    .app-subtitle { font-family: 'Nunito', sans-serif; font-size: 15px; color: #475569; font-weight: 800; margin-bottom: 25px; }

    /* ========================================= */
    /* LIQUID GLASS BUTTON (Black with Glow)     */
    /* ========================================= */
    .glass-btn-container {
        position: relative; width: 100%; max-width: 340px; height: 68px; border-radius: 50px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 25px; cursor: pointer; transition: transform 0.2s;
        z-index: 5;
    }
    .glass-btn-container:active { transform: scale(0.95); }

    /* Ghumta hua glow border */
    .glass-btn-container::before {
        content: ''; position: absolute;
        top: -3px; left: -3px; right: -3px; bottom: -3px;
        border-radius: 53px;
        background: linear-gradient(90deg, #4285F4, #FFD700, #EA4335, #4285F4);
        background-size: 300% 100%;
        animation: borderGlow 4s linear infinite;
        z-index: 0; box-shadow: 0 0 20px rgba(66, 133, 244, 0.3);
    }
    
    .glass-btn-container::after {
        content: ''; position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #111; border-radius: 50px; z-index: 1;
    }

    @keyframes borderGlow {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    .glass-btn-content {
        position: relative; z-index: 2;
        display: flex; align-items: center; justify-content: center; gap: 12px;
        width: 100%; height: 100%;
    }

    .glass-btn-text { color: #ffffff; font-size: 20px; font-family: 'Fredoka', sans-serif; font-weight: 600; }
    .google-icon-svg { width: 26px; height: 26px; flex-shrink: 0; }

    /* Privacy Text */
    .privacy-text { 
        font-size: 12px; color: #64748b; font-weight: 800; line-height: 1.6; 
        margin-top: auto; /* Isko sabse neeche push karega */
        padding-top: 10px;
    }
    .privacy-text a { color: #0f172a; text-decoration: none; font-weight: 900; border-bottom: 2px solid #0f172a; padding-bottom: 2px; }
    
    /* Loading Overlay */
    #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.7); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
    .spinner { width: 45px; height: 45px; border: 4px solid rgba(0,0,0,0.1); border-top: 4px solid #FF5E3A; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Neeche se aane wala Login Box -->
<div class="login-popup-box">
    <div class="icon-3d">🎓</div>
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">Guide your child's learning journey</p>

    <div class="glass-btn-container" onclick="handleGoogleLogin()">
        <div class="glass-btn-content">
            <svg class="google-icon-svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span class="glass-btn-text" id="btnText">Continue with Google</span>
        </div>
    </div>

    <p class="privacy-text">By continuing, you agree to our<br><a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a></p>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="spinner"></div>
</div>

<!-- Firebase Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const overlay = document.getElementById("loadingOverlay");
const btnText = document.getElementById("btnText");

setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));

function handleLoginSuccess() {
    window.location.replace("age-select.html");
}

getRedirectResult(auth).then(result => {
  if (result && result.user) {
    overlay.style.display = "flex";
    setTimeout(handleLoginSuccess, 500);
  }
}).catch(err => console.error(err));

onAuthStateChanged(auth, user => {
  if (user) {
    overlay.style.display = "flex";
    setTimeout(handleLoginSuccess, 500);
  }
});

window.handleGoogleLogin = async function(){
  btnText.innerText = "Connecting...";
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  try {
    await signInWithRedirect(auth, provider);
  } catch (error) {
    overlay.style.display = "none";
    btnText.innerText = "Continue with Google";
    alert("Login failed: " + error.message);
  }
};
</script>
</body>
</html>
