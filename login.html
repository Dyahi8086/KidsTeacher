<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    position: relative;
    font-family: 'Nunito', sans-serif;

    /* Clean Blur White Base Background */
    background-color: #f8fafc;
}

/* AMBIENT FLOATING BLUR ORBS (White Blur Effect ke peeche halka sa color) */
.bg-blur-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(45px);
    -webkit-backdrop-filter: blur(45px);
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.45;
    animation: floatOrb 10s ease-in-out infinite alternate;
}

.orb-1 {
    width: 260px;
    height: 260px;
    background: #ffd1dc;
    top: 5%;
    left: -10%;
}

.orb-2 {
    width: 300px;
    height: 300px;
    background: #bae6fd;
    top: 25%;
    right: -15%;
    animation-delay: -3s;
}

.orb-3 {
    width: 240px;
    height: 240px;
    background: #fed7aa;
    bottom: 40%;
    left: 20%;
    animation-delay: -6s;
}

@keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(25px, -30px) scale(1.1); }
}

/* OFFLINE NETWORK BANNER */
#offlineBanner {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #ef4444;
    color: white;
    text-align: center;
    padding: 10px;
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    z-index: 10001;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
}

/* FROSTED WHITE GLASS LOGIN PANEL */
.login-popup-box {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 500px;
    height: 58vh;
    height: 58dvh;
    min-height: 460px;
    max-height: 720px;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;

    padding:
        clamp(55px, 9vh, 120px)
        24px
        max(35px, env(safe-area-inset-bottom));

    /* Pure Frosted White Glass */
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(35px) saturate(180%);
    -webkit-backdrop-filter: blur(35px) saturate(180%);

    border-radius: 45px 45px 0 0;

    border-top: 2px solid #ffffff;
    border-left: 1px solid rgba(255, 255, 255, 0.8);
    border-right: 1px solid rgba(255, 255, 255, 0.8);

    box-shadow:
        0 -20px 50px rgba(15, 23, 42, 0.06),
        inset 0 2px 10px rgba(255, 255, 255, 1);

    animation: slideUp 0.8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}

/* TOP PULL BAR */
.login-popup-box::before {
    content: "";
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 65px;
    height: 6px;
    border-radius: 20px;
    background: #cbd5e1;
}

/* SMART GREETING BADGE */
.greeting-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f1f5f9;
    color: #475569;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 14px;
    border: 1px solid #e2e8f0;
}

/* ICON */
.icon-3d {
    font-size: 64px;
    line-height: 1;
    margin-bottom: 14px;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.12));
    animation: floating 3s ease-in-out infinite;
}

@keyframes floating {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

/* HEADING */
.app-title {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(28px, 6.5vw, 38px);
    font-weight: 700;
    color: #0f172a;
    line-height: 1.15;
    margin-bottom: 8px;
}

.app-subtitle {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(13px, 3.5vw, 16px);
    color: #64748b;
    font-weight: 800;
    line-height: 1.4;
    margin-bottom: 28px;
}

/* SLEEK BLACK BUTTON WITH ROTATING GLOW BORDER */
.google-btn-wrapper {
    position: relative;
    width: 100%;
    max-width: 380px;
    border-radius: 40px;
    padding: 2.5px;
    overflow: hidden;
    box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
}

.google-btn-wrapper::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: conic-gradient(transparent, transparent, transparent, #ff3366, #3b82f6, #10b981, #f59e0b, transparent);
    animation: rotateGlow 3.5s linear infinite;
}

@keyframes rotateGlow {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.google-btn {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 58px;
    padding: 12px 18px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    background: #0f172a;
    color: #ffffff;

    border: none;
    border-radius: 38px;

    font-family: 'Fredoka', sans-serif;
    font-size: clamp(15px, 4vw, 19px);
    font-weight: 700;

    cursor: pointer;
    transition: transform .2s ease;
}

.google-btn:active {
    transform: scale(.97);
}

.google-btn:disabled {
    opacity: .7;
    cursor: wait;
}

.btn-text {
    display: inline-block;
    animation: textWiggle 2.5s ease-in-out infinite;
}

@keyframes textWiggle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
}

.google-icon-svg {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
}

/* PRIVACY & SECURITY NOTE */
.security-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 11px;
    color: #16a34a;
    font-weight: 800;
    margin-top: 14px;
}

.privacy-text {
    font-family: 'Nunito', sans-serif;
    font-size: 12.5px;
    color: #64748b;
    font-weight: 800;
    line-height: 1.5;
    margin-top: 12px;
    padding: 0 8px;
}

.privacy-text a {
    color: #0f172a;
    text-decoration: none;
    border-bottom: 1.5px solid #0f172a;
}

/* ERROR MESSAGE */
#errorBox {
    display: none;
    width: 100%;
    max-width: 380px;
    padding: 10px 14px;
    margin-top: 12px;
    border-radius: 12px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 12px;
    font-weight: 800;
    overflow-wrap: anywhere;
}

/* LOADING OVERLAY */
#loadingOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;

    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #e2e8f0;
    border-top: 4px solid #0f172a;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 15px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    font-family: 'Fredoka', sans-serif;
    color: #0f172a;
    font-size: 18px;
    font-weight: 600;
}

/* TOUCH SPARKLE PARTICLES */
.sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    font-size: 16px;
    animation: sparkleFade 0.8s ease-out forwards;
}

@keyframes sparkleFade {
    0% { transform: scale(0.5) translateY(0); opacity: 1; }
    100% { transform: scale(1.4) translateY(-35px); opacity: 0; }
}

@media (max-height: 720px) {
    .login-popup-box {
        height: 64dvh;
        min-height: 420px;
        padding-top: 45px;
    }
    .icon-3d { font-size: 52px; margin-bottom: 10px; }
    .app-subtitle { margin-bottom: 20px; }
    .google-btn-wrapper { max-width: 340px; }
    .google-btn { min-height: 52px; }
}
</style>
</head>

<body>

<!-- OFFLINE ALERT -->
<div id="offlineBanner">⚠️ No Internet Connection! Please check your network.</div>

<!-- BLUR WHITE AMBIENT BACKGROUND -->
<div class="bg-blur-layer">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<!-- FROSTED WHITE GLASS PANEL -->
<main class="login-popup-box">
    <div class="greeting-badge" id="greetingBadge">👋 Welcome, Parent!</div>
    <div class="icon-3d" aria-hidden="true">🎓</div>
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">Guide your child's learning journey</p>

    <div class="google-btn-wrapper">
        <button type="button" id="googleBtn" class="google-btn" aria-label="Continue with Google">
            <svg class="google-icon-svg" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span class="btn-text" id="btnText">Continue with Google</span>
        </button>
    </div>

    <div id="errorBox" role="alert" aria-live="polite"></div>

    <div class="security-badge">
        <span>🛡️</span> 100% Safe & Ad-Free Kids Environment
    </div>

    <p class="privacy-text">
        By continuing, you agree to our<br>
        <a href="./privacy-policy.html">Privacy Policy</a> and <a href="./terms.html">Terms of Service</a>
    </p>
</main>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text" id="loadingText">Logging you in...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
    getAuth,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// 1. Smart Time-based Greeting
const hour = new Date().getHours();
const greetingBadge = document.getElementById("greetingBadge");
if (hour < 12) greetingBadge.textContent = "☀️ Good Morning, Parent!";
else if (hour < 17) greetingBadge.textContent = "🌤️ Good Afternoon, Parent!";
else greetingBadge.textContent = "🌙 Good Evening, Parent!";

// 2. Interactive Touch Sparkles
const emojis = ["✨", "⭐", "🎈", "🎨", "🌟"];
document.addEventListener("pointerdown", (e) => {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    sparkle.style.left = (e.clientX - 10) + "px";
    sparkle.style.top = (e.clientY - 10) + "px";
    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 800);
});

// 3. Offline Network Monitor
const offlineBanner = document.getElementById("offlineBanner");
window.addEventListener("online", () => offlineBanner.style.display = "none");
window.addEventListener("offline", () => offlineBanner.style.display = "block");
if (!navigator.onLine) offlineBanner.style.display = "block";

// Firebase Setup
const firebaseConfig = {
    apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
    authDomain: "kids-teacher-4387e.firebaseapp.com",
    projectId: "kids-teacher-4387e",
    storageBucket: "kids-teacher-4387e.firebasestorage.app",
    messagingSenderId: "420221167346",
    appId: "1:420221167346:web:da7ac80acdfd52339d526b",
    measurementId: "G-VJVS2ZMNLY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

const googleBtn = document.getElementById("googleBtn");
const btnText = document.getElementById("btnText");
const overlay = document.getElementById("loadingOverlay");
const loadingText = document.getElementById("loadingText");
const errorBox = document.getElementById("errorBox");

let isBusy = false;
let redirectHandled = false;

function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function hideError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
}

function friendlyError(error) {
    const code = error?.code || "";
    if (code === "auth/unauthorized-domain") return "GitHub Pages domain Firebase Authorized Domains mein add karo.";
    if (code === "auth/operation-not-allowed") return "Firebase Console mein Google Sign-In enable karo.";
    return "Login failed: " + (code || error.message || "Unknown error");
}

function setLoading(active) {
    isBusy = active;
    googleBtn.disabled = active;
    overlay.style.display = active ? "flex" : "none";
    btnText.textContent = active ? "Connecting..." : "Continue with Google";
}

function goToNextPage() {
    if (redirectHandled) return;
    redirectHandled = true;
    loadingText.textContent = "Login Successful! 🎉";
    overlay.style.display = "flex";

    setTimeout(() => {
        const savedAge = localStorage.getItem('kidsAgeGroup');
        if (!savedAge) {
            window.location.replace("age-select.html");
        } else {
            window.location.replace("index-home.html");
        }
    }, 800);
}

googleBtn.addEventListener("click", async () => {
    if (isBusy) return;
    hideError();
    if (navigator.vibrate) navigator.vibrate(40);
    try {
        setLoading(true);
        await setPersistence(auth, browserLocalPersistence);
        await signInWithRedirect(auth, provider);
    } catch (error) {
        console.error("Google Login Error:", error);
        setLoading(false);
        showError(friendlyError(error));
    }
});

async function checkRedirectResult() {
    try {
        const result = await getRedirectResult(auth);
        if (result && result.user) {
            goToNextPage();
        }
    } catch (error) {
        console.error("Redirect Login Error:", error);
        setLoading(false);
        showError(friendlyError(error));
    }
}

onAuthStateChanged(auth, user => {
    if (user) {
        goToNextPage();
    }
});

async function initializeLogin() {
    try {
        await setPersistence(auth, browserLocalPersistence);
        await checkRedirectResult();
    } catch (error) {
        console.error("Firebase Initialization Error:", error);
        setLoading(false);
        showError(friendlyError(error));
    }
}

initializeLogin();

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(error => {
            console.error("Service Worker Error:", error);
        });
    });
}
</script>

</body>
</html>
