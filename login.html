<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
        font-family: 'Nunito', sans-serif;
        
        /* Dark Sky Background (Jaisa pehli photo me tha) */
        background-color: #0284c7;
        background-image: url('https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=1000&auto=format&fit=crop');
        background-size: cover;
        background-position: center bottom;
        background-repeat: no-repeat;
        
        display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
        position: relative;
    }

    /* Glass Box */
    .login-popup-box {
        position: relative; z-index: 10;
        width: 100%; max-width: 500px; 
        min-height: 58vh; /* Height kam ki taaki sab upar aaye */
        
        background: rgba(255, 255, 255, 0.35); /* Transparent glass */
        backdrop-filter: blur(25px) saturate(200%);
        -webkit-backdrop-filter: blur(25px) saturate(200%);
        
        border-radius: 45px 45px 0 0;
        padding: 40px 30px 25px; /* Padding adjust ki */
        
        border-top: 2px solid rgba(255, 255, 255, 0.9);
        border-left: 1px solid rgba(255, 255, 255, 0.4);
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 -10px 40px rgba(0,0,0,0.1), inset 0 2px 5px rgba(255,255,255,0.8);
        
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        
        transform: translateY(100%);
        animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes slideUp {
        0% { transform: translateY(100%); }
        100% { transform: translateY(0); }
    }

    /* Pull Bar */
    .login-popup-box::before {
        content: ''; position: absolute; top: 15px; 
        width: 50px; height: 5px; background: rgba(255,255,255,0.8); border-radius: 10px;
    }

    .icon-3d { 
        font-size: 55px; margin-top: 10px; margin-bottom: 10px; 
        filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15)); 
        animation: float 3s ease-in-out infinite; 
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .app-title { font-family: 'Fredoka', sans-serif; font-size: 34px; font-weight: 700; color: #0f172a; margin-bottom: 5px; }
    .app-subtitle { font-family: 'Nunito', sans-serif; font-size: 15px; color: #1e293b; font-weight: 800; margin-bottom: 30px; }

    /* Button (Chhota aur patla kiya) */
    .google-btn {
        width: 85%; max-width: 300px; height: 55px; /* Size kam kiya */
        background: #ffffff;
        color: #1e293b;
        border: none;
        border-radius: 50px;
        font-size: 18px; /* Font chhota kiya */
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        transition: transform 0.15s ease;
        margin-bottom: 20px; /* Button ke niche gap */
    }

    .google-btn:active {
        transform: scale(0.96);
    }

    .google-btn:disabled { opacity: 0.7; cursor: wait; }
    .google-icon-svg { width: 22px; height: 22px; flex-shrink: 0; }

    /* Privacy Text (Ekdum perfect position pe) */
    .privacy-text { 
        font-size: 13px; 
        color: #0f172a; 
        font-weight: 800; 
        line-height: 1.6; 
        margin-top: auto; /* Auto lagaya taaki text box ke bilkul niche aaye */
        padding-top: 10px;
    }
    
    .privacy-text a { 
        color: #0f172a; 
        text-decoration: none; 
        font-weight: 900; 
        border-bottom: 2px solid #0f172a; 
        padding-bottom: 2px; 
    }
    
    /* Loading Overlay */
    #loadingOverlay { 
        display: none; position: fixed; inset: 0; 
        background: rgba(255,255,255,0.7); z-index: 9999; 
        flex-direction: column; justify-content: center; align-items: center; 
        backdrop-filter: blur(15px); 
    }
    .spinner { 
        width: 45px; height: 45px; 
        border: 4px solid rgba(255,255,255,0.5); border-top: 4px solid #FF5E3A; 
        border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; 
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-popup-box">
    <div class="icon-3d">🎓</div>
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">Guide your child's learning journey</p>

    <button type="button" id="googleBtn" class="google-btn" onclick="handleGoogleLogin()">
        <svg class="google-icon-svg" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="btnText">Continue with Google</span>
    </button>

    <p class="privacy-text">By continuing, you agree to our<br><a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a></p>
</div>

<div id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const overlay = document.getElementById("loadingOverlay");
const btnText = document.getElementById("btnText");

setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));

function handleLoginSuccess() {
    window.location.replace("age-select.html");
}

getRedirectResult(auth).then(result => {
  if (result && result.user) {
    overlay.style.display = "flex";
    setTimeout(handleLoginSuccess, 500);
  }
}).catch(err => console.error(err));

onAuthStateChanged(auth, user => {
  if (user) {
    overlay.style.display = "flex";
    setTimeout(handleLoginSuccess, 500);
  }
});

window.handleGoogleLogin = async function(){
  btnText.innerText = "Connecting...";
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  try {
    await signInWithRedirect(auth, provider);
  } catch (error) {
    overlay.style.display = "none";
    btnText.innerText = "Continue with Google";
    alert("Login failed: " + error.message);
  }
};
</script>
</body>
</html>
