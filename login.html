<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7DD3FC">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
        width: 100%; height: 100%; overflow: hidden;
        background-color: #75B9F1;
        background-image: url("https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=1400&auto=format&fit=crop");
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        font-family: 'Nunito', sans-serif;
    }

    body {
        height: 100vh; height: 100dvh;
        display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
        position: relative;
    }

    /* 2nd Photo wala Light Glass Box */
    .login-popup-box {
        position: relative; z-index: 10;
        width: 100%; max-width: 500px; 
        height: 60vh; /* Exact height 2nd photo jaisi */
        min-height: 450px;
        
        background: linear-gradient(145deg, rgba(210,244,255,0.6), rgba(255,255,255,0.3) 48%, rgba(105,202,255,0.4));
        backdrop-filter: blur(28px) saturate(190%);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
        
        border-radius: 45px 45px 0 0;
        padding: 40px 30px 25px; 
        
        border-top: 2px solid rgba(255,255,255,0.95);
        border-left: 1px solid rgba(255,255,255,0.55);
        border-right: 1px solid rgba(255,255,255,0.55);
        box-shadow: 0 -15px 50px rgba(25,100,170,0.14), inset 0 2px 8px rgba(255,255,255,0.85);
        
        display: flex; flex-direction: column; align-items: center;
        text-align: center;
        
        transform: translateY(100%);
        animation: slideUp 0.85s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }

    /* Pull Bar */
    .login-popup-box::before {
        content: ""; position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
        width: 60px; height: 6px; border-radius: 20px;
        background: rgba(255,255,255,0.85); box-shadow: 0 2px 8px rgba(255,255,255,0.35);
    }

    .icon-3d { 
        font-size: 65px; margin-top: 10px; margin-bottom: 15px; 
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); 
        animation: float 3s ease-in-out infinite; 
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .app-title { font-family: 'Fredoka', sans-serif; font-size: 36px; font-weight: 700; color: #0f172a; margin-bottom: 5px; }
    .app-subtitle { font-family: 'Nunito', sans-serif; font-size: 16px; color: #1e293b; font-weight: 800; margin-bottom: 35px; }

    /* 2nd Photo wala Button */
    .google-btn {
        width: 90%; max-width: 350px; height: 65px;
        background: #ffffff; color: #1e293b; border: none; border-radius: 50px;
        font-size: 20px; font-family: 'Fredoka', sans-serif; font-weight: 600;
        display: flex; align-items: center; justify-content: center; gap: 12px;
        cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        transition: transform 0.15s ease; margin-bottom: auto; 
    }
    .google-btn:active { transform: scale(0.96); }
    .google-btn:disabled { opacity: 0.7; cursor: wait; }
    .google-icon-svg { width: 26px; height: 26px; flex-shrink: 0; }

    /* 2nd Photo wala Privacy Text (Bold & Niche) */
    .privacy-text { 
        font-size: 13.5px; color: #0f172a; font-weight: 800; 
        line-height: 1.6; margin-top: auto; padding-top: 15px;
    }
    .privacy-text a { 
        color: #0f172a; text-decoration: none; font-weight: 900; 
        border-bottom: 2px solid #0f172a; padding-bottom: 2px; 
    }
    
    /* Loading Overlay */
    #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(225,244,255,0.7); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
    .spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.5); border-top: 4px solid #168bd1; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-popup-box">
    <div class="icon-3d">🎓</div>
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">Guide your child's learning journey</p>

    <button type="button" id="googleBtn" class="google-btn" onclick="handleGoogleLogin()">
        <svg class="google-icon-svg" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="btnText">Continue with Google</span>
    </button>

    <p class="privacy-text">By continuing, you agree to our<br><a href="./privacy-policy.html">Privacy Policy</a> and <a href="./terms.html">Terms of Service</a></p>
</div>

<div id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const overlay = document.getElementById("loadingOverlay");
const btnText = document.getElementById("btnText");

setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));

// --- CRITICAL LOGIC FIX ---
function handleLoginSuccess() {
    // Age save hai ya nahi check karo
    const savedAge = localStorage.getItem('kidsAgeGroup');
    
    // Ek chhota sa delay taaki loading dikhe
    setTimeout(() => {
        if (!savedAge) {
            window.location.replace("age-select.html");
        } else {
            window.location.replace("index-home.html");
        }
    }, 500);
}

// Redirect Result Handle karo
getRedirectResult(auth).then(result => {
  if (result && result.user) {
    overlay.style.display = "flex";
    handleLoginSuccess();
  }
}).catch(err => console.error(err));

// Auth State Handle karo
onAuthStateChanged(auth, user => {
  if (user) {
    overlay.style.display = "flex";
    handleLoginSuccess();
  }
});

window.handleGoogleLogin = async function(){
  btnText.innerText = "Connecting...";
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  try {
    await signInWithRedirect(auth, provider);
  } catch (error) {
    overlay.style.display = "none";
    btnText.innerText = "Continue with Google";
    alert("Login failed: " + error.message);
  }
};
</script>
</body>
</html>
