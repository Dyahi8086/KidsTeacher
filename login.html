<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8b5cf6">
  <title>Parents Login - Kids Teacher</title>
  
  <!-- PWA Links -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      height: 100vh; 
      height: 100dvh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-family: 'Nunito', sans-serif; 
      
      /* BACKGROUND PHOTO */
      background-image: url('./login_bg.png'); 
      background-size: cover; 
      background-position: center;
      background-repeat: no-repeat;
      background-color: #e9d5ff; 
      overflow: hidden;
    }

    /* --- MAIN CONTAINER (Frame ke andar center) --- */
    .login-container {
      width: 78%; 
      max-width: 330px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 3D Icon Premium Look */
    .icon-3d {
      font-size: 48px;
      margin-bottom: 10px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
    }

    /* --- 3D BUBBLE FONT (Parents Login) --- */
    .app-title { 
      font-family: 'Fredoka', sans-serif; 
      font-size: 38px; 
      font-weight: 700; 
      letter-spacing: -0.5px; 
      margin-bottom: 8px;
      
      color: #4c1d95; 
      
      /* 3D Text Shadow (Safed outline + Purple shadow) */
      text-shadow: 
        -1px -1px 0 #fff,  
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff,
         0px  4px 0px #c084fc, 
         0px  6px 10px rgba(0,0,0,0.3);
    }

    .app-subtitle {
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      color: #6b21a8; 
      font-weight: 700;
      margin-bottom: 30px;
      padding: 0 10px;
      line-height: 1.4;
    }

    /* --- OFFICIAL WHITE GOOGLE BUTTON (With Pulse Animation) --- */
    .btn-google {
      width: 100%; 
      padding: 14px 15px;
      background: #ffffff; 
      color: #3c4043; 
      border: 1px solid #dadce0; 
      border-radius: 50px;
      font-size: 16px; 
      font-family: 'Nunito', sans-serif; 
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      
      /* 3D Shadow */
      box-shadow: 0 5px 0 #e2e8f0, 0 10px 15px rgba(0,0,0,0.05);
      transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform: translateY(0);
      
      /* BUTTON HILTA HUVA (Pulse Animation) */
      animation: pulseBtn 2s infinite;
    }

    /* Button Shine Effect */
    .btn-google::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    /* Pulse Animation Keyframes */
    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 5px 0 #e2e8f0, 0 10px 15px rgba(0,0,0,0.05); }
      50% { transform: scale(1.03); box-shadow: 0 5px 0 #e2e8f0, 0 15px 25px rgba(139, 92, 246, 0.2); }
      100% { transform: scale(1); box-shadow: 0 5px 0 #e2e8f0, 0 10px 15px rgba(0,0,0,0.05); }
    }

    /* Jab click kare to dabega aur pulse ruk jayega */
    .btn-google:active { 
      transform: translateY(5px) scale(1); 
      box-shadow: 0 0px 0 #e2e8f0, 0 4px 10px rgba(0,0,0,0.05); 
      animation: none; 
    }
    
    .btn-google:disabled {
      background: #f1f5f9;
      color: #94a3b8;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
      border-color: #e2e8f0;
      animation: none;
    }

    /* Google Icon SVG Size */
    .google-icon-svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* --- READABLE & ELEGANT PRIVACY TEXT --- */
    .privacy-text {
      font-family: 'Nunito', sans-serif;
      font-size: 11.5px;
      color: #3b0764; 
      font-weight: 700;
      margin-top: 25px;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.4); 
      padding: 10px 15px;
      border-radius: 15px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .privacy-text a {
      color: #4c1d95;
      text-decoration: underline;
      font-weight: 800;
    }

    /* --- LOADING OVERLAY --- */
    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
      z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid #e9d5ff;
      border-top: 5px solid #4285F4; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loading-text { font-family: 'Fredoka'; font-size: 22px; color: #4c1d95; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Login Container -->
  <div class="login-container">
    
    <div class="icon-3d">🎓</div>

    <!-- 3D BUBBLE TEXT -->
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">Guide your child's learning journey</p>

    <!-- Official Google Button with Pulse -->
    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
      <svg class="google-icon-svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Readable Privacy Text -->
    <p class="privacy-text">
      By continuing, you agree to our<br>
      <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a>
    </p>
  </div>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">Logging you in...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    const overlay = document.getElementById('loadingOverlay');
    const googleBtn = document.getElementById('googleBtn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        overlay.style.display = 'flex';
        const savedAge = localStorage.getItem('kidsAgeGroup');
        setTimeout(() => {
            window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
        }, 800); 
      }
    });

    window.handleGoogleLogin = async function() {
      if (navigator.vibrate) navigator.vibrate(50);

      const originalHTML = googleBtn.innerHTML;
      googleBtn.innerHTML = "Connecting...";
      googleBtn.disabled = true;
      
      const provider = new GoogleAuthProvider(); 
      provider.setCustomParameters({ prompt: 'select_account' });
      
      try { 
        await signInWithPopup(auth, provider); 
      } 
      catch (error) { 
        googleBtn.innerHTML = originalHTML;
        googleBtn.disabled = false;
        if(error.code !== 'auth/popup-closed-by-user') { alert("Login failed. Please try again."); }
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js'); });
    }
  </script>
</body>
</html>
