
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF6B35">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: 'Nunito', sans-serif;
  position: relative;
  background: linear-gradient(180deg,#159BF4,#42BFFF);
}

/* FIXED CLOUD BACKGROUND */
#cloud-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
  pointer-events: none;
}

/* LOGIN CONTAINER */
.login-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  z-index: 10;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 20px;
}

/* ORIGINAL LIQUID GLASS CARD */
.login-card {
  width: 100%;
  max-width: 450px;
  min-height: 55vh;

  background: rgba(255,255,255,.25);
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);

  border-radius: 40px 40px 0 0;

  border-top: 1px solid rgba(255,255,255,.8);
  border-left: 1px solid rgba(255,255,255,.4);
  border-right: 1px solid rgba(255,255,255,.4);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,1),
    inset 0 -1px 20px rgba(255,255,255,.3),
    0 -15px 40px rgba(0,0,0,.2);

  padding: 40px 25px calc(40px + env(safe-area-inset-bottom)) 25px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;

  animation: bounceUp .9s cubic-bezier(.175,.885,.32,1.275) forwards;
  transform: translateY(100%);
}

@keyframes bounceUp {
  0% { transform: translateY(100%); }
  60% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}

/* PULL BAR */
.login-card::before {
  content: '';
  position: absolute;
  top: 12px;
  width: 50px;
  height: 5px;
  background: rgba(255,255,255,.6);
  border-radius: 10px;
}

/* ICON */
.icon-3d {
  font-size: 60px;
  margin-top: 10px;
  margin-bottom: 10px;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,.2));
}

/* TITLE */
.app-title {
  font-family: 'Fredoka',sans-serif;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -.5px;
  margin-bottom: 8px;
  color: #0f172a;
}

.app-subtitle {
  font-family: 'Nunito',sans-serif;
  font-size: 15px;
  color: #334155;
  font-weight: 700;
  margin-bottom: 30px;
  padding: 0 10px;
  line-height: 1.4;
}

/* GOOGLE BUTTON */
.btn-google {
  width: 100%;
  padding: 18px 15px;

  background: rgba(255,255,255,.9);
  color: #0f172a;

  border: 1px solid rgba(255,255,255,1);
  border-radius: 50px;

  font-size: 17px;
  font-family: 'Fredoka',sans-serif;
  font-weight: 700;

  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  position: relative;
  overflow: hidden;

  box-shadow:
    0 8px 20px rgba(0,0,0,.1),
    inset 0 2px 2px rgba(255,255,255,1);

  transition: all .1s ease;
  margin-bottom: 25px;
  z-index: 100;
}

.btn-google span {
  display: inline-block;
  animation: textBounce 2s infinite ease-in-out;
}

@keyframes textBounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

.btn-google::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(
    to right,
    rgba(255,255,255,0),
    rgba(255,255,255,.8),
    rgba(255,255,255,0)
  );
  transform: skewX(-25deg);
  animation: shine 3s infinite;
}

@keyframes shine {
  0% { left: -100%; }
  20% { left: 200%; }
  100% { left: 200%; }
}

.btn-google:active {
  transform: translateY(3px) scale(1);
  box-shadow: 0 2px 5px rgba(0,0,0,.1);
}

.btn-google:disabled {
  opacity: .7;
  cursor: wait;
}

.google-icon-svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

/* PRIVACY */
.privacy-text {
  font-family: 'Nunito',sans-serif;
  font-size: 12px;
  color: #334155;
  font-weight: 800;
  line-height: 1.5;
  text-align: center;
  padding: 0 10px;
}

.privacy-text a {
  color: #0f172a;
  text-decoration: underline;
}

/* LOADING */
#loadingOverlay {
  display: none;
  position: fixed;
  inset: 0;
  height: 100vh;
  height: 100dvh;
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(10px);
  z-index: 9999;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid #ffedd5;
  border-top: 5px solid #FF5E3A;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

.loading-text {
  font-family: 'Fredoka',sans-serif;
  font-size: 22px;
  color: #9a3412;
  font-weight: 600;
}

/* SMALL SCREEN FIX */
@media (max-height: 700px) {
  .login-card {
    min-height: auto;
    padding-top: 30px;
    padding-bottom: calc(25px + env(safe-area-inset-bottom));
  }

  .icon-3d {
    font-size: 48px;
  }

  .app-title {
    font-size: 30px;
  }

  .app-subtitle {
    margin-bottom: 20px;
  }

  .btn-google {
    margin-bottom: 18px;
  }
}
</style>
</head>

<body>

<canvas id="cloud-canvas"></canvas>

<div class="login-container">
  <div class="login-card">

    <div class="icon-3d">🎓</div>

    <h1 class="app-title">Parents Login</h1>

    <p class="app-subtitle">
      Guide your child's learning journey
    </p>

    <button
      type="button"
      id="googleBtn"
      class="btn-google"
      onclick="handleGoogleLogin()"
    >
      <svg class="google-icon-svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>

      <span>Continue with Google</span>
    </button>

    <p class="privacy-text">
      By continuing, you agree to our<br>
      <a href="#">Privacy Policy</a> and
      <a href="#">Terms of Service</a>
    </p>

  </div>
</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p class="loading-text">Logging you in...</p>
</div>

<!-- BACKGROUND SHADER -->
<script>
(() => {
  const canvas = document.getElementById("cloud-canvas");

  if (!canvas) return;

  const gl = canvas.getContext("webgl", {
    alpha: false,
    antialias: false
  });

  if (!gl) {
    document.body.style.background =
      "linear-gradient(180deg,#159BF4,#42BFFF)";
    return;
  }

  const vertexSource = `
    attribute vec2 a_position;
    varying vec2 v_uv;

    void main() {
      v_uv = a_position * 0.5 + 0.5;
      gl_Position = vec4(a_position,0.0,1.0);
    }
  `;

  const fragmentSource = `
    precision mediump float;

    varying vec2 v_uv;
    uniform vec2 u_resolution;
    uniform float u_time;

    float hash(vec2 p) {
      return fract(
        sin(dot(p,vec2(127.1,311.7))) *
        43758.5453
      );
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);

      f = f*f*(3.0-2.0*f);

      float a = hash(i);
      float b = hash(i+vec2(1.0,0.0));
      float c = hash(i+vec2(0.0,1.0));
      float d = hash(i+vec2(1.0,1.0));

      return mix(
        mix(a,b,f.x),
        mix(c,d,f.x),
        f.y
      );
    }

    float fbm(vec2 p) {
      float value = 0.0;
      float amplitude = 0.5;

      for(int i=0;i<5;i++) {
        value += noise(p)*amplitude;
        p = p*2.02+vec2(17.1,9.2);
        amplitude *= 0.5;
      }

      return value;
    }

    void main() {
      float aspect =
        u_resolution.x/u_resolution.y;

      vec2 p = vec2(
        v_uv.x*aspect,
        v_uv.y
      );

      // Blue sky gradient
      vec3 skyTop = vec3(
        0.055,
        0.53,
        0.94
      );

      vec3 skyBottom = vec3(
        0.28,
        0.76,
        0.98
      );

      vec3 sky = mix(
        skyBottom,
        skyTop,
        v_uv.y
      );

      // Soft cloud movement
      vec2 cloudUV = p*2.8;

      cloudUV.x += u_time*0.025;
      cloudUV.y += sin(u_time*0.04)*0.025;

      float cloudNoise = fbm(cloudUV);

      float cloudShape = smoothstep(
        0.43,
        0.72,
        cloudNoise
      );

      float detail = fbm(
        cloudUV*1.8+vec2(4.1,2.3)
      );

      float density = clamp(
        cloudShape*0.72+
        smoothstep(0.45,0.76,detail)*0.24,
        0.0,
        0.82
      );

      vec3 cloudColor = mix(
        vec3(0.78,0.91,1.0),
        vec3(1.0,1.0,1.0),
        smoothstep(0.4,0.75,cloudNoise)
      );

      vec3 color = mix(
        sky,
        cloudColor,
        density
      );

      // Sun glow
      vec2 sunPosition = vec2(
        aspect*0.78,
        0.86
      );

      float sunDistance =
        length(p-sunPosition);

      float sunGlow = exp(
        -sunDistance*sunDistance*7.0
      );

      color += vec3(
        1.0,
        0.95,
        0.82
      )*sunGlow*0.22;

      gl_FragColor = vec4(color,1.0);
    }
  `;

  function compileShader(type,source) {
    const shader = gl.createShader(type);

    gl.shaderSource(shader,source);
    gl.compileShader(shader);

    if(!gl.getShaderParameter(
      shader,
      gl.COMPILE_STATUS
    )) {
      console.error(
        "Shader compile error:",
        gl.getShaderInfoLog(shader)
      );

      gl.deleteShader(shader);
      return null;
    }

    return shader;
  }

  const vertex = compileShader(
    gl.VERTEX_SHADER,
    vertexSource
  );

  const fragment = compileShader(
    gl.FRAGMENT_SHADER,
    fragmentSource
  );

  if(!vertex || !fragment) return;

  const program = gl.createProgram();

  gl.attachShader(program,vertex);
  gl.attachShader(program,fragment);
  gl.linkProgram(program);

  if(!gl.getProgramParameter(
    program,
    gl.LINK_STATUS
  )) {
    console.error(
      "Shader link error:",
      gl.getProgramInfoLog(program)
    );
    return;
  }

  gl.useProgram(program);

  const buffer = gl.createBuffer();

  gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
  );

  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([
      -1,-1,
       3,-1,
      -1, 3
    ]),
    gl.STATIC_DRAW
  );

  const position = gl.getAttribLocation(
    program,
    "a_position"
  );

  gl.enableVertexAttribArray(position);

  gl.vertexAttribPointer(
    position,
    2,
    gl.FLOAT,
    false,
    0,
    0
  );

  const resolution = gl.getUniformLocation(
    program,
    "u_resolution"
  );

  const time = gl.getUniformLocation(
    program,
    "u_time"
  );

  let animationFrame = 0;
  let startTime = performance.now();

  function resize() {
    const dpr = Math.min(
      window.devicePixelRatio||1,
      1.5
    );

    const width = Math.max(
      1,
      Math.floor(window.innerWidth*dpr)
    );

    const height = Math.max(
      1,
      Math.floor(window.innerHeight*dpr)
    );

    if(
      canvas.width!==width ||
      canvas.height!==height
    ) {
      canvas.width=width;
      canvas.height=height;

      gl.viewport(
        0,
        0,
        width,
        height
      );
    }

    gl.uniform2f(
      resolution,
      canvas.width,
      canvas.height
    );
  }

  function render(now) {
    animationFrame=0;

    if(document.hidden) return;

    resize();

    gl.uniform1f(
      time,
      (now-startTime)/1000
    );

    gl.drawArrays(
      gl.TRIANGLES,
      0,
      3
    );

    animationFrame=requestAnimationFrame(render);
  }

  function start() {
    if(!animationFrame) {
      animationFrame=requestAnimationFrame(render);
    }
  }

  function stop() {
    if(animationFrame) {
      cancelAnimationFrame(animationFrame);
      animationFrame=0;
    }
  }

  window.addEventListener(
    "resize",
    resize,
    {passive:true}
  );

  document.addEventListener(
    "visibilitychange",
    () => {
      if(document.hidden) {
        stop();
      } else {
        start();
      }
    }
  );

  resize();
  start();
})();
</script>
<!-- FIREBASE LOGIN -->
<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const overlay = document.getElementById("loadingOverlay");
const googleBtn = document.getElementById("googleBtn");

let loginInProgress = false;

setPersistence(auth,browserLocalPersistence)
.catch(error=>{
  console.error("Firebase persistence error:",error);
});

onAuthStateChanged(auth,user=>{
  if(user && !loginInProgress) {
    overlay.style.display="flex";

    const savedAge=localStorage.getItem("kidsAgeGroup");

    window.location.replace(
      savedAge ? "index-home.html" : "age-select.html"
    );
  }
},error=>{
  console.error("Auth state error:",error);
});

window.handleGoogleLogin=async function() {
  if(loginInProgress) return;

  loginInProgress=true;
  googleBtn.disabled=true;

  const originalHTML=googleBtn.innerHTML;

  googleBtn.innerHTML="<span>Connecting...</span>";

  if(navigator.vibrate) {
    navigator.vibrate(50);
  }

  const provider=new GoogleAuthProvider();

  provider.setCustomParameters({
    prompt:"select_account"
  });

  try {
    overlay.style.display="flex";

    await signInWithPopup(auth,provider);

  } catch(error) {
    console.error("Google login error:",error);

    overlay.style.display="none";

    googleBtn.innerHTML=originalHTML;
    googleBtn.disabled=false;

    loginInProgress=false;

    if(error.code!=="auth/popup-closed-by-user") {
      alert("Login failed. Please try again.");
    }
  }
};

// Service worker
if("serviceWorker" in navigator) {
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js")
    .catch(error=>{
      console.error("Service worker error:",error);
    });
  });
}
</script>

</body>
