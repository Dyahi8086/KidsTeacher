<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fce8f5">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================
   KIDS TEACHER - LIQUID GLASS LOGIN
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --text: #303044;
    --glass: rgba(255,255,255,0.58);
    --glass-border: rgba(255,255,255,0.85);
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow: hidden;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Nunito', sans-serif;
    color: var(--text);

    /* Background soft colors taaki glass me blur ho kar dikhe */
    background:
        radial-gradient(ellipse at 5% 5%, rgba(190,225,255,0.95), transparent 45%),
        radial-gradient(ellipse at 100% 0%, rgba(255,208,238,0.95), transparent 48%),
        linear-gradient(160deg, #dff2ff 0%, #f9e5f4 48%, #fff0e8 100%);

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
}

/* Main layout */
.login-wrapper {
    width: 100%;
    max-width: 430px;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: pageAppear 0.55s ease-out both;
}

/* Glass card */
.login-card {
    width: 100%;
    padding: 40px 24px 25px;
    border-radius: 32px;
    background: linear-gradient(145deg, rgba(255,255,255,0.78), rgba(255,255,255,0.42));
    border: 1px solid var(--glass-border);
    box-shadow:
        0 25px 65px rgba(109,105,145,0.15),
        0 8px 22px rgba(255,255,255,0.45),
        inset 0 1px 0 rgba(255,255,255,0.95);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    position: relative;
    overflow: hidden;
}

.login-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 115px;
    background: linear-gradient(180deg, rgba(255,255,255,0.52), transparent);
    pointer-events: none;
}

.card-content {
    position: relative;
    z-index: 1;
}

/* Heading */
.login-heading {
    text-align: center;
    margin-bottom: 30px;
    margin-top: 10px;
}

.login-heading h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 32px;
    line-height: 1.2;
    font-weight: 700;
    color: #373047;
    margin-bottom: 10px;
}

.login-heading p {
    font-size: 15px;
    line-height: 1.5;
    font-weight: 700;
    color: #82798e;
}

/* =========================================
   LIQUID GLASS BLACK BUTTON (Like Screenshot)
========================================= */

.liquid-btn-wrapper {
    position: relative;
    width: 100%;
    height: 64px;
    border-radius: 50px;
    padding: 3px; /* Border thickness */
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.liquid-btn-wrapper:active {
    transform: scale(0.96);
}

/* Piche ka ghumta hua glow (Neon colors) */
.liquid-btn-wrapper::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50px;
    background: linear-gradient(90deg, #4285F4, #FFD700, #EA4335, #4285F4);
    background-size: 300% 100%;
    animation: glowMove 4s linear infinite;
    z-index: 0;
    box-shadow: 0 8px 25px rgba(66, 133, 244, 0.3);
}

@keyframes glowMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* Actual Black Button */
.liquid-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border-radius: 47px;
    background: #111111;
    color: #ffffff;
    border: none;
    font-family: 'Fredoka', sans-serif;
    font-size: 19px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.8);
}

/* Button ke andar ki shine */
.liquid-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.15), rgba(255,255,255,0));
    transform: skewX(-25deg);
    animation: shine 5s infinite;
    border-radius: 47px;
}

@keyframes shine {
    0% { left: -100%; }
    25% { left: 200%; }
    100% { left: 200%; }
}

.google-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
}

/* Small divider */
.divider {
    display: flex;
    align-items: center;
    gap: 13px;
    margin: 10px 0 23px;
}

.divider span {
    height: 1px;
    flex: 1;
    background: rgba(130,120,150,0.20);
}

.divider p {
    color: #aaa0b4;
    font-size: 12px;
    font-weight: 800;
}

/* Parent message */
.parent-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.55);
    color: #82788d;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    line-height: 1.5;
}

.parent-note-icon {
    font-size: 17px;
    flex-shrink: 0;
}

/* Privacy */
.privacy-text {
    text-align: center;
    margin-top: 22px;
    font-size: 11px;
    line-height: 1.7;
    color: #91869a;
    font-weight: 700;
}

.privacy-text a {
    color: #655777;
    text-decoration: underline;
    text-underline-offset: 3px;
    font-weight: 900;
}

/* Loading overlay */
#loadingOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(245,235,249,0.72);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.loading-glass {
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 28px;
    background: rgba(255,255,255,0.65);
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 15px 35px rgba(120,110,160,0.14), inset 0 1px 0 rgba(255,255,255,1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.spinner {
    width: 36px;
    height: 36px;
    border: 4px solid rgba(255,107,53,0.15);
    border-top-color: #ff6b35;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

.loading-text {
    margin-top: 17px;
    font-family: 'Fredoka', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: #665b79;
}

/* Error */
#errorMessage {
    display: none;
    margin-top: 15px;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255,230,230,0.70);
    border: 1px solid rgba(255,130,130,0.25);
    color: #b63c48;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.5;
    text-align: center;
}

/* Animations */
@keyframes pageAppear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Small phones */
@media (max-height: 700px) {
    .login-card { padding: 30px 20px 20px; }
    .login-heading h1 { font-size: 28px; }
    .liquid-btn-wrapper { height: 58px; }
    .liquid-btn { font-size: 17px; }
}
</style>
</head>

<body>

<main class="login-wrapper">
    <!-- Login card -->
    <section class="login-card">
        <div class="card-content">
            
            <!-- Heading -->
            <div class="login-heading">
                <h1>Parents Login</h1>
                <p>Guide your child's learning journey</p>
            </div>

            <!-- LIQUID GLASS BLACK BUTTON -->
            <div class="liquid-btn-wrapper">
                <button type="button" id="googleBtn" class="liquid-btn" aria-label="Continue with Google">
                    <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    <span id="btnText">Continue with Google</span>
                </button>
            </div>

            <!-- Divider -->
            <div class="divider" aria-hidden="true">
                <span></span>
                <p>SAFE &amp; SIMPLE</p>
                <span></span>
            </div>

            <!-- Parent note -->
            <div class="parent-note">
                <span class="parent-note-icon" aria-hidden="true">🔒</span>
                <span>Secure login for parents.<br>Your child's learning journey starts here.</span>
            </div>

            <!-- Error -->
            <div id="errorMessage" role="alert"></div>

            <!-- Privacy -->
            <p class="privacy-text">
                By continuing, you agree to our<br>
                <a href="./privacy-policy.html">Privacy Policy</a> and <a href="./terms.html">Terms of Service</a>
            </p>

        </div>
    </section>
</main>

<!-- Loading -->
<div id="loadingOverlay">
    <div class="loading-glass">
        <div class="spinner"></div>
    </div>
    <p class="loading-text">Connecting to Kids Teacher...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
    authDomain: "kids-teacher-4387e.firebaseapp.com",
    projectId: "kids-teacher-4387e",
    storageBucket: "kids-teacher-4387e.firebasestorage.app",
    messagingSenderId: "420221167346",
    appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const googleBtn = document.getElementById("googleBtn");
const btnText = document.getElementById("btnText");
const loadingOverlay = document.getElementById("loadingOverlay");
const errorMessage = document.getElementById("errorMessage");

let isRedirecting = false;
let isLoginInProgress = false;

function showLoading() {
    loadingOverlay.style.display = "flex";
    googleBtn.disabled = true;
}

function hideLoading() {
    loadingOverlay.style.display = "none";
    googleBtn.disabled = false;
}

function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
}

function hideError() {
    errorMessage.textContent = "";
    errorMessage.style.display = "none";
}

function goToNextPage(user) {
    if (!user || isRedirecting) return;
    isRedirecting = true;
    showLoading();
    window.location.replace("./age-select.html");
}

googleBtn.addEventListener("click", async function () {
    if (isLoginInProgress) return;
    isLoginInProgress = true;
    hideError();
    btnText.textContent = "Connecting...";
    showLoading();

    try {
        await setPersistence(auth, browserLocalPersistence);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        await signInWithRedirect(auth, provider);
    } catch (error) {
        console.error("Google Login Error:", error);
        hideLoading();
        isLoginInProgress = false;
        btnText.textContent = "Continue with Google";
        showError("Login failed. Please try again.");
    }
});

try {
    const result = await getRedirectResult(auth);
    if (result && result.user) {
        goToNextPage(result.user);
    }
} catch (error) {
    console.error("Redirect Login Error:", error);
    hideLoading();
    showError("Google login could not be completed. Please try again.");
}

onAuthStateChanged(auth, function (user) {
    if (user) {
        goToNextPage(user);
    } else {
        if (!isLoginInProgress) {
            hideLoading();
            btnText.textContent = "Continue with Google";
        }
    }
});

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").catch(function (error) {
            console.error("Service Worker Error:", error);
        });
    });
}
</script>

</body>
</html>
