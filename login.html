
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF6B35">

<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;

    font-family: 'Nunito', sans-serif;

    background:
        radial-gradient(
            ellipse at 12% 12%,
            rgba(255, 202, 120, .95) 0%,
            transparent 42%
        ),
        radial-gradient(
            ellipse at 90% 82%,
            rgba(210, 48, 20, .72) 0%,
            transparent 48%
        ),
        linear-gradient(
            135deg,
            #FF9A45 0%,
            #FF6B35 48%,
            #D9381E 100%
        );

    overflow: hidden;
    position: fixed;
    inset: 0;
    width: 100%;
}

/* Background Shapes */

body::before,
body::after {
    content: '';

    position: absolute;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.10);

    z-index: 0;

    pointer-events: none;
}

body::before {
    width: 300px;
    height: 300px;

    top: -100px;
    left: -100px;
}

body::after {
    width: 200px;
    height: 200px;

    bottom: -50px;
    right: -50px;
}

/* Login Container */

.login-container {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: flex-end;
    align-items: center;

    overflow-y: auto;
    -webkit-overflow-scrolling: touch;

    padding-top: 20px;

    z-index: 10;
}

/* Liquid Glass Login Card */

.login-card {
    width: 100%;
    max-width: 450px;

    min-height: 48vh;

    flex-shrink: 0;

    background: rgba(255, 255, 255, 0.20);

    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);

    border-radius: 38px 38px 0 0;

    border: 1px solid rgba(255, 255, 255, 0.48);
    border-bottom: none;

    padding: 34px 25px
        calc(30px + env(safe-area-inset-bottom))
        25px;

    box-shadow:
        0 -15px 45px rgba(90, 30, 10, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        inset 0 0 25px rgba(255, 255, 255, 0.10);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    overflow: hidden;

    transform: translateY(100%);

    animation:
        slideUp 0.85s cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
}

/* Glass Reflection */

.login-card::before {
    content: '';

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 48%;

    background: linear-gradient(
        180deg,
        rgba(255,255,255,.34),
        rgba(255,255,255,.08),
        transparent
    );

    pointer-events: none;
    z-index: 1;
}

/* Glass Handle */

.login-card::after {
    content: '';

    position: absolute;

    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    width: 48px;
    height: 5px;

    border-radius: 10px;

    background: rgba(255,255,255,.72);

    box-shadow:
        0 1px 5px rgba(0,0,0,.08);

    z-index: 3;
}

/* Card Content */

.login-card > * {
    position: relative;
    z-index: 2;
}

/* Slide Up Animation */

@keyframes slideUp {
    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}

/* 3D Icon */

.icon-3d {
    font-size: 50px;

    margin-top: 10px;
    margin-bottom: 5px;

    filter: drop-shadow(
        0 8px 12px rgba(255, 107, 53, 0.3)
    );
}

/* App Title */

.app-title {
    font-family: 'Fredoka', sans-serif;

    font-size: 32px;
    font-weight: 700;

    letter-spacing: -0.5px;

    margin-bottom: 5px;

    color: #9a3412;
}

/* Subtitle */

.app-subtitle {
    font-family: 'Nunito', sans-serif;

    font-size: 14px;

    color: #64748b;

    font-weight: 700;

    margin-bottom: 25px;

    padding: 0 10px;

    line-height: 1.4;
}

/* Google Login Button */

.btn-google {
    width: 100%;

    padding: 16px 15px;

    background: rgba(255, 255, 255, 0.82);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    color: #0f172a;

    border: 1px solid rgba(255,255,255,.95);

    border-radius: 50px;

    font-size: 16px;

    font-family: 'Fredoka', sans-serif;

    font-weight: 700;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    position: relative;

    box-shadow:
        0 5px 0 rgba(190, 190, 190, .7),
        0 12px 24px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,1);

    transition:
        transform .18s ease,
        box-shadow .18s ease;

    margin-bottom: 20px;

    animation: pulseBtn 2.4s infinite;
}

/* Button Animation */

@keyframes pulseBtn {
    0%, 100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-2px) scale(1.015);
    }
}

/* Button Press */

.btn-google:active {
    transform: translateY(4px);

    box-shadow:
        0 1px 0 rgba(190,190,190,.7);

    animation: none;
}

/* Disabled Button */

.btn-google:disabled {
    background: rgba(241,245,249,.8);

    color: #94a3b8;

    box-shadow: none;

    transform: none;

    cursor: not-allowed;

    border-color: rgba(226,232,240,.8);

    animation: none;
}

/* Google Icon */

.google-icon-svg {
    width: 20px;
    height: 20px;

    flex-shrink: 0;
}

/* Privacy Text */

.privacy-text {
    font-family: 'Nunito', sans-serif;

    font-size: 11px;

    color: #64748b;

    font-weight: 800;

    line-height: 1.5;

    text-align: center;

    padding: 0 10px;
}

.privacy-text a {
    color: #9a3412;
    text-decoration: underline;
}

/* Small Screens */

@media (max-height: 700px) {
    .login-card {
        min-height: 44vh;

        padding-top: 28px;

        padding-bottom:
            calc(20px + env(safe-area-inset-bottom));
    }

    .icon-3d {
        font-size: 42px;
    }

    .app-title {
        font-size: 28px;
    }

    .app-subtitle {
        margin-bottom: 18px;
    }

    .btn-google {
        margin-bottom: 16px;
    }
}

/* Loading Overlay */

#loadingOverlay {
    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    background: rgba(255, 255, 255, 0.9);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    z-index: 9999;

    flex-direction: column;

    justify-content: center;
    align-items: center;
}

/* Spinner */

.spinner {
    width: 50px;
    height: 50px;

    border: 5px solid #ffedd5;

    border-top: 5px solid #FF5E3A;

    border-radius: 50%;

    animation: spin 1s linear infinite;

    margin-bottom: 20px;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}

.loading-text {
    font-family: 'Fredoka', sans-serif;

    font-size: 22px;

    color: #9a3412;

    font-weight: 600;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="icon-3d">🎓</div>

        <h1 class="app-title">Parents Login</h1>

        <p class="app-subtitle">
            Guide your child's learning journey
        </p>

        <button
            type="button"
            id="googleBtn"
            class="btn-google"
            onclick="handleGoogleLogin()"
        >

            <svg class="google-icon-svg" viewBox="0 0 48 48">

                <path fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

                <path fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

                <path fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

                <path fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

            </svg>

            Continue with Google

        </button>

        <p class="privacy-text">
            By continuing, you agree to our<br>
            <a href="#">Privacy Policy</a>
            and
            <a href="#">Terms of Service</a>
        </p>

    </div>

</div>

<div id="loadingOverlay">

    <div class="spinner"></div>

    <p class="loading-text">
        Logging you in...
    </p>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
    authDomain: "kids-teacher-4387e.firebaseapp.com",
    projectId: "kids-teacher-4387e",
    storageBucket: "kids-teacher-4387e.firebasestorage.app",
    messagingSenderId: "420221167346",
    appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

setPersistence(auth, browserLocalPersistence)
    .catch(console.error);


const overlay = document.getElementById('loadingOverlay');

const googleBtn = document.getElementById('googleBtn');


/* Existing Login Flow */

onAuthStateChanged(auth, (user) => {

    if (user) {

        overlay.style.display = 'flex';

        const savedAge = localStorage.getItem('kidsAgeGroup');

        setTimeout(() => {

            window.location.replace(
                !savedAge
                    ? "age-select.html"
                    : "index-home.html"
            );

        }, 800);

    }

});


/* Google Login */

window.handleGoogleLogin = async function() {

    if (navigator.vibrate) {
        navigator.vibrate(50);
    }

    const originalHTML = googleBtn.innerHTML;

    googleBtn.innerHTML = "Connecting...";

    googleBtn.disabled = true;


    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
        prompt: 'select_account'
    });


    try {

        await signInWithPopup(auth, provider);

    }

    catch (error) {

        googleBtn.innerHTML = originalHTML;

        googleBtn.disabled = false;

        if (
            error.code !== 'auth/popup-closed-by-user'
        ) {

            alert("Login failed. Please try again.");

        }

    }

};


/* Service Worker */

if ('serviceWorker' in navigator) {

    window.addEventListener('load', () => {

        navigator.serviceWorker.register('./service-worker.js');

    });

}

</script>

</body>
</html>
