
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF6B35">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(
    180deg,
    #ff713f 0%,
    #ff6539 58%,
    #f95132 100%
  );
  overflow: hidden;
  position: relative;
}

/* Orange background circle */

body::before {
  content: '';
  position: absolute;
  width: 75vw;
  height: 75vw;
  max-width: 650px;
  max-height: 650px;
  top: -27%;
  left: -30%;
  border-radius: 50%;
  background: rgba(255, 190, 133, .24);
  z-index: 0;
}

body::after {
  content: none;
}

/* Main container */

.login-container {
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  z-index: 10;
}

/* Login bottom sheet */

.login-card {
  width: 100%;
  max-width: 450px;

  height: 55%;
  height: 55dvh;

  min-height: 390px;
  max-height: 650px;

  background: #ffe8e2;

  backdrop-filter: none;
  -webkit-backdrop-filter: none;

  border-radius: 42px 42px 0 0;
  border-top: 1px solid rgba(255,255,255,.9);

  padding: 20px 24px
    calc(28px + env(safe-area-inset-bottom));

  box-shadow: 0 -8px 30px rgba(130,49,30,.08);

  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;

  position: relative;

  animation: slideUp .8s
    cubic-bezier(.175,.885,.32,1.275) forwards;

  transform: translateY(100%);
}

@keyframes slideUp {
  to {
    transform: translateY(0);
  }
}

/* Sheet handle */

.login-card::before {
  content: '';
  position: absolute;
  top: 20px;
  width: 80px;
  height: 8px;
  background: #cbd3df;
  border-radius: 20px;
}

/* Graduation cap */

.icon-3d {
  font-size: 66px;
  line-height: 1;
  margin-top: 58px;
  margin-bottom: 20px;
  filter: drop-shadow(
    0 8px 12px rgba(255,107,53,.3)
  );
  flex-shrink: 0;
}

/* Title */

.app-title {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(27px, 5vw, 43px);
  font-weight: 700;
  letter-spacing: -.5px;
  margin-bottom: 12px;
  color: #963a1c;
  line-height: 1.2;
}

/* Subtitle */

.app-subtitle {
  font-family: 'Nunito', sans-serif;
  font-size: clamp(15px, 3.5vw, 21px);
  color: #68758b;
  font-weight: 700;
  margin-bottom: 38px;
  padding: 0 10px;
  line-height: 1.4;
}

/* Google button */

.btn-google {
  width: 100%;
  padding: 22px 15px;
  min-height: 86px;

  background: #fff;
  color: #151c2d;

  border: 2px solid #e5eaf1;
  border-radius: 60px;

  font-size: clamp(16px, 3.8vw, 24px);
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;

  position: relative;

  box-shadow:
    0 8px 0 #d8dfe8,
    0 16px 28px rgba(85,50,35,.12);

  transition:
    transform .2s ease,
    box-shadow .2s ease;

  transform: translateY(-5px);

  margin-bottom: 20px;

  animation: pulseBtn 2s infinite;

  flex-shrink: 0;
}

@keyframes pulseBtn {
  0% {
    transform: scale(1) translateY(-5px);
    box-shadow:
      0 8px 0 #d8dfe8,
      0 16px 28px rgba(85,50,35,.12);
  }

  50% {
    transform: scale(1.02) translateY(-5px);
    box-shadow:
      0 8px 0 #d8dfe8,
      0 20px 30px rgba(85,50,35,.15);
  }

  100% {
    transform: scale(1) translateY(-5px);
    box-shadow:
      0 8px 0 #d8dfe8,
      0 16px 28px rgba(85,50,35,.12);
  }
}

.btn-google:active {
  transform: translateY(1px) scale(1);
  box-shadow:
    0 0 0 #d8dfe8,
    0 5px 10px rgba(85,50,35,.1);
  animation: none;
}

.btn-google:disabled {
  background: #f1f5f9;
  color: #94a3b8;
  box-shadow: none;
  transform: none;
  cursor: not-allowed;
  border-color: #e2e8f0;
  animation: none;
}

/* Google icon */

.google-icon-svg {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
}

/* Privacy */

.privacy-text {
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  color: #68758b;
  font-weight: 800;
  line-height: 1.8;
  text-align: center;
  padding: 0 10px;
  margin-top: auto;
}

.privacy-text a {
  color: #8f3c24;
  text-decoration: underline;
}

/* Loading overlay */

#loadingOverlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;

  background: rgba(255,255,255,.9);
  backdrop-filter: blur(10px);

  z-index: 9999;

  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.spinner {
  width: 50px;
  height: 50px;

  border: 5px solid #ffedd5;
  border-top: 5px solid #FF5E3A;

  border-radius: 50%;

  animation: spin 1s linear infinite;

  margin-bottom: 20px;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.loading-text {
  font-family: 'Fredoka';
  font-size: 22px;
  color: #9a3412;
  font-weight: 600;
}

/* Small screens */

@media (max-height: 700px) {
  .login-card {
    height: 57%;
    height: 57dvh;
    min-height: 350px;
    padding-top: 15px;
  }

  .login-card::before {
    top: 15px;
  }

  .icon-3d {
    font-size: 52px;
    margin-top: 42px;
    margin-bottom: 12px;
  }

  .app-subtitle {
    margin-bottom: 25px;
  }

  .btn-google {
    min-height: 68px;
    padding: 16px 15px;
  }

  .privacy-text {
    font-size: 12px;
  }
}

@media (max-width: 360px) {
  .login-card {
    padding-left: 18px;
    padding-right: 18px;
    border-radius: 32px 32px 0 0;
  }

  .app-title {
    font-size: 27px;
  }

  .app-subtitle {
    font-size: 15px;
  }

  .btn-google {
    min-height: 68px;
    font-size: 16px;
    gap: 10px;
  }

  .google-icon-svg {
    width: 28px;
    height: 28px;
  }
}
</style>
</head>
<body>

<div class="login-container">

  <div class="login-card">

    <div class="icon-3d">🎓</div>

    <h1 class="app-title">Parents Login</h1>

    <p class="app-subtitle">
      Guide your child's learning journey
    </p>

    <button
      type="button"
      id="googleBtn"
      class="btn-google"
      onclick="handleGoogleLogin()">

      <svg
        class="google-icon-svg"
        viewBox="0 0 48 48">

        <path
          fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

        <path
          fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

        <path
          fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

        <path
          fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

      </svg>

      Continue with Google

    </button>

    <p class="privacy-text">
      By continuing, you agree to our<br>
      <a href="#">Privacy Policy</a> and
      <a href="#">Terms of Service</a>
    </p>

  </div>
</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p class="loading-text">Logging you in...</p>
</div>
<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

setPersistence(auth, browserLocalPersistence)
  .catch(console.error);

const overlay = document.getElementById('loadingOverlay');
const googleBtn = document.getElementById('googleBtn');

onAuthStateChanged(auth, (user) => {
  if (user) {
    overlay.style.display = 'flex';

    const savedAge = localStorage.getItem('kidsAgeGroup');

    setTimeout(() => {
      window.location.replace(
        !savedAge
          ? "age-select.html"
          : "index-home.html"
      );
    }, 800);
  }
});

window.handleGoogleLogin = async function() {
  if (navigator.vibrate) {
    navigator.vibrate(50);
  }

  const originalHTML = googleBtn.innerHTML;

  googleBtn.innerHTML = "Connecting...";
  googleBtn.disabled = true;

  const provider = new GoogleAuthProvider();

  provider.setCustomParameters({
    prompt: 'select_account'
  });

  try {
    await signInWithPopup(auth, provider);
  }
  catch (error) {
    googleBtn.innerHTML = originalHTML;
    googleBtn.disabled = false;

    if (error.code !== 'auth/popup-closed-by-user') {
      alert("Login failed. Please try again.");
    }
  }
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>

</body>
</html>
