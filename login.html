<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fdfbfb">
  <title>Parents Login - Kids Teacher</title>
  
  <!-- PWA Manifest & Favicon (Paths set for GitHub Pages) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* --- ADVANCED CSS SETUP --- */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      height: 100vh; height: 100dvh; 
      display: flex; flex-direction: column; 
      font-family: 'Nunito', sans-serif; 
      overflow: hidden;
      /* Premium warm cream, light blue, and pink gradient background */
      background: linear-gradient(135deg, #fdfbfb 0%, #fef6f8 40%, #e0f2fe 100%);
      position: relative;
    }

    /* --- FLOATING DECORATIVE STARS --- */
    .floating-star {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
      animation: floatStar 6s infinite ease-in-out;
      z-index: 0;
    }
    .star-1 { width: 20px; height: 20px; top: 10%; left: 10%; animation-delay: 0s; }
    .star-2 { width: 30px; height: 30px; top: 20%; right: 15%; animation-delay: 2s; }
    .star-3 { width: 15px; height: 15px; bottom: 30%; left: 5%; animation-delay: 1s; }
    .star-4 { width: 25px; height: 25px; bottom: 15%; right: 10%; animation-delay: 3s; }

    @keyframes floatStar {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
    }

    /* --- MAIN CONTENT WRAPPER --- */
    .main-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px 20px 30px 20px;
      overflow-y: auto; /* Allows scroll on very small screens */
    }

    /* --- TOP IMAGE CARD (Premium Rounded) --- */
    .image-card {
      width: 100%;
      height: 55%; /* Takes top 55% of available space */
      border-radius: 35px;
      background-image: url('login_bg.png'); /* Existing Image */
      background-size: cover;
      background-position: center top;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* --- LOGIN FORM SECTION --- */
    .login-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 10px;
    }

    .app-title { 
      font-family: 'Fredoka', sans-serif; 
      font-size: clamp(28px, 7vw, 34px); 
      color: #1e293b; 
      font-weight: 700; 
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .app-subtitle { 
      font-size: clamp(14px, 4vw, 16px); 
      color: #64748b; 
      font-weight: 700; 
      margin-bottom: 30px; 
    }

    /* --- PREMIUM 3D GOOGLE BUTTON --- */
    .btn-google {
      width: 100%; 
      max-width: 350px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      color: #334155;
      border: 1px solid #e2e8f0;
      border-radius: 50px;
      font-size: 17px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      /* Premium 3D Shadow */
      box-shadow: 0 6px 0 #cbd5e1, 0 10px 20px rgba(0,0,0,0.08);
      transition: all 0.1s ease;
      position: relative;
      overflow: hidden;
    }
    
    /* Button Press Animation */
    .btn-google:active { 
      transform: translateY(6px); 
      box-shadow: 0 0px 0 #cbd5e1, 0 4px 10px rgba(0,0,0,0.05); 
    }
    
    .btn-google:disabled {
      background: #f1f5f9;
      color: #94a3b8;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }

    /* --- SPINNER INSIDE BUTTON --- */
    .btn-spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #4285F4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* --- FULL SCREEN LOADING OVERLAY --- */
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      display: none; /* Hidden by default */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    .overlay-spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #f1f5f9;
      border-top: 6px solid #4285F4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .loading-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 22px;
      color: #1e293b;
      font-weight: 600;
      animation: pulseText 1.5s infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* --- RESPONSIVE FIXES --- */
    @media (max-height: 700px) {
      .image-card { height: 45%; margin-bottom: 15px; }
      .app-title { font-size: 26px; }
      .app-subtitle { margin-bottom: 20px; }
      .btn-google { padding: 15px; }
    }
  </style>
</head>
<body>

  <!-- Background Floating Stars -->
  <div class="floating-star star-1"></div>
  <div class="floating-star star-2"></div>
  <div class="floating-star star-3"></div>
  <div class="floating-star star-4"></div>

  <!-- Main Content -->
  <div class="main-wrapper">
    
    <!-- Top Image Card -->
    <div class="image-card"></div>

    <!-- Login Section -->
    <div class="login-section">
      <h1 class="app-title">Parents Login</h1>
      <p class="app-subtitle">Continue with Google to guide your child's journey</p>

      <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
        <svg id="googleIcon" width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <div class="btn-spinner" id="btnSpinner"></div>
        <span id="btnText">Continue with Google</span>
      </button>
    </div>
  </div>

  <!-- Full Screen Loading Overlay -->
  <div id="loadingOverlay">
    <div class="overlay-spinner"></div>
    <div class="loading-text">Logging you in...</div>
  </div>

  <!-- Firebase Authentication Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Your Existing Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    const overlay = document.getElementById('loadingOverlay');
    const googleBtn = document.getElementById('googleBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const googleIcon = document.getElementById('googleIcon');

    // Auto-check if user is already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User is logged in, show overlay and redirect
        overlay.style.display = 'flex';
        const savedAge = localStorage.getItem('kidsAgeGroup');
        setTimeout(() => {
            window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
        }, 500); 
      }
    });

    window.handleGoogleLogin = async function() {
      // Change button state to loading
      googleBtn.disabled = true;
      googleIcon.style.display = 'none';
      btnText.textContent = "Connecting...";
      btnSpinner.style.display = 'block';
      
      const provider = new GoogleAuthProvider(); 
      provider.setCustomParameters({ prompt: 'select_account' });
      
      try { 
        await signInWithPopup(auth, provider); 
        // The onAuthStateChanged listener will handle the redirect and overlay
      } 
      catch (error) { 
        // Revert button state on error
        googleBtn.disabled = false;
        googleIcon.style.display = 'block';
        btnText.textContent = "Continue with Google";
        btnSpinner.style.display = 'none';
        
        // Ignore error if user just closed the popup
        if(error.code !== 'auth/popup-closed-by-user') { 
          alert("Login failed. Please check your internet and try again."); 
        }
      }
    }

    // Register Service Worker for PWA (Optional but good for installability)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { 
        navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW Error:', err)); 
      });
    }
  </script>
</body>
</html>
