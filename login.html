<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff0f5">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
        font-family: 'Nunito', sans-serif;
        background: #fff0f5; /* Soft pink background */
        display: flex; align-items: center; justify-content: center;
        position: relative;
    }

    /* Sakura Tree Canvas Background */
    #sakura-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0; /* Peeche rahega */
        opacity: 0.6; /* Halka sa fade taaki text clear dikhe */
    }

    /* Login Card (Glass Effect) */
    .login-card {
        position: relative; z-index: 10;
        width: 92%; max-width: 420px;
        background: rgba(255, 255, 255, 0.65); /* Thoda aur transparent kiya taaki tree dikhe */
        backdrop-filter: blur(25px) saturate(200%);
        -webkit-backdrop-filter: blur(25px) saturate(200%);
        border-radius: 40px;
        padding: 45px 30px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 25px 50px rgba(200, 150, 180, 0.2), inset 0 1px 2px rgba(255, 255, 255, 1);
        text-align: center;
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .icon-3d { font-size: 60px; margin-bottom: 15px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .app-title { font-family: 'Fredoka', sans-serif; font-size: 36px; font-weight: 700; color: #4a3b4a; margin-bottom: 8px; }
    .app-subtitle { font-family: 'Nunito', sans-serif; font-size: 16px; color: #7a6b7a; font-weight: 800; margin-bottom: 35px; }

    /* Liquid Glass Button */
    .glass-btn-container {
        position: relative; width: 100%; height: 68px; border-radius: 50px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 25px; cursor: pointer; transition: transform 0.2s;
        z-index: 5;
    }
    .glass-btn-container:active { transform: scale(0.95); }

    .glass-btn-container::before {
        content: ''; position: absolute;
        top: -3px; left: -3px; right: -3px; bottom: -3px;
        border-radius: 53px;
        background: linear-gradient(90deg, #ff9a9e, #fecfef, #a18cd1, #ff9a9e);
        background-size: 300% 100%;
        animation: borderGlow 4s linear infinite;
        z-index: 0; 
        box-shadow: 0 0 20px rgba(255, 154, 158, 0.4);
    }
    
    .glass-btn-container::after {
        content: ''; position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #1a1a1a; border-radius: 50px; z-index: 1;
    }

    @keyframes borderGlow {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    .glass-btn-content {
        position: relative; z-index: 2;
        display: flex; align-items: center; justify-content: center; gap: 12px;
        width: 100%; height: 100%;
    }

    .glass-btn-text { color: #ffffff; font-size: 21px; font-family: 'Fredoka', sans-serif; font-weight: 600; }
    .google-icon-svg { width: 26px; height: 26px; flex-shrink: 0; }

    .privacy-text { font-size: 13px; color: #7a6b7a; font-weight: 800; line-height: 1.6; margin-top: 25px; }
    .privacy-text a { color: #4a3b4a; text-decoration: none; font-weight: 900; border-bottom: 2px solid #4a3b4a; padding-bottom: 2px; }
    
    /* Loading Overlay */
    #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(255, 240, 245, 0.8); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
    .spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.5); border-top: 4px solid #FF5E3A; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Background Sakura Tree -->
<canvas id="sakura-canvas"></canvas>

<!-- Login Card -->
<div class="login-card">
    <div class="icon-3d">🎓</div>
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">Guide your child's learning journey</p>

    <div class="glass-btn-container" onclick="handleGoogleLogin()">
        <div class="glass-btn-content">
            <svg class="google-icon-svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span class="glass-btn-text" id="btnText">Continue with Google</span>
        </div>
    </div>

    <p class="privacy-text">By continuing, you agree to our<br><a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a></p>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="spinner"></div>
</div>

<!-- SAKURA ANIMATION SCRIPT -->
<script>
    const canvas = document.getElementById('sakura-canvas');
    const ctx = canvas.getContext('2d');
    let w, h;
    let petals = [];

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        initPetals();
    }
    window.addEventListener('resize', resize);

    // Petal Particle Class
    class Petal {
        constructor() {
            this.reset();
            this.y = Math.random() * h; // Start anywhere
        }
        reset() {
            this.x = Math.random() * w;
            this.y = -20;
            this.size = Math.random() * 8 + 4;
            this.speedY = Math.random() * 1.5 + 1;
            this.speedX = Math.random() * 1 - 0.5;
            this.opacity = Math.random() * 0.5 + 0.5;
            this.angle = Math.random() * Math.PI * 2;
            this.spin = Math.random() * 0.05 - 0.025;
        }
        update() {
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(this.y / 50) * 0.5; // Swaying effect
            this.angle += this.spin;
            if (this.y > h + 20) this.reset();
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.beginPath();
            // Petal shape (oval)
            ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 183, 197, ${this.opacity})`; // Soft pink
            ctx.fill();
            ctx.restore();
        }
    }

    function initPetals() {
        petals = [];
        let count = window.innerWidth < 600 ? 30 : 60; // Mobile par kam petals
        for (let i = 0; i < count; i++) {
            petals.push(new Petal());
        }
    }

    // Background Tree Drawing
    function drawTree(x, y, len, angle, width, depth) {
        if (depth === 0) return;

        ctx.beginPath();
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -len);
        
        ctx.strokeStyle = `rgba(180, 140, 150, ${depth / 12})`; // Light brown/pinkish trunk
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.stroke();

        drawTree(0, -len, len * 0.75, 0.4, width * 0.7, depth - 1);
        drawTree(0, -len, len * 0.75, -0.4, width * 0.7, depth - 1);
        
        ctx.restore();
    }

    function animate() {
        ctx.clearRect(0, 0, w, h);
        
        // Draw tree from bottom center
        drawTree(w / 2, h + 20, 120, 0, 15, 7);

        // Draw and update petals
        petals.forEach(petal => {
            petal.update();
            petal.draw();
        });

        requestAnimationFrame(animate);
    }

    resize();
    animate();
</script>

<!-- FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const overlay = document.getElementById("loadingOverlay");
const btnText = document.getElementById("btnText");

setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));

function handleLoginSuccess() {
    window.location.replace("age-select.html");
}

getRedirectResult(auth).then(result => {
  if (result && result.user) {
    overlay.style.display = "flex";
    setTimeout(handleLoginSuccess, 500);
  }
}).catch(err => console.error(err));

onAuthStateChanged(auth, user => {
  if (user) {
    overlay.style.display = "flex";
    setTimeout(handleLoginSuccess, 500);
  }
});

window.handleGoogleLogin = async function(){
  btnText.innerText = "Connecting...";
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  try {
    await signInWithRedirect(auth, provider);
  } catch (error) {
    overlay.style.display = "none";
    btnText.innerText = "Continue with Google";
    alert("Login failed: " + error.message);
  }
};
</script>
</body>
</html>
