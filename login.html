<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Theme color set kiya taaki upar ki orange patti na dikhe -->
  <meta name="theme-color" content="#e0f2fe">
  <title>Parents Login - Kids Teacher</title>
  <link rel="manifest" href="manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4338ca;
      --bg-gradient: linear-gradient(180deg, #e0f2fe 0%, #ede9fe 50%, #ffffff 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100dvh; 
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end; 
      background: var(--bg-gradient);
      font-family: 'Nunito', sans-serif; 
      overflow: hidden; /* Body scroll lock */
      position: relative;
    }

    /* Floating Shapes */
    .bg-shape { position: absolute; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px); border-radius: 50%; z-index: 0; }
    .shape-1 { width: 180px; height: 180px; top: -40px; left: -50px; background: radial-gradient(circle at 30% 30%, #ffffff, #bfdbfe); animation: float 7s ease-in-out infinite; }
    .shape-2 { width: 140px; height: 140px; top: 15%; right: -30px; background: radial-gradient(circle at 30% 30%, #ffffff, #e9d5ff); animation: float 9s ease-in-out infinite reverse; }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-25px) rotate(15deg); } }

    /* Floating Book */
    .logo-container {
      position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
      width: 160px; z-index: 5; animation: floatBook 3s ease-in-out infinite; 
    }
    .logo-container img { width: 100%; height: auto; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); }
    @keyframes floatBook { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -15px); } }

    /* --- MAIN CARD (Scrollable Fix) --- */
    .login-card {
      width: 100%; max-width: 450px; margin: 0 auto;
      background: var(--card-bg); border-radius: 35px 35px 0 0;
      padding: 25px 25px 30px 25px;
      box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.05);
      position: relative; z-index: 10;
      animation: slideUpSlow 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transform: translateY(100%);
      
      /* YEH FIX HAI: Agar content zyada ho toh card scroll ho jayega */
      max-height: 80vh; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch;
    }

    @keyframes slideUpSlow { to { transform: translateY(0); } }

    /* Tabs */
    .tabs { display: flex; background: #f1f5f9; border-radius: 16px; padding: 5px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; font-family: 'Fredoka'; font-size: 16px; font-weight: 600; color: #94a3b8; cursor: pointer; border-radius: 12px; transition: 0.3s; }
    .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

    .brand-header { text-align: center; margin-bottom: 20px; }
    .app-title { font-family: 'Fredoka'; font-size: 26px; color: var(--text-main); font-weight: 700; }
    .app-subtitle { font-size: 13px; color: var(--text-muted); font-weight: 700; margin-top: 5px; }

    /* Alerts */
    .alert-box { display: none; padding: 12px; margin-bottom: 15px; border-radius: 12px; font-size: 13px; font-weight: 800; text-align: center; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #4ade80; }

    /* Inputs */
    .input-group { position: relative; margin-bottom: 15px; text-align: left; }
    .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #94a3b8; z-index: 2; }
    .form-input { width: 100%; padding: 22px 45px 8px 48px; background: #f8fafc; border: 2px solid var(--border-color); border-radius: 16px; font-size: 15px; color: var(--text-main); font-family: 'Nunito'; font-weight: 800; outline: none; transition: 0.2s; }
    .form-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
    
    .floating-label { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); font-size: 15px; color: #94a3b8; font-weight: 700; pointer-events: none; transition: 0.2s; }
    .form-input:focus ~ .floating-label, .form-input:not(:placeholder-shown) ~ .floating-label { top: 12px; font-size: 11px; color: var(--primary); }

    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
    .hidden { display: none !important; }

    .forgot-link { display: block; text-align: right; font-size: 13px; color: var(--text-muted); font-weight: 800; background: none; border: none; cursor: pointer; margin-bottom: 20px; width: 100%; }
    
    /* Buttons */
    .btn-main { width: 100%; padding: 16px; background: linear-gradient(135deg, #818cf8, #6366f1); color: #ffffff; border: none; border-radius: 16px; font-size: 18px; font-family: 'Fredoka'; font-weight: 700; cursor: pointer; box-shadow: 0 6px 0 #4338ca, 0 10px 15px rgba(99, 102, 241, 0.3); transition: 0.1s; margin-bottom: 20px; position: relative; overflow: hidden; }
    .btn-main:active { transform: translateY(6px); box-shadow: 0 0 0 #4338ca; }
    .btn-main:disabled { background: #cbd5e1; box-shadow: 0 6px 0 #94a3b8; color: #fff; cursor: not-allowed; }

    .divider { display: flex; align-items: center; text-align: center; margin: 15px 0; color: #cbd5e1; font-size: 12px; font-weight: 800; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 2px solid #e2e8f0; }
    .divider::before { margin-right: 12px; } .divider::after { margin-left: 12px; }

    .btn-google { width: 100%; padding: 14px; background: #ffffff; color: #334155; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 0 #e2e8f0; transition: 0.1s; margin-bottom: 20px; }
    .btn-google:active { transform: translateY(4px); box-shadow: 0 0 0 #e2e8f0; }
  </style>
</head>
<body>

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="logo-container">
    <img src="book_logo.png" alt="Magical Book">
  </div>

  <div class="login-card">
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Log In</button>
      <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="brand-header">
      <h1 class="app-title" id="formTitle">Parents Login</h1>
      <p class="app-subtitle" id="formSubtitle">Log in to guide your child's journey</p>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <form id="authForm" onsubmit="handleFormSubmit(event)">
      
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" class="form-input" placeholder=" " required>
        <label class="floating-label">Email Address</label>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" class="form-input" placeholder=" " required>
        <label class="floating-label">Password</label>
        
        <button type="button" class="toggle-password" id="eyeBtn" onclick="togglePasswordVisibility()">
          <svg id="eyeOpen" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg id="eyeClosed" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>

      <button type="button" id="forgotBtn" class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</button>

      <button type="submit" id="submitBtn" class="btn-main">Log In</button>
    </form>

    <div class="divider">OR</div>

    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>
  </div>

  <!-- Aapka purana Firebase script yahan aayega (isme koi change nahi karna) -->
  <script type="module">
    /* Firebase script same as before */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, 
      onAuthStateChanged, setPersistence, browserLocalPersistence 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b",
      measurementId: "G-VJVS2ZMNLY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    let currentMode = 'login';
    const MAX_ATTEMPTS = 4;
    const LOCKOUT_TIME = 60 * 1000;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const savedAge = localStorage.getItem('kidsAgeGroup');
        window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
      }
    });

    window.switchTab = function(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      const formTitle = document.getElementById('formTitle');
      const formSubtitle = document.getElementById('formSubtitle');
      const submitBtn = document.getElementById('submitBtn');
      const forgotBtn = document.getElementById('forgotBtn');
      
      hideAlert();

      if (mode === 'login') {
        tabLogin.classList.add('active'); tabSignup.classList.remove('active');
        formTitle.textContent = "Parents Login"; formSubtitle.textContent = "Log in to guide your child's journey";
        submitBtn.textContent = "Log In"; forgotBtn.classList.remove('hidden');
      } else {
        tabLogin.classList.remove('active'); tabSignup.classList.add('active');
        formTitle.textContent = "Create Account"; formSubtitle.textContent = "Join us to start the magical journey";
        submitBtn.textContent = "Sign Up"; forgotBtn.classList.add('hidden'); 
      }
    }

    window.togglePasswordVisibility = function() {
      const passwordInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text'; eyeOpen.classList.add('hidden'); eyeClosed.classList.remove('hidden');
      } else {
        passwordInput.type = 'password'; eyeOpen.classList.remove('hidden'); eyeClosed.classList.add('hidden');
      }
    }

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message; alertBox.className = `alert-box alert-${type}`; alertBox.style.display = 'block';
    }
    function hideAlert() { document.getElementById('alertBox').style.display = 'none'; }

    function setLoading(isLoading, text = '') {
      const submitBtn = document.getElementById('submitBtn'); const googleBtn = document.getElementById('googleBtn');
      submitBtn.disabled = isLoading; googleBtn.disabled = isLoading;
      if(isLoading) submitBtn.textContent = text;
      else submitBtn.textContent = currentMode === 'login' ? "Log In" : "Sign Up";
    }

    function getFriendlyErrorMessage(errorCode) {
      switch (errorCode) {
        case 'auth/invalid-email': return "Please enter a valid email address.";
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return "Incorrect email or password.";
        case 'auth/email-already-in-use': return "Email already registered. Please Log In.";
        case 'auth/weak-password': return "Password must be at least 6 characters.";
        case 'auth/too-many-requests': return "Too many attempts. Try again later.";
        default: return "An error occurred. Please try again.";
      }
    }

    function checkRateLimit() {
      const attempts = parseInt(localStorage.getItem('loginAttempts') || '0');
      const lockoutUntil = parseInt(localStorage.getItem('lockoutUntil') || '0');
      const now = Date.now();

      if (now < lockoutUntil) {
        const secondsLeft = Math.ceil((lockoutUntil - now) / 1000);
        showAlert(`Too many failed attempts. Please wait ${secondsLeft} seconds.`); return false; 
      }
      if (now > lockoutUntil && attempts >= MAX_ATTEMPTS) {
        localStorage.setItem('loginAttempts', '0'); localStorage.removeItem('lockoutUntil');
      }
      return true; 
    }

    function handleFailedAttempt() {
      let attempts = parseInt(localStorage.getItem('loginAttempts') || '0');
      attempts++; localStorage.setItem('loginAttempts', attempts.toString());
      if (attempts >= MAX_ATTEMPTS) {
        localStorage.setItem('lockoutUntil', (Date.now() + LOCKOUT_TIME).toString());
        showAlert("Account locked for 1 minute due to multiple failed attempts.");
      }
    }

    window.handleFormSubmit = async function(event) {
      event.preventDefault(); hideAlert();
      if (!checkRateLimit()) return;
      const email = document.getElementById('email').value.trim(); const password = document.getElementById('password').value;
      if (!email || !password) { showAlert("Please fill in all fields."); return; }
      
      setLoading(true, currentMode === 'login' ? "Signing in..." : "Creating...");
      try {
        if (currentMode === 'login') { await signInWithEmailAndPassword(auth, email, password); localStorage.setItem('loginAttempts', '0'); } 
        else { await createUserWithEmailAndPassword(auth, email, password); }
      } catch (error) {
        setLoading(false); showAlert(getFriendlyErrorMessage(error.code));
        if(currentMode === 'login' && (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential')) { handleFailedAttempt(); }
      }
    }

    window.handleGoogleLogin = async function() {
      hideAlert(); setLoading(true, "Connecting...");
      const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
      try { await signInWithPopup(auth, provider); } 
      catch (error) {
        setLoading(false);
        if(error.code === 'auth/popup-blocked') { showAlert("Popup blocked! Please allow popups in settings.", "error"); } 
        else if (error.code !== 'auth/popup-closed-by-user') { showAlert(getFriendlyErrorMessage(error.code)); }
      }
    }

    window.handleForgotPassword = async function() {
      hideAlert(); const email = document.getElementById('email').value.trim();
      if (!email) { showAlert("Please type your email above first."); return; }
      setLoading(true, "Sending...");
      try { await sendPasswordResetEmail(auth, email); setLoading(false); showAlert("Password reset link sent to your email!", "success"); } 
      catch (error) { setLoading(false); showAlert(getFriendlyErrorMessage(error.code)); }
    }
  </script>
</body>
</html>
