<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B35">
  <title>Parents Login - Kids Teacher</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      height: 100vh; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column; 
      font-family: 'Nunito', sans-serif; 
      
      /* ORANGE BACKGROUND GRADIENT */
      background: linear-gradient(135deg, #FF8C42 0%, #FF5E3A 50%, #D9381E 100%);
      overflow: hidden;
      position: relative;
    }

    /* Background Shapes (Taaki glass effect acha dikhe) */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      z-index: 0;
    }
    body::before { width: 300px; height: 300px; top: -100px; left: -100px; }
    body::after { width: 250px; height: 250px; bottom: -50px; right: -50px; }

    /* --- MAIN CONTAINER --- */
    .login-container {
      width: 100%; 
      flex: 1; 
      display: flex;
      flex-direction: column;
      justify-content: flex-end; 
      align-items: center;
      z-index: 10;
    }

    /* --- GLASSMORPHISM CARD --- */
    .login-card {
      width: 100%;
      max-width: 450px;
      
      /* GLASS EFFECT: Transparent White + Blur */
      background: rgba(255, 255, 255, 0.25); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      
      border-radius: 40px 40px 0 0;
      
      /* White border for glass edge */
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      
      /* Shadow for depth */
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15);
      
      padding: 30px 25px calc(30px + env(safe-area-inset-bottom)) 25px;
      
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      
      /* SLOW SLIDE UP ANIMATION */
      animation: slideUpSlow 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transform: translateY(100%);
    }

    @keyframes slideUpSlow {
      to { transform: translateY(0); }
    }

    /* Pull bar */
    .login-card::before {
      content: '';
      position: absolute;
      top: 12px;
      width: 50px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
    }

    /* 3D Icon */
    .icon-3d {
      font-size: 50px;
      margin-top: 10px;
      margin-bottom: 5px;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
    }

    /* --- TEXT STYLING (White for Glass) --- */
    .app-title { 
      font-family: 'Fredoka', sans-serif; 
      font-size: 32px; 
      font-weight: 700; 
      letter-spacing: -0.5px; 
      margin-bottom: 5px;
      
      /* White text to pop on glass */
      color: #ffffff; 
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .app-subtitle {
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9); 
      font-weight: 700;
      margin-bottom: 25px;
      padding: 0 10px;
      line-height: 1.4;
    }

    /* --- GLASS GOOGLE BUTTON --- */
    .btn-google {
      width: 100%; 
      padding: 18px 15px;
      
      /* White button to stand out on glass */
      background: #ffffff; 
      color: #0f172a; 
      border: none;
      border-radius: 50px;
      font-size: 16px; 
      font-family: 'Fredoka', sans-serif; 
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      
      /* Soft shadow for white button */
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      
      transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform: translateY(0); 
      
      animation: pulseBtn 2s infinite;
      margin-bottom: 20px;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
      50% { transform: scale(1.02); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
      100% { transform: scale(1); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    }

    .btn-google:active { 
      transform: translateY(2px) scale(1); 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      animation: none; 
    }
    
    .btn-google:disabled {
      background: rgba(255, 255, 255, 0.5);
      color: #64748b;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
      animation: none;
    }

    .google-icon-svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* --- PRIVACY TEXT (White for Glass) --- */
    .privacy-text {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9); 
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
      padding: 0 10px;
    }

    .privacy-text a {
      color: #ffffff;
      text-decoration: underline;
    }

    /* --- LOADING OVERLAY --- */
    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
      z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid #ffedd5;
      border-top: 5px solid #FF5E3A; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loading-text { font-family: 'Fredoka'; font-size: 22px; color: #9a3412; font-weight: 600; }
  </style>
</head>
<body>

  <div class="login-container">
    
    <div class="login-card">
      
      <div class="icon-3d">🎓</div>

      <h1 class="app-title">Parents Login</h1>
      <p class="app-subtitle">Guide your child's learning journey</p>

      <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
        <svg class="google-icon-svg" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <p class="privacy-text">
        By continuing, you agree to our<br>
        <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a>
      </p>
      
    </div>
  </div>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">Logging you in...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    const overlay = document.getElementById('loadingOverlay');
    const googleBtn = document.getElementById('googleBtn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        overlay.style.display = 'flex';
        const savedAge = localStorage.getItem('kidsAgeGroup');
        setTimeout(() => {
            window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
        }, 800); 
      }
    });

    window.handleGoogleLogin = async function() {
      if (navigator.vibrate) navigator.vibrate(50);

      const originalHTML = googleBtn.innerHTML;
      googleBtn.innerHTML = "Connecting...";
      googleBtn.disabled = true;
      
      const provider = new GoogleAuthProvider(); 
      provider.setCustomParameters({ prompt: 'select_account' });
      
      try { 
        await signInWithPopup(auth, provider); 
      } 
      catch (error) { 
        googleBtn.innerHTML = originalHTML;
        googleBtn.disabled = false;
        if(error.code !== 'auth/popup-closed-by-user') { alert("Login failed. Please try again."); }
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js'); });
    }
  </script>
</body>
</html>
