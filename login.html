<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#facc15">
  <title>Parents Login - Kids Teacher</title>
  
  <!-- PWA Links -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      height: 100vh; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column; 
      font-family: 'Nunito', sans-serif; 
      
      /* BACKGROUND IMAGE FIX */
      background-image: url('login_bg.png'); 
      /* Image ko stretch kiya taaki har screen par fit ho jaye */
      background-size: 100% 100%; 
      background-position: center;
      background-repeat: no-repeat;
      background-color: #facc15; 
      overflow: hidden;
    }

    /* --- MAIN CONTAINER --- */
    .login-container {
      width: 100%; 
      flex: 1; 
      display: flex;
      flex-direction: column;
      /* Content ko screen ke center se thoda niche rakhega */
      justify-content: flex-end; 
      align-items: center;
      text-align: center;
      
      /* Fix spacing taaki text aur button sabhi devices par ek jaisa dikhe */
      padding-bottom: calc(30px + env(safe-area-inset-bottom)); 
    }

    .text-content {
      margin-bottom: 25px;
      z-index: 10;
    }

    /* --- PREMIUM FONT (Parents Login) --- */
    .app-title { 
      font-family: 'Fredoka', sans-serif; 
      font-size: 34px; 
      font-weight: 600; 
      letter-spacing: 0.5px; 
      margin-bottom: 8px;
      
      /* Deep Chocolate Brown Color */
      color: #4a2c11; 
      
      text-shadow: 0px 2px 4px rgba(255, 255, 255, 0.5), 0px 4px 8px rgba(0,0,0,0.1);
    }

    .app-subtitle {
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      color: #574132; 
      font-weight: 700;
      padding: 0 20px;
      line-height: 1.4;
    }

    /* --- POP-OUT GOOGLE BUTTON --- */
    .btn-google {
      width: 85%; 
      max-width: 320px;
      padding: 16px 15px;
      background: #ffffff; 
      color: #0f172a; 
      border: 2px solid #e2e8f0; 
      border-radius: 50px;
      font-size: 16px; 
      font-family: 'Fredoka', sans-serif; 
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      
      box-shadow: 0 6px 0 #cbd5e1, 0 15px 25px rgba(0,0,0,0.15);
      transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform: translateY(-5px); 
      
      animation: pulseBtn 2s infinite;
      margin-bottom: 25px;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1) translateY(-5px); box-shadow: 0 6px 0 #cbd5e1, 0 15px 25px rgba(0,0,0,0.15); }
      50% { transform: scale(1.02) translateY(-5px); box-shadow: 0 6px 0 #cbd5e1, 0 20px 30px rgba(0,0,0,0.2); }
      100% { transform: scale(1) translateY(-5px); box-shadow: 0 6px 0 #cbd5e1, 0 15px 25px rgba(0,0,0,0.15); }
    }

    .btn-google:active { 
      transform: translateY(1px) scale(1); 
      box-shadow: 0 0px 0 #cbd5e1, 0 5px 10px rgba(0,0,0,0.1); 
      animation: none; 
    }
    
    .btn-google:disabled {
      background: #f1f5f9;
      color: #94a3b8;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
      border-color: #e2e8f0;
      animation: none;
    }

    .google-icon-svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* --- PRIVACY TEXT --- */
    .privacy-text {
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      color: #4a2c11; 
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
      padding: 0 10px;
    }

    .privacy-text a {
      color: #4a2c11;
      text-decoration: underline;
    }

    /* --- LOADING OVERLAY --- */
    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
      z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid #e9d5ff;
      border-top: 5px solid #4a2c11; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loading-text { font-family: 'Fredoka'; font-size: 22px; color: #4a2c11; font-weight: 600; }
  </style>
</head>
<body>

  <div class="login-container">
    
    <div class="text-content">
      <h1 class="app-title">Parents Login</h1>
      <p class="app-subtitle">Guide your child's learning journey</p>
    </div>

    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
      <svg class="google-icon-svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <p class="privacy-text">
      By continuing, you agree to our<br>
      <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a>
    </p>
  </div>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">Logging you in...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    const overlay = document.getElementById('loadingOverlay');
    const googleBtn = document.getElementById('googleBtn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        overlay.style.display = 'flex';
        const savedAge = localStorage.getItem('kidsAgeGroup');
        setTimeout(() => {
            window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
        }, 800); 
      }
    });

    window.handleGoogleLogin = async function() {
      if (navigator.vibrate) navigator.vibrate(50);

      const originalHTML = googleBtn.innerHTML;
      googleBtn.innerHTML = "Connecting...";
      googleBtn.disabled = true;
      
      const provider = new GoogleAuthProvider(); 
      provider.setCustomParameters({ prompt: 'select_account' });
      
      try { 
        await signInWithPopup(auth, provider); 
      } 
      catch (error) { 
        googleBtn.innerHTML = originalHTML;
        googleBtn.disabled = false;
        if(error.code !== 'auth/popup-closed-by-user') { alert("Login failed. Please try again."); }
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js'); });
    }
  </script>
</body>
</html>
