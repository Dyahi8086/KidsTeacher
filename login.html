<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Parents Login - Kids Teacher</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      height: 100vh; height: 100dvh; 
      display: flex; flex-direction: column; 
      font-family: 'Nunito', sans-serif; 
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, #fdf2f8 40%, #e0f2fe 100%);
    }

    .top-image-section {
      width: 100%; height: 55vh; 
      background-image: url('login_bg.png'); 
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }

    .login-card {
      width: 90%; max-width: 400px;
      margin: -30px auto 0 auto; 
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      z-index: 10;
    }

    .brand-header { text-align: center; margin-bottom: 25px; }
    .app-title { font-family: 'Fredoka'; font-size: 30px; color: #1e293b; font-weight: 700; }
    .app-subtitle { font-size: 14px; color: #64748b; font-weight: 700; margin-top: 6px; }

    .btn-google {
      width: 100%; max-width: 350px; padding: 16px;
      background: #ffffff; color: #334155;
      border: 2px solid #e2e8f0; border-radius: 50px;
      font-size: 18px; font-family: 'Fredoka'; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
      box-shadow: 0 6px 0 #cbd5e1, 0 10px 15px rgba(0,0,0,0.05);
      transition: all 0.1s ease;
    }
    
    .btn-google:active { transform: translateY(6px); box-shadow: 0 0px 0 #cbd5e1; }
    
    /* Loading Overlay */
    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #ffffff; z-index: 9999;
      flex-direction: column; justify-content: center; align-items: center;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid #e2e8f0;
      border-top: 5px solid #4285F4; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="top-image-section"></div>

  <div class="login-card">
    <div class="brand-header">
      <h1 class="app-title">Parents Login</h1>
      <p class="app-subtitle">Continue with Google</p>
    </div>

    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
      <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>
  </div>

  <!-- Loading Screen -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p style="font-family: 'Fredoka'; font-size: 20px; color: #1e293b; font-weight: 600;">Logging you in...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    const overlay = document.getElementById('loadingOverlay');

    // --- AUTO REDIRECT LOGIC ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Agar user logged in hai, toh loader dikhao aur Home bhej do
        overlay.style.display = 'flex';
        const savedAge = localStorage.getItem('kidsAgeGroup');
        
        setTimeout(() => {
            window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
        }, 800); // 0.8 second ka delay taaki loader dikh jaye
      }
    });

    window.handleGoogleLogin = async function() {
      const btn = document.getElementById('googleBtn');
      btn.innerHTML = "Connecting...";
      btn.disabled = true;
      
      const provider = new GoogleAuthProvider(); 
      provider.setCustomParameters({ prompt: 'select_account' });
      
      try { await signInWithPopup(auth, provider); } 
      catch (error) { 
        btn.innerHTML = "Continue with Google";
        btn.disabled = false;
        if(error.code !== 'auth/popup-closed-by-user') { alert("Login failed. Please try again."); }
      }
    }
  </script>
</body>
</html>
