
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#38BDF8">

<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  font-family: 'Nunito', sans-serif;

  position: relative;

  background: linear-gradient(
    180deg,
    #38BDF8 0%,
    #7DD3FC 55%,
    #BAE6FD 100%
  );
}

/* BACKGROUND */

#cloud-canvas {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0;

  pointer-events: none;
}

/* LOGIN CONTAINER */

.login-container {
  position: relative;

  width: 100%;
  height: 100%;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  justify-content: flex-end;
  align-items: center;

  z-index: 10;

  overflow-y: auto;

  overscroll-behavior: contain;

  -webkit-overflow-scrolling: touch;

  padding-bottom: env(safe-area-inset-bottom);
}

/* LOGIN CARD */

.login-card {
  width: 100%;
  max-width: 450px;

  min-height: 55vh;

  background: rgba(255, 255, 255, 0.28);

  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);

  border-radius: 40px 40px 0 0;

  border-top: 1px solid rgba(255,255,255,0.8);

  border-left: 1px solid rgba(255,255,255,0.4);

  border-right: 1px solid rgba(255,255,255,0.4);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.8),
    inset 0 -1px 20px rgba(255,255,255,0.2),
    0 -10px 35px rgba(0,0,0,0.12);

  padding: 40px 25px calc(40px + env(safe-area-inset-bottom));

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  position: relative;

  animation: bounceUp 0.9s cubic-bezier(
    0.175,
    0.885,
    0.32,
    1.275
  ) forwards;

  transform: translateY(100%);
}

@keyframes bounceUp {
  0% {
    transform: translateY(100%);
  }

  60% {
    transform: translateY(-15px);
  }

  100% {
    transform: translateY(0);
  }
}

/* PULL BAR */

.login-card::before {
  content: '';

  position: absolute;

  top: 12px;

  width: 50px;
  height: 5px;

  background: rgba(255,255,255,0.65);

  border-radius: 10px;
}

/* ICON */

.icon-3d {
  font-size: 60px;

  margin-top: 10px;
  margin-bottom: 10px;

  filter: drop-shadow(
    0 8px 12px rgba(0,0,0,0.2)
  );
}

/* TITLE */

.app-title {
  font-family: 'Fredoka', sans-serif;

  font-size: 34px;

  font-weight: 700;

  letter-spacing: -0.5px;

  margin-bottom: 8px;

  color: #0f172a;
}

/* SUBTITLE */

.app-subtitle {
  font-family: 'Nunito', sans-serif;

  font-size: 15px;

  color: #334155;

  font-weight: 700;

  margin-bottom: 30px;

  padding: 0 10px;

  line-height: 1.4;
}

/* GOOGLE BUTTON */

.btn-google {
  width: 100%;

  padding: 18px 15px;

  background: rgba(255,255,255,0.92);

  color: #0f172a;

  border: 1px solid rgba(255,255,255,1);

  border-radius: 50px;

  font-size: 17px;

  font-family: 'Fredoka', sans-serif;

  font-weight: 700;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 10px;

  position: relative;

  overflow: hidden;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.1),
    inset 0 2px 2px rgba(255,255,255,1);

  transition: all 0.15s ease;

  margin-bottom: 25px;

  z-index: 100;
}

/* BUTTON TEXT */

.btn-google span {
  display: inline-block;

  animation: textBounce 2s infinite ease-in-out;
}

@keyframes textBounce {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-3px);
  }
}

/* BUTTON SHINE */

.btn-google::after {
  content: '';

  position: absolute;

  top: 0;
  left: -100%;

  width: 50%;
  height: 100%;

  background: linear-gradient(
    to right,
    rgba(255,255,255,0),
    rgba(255,255,255,0.8),
    rgba(255,255,255,0)
  );

  transform: skewX(-25deg);

  animation: shine 3s infinite;

  pointer-events: none;
}

@keyframes shine {
  0% {
    left: -100%;
  }

  20% {
    left: 200%;
  }

  100% {
    left: 200%;
  }
}

.btn-google:active {
  transform: translateY(3px);
}

.btn-google:disabled {
  opacity: 0.7;
  cursor: wait;
}

.google-icon-svg {
  width: 22px;
  height: 22px;

  flex-shrink: 0;
}

/* PRIVACY */

.privacy-text {
  font-family: 'Nunito', sans-serif;

  font-size: 12px;

  color: #334155;

  font-weight: 800;

  line-height: 1.5;

  text-align: center;

  padding: 0 10px;
}

.privacy-text a {
  color: #0f172a;

  text-decoration: underline;
}

/* LOADING */

#loadingOverlay {
  display: none;

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  background: rgba(255,255,255,0.9);

  backdrop-filter: blur(10px);

  z-index: 9999;

  flex-direction: column;

  justify-content: center;
  align-items: center;
}

.spinner {
  width: 50px;
  height: 50px;

  border: 5px solid #ffedd5;

  border-top: 5px solid #FF5E3A;

  border-radius: 50%;

  animation: spin 1s linear infinite;

  margin-bottom: 20px;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.loading-text {
  font-family: 'Fredoka', sans-serif;

  font-size: 22px;

  color: #9a3412;

  font-weight: 600;
}

/* SMALL MOBILE */

@media (max-height: 650px) {
  .login-card {
    min-height: auto;

    padding-top: 30px;

    padding-bottom: calc(
      25px + env(safe-area-inset-bottom)
    );
  }

  .icon-3d {
    font-size: 48px;

    margin-top: 5px;
    margin-bottom: 5px;
  }

  .app-title {
    font-size: 29px;
  }

  .app-subtitle {
    margin-bottom: 20px;
  }

  .btn-google {
    padding: 15px;

    margin-bottom: 20px;
  }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;

    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<!-- BACKGROUND CANVAS -->

<canvas id="cloud-canvas"></canvas>

<!-- LOGIN -->

<div class="login-container">

  <div class="login-card">

    <div class="icon-3d">🎓</div>

    <h1 class="app-title">
      Parents Login
    </h1>

    <p class="app-subtitle">
      Guide your child's learning journey
    </p>

    <button
      type="button"
      id="googleBtn"
      class="btn-google"
      onclick="handleGoogleLogin()"
    >

      <svg
        class="google-icon-svg"
        viewBox="0 0 48 48"
        aria-hidden="true"
      >

        <path
          fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
        />

        <path
          fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
        />

        <path
          fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
        />

        <path
          fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
        />

      </svg>

      <span>Continue with Google</span>

    </button>

    <p class="privacy-text">
      By continuing, you agree to our<br>

      <a href="#">Privacy Policy</a>
      and
      <a href="#">Terms of Service</a>
    </p>

  </div>

</div>

<!-- LOADING OVERLAY -->

<div id="loadingOverlay">

  <div class="spinner"></div>

  <p class="loading-text">
    Logging you in...
  </p>

</div>

<!-- KIDS CARTOON SKY BACKGROUND -->

<script>
(() => {
  const canvas = document.getElementById("cloud-canvas");

  if (!canvas) return;

  const gl = canvas.getContext("webgl", {
    alpha: false,
    antialias: false
  });

  if (!gl) {
    canvas.style.display = "none";
    return;
  }

  const vertex = `
    attribute vec2 position;
    varying vec2 uv;

    void main() {
      uv = position * 0.5 + 0.5;
      gl_Position = vec4(position, 0.0, 1.0);
    }
  `;

  const fragment = `
    precision mediump float;

    varying vec2 uv;

    uniform vec2 resolution;
    uniform float time;

    float hash(vec2 p) {
      return fract(
        sin(dot(p, vec2(127.1, 311.7)))
        * 43758.5
      );
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);

      f = f*f*(3.0-2.0*f);

      return mix(
        mix(
          hash(i),
          hash(i+vec2(1.0,0.0)),
          f.x
        ),
        mix(
          hash(i+vec2(0.0,1.0)),
          hash(i+vec2(1.0,1.0)),
          f.x
        ),
        f.y
      );
    }

    float fbm(vec2 p) {
      float value = 0.0;
      float amp = 0.5;

      for(int i=0;i<4;i++) {
        value += noise(p)*amp;
        p = p*2.0+13.1;
        amp *= 0.5;
      }

      return value;
    }

    void main() {
      vec2 p = uv;

      float aspect = resolution.x/resolution.y;

      // BLUE SKY
      vec3 sky = mix(
        vec3(0.45,0.82,1.0),
        vec3(0.05,0.55,0.96),
        uv.y
      );

      // CLOUD TEXTURE
      vec2 cloudP = vec2(
        p.x*aspect*2.0 + time*0.025,
        p.y*3.0
      );

      float n = fbm(cloudP*2.0);

      float cloudShape =
        smoothstep(0.48,0.72,n) *
        smoothstep(0.20,0.42,p.y);

      vec3 cloudColor = vec3(
        1.0,
        0.98,
        0.94
      );

      sky = mix(
        sky,
        cloudColor,
        cloudShape*0.8
      );

      // SUN
      float sun = length(
        p-vec2(0.78,0.88)
      );

      sky += vec3(1.0,0.9,0.6) *
        exp(-sun*sun*8.0)*0.15;

      gl_FragColor = vec4(sky,1.0);
    }
  `;

  function createShader(type, source) {
    const s = gl.createShader(type);

    gl.shaderSource(s, source);
    gl.compileShader(s);

    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      throw new Error("Shader compile error");
    }

    return s;
  }

  try {
    const program = gl.createProgram();

    gl.attachShader(
      program,
      createShader(gl.VERTEX_SHADER, vertex)
    );

    gl.attachShader(
      program,
      createShader(gl.FRAGMENT_SHADER, fragment)
    );

    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }

    gl.useProgram(program);

    const buffer = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

    gl.bufferData(
      gl.ARRAY_BUFFER,
      new Float32Array([
        -1,-1,
         3,-1,
        -1, 3
      ]),
      gl.STATIC_DRAW
    );

    const position = gl.getAttribLocation(
      program,
      "position"
    );

    gl.enableVertexAttribArray(position);

    gl.vertexAttribPointer(
      position,
      2,
      gl.FLOAT,
      false,
      0,
      0
    );

    const resolution = gl.getUniformLocation(
      program,
      "resolution"
    );

    const time = gl.getUniformLocation(
      program,
      "time"
    );

    function resize() {
      const dpr = Math.min(
        window.devicePixelRatio || 1,
        1.5
      );

      const width = Math.max(
        1,
        Math.floor(canvas.clientWidth*dpr)
      );

      const height = Math.max(
        1,
        Math.floor(canvas.clientHeight*dpr)
      );

      canvas.width = width;
      canvas.height = height;

      gl.viewport(
        0,
        0,
        width,
        height
      );

      gl.uniform2f(
        resolution,
        width,
        height
      );
    }

    window.addEventListener("resize",resize);

    resize();

    let frame = 0;

    const start = performance.now();

    function draw(now) {
      if (document.hidden) {
        return;
      }

      gl.uniform1f(
        time,
        (now-start)/1000
      );

      gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
      );

      frame = requestAnimationFrame(draw);
    }

    frame = requestAnimationFrame(draw);

    document.addEventListener(
      "visibilitychange",
      () => {
        cancelAnimationFrame(frame);

        if (!document.hidden) {
          frame = requestAnimationFrame(draw);
        }
      }
    );

  } catch(error) {
    console.error("Background error:",error);

    canvas.style.display = "none";
  }
})();
</script>

<!-- FIREBASE LOGIN -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const overlay = document.getElementById(
  "loadingOverlay"
);

const googleBtn = document.getElementById(
  "googleBtn"
);

/* PERSISTENCE */

setPersistence(
  auth,
  browserLocalPersistence
).catch(error => {
  console.error("Persistence error:",error);
});

/* CHECK LOGIN */

onAuthStateChanged(
  auth,

  user => {
    if (!user) {
      overlay.style.display = "none";
      return;
    }

    overlay.style.display = "flex";

    const savedAge = localStorage.getItem(
      "kidsAgeGroup"
    );

    setTimeout(() => {
      const destination = !savedAge
        ? "age-select.html"
        : "index-home.html";

      window.location.replace(destination);
    },800);
  },

  error => {
    console.error("Auth state error:",error);

    overlay.style.display = "none";
  }
);

/* GOOGLE LOGIN */

window.handleGoogleLogin = async function() {

  if (googleBtn.disabled) return;

  if (navigator.vibrate) {
    navigator.vibrate(50);
  }

  const originalHTML = googleBtn.innerHTML;

  googleBtn.disabled = true;

  googleBtn.innerHTML = "<span>Connecting...</span>";

  const provider = new GoogleAuthProvider();

  provider.setCustomParameters({
    prompt: "select_account"
  });

  try {
    overlay.style.display = "flex";

    await signInWithPopup(
      auth,
      provider
    );

  } catch(error) {

    console.error("Google login error:",error);

    overlay.style.display = "none";

    googleBtn.innerHTML = originalHTML;

    googleBtn.disabled = false;

    if (
      error.code !==
      "auth/popup-closed-by-user"
    ) {
      alert(
        "Login failed. Please try again."
      );
    }
  }
};

/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

  window.addEventListener("load",() => {

    navigator.serviceWorker.register(
      "./service-worker.js"
    ).catch(error => {
      console.error(
        "Service worker error:",
        error
      );
    });

  });

}

</script>
