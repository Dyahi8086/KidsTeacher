
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#38BDF8">
<title>Parents Login - Kids Teacher</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  width:100%;
  height:100%;
  overflow:hidden;
}

body {
  height:100dvh;
  position:relative;
  font-family:'Nunito',sans-serif;
  background:#38BDF8;
}

/* FIXED FULL-SCREEN BACKGROUND */
#cloud-canvas {
  position:fixed;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

/* LOGIN CONTAINER */
.login-container {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;
  z-index:10;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;

  overflow-y:auto;
  overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom);
}

/* GLASS CARD */
.login-card {
  position:relative;
  flex-shrink:0;

  width:100%;
  max-width:450px;
  min-height:55vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  background:
    linear-gradient(
      160deg,
      rgba(255,255,255,.32),
      rgba(255,255,255,.18)
    );

  backdrop-filter:blur(26px) saturate(145%);
  -webkit-backdrop-filter:blur(26px) saturate(145%);

  border:1px solid rgba(255,255,255,.55);
  border-bottom:0;
  border-radius:40px 40px 0 0;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.7),
    0 -12px 35px rgba(0,0,0,.08);

  padding:40px 25px calc(35px + env(safe-area-inset-bottom));

  animation:cardUp .75s cubic-bezier(.175,.885,.32,1.15);
}

@keyframes cardUp {
  from { transform:translateY(100%); }
  to { transform:translateY(0); }
}

/* HANDLE */
.login-card::before {
  content:"";
  position:absolute;
  top:12px;
  width:50px;
  height:5px;
  border-radius:10px;
  background:rgba(255,255,255,.8);
}

/* ICON */
.icon-3d {
  font-size:60px;
  margin:10px 0;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));
}

/* TITLE */
.app-title {
  font-family:'Fredoka',sans-serif;
  font-size:34px;
  font-weight:700;
  letter-spacing:-.5px;
  margin-bottom:8px;
  color:#0F172A;
}

.app-subtitle {
  font-size:15px;
  color:#334155;
  font-weight:800;
  line-height:1.4;
  padding:0 10px;
  margin-bottom:30px;
}

/* GOOGLE BUTTON */
.btn-google {
  position:relative;
  overflow:hidden;

  width:100%;
  padding:18px 15px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  border:1px solid #fff;
  border-radius:50px;

  background:rgba(255,255,255,.96);
  color:#0F172A;

  font-family:'Fredoka',sans-serif;
  font-size:17px;
  font-weight:700;

  cursor:pointer;
  margin-bottom:25px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.1),
    inset 0 2px 2px #fff;

  transition:transform .15s;
}

.btn-google span {
  display:inline-block;
  animation:textBounce 2s infinite ease-in-out;
}

@keyframes textBounce {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-3px); }
}

.btn-google::after {
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:50%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.8),
    transparent
  );
  transform:skewX(-25deg);
  animation:shine 3s infinite;
  pointer-events:none;
}

@keyframes shine {
  0% { left:-100%; }
  20%,100% { left:200%; }
}

.btn-google:active {
  transform:translateY(3px);
}

.btn-google:disabled {
  opacity:.7;
  cursor:wait;
}

.google-icon-svg {
  width:22px;
  height:22px;
  flex-shrink:0;
}

/* PRIVACY */
.privacy-text {
  font-size:12px;
  color:#334155;
  font-weight:800;
  line-height:1.5;
  text-align:center;
  padding:0 10px;
}

.privacy-text a {
  color:#0F172A;
  text-decoration:underline;
}

/* LOADING */
#loadingOverlay {
  display:none;
  position:fixed;
  inset:0;
  height:100dvh;
  z-index:9999;

  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);

  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.spinner {
  width:50px;
  height:50px;
  border:5px solid #FFEDD5;
  border-top-color:#FF5E3A;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:20px;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

.loading-text {
  font-family:'Fredoka',sans-serif;
  font-size:22px;
  color:#9A3412;
  font-weight:600;
}

/* SHORT SCREEN */
@media(max-height:650px) {
  .login-card {
    min-height:auto;
    padding-top:28px;
    padding-bottom:calc(25px + env(safe-area-inset-bottom));
  }

  .icon-3d {
    font-size:48px;
    margin:5px 0;
  }

  .app-title {
    font-size:29px;
  }

  .app-subtitle {
    margin-bottom:20px;
  }

  .btn-google {
    padding:15px;
    margin-bottom:20px;
  }
}
</style>
</head>

<body>

<canvas id="cloud-canvas"></canvas>

<div class="login-container">
  <div class="login-card">

    <div class="icon-3d">🎓</div>

    <h1 class="app-title">Parents Login</h1>

    <p class="app-subtitle">
      Guide your child's learning journey
    </p>

    <button
      type="button"
      id="googleBtn"
      class="btn-google"
      onclick="handleGoogleLogin()"
    >
      <svg class="google-icon-svg" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <p class="privacy-text">
      By continuing, you agree to our<br>
      <a href="#">Privacy Policy</a> and
      <a href="#">Terms of Service</a>
    </p>

  </div>
</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p class="loading-text">Logging you in...</p>
</div>
<!-- BACKGROUND DRAWING -->
<script>
(() => {
  const canvas = document.getElementById("cloud-canvas");
  const ctx = canvas.getContext("2d");

  if (!ctx) return;

  let W = 0, H = 0, DPR = 1;
  let animation = 0;
  let lastTime = 0;

  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    // Reset transform every resize: prevents scaling bugs.
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    draw(performance.now());
  }

  function roundedCloud(x, y, s) {
    ctx.save();
    ctx.translate(x, y);

    ctx.shadowColor = "rgba(45,125,175,.12)";
    ctx.shadowBlur = s * .12;
    ctx.shadowOffsetY = s * .08;

    const grad = ctx.createLinearGradient(0, -s*.4, 0, s*.3);
    grad.addColorStop(0, "#FFFFFF");
    grad.addColorStop(.75, "#FFFFFF");
    grad.addColorStop(1, "#EAF8FF");

    ctx.fillStyle = grad;
    ctx.beginPath();

    ctx.ellipse(-s*.30, s*.03, s*.25, s*.22, 0, 0, Math.PI*2);
    ctx.ellipse(-s*.12, -s*.12, s*.28, s*.29, 0, 0, Math.PI*2);
    ctx.ellipse(s*.15, -s*.10, s*.25, s*.27, 0, 0, Math.PI*2);
    ctx.ellipse(s*.36, s*.04, s*.20, s*.20, 0, 0, Math.PI*2);
    ctx.ellipse(0, s*.10, s*.52, s*.19, 0, 0, Math.PI*2);

    ctx.fill();
    ctx.restore();
  }

  function drawSun() {
    const x = W * .82;
    const y = H * .17;
    const r = Math.min(W, H) * .045;

    const glow = ctx.createRadialGradient(x,y,r*.1,x,y,r*2.5);
    glow.addColorStop(0,"rgba(255,246,165,.65)");
    glow.addColorStop(1,"rgba(255,246,165,0)");

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x,y,r*2.5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#FFF2A0";
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "#A65D22";
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.arc(x-r*.27,y-r*.02,2,0,Math.PI*2);
    ctx.arc(x+r*.27,y-r*.02,2,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x,y+r*.05,r*.30,.15,Math.PI-.15);
    ctx.stroke();
  }

  function drawRainbow() {
    // Responsive rainbow: stays inside the screen.
    const radius = Math.min(W*.31, H*.23);
    const centerX = W*.04;
    const centerY = H*.39;

    const colors = [
      "#F65D72",
      "#FF9A45",
      "#FFDB4A",
      "#55D58B",
      "#43BDF3",
      "#A477F5"
    ];

    ctx.save();
    ctx.lineCap = "round";

    colors.forEach((color,i) => {
      const inset = i * radius * .105;
      const r = radius - inset;

      if (r <= 0) return;

      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(4, radius*.09);

      ctx.arc(
        centerX,
        centerY,
        r,
        Math.PI,
        Math.PI*2
      );

      ctx.stroke();
    });

    ctx.restore();
  }

  function drawHills() {
    // Back hill
    ctx.fillStyle = "#A1E8AE";
    ctx.beginPath();
    ctx.moveTo(0,H*.70);

    ctx.bezierCurveTo(
      W*.18,H*.58,
      W*.34,H*.76,
      W*.53,H*.67
    );

    ctx.bezierCurveTo(
      W*.72,H*.57,
      W*.86,H*.68,
      W,H*.62
    );

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();

    // Front hill
    const grad = ctx.createLinearGradient(0,H*.72,0,H);
    grad.addColorStop(0,"#78DE8C");
    grad.addColorStop(1,"#3FC574");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0,H*.83);

    ctx.bezierCurveTo(
      W*.19,H*.70,
      W*.40,H*.86,
      W*.61,H*.78
    );

    ctx.bezierCurveTo(
      W*.79,H*.68,
      W*.91,H*.77,
      W,H*.72
    );

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();
  }

  function drawTree(x,y,size) {
    ctx.save();
    ctx.translate(x,y);

    ctx.fillStyle = "#98603D";
    ctx.fillRect(-size*.07,-size*.35,size*.14,size*.42);

    const circles = [
      [0,-size*.60,size*.31,"#39C96D"],
      [-size*.20,-size*.45,size*.25,"#54D47D"],
      [size*.20,-size*.45,size*.25,"#29B866"],
      [0,-size*.33,size*.23,"#65DB8A"]
    ];

    circles.forEach(c => {
      ctx.fillStyle = c[3];
      ctx.beginPath();
      ctx.arc(c[0],c[1],c[2],0,Math.PI*2);
      ctx.fill();
    });

    ctx.restore();
  }

  function drawButterfly(x,y,color,time,phase) {
    const flap = reducedMotion ? .5 : Math.abs(Math.sin(time*.004+phase));

    ctx.save();
    ctx.translate(x,y);

    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.ellipse(-4,-2,3+flap*2,5,-.3,0,Math.PI*2);
    ctx.ellipse(4,-2,3+flap*2,5,.3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#68443A";
    ctx.fillRect(-.7,-4,1.4,8);

    ctx.restore();
  }

  function draw(time) {
    if (!W || !H) return;

    ctx.clearRect(0,0,W,H);

    // Full-screen sky. Canvas dimensions match viewport.
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#159BF4");
    sky.addColorStop(.48,"#42BFFF");
    sky.addColorStop(.76,"#8DE0FF");
    sky.addColorStop(1,"#E6FAFF");

    ctx.fillStyle = sky;
    ctx.fillRect(0,0,W,H);

    drawSun();
    drawRainbow();

    const movement = reducedMotion ? 0 : time*.000015;

    // Clouds move slowly and stay within canvas.
    roundedCloud(
      W*(.25 + Math.sin(movement)*.025),
      H*.48,
      Math.min(W,H)*.17
    );

    roundedCloud(
      W*(.75 - Math.sin(movement*.7)*.025),
      H*.56,
      Math.min(W,H)*.20
    );

    roundedCloud(
      W*.50,
      H*.64,
      Math.min(W,H)*.12
    );

    drawHills();

    // Trees on hills
    const treeSize = Math.min(W,H)*.16;
    drawTree(W*.08,H*.88,treeSize);
    drawTree(W*.92,H*.85,treeSize*.9);
    drawTree(W*.72,H*.82,treeSize*.65);

    // Small flowers
    const flowerColors = [
      "#FF6B9D","#FFD447","#FFFFFF","#C084FC"
    ];

    for(let i=0;i<30;i++){
      const x = (i/30)*W;
      const y = H*(.91 + Math.sin(i*2.1)*.025);
      const s = Math.min(W,H)*.004;

      ctx.fillStyle = flowerColors[i%flowerColors.length];
      ctx.beginPath();
      ctx.arc(x,y,s*2.3,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle = "#FFD84D";
      ctx.beginPath();
      ctx.arc(x,y,s*.8,0,Math.PI*2);
      ctx.fill();
    }

    drawButterfly(
      W*.20,H*.29,"#FF72A7",time,1
    );

    drawButterfly(
      W*.57,H*.23,"#A477F5",time,3
    );

    drawButterfly(
      W*.78,H*.40,"#FFD447",time,5
    );
  }

  function animate(time) {
    if (document.hidden) {
      animation = 0;
      return;
    }

    // Limit redraw rate on slower phones.
    if (time-lastTime >= 33) {
      draw(time);
      lastTime = time;
    }

    animation = requestAnimationFrame(animate);
  }

  function start() {
    if (!animation) {
      animation = requestAnimationFrame(animate);
    }
  }

  function stop() {
    if (animation) {
      cancelAnimationFrame(animation);
      animation = 0;
    }
  }

  window.addEventListener("resize",resize,{passive:true});

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden) {
      stop();
    } else {
      draw(performance.now());
      start();
    }
  });

  resize();
  start();
})();
</script>

<!-- FIREBASE LOGIN -->

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const overlay = document.getElementById("loadingOverlay");
const googleBtn = document.getElementById("googleBtn");

let loginInProgress = false;

setPersistence(auth,browserLocalPersistence)
.catch(error=>{
  console.error("Firebase persistence error:",error);
});

onAuthStateChanged(auth,user=>{
  if(user && !loginInProgress) {
    overlay.style.display = "flex";

    const savedAge = localStorage.getItem("kidsAgeGroup");

    setTimeout(()=>{
      window.location.replace(
        savedAge ? "index-home.html" : "age-select.html"
      );
    },500);
  }
},error=>{
  console.error("Firebase auth state error:",error);
  overlay.style.display = "none";
});

window.handleGoogleLogin = async function() {
  if(loginInProgress) return;

  loginInProgress = true;
  googleBtn.disabled = true;

  const originalHTML = googleBtn.innerHTML;
  googleBtn.innerHTML = "<span>Connecting...</span>";

  if(navigator.vibrate) {
    navigator.vibrate(40);
  }

  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({
    prompt:"select_account"
  });

  try {
    overlay.style.display = "flex";

    await signInWithPopup(auth,provider);

    // Auth listener will redirect authenticated users.

  } catch(error) {
    console.error("Google sign-in error:",error);

    overlay.style.display = "none";

    googleBtn.disabled = false;
    googleBtn.innerHTML = originalHTML;
    loginInProgress = false;

    if(error.code !== "auth/popup-closed-by-user") {
      alert("Login failed. Please try again.");
    }
  }
};

if("serviceWorker" in navigator) {
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js")
    .catch(error=>{
      console.error("Service worker registration failed:",error);
    });
  });
}
</script>
