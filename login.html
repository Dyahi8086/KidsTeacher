<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Teacher - Parent Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:20px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:#20283d;
  background:#b9d6ff url("kids_teacher_login_background.png") center/cover no-repeat fixed;
}
.card{
  width:min(100%,590px);
  padding:30px 24px;
  text-align:center;
  border:2px solid white;
  border-radius:36px;
  background:linear-gradient(160deg,rgba(205,239,255,.96),rgba(255,253,229,.96),rgba(222,229,255,.97));
  box-shadow:0 18px 55px #374a7c33;
}
.logo{font-size:50px;margin-bottom:12px}
h1{font-size:clamp(30px,6vw,44px);margin:8px 0}
.subtitle{font-size:17px;font-weight:bold;margin-bottom:25px}
.alert{
  display:none;
  padding:13px;
  margin-bottom:16px;
  border:1px solid #e58a8a;
  border-radius:18px;
  background:#ffe7e7;
  color:#a6222c;
  text-align:left;
  overflow-wrap:anywhere;
}
.alert.success{background:#e5ffed;color:#176b37;border-color:#73c991}
.field{
  display:flex;
  align-items:center;
  min-height:64px;
  margin-bottom:17px;
  border:2px solid #e3e8ef;
  border-radius:25px;
  background:white;
}
.icon{width:48px;font-size:22px;flex-shrink:0}
.field input{
  width:100%;
  min-width:0;
  padding:16px 8px;
  border:0;
  outline:0;
  background:transparent;
  font:inherit;
  font-size:17px;
}
.show{
  border:0;
  background:transparent;
  font-size:20px;
  padding:10px;
  cursor:pointer;
}
.forgot{text-align:right;margin:0 0 22px}
.text-button,.bottom button{
  border:0;
  background:transparent;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
}
.primary,.outline,.google{
  width:100%;
  min-height:62px;
  border-radius:25px;
  font:inherit;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  border:0;
  color:white;
  background:linear-gradient(110deg,#ff7547,#ff6b18);
  box-shadow:0 7px 0 #d94a0b;
  margin-bottom:18px;
}
.outline{
  border:2px dashed #f18a41;
  color:#b54a1f;
  background:#ffffffbf;
  font-style:italic;
  margin-bottom:24px;
}
.divider{
  display:flex;
  align-items:center;
  gap:14px;
  margin:20px 0;
  font-weight:bold;
}
.divider:before,.divider:after{
  content:"";
  flex:1;
  height:2px;
  background:#6f7f9d33;
}
.google{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  border:2px solid #e5e9f0;
  background:white;
  color:#30384b;
}
.g{font:bold 29px Arial;color:#4285f4}
.bottom{margin-top:25px;font-size:17px;font-weight:bold}
.bottom button{color:#e8782d}
.small{font-size:12px;color:#596276;margin-top:15px}
button:disabled{opacity:.65;cursor:wait}
.spinner{
  display:inline-block;
  width:17px;height:17px;
  margin-right:8px;
  vertical-align:middle;
  border:2px solid #ffffff70;
  border-top-color:white;
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:420px){
  body{padding:12px 9px}
  .card{padding:23px 16px;border-radius:30px}
  .field{min-height:59px}
  .primary,.outline,.google{min-height:58px;font-size:16px}
}
</style>
</head>

<body>
<main class="card">

  <div class="logo">📖⭐</div>

  <h1>Welcome Back!</h1>
  <p class="subtitle">Manage your child's learning journey</p>

  <div id="alertBox" class="alert" role="status" aria-live="polite"></div>

  <form id="loginForm" novalidate>

    <label class="field">
      <span class="icon">✉</span>
      <input id="email" type="email" autocomplete="email"
        placeholder="Email Address" aria-label="Email Address" required>
    </label>

    <label class="field">
      <span class="icon">🔒</span>
      <input id="password" type="password" autocomplete="current-password"
        placeholder="Password" aria-label="Password" required>
      <button class="show" type="button" id="togglePassword"
        aria-label="Show password">👁️</button>
    </label>

    <div class="forgot">
      <button class="text-button" type="button" id="forgotBtn">
        Forgot Password?
      </button>
    </div>

    <button class="primary" type="submit" id="loginBtn">
      Log In ➜
    </button>

    <button class="outline" type="button" id="createBtn">
      Create New Account
    </button>

  </form>

  <div class="divider">— OR —</div>

  <button class="google" type="button" id="googleBtn">
    <span class="g">G</span>
    <span>Continue with Google</span>
  </button>

  <p class="bottom">
    New here?
    <button type="button" id="createTextBtn">Create Account</button>
  </p>

  <p class="small">Your account is securely managed by Firebase.</p>

</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDidkZxkQGLjJO4_Ido5FI6Q0s9vay0E3mA",
  authDomain: "kids-teacher-4387e.firebaseapp.com",
  projectId: "kids-teacher-4387e",
  storageBucket: "kids-teacher-4387e.firebasestorage.app",
  messagingSenderId: "420221167346",
  appId: "1:420221167346:web:da7ac80acdfd52339d526b",
  measurementId: "G-VJVS2ZMNLY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const alertBox = document.getElementById("alertBox");
const loginBtn = document.getElementById("loginBtn");

const buttons = [
  "loginBtn",
  "createBtn",
  "createTextBtn",
  "googleBtn",
  "forgotBtn"
].map(id => document.getElementById(id));

let busy = false;


/* ALERT MESSAGE */
function showAlert(message, type = "error") {
  alertBox.textContent = message;
  alertBox.className =
    type === "success" ? "alert success" : "alert";
  alertBox.style.display = "block";
}

function hideAlert() {
  alertBox.style.display = "none";
  alertBox.textContent = "";
}


/* LOADING INDICATOR */
function setLoading(active, message = "") {
  busy = active;

  buttons.forEach(button => {
    button.disabled = active;
  });

  loginBtn.innerHTML = active
    ? '<span class="spinner"></span>' + message
    : "Log In ➜";
}


/* FRIENDLY ERROR MESSAGES */
function friendlyError(error) {
  const code = error?.code || "";

  if (
    code === "auth/api-key-not-valid" ||
    code === "auth/invalid-api-key"
  ) {
    return "Firebase API key invalid hai. Firebase Project Settings mein Web API key aur API restrictions check karo.";
  }

  if (code === "auth/unauthorized-domain") {
    return "Website domain Firebase Authentication mein authorized nahi hai.";
  }

  if (code === "auth/operation-not-allowed") {
    return "Firebase Console mein ye login method enable nahi hai.";
  }

  if ([
    "auth/invalid-credential",
    "auth/wrong-password",
    "auth/user-not-found",
    "auth/invalid-login-credentials"
  ].includes(code)) {
    return "Incorrect email or password. Please try again.";
  }

  if (code === "auth/email-already-in-use") {
    return "This email is already registered. Please log in.";
  }

  if (code === "auth/weak-password") {
    return "Password must be at least 6 characters.";
  }

  if (code === "auth/invalid-email") {
    return "Please enter a valid email address.";
  }

  if (code === "auth/too-many-requests") {
    return "Too many attempts. Please try again later.";
  }

  if (code === "auth/network-request-failed") {
    return "Please check your internet connection.";
  }

  if (code === "auth/popup-closed-by-user") {
    return "Google sign-in was cancelled. Please try again.";
  }

  if (code === "auth/account-exists-with-different-credential") {
    return "This email already uses another login method. Try that method.";
  }

  return "Firebase error: " + (code || "Unknown error");
}


/* HOME PAGE */
function goHome() {
  window.location.replace(
    new URL("./index.html", window.location.href).href
  );
}


/* EMAIL VALIDATION */
function validEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}


/* SHOW / HIDE PASSWORD */
document.getElementById("togglePassword")
  .addEventListener("click", () => {

    const password = document.getElementById("password");
    const show = password.type === "password";

    password.type = show ? "text" : "password";

    document.getElementById("togglePassword")
      .setAttribute(
        "aria-label",
        show ? "Hide password" : "Show password"
      );
});


/* EMAIL LOGIN */
document.getElementById("loginForm")
  .addEventListener("submit", async event => {

    event.preventDefault();

    if (busy) return;

    hideAlert();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!validEmail(email)) {
      showAlert("Please enter a valid email address.");
      return;
    }

    if (!password) {
      showAlert("Please enter your password.");
      return;
    }

    setLoading(true, "Logging in...");

    try {
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      goHome();

    } catch (error) {
      console.error("Email login error:", error.code, error.message);
      showAlert(friendlyError(error));

    } finally {
      setLoading(false);
    }
});


/* CREATE ACCOUNT */
async function createAccount() {
  if (busy) return;

  hideAlert();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!validEmail(email)) {
    showAlert("Please enter a valid email address.");
    return;
  }

  if (password.length < 6) {
    showAlert("Password must be at least 6 characters.");
    return;
  }

  setLoading(true, "Creating account...");

  try {
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    showAlert(
      "Account created successfully. Opening Kids Teacher...",
      "success"
    );

    setTimeout(goHome, 500);

  } catch (error) {
    console.error("Create account error:", error.code, error.message);
    showAlert(friendlyError(error));

  } finally {
    setLoading(false);
  }
}

document.getElementById("createBtn")
  .addEventListener("click", createAccount);

document.getElementById("createTextBtn")
  .addEventListener("click", createAccount);


/* GOOGLE LOGIN */
document.getElementById("googleBtn")
  .addEventListener("click", async () => {

    if (busy) return;

    hideAlert();
    setLoading(true, "Opening Google...");

    try {
      await setPersistence(auth, browserLocalPersistence);

      const provider = new GoogleAuthProvider();

      provider.setCustomParameters({
        prompt: "select_account"
      });

      await signInWithRedirect(auth, provider);

    } catch (error) {
      console.error("Google Login Error:", error.code, error.message);
      setLoading(false);
      showAlert(friendlyError(error));
    }
});


/* FORGOT PASSWORD */
document.getElementById("forgotBtn")
  .addEventListener("click", async () => {

    if (busy) return;

    hideAlert();

    const email =
      document.getElementById("email").value.trim();

    if (!validEmail(email)) {
      showAlert("Enter your email address above first.");
      return;
    }

    setLoading(true, "Sending reset email...");

    try {
      await sendPasswordResetEmail(auth, email);

      showAlert(
        "If an account exists for this email, password reset instructions will be sent.",
        "success"
      );

    } catch (error) {
      console.error("Password reset error:", error.code, error.message);
      showAlert(friendlyError(error));

    } finally {
      setLoading(false);
    }
});


/* SAVE LOGIN SESSION + GOOGLE REDIRECT RESULT */
async function initializeAuth() {
  try {
    await setPersistence(auth, browserLocalPersistence);

    const result = await getRedirectResult(auth);

    if (result?.user) {
      goHome();
      return;
    }

    onAuthStateChanged(auth, user => {
      if (user) {
        goHome();
      }
    });

  } catch (error) {
    console.error(
      "Firebase initialization error:",
      error.code,
      error.message
    );

    showAlert(friendlyError(error));
  }
}

initializeAuth();

</script>
</body>
</html>
