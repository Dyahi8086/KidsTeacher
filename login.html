<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parents Login - Kids Teacher</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Soft Animated Background */
      background: linear-gradient(135deg, #e0f2fe 0%, #fdf4ff 50%, #fff7ed 100%);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      font-family: 'Nunito', sans-serif;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* --- ADVANCED 3D FLOATING BACKGROUND ELEMENTS --- */
    .bg-shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      box-shadow: inset -10px -10px 20px rgba(0,0,0,0.05), 10px 10px 20px rgba(255,255,255,0.8);
      z-index: 0;
    }

    .shape-1 {
      width: 150px; height: 150px;
      top: -30px; left: -40px;
      background: radial-gradient(circle at 30% 30%, #ffffff, #e0f2fe);
      animation: float 6s ease-in-out infinite;
    }

    .shape-2 {
      width: 100px; height: 100px;
      bottom: 50px; right: -20px;
      background: radial-gradient(circle at 30% 30%, #ffffff, #fdf4ff);
      animation: float 8s ease-in-out infinite reverse;
    }

    .shape-3 {
      width: 60px; height: 60px;
      top: 20%; right: 15%;
      background: radial-gradient(circle at 30% 30%, #fef08a, #fde047); /* Yellow Star shape illusion */
      border-radius: 20% 80% 20% 80%; /* Star-like rough shape */
      animation: float 5s ease-in-out infinite 1s;
    }
    
    .shape-4 {
      width: 120px; height: 120px;
      bottom: 10%; left: 10%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #ffedd5);
      animation: float 7s ease-in-out infinite 0.5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* --- LOGIN CARD (ADVANCED GLASSMORPHISM) --- */
    .login-card {
      width: 92%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.7); /* Transparent */
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 32px;
      padding: 40px 25px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      text-align: center;
      position: relative;
      z-index: 10;
      animation: breatheGlow 4s ease-in-out infinite alternate;
    }

    /* Breathing Glow Effect */
    @keyframes breatheGlow {
      0% { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
      100% { box-shadow: 0 25px 60px -10px rgba(255, 107, 53, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.8); }
    }

    /* --- HEADER & LOGO --- */
    .brand-header { margin-bottom: 25px; }

    .logo-container {
      width: 75px; height: 75px;
      background: #fff;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 15px auto;
      box-shadow: 0 10px 20px rgba(255, 107, 53, 0.15);
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .app-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.5px;
    }

    .app-subtitle {
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-top: 5px;
    }

    /* --- ALERTS --- */
    #alertBox {
      display: none;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    #alertBox.error { background: #fee2e2; color: #b91c1c; border-left: 4px solid #ef4444;}
    #alertBox.success { background: #dcfce7; color: #15803d; border-left: 4px solid #22c55e;}

    /* --- INPUTS WITH FLOATING LABELS --- */
    .input-group {
      position: relative;
      margin-bottom: 18px;
      text-align: left;
    }

    .input-icon {
      position: absolute;
      left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 18px; color: #94a3b8; z-index: 2;
    }

    .form-input {
      width: 100%;
      padding: 22px 16px 8px 48px; /* Space for floating label */
      background: #ffffff;
      border: 2px solid transparent;
      border-radius: 16px;
      font-size: 15px;
      color: #1e293b;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .form-input:focus {
      border-color: #ff6b35; /* Neon Orange Glow */
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15);
    }

    .floating-label {
      position: absolute;
      left: 48px; top: 50%; transform: translateY(-50%);
      font-size: 15px; color: #94a3b8; font-weight: 700;
      pointer-events: none; transition: all 0.2s ease;
    }

    .form-input:focus ~ .floating-label,
    .form-input:not(:placeholder-shown) ~ .floating-label {
      top: 12px; font-size: 11px; color: #ff6b35;
    }

    .toggle-password {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px; color: #94a3b8;
    }

    /* --- BUTTONS --- */
    .forgot-link {
      display: block; text-align: right; font-size: 13px; color: #64748b;
      font-weight: 800; background: none; border: none; cursor: pointer;
      margin-bottom: 20px; width: 100%;
    }

    .btn-login {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #ff7e5f, #f97316);
      color: #ffffff; border: none; border-radius: 16px;
      font-size: 18px; font-family: 'Fredoka', sans-serif; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c2410c, 0 10px 15px rgba(249, 115, 22, 0.3);
      transition: all 0.1s ease;
      margin-bottom: 20px;
      position: relative; overflow: hidden;
    }

    .btn-login:active { transform: translateY(6px); box-shadow: 0 0 0 #c2410c; }

    /* Ripple Effect */
    .ripple { position: absolute; background: rgba(255,255,255,0.4); border-radius: 50%; transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none; }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    .divider {
      display: flex; align-items: center; text-align: center;
      margin: 20px 0; color: #cbd5e1; font-size: 12px; font-weight: 800;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 2px solid rgba(203, 213, 225, 0.5); }
    .divider::before { margin-right: 12px; } .divider::after { margin-left: 12px; }

    .btn-google {
      width: 100%; padding: 14px; background: #ffffff; color: #334155;
      border: 2px solid #e2e8f0; border-radius: 16px; font-size: 15px; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 0 #e2e8f0; transition: all 0.1s ease; margin-bottom: 25px;
    }
    .btn-google:active { transform: translateY(4px); box-shadow: 0 0 0 #e2e8f0; }

    .bottom-signup { font-size: 14px; color: #64748b; font-weight: 800; }
    .bottom-signup button { color: #f97316; background: none; border: none; cursor: pointer; font-weight: 800; font-size: 14px; }
  </style>
</head>
<body>

  <!-- 3D Floating Background Elements -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>
  <div class="bg-shape shape-4"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="logo-container">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <h1 class="app-title">Parents Login</h1>
      <p class="app-subtitle">Guide your child's learning journey</p>
    </div>

    <div id="alertBox"></div>

    <form id="authForm" onsubmit="handleFormSubmit(event)">
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" class="form-input" placeholder=" " required>
        <label class="floating-label">Email Address</label>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" class="form-input" placeholder=" " required>
        <label class="floating-label">Password</label>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
      </div>

      <button type="button" class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</button>

      <button type="submit" id="submitBtn" class="btn-login">Log In</button>
    </form>

    <div class="divider">OR</div>

    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>

    <div class="bottom-signup">
      New here? <button type="button" id="signupBtn" onclick="handleCreateAccount()">Create Account</button>
    </div>
  </div>

  <!-- Firebase Script (Aapka same script, bas thoda smooth kiya hai) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, 
      signInWithRedirect, getRedirectResult, onAuthStateChanged, 
      setPersistence, browserLocalPersistence 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b",
      measurementId: "G-VJVS2ZMNLY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    // Loader ko hatana kyunki ab humne stylish 3D background lagaya hai
    const loader = document.getElementById('authLoader');
    if(loader) loader.style.display = 'none';

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const savedAge = localStorage.getItem('kidsAgeGroup');
        window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
      }
    });

    window.togglePasswordVisibility = function() {
      const passwordInput = document.getElementById('password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = type;
      alertBox.style.display = 'block';
    }
    function hideAlert() { document.getElementById('alertBox').style.display = 'none'; }

    function setLoading(isLoading, text = '') {
      const submitBtn = document.getElementById('submitBtn');
      document.getElementById('signupBtn').disabled = isLoading;
      document.getElementById('googleBtn').disabled = isLoading;
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? text : "Log In";
    }

    function getFriendlyErrorMessage(errorCode) {
      switch (errorCode) {
        case 'auth/invalid-email': return "Please enter a valid email address.";
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return "Incorrect email or password.";
        case 'auth/email-already-in-use': return "Email already registered. Please log in.";
        case 'auth/weak-password': return "Password must be at least 6 characters.";
        default: return "An error occurred. Please try again.";
      }
    }

    window.handleFormSubmit = async function(event) {
      event.preventDefault();
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) { showAlert("Please fill in all fields."); return; }
      setLoading(true, "Signing in...");
      
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }

    window.handleCreateAccount = async function() {
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showAlert("Enter email and password."); return; }

      setLoading(true, "Creating...");
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        window.location.replace("age-select.html");
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }

    window.handleGoogleLogin = async function() {
      hideAlert();
      setLoading(true, "Connecting...");
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        setLoading(false);
        if (error.code === 'auth/popup-blocked') {
          showAlert("Please allow pop-ups for this site.");
        } else if (error.code !== 'auth/popup-closed-by-user') {
          showAlert(getFriendlyErrorMessage(error.code));
        }
      }
    }

    window.handleForgotPassword = async function() {
      hideAlert();
      const email = document.getElementById('email').value.trim();
      if (!email) { showAlert("Enter email address first."); return; }

      setLoading(true, "Sending...");
      try {
        await sendPasswordResetEmail(auth, email);
        setLoading(false);
        showAlert("Reset link sent! Check inbox.", "success");
      } catch (error) {
        setLoading(false);
        showAlert(getFriendlyErrorMessage(error.code));
      }
    }
  </script>
</body>
</html>
