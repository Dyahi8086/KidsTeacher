<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;

  font-family: 'Nunito', sans-serif;

  position: relative;

  background: linear-gradient(
    180deg,
    #42b9f5,
    #8bdcff,
    #e0f7ff
  );
}

/* BACKGROUND */

#cloud-canvas {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0;

  pointer-events: none;
}

/* LOGIN CONTAINER */

.login-container {
  position: relative;

  width: 100%;
  height: 100%;
  height: 100dvh;

  display: flex;

  flex-direction: column;

  justify-content: flex-end;
  align-items: center;

  z-index: 10;

  overflow-y: auto;

  overscroll-behavior: contain;

  -webkit-overflow-scrolling: touch;

  padding-bottom: env(safe-area-inset-bottom);
}

/* LOGIN CARD */

.login-card {
  width: 100%;
  max-width: 450px;

  min-height: 55vh;

  background: rgba(255,255,255,0.34);

  backdrop-filter: blur(22px) saturate(135%);
  -webkit-backdrop-filter: blur(22px) saturate(135%);

  border-radius: 40px 40px 0 0;

  border-top: 1px solid rgba(255,255,255,0.85);

  border-left: 1px solid rgba(255,255,255,0.4);

  border-right: 1px solid rgba(255,255,255,0.4);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.8),
    0 -10px 30px rgba(0,0,0,0.10);

  padding: 40px 25px calc(35px + env(safe-area-inset-bottom));

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  position: relative;

  animation: bounceUp 0.9s cubic-bezier(
    0.175,
    0.885,
    0.32,
    1.275
  ) forwards;

  transform: translateY(100%);
}

@keyframes bounceUp {
  0% {
    transform: translateY(100%);
  }

  60% {
    transform: translateY(-12px);
  }

  100% {
    transform: translateY(0);
  }
}

/* PULL BAR */

.login-card::before {
  content: '';

  position: absolute;

  top: 12px;

  width: 50px;
  height: 5px;

  background: rgba(255,255,255,0.7);

  border-radius: 10px;
}

/* ICON */

.icon-3d {
  font-size: 60px;

  margin-top: 10px;
  margin-bottom: 10px;

  filter: drop-shadow(
    0 8px 12px rgba(0,0,0,0.2)
  );
}

/* TITLE */

.app-title {
  font-family: 'Fredoka', sans-serif;

  font-size: 34px;

  font-weight: 700;

  letter-spacing: -0.5px;

  margin-bottom: 8px;

  color: #0f172a;
}

/* SUBTITLE */

.app-subtitle {
  font-family: 'Nunito', sans-serif;

  font-size: 15px;

  color: #334155;

  font-weight: 700;

  margin-bottom: 30px;

  padding: 0 10px;

  line-height: 1.4;
}

/* GOOGLE BUTTON */

.btn-google {
  width: 100%;

  padding: 18px 15px;

  background: rgba(255,255,255,0.95);

  color: #0f172a;

  border: 1px solid #fff;

  border-radius: 50px;

  font-size: 17px;

  font-family: 'Fredoka', sans-serif;

  font-weight: 700;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 10px;

  position: relative;

  overflow: hidden;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.10),
    inset 0 2px 2px rgba(255,255,255,1);

  transition: transform 0.15s ease;

  margin-bottom: 25px;

  z-index: 100;
}

.btn-google span {
  display: inline-block;

  animation: textBounce 2s infinite ease-in-out;
}

@keyframes textBounce {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-3px);
  }
}

/* BUTTON SHINE */

.btn-google::after {
  content: '';

  position: absolute;

  top: 0;
  left: -100%;

  width: 50%;
  height: 100%;

  background: linear-gradient(
    to right,
    transparent,
    rgba(255,255,255,0.8),
    transparent
  );

  transform: skewX(-25deg);

  animation: shine 3s infinite;

  pointer-events: none;
}

@keyframes shine {
  0% {
    left: -100%;
  }

  20% {
    left: 200%;
  }

  100% {
    left: 200%;
  }
}

.btn-google:active {
  transform: translateY(3px);
}

.btn-google:disabled {
  opacity: 0.7;
  cursor: wait;
}

.google-icon-svg {
  width: 22px;
  height: 22px;

  flex-shrink: 0;
}

/* PRIVACY */

.privacy-text {
  font-family: 'Nunito', sans-serif;

  font-size: 12px;

  color: #334155;

  font-weight: 800;

  line-height: 1.5;

  text-align: center;

  padding: 0 10px;
}

.privacy-text a {
  color: #0f172a;

  text-decoration: underline;
}

/* LOADING */

#loadingOverlay {
  display: none;

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  background: rgba(255,255,255,0.92);

  backdrop-filter: blur(10px);

  z-index: 9999;

  flex-direction: column;

  justify-content: center;
  align-items: center;
}

.spinner {
  width: 50px;
  height: 50px;

  border: 5px solid #ffedd5;

  border-top: 5px solid #FF5E3A;

  border-radius: 50%;

  animation: spin 1s linear infinite;

  margin-bottom: 20px;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.loading-text {
  font-family: 'Fredoka', sans-serif;

  font-size: 22px;

  color: #9a3412;

  font-weight: 600;
}

/* SMALL MOBILE */

@media (max-height: 650px) {
  .login-card {
    min-height: auto;

    padding-top: 30px;

    padding-bottom: calc(
      25px + env(safe-area-inset-bottom)
    );
  }

  .icon-3d {
    font-size: 48px;

    margin-top: 5px;
    margin-bottom: 5px;
  }

  .app-title {
    font-size: 29px;
  }

  .app-subtitle {
    margin-bottom: 20px;
  }

  .btn-google {
    padding: 15px;

    margin-bottom: 20px;
  }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>

<script>
(() => {
  const canvas = document.getElementById("cloud-canvas");
  const ctx = canvas.getContext("2d");

  if (!ctx) return;

  let width = 0;
  let height = 0;
  let dpr = 1;
  let animationId = 0;

  const clouds = [
    {x:0.12,y:0.36,s:1.0,speed:0.006},
    {x:0.78,y:0.43,s:1.25,speed:0.009},
    {x:0.43,y:0.56,s:0.8,speed:0.004}
  ];

  const butterflies = [
    {x:0.18,y:0.25,s:1,color:"#FF75B5",phase:0},
    {x:0.83,y:0.32,s:0.8,color:"#FFD447",phase:2},
    {x:0.58,y:0.19,s:0.7,color:"#A78BFA",phase:4}
  ];

  const flowers = [];

  for(let i=0;i<35;i++){
    flowers.push({
      x:Math.random(),
      y:0.89+Math.random()*0.08,
      size:3+Math.random()*4,
      color:[
        "#FF6B9D",
        "#FFD447",
        "#FFFFFF",
        "#C084FC",
        "#FF9F43"
      ][i%5]
    });
  }

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);

    width=window.innerWidth;
    height=window.innerHeight;

    canvas.width=Math.floor(width*dpr);
    canvas.height=Math.floor(height*dpr);

    canvas.style.width=width+"px";
    canvas.style.height=height+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  window.addEventListener("resize",resize);
  resize();

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();

    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);

    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);

    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);

    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);

    ctx.closePath();
  }

  function drawSky(){
    const sky=ctx.createLinearGradient(
      0,0,0,height
    );

    sky.addColorStop(0,"#1599F4");
    sky.addColorStop(0.45,"#45C4FF");
    sky.addColorStop(0.78,"#A5E8FF");
    sky.addColorStop(1,"#E6FAFF");

    ctx.fillStyle=sky;

    ctx.fillRect(0,0,width,height);

    // SUN

    const sx=width*0.83;
    const sy=height*0.16;
    const sr=Math.min(width,height)*0.055;

    const sunGlow=ctx.createRadialGradient(
      sx,sy,0,
      sx,sy,sr*2.5
    );

    sunGlow.addColorStop(0,"rgba(255,255,190,0.65)");
    sunGlow.addColorStop(1,"rgba(255,255,190,0)");

    ctx.fillStyle=sunGlow;

    ctx.beginPath();
    ctx.arc(sx,sy,sr*2.5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#FFF5A8";

    ctx.beginPath();
    ctx.arc(sx,sy,sr,0,Math.PI*2);
    ctx.fill();

    // SUN FACE

    ctx.fillStyle="#A65D22";

    ctx.beginPath();
    ctx.arc(sx-sr*0.28,sy-sr*0.05,2.2,0,Math.PI*2);
    ctx.arc(sx+sr*0.28,sy-sr*0.05,2.2,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#A65D22";
    ctx.lineWidth=1.5;

    ctx.beginPath();
    ctx.arc(sx,sy+sr*0.05,sr*0.3,0.15,Math.PI-0.15);
    ctx.stroke();
  }

  function drawRainbow(){
    const x=width*0.15;
    const y=height*0.25;

    const r=Math.min(width*0.34,height*0.27);

    const colors=[
      "#FF595E",
      "#FF924C",
      "#FFD93D",
      "#6BCB77",
      "#4D96FF",
      "#9B5DE5"
    ];

    ctx.save();

    ctx.globalAlpha=0.78;

    ctx.lineCap="round";

    colors.forEach((color,i)=>{
      ctx.beginPath();

      ctx.strokeStyle=color;

      ctx.lineWidth=Math.max(5,r*0.075);

      ctx.arc(
        x,
        y,
        r-i*ctx.lineWidth*1.15,
        Math.PI,
        Math.PI*2
      );

      ctx.stroke();
    });

    ctx.restore();
  }

  function drawCloud(x,y,size){
    const s=size;

    ctx.save();

    ctx.translate(x,y);

    // cloud shadow

    ctx.fillStyle="rgba(72,154,210,0.12)";

    ctx.beginPath();

    ctx.ellipse(
      0,
      s*0.10,
      s*0.62,
      s*0.20,
      0,0,Math.PI*2
    );

    ctx.fill();

    // fluffy cloud

    const cloudGradient=ctx.createLinearGradient(
      0,-s*0.35,
      0,s*0.3
    );

    cloudGradient.addColorStop(0,"#FFFFFF");
    cloudGradient.addColorStop(0.65,"#FFFFFF");
    cloudGradient.addColorStop(1,"#EAF8FF");

    ctx.fillStyle=cloudGradient;

    ctx.beginPath();

    ctx.arc(-s*0.30,0,s*0.22,0,Math.PI*2);

    ctx.arc(-s*0.08,-s*0.13,s*0.28,0,Math.PI*2);

    ctx.arc(s*0.20,-s*0.12,s*0.24,0,Math.PI*2);

    ctx.arc(s*0.40,s*0.02,s*0.18,0,Math.PI*2);

    ctx.ellipse(
      s*0.05,
      s*0.06,
      s*0.53,
      s*0.20,
      0,0,Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }

  function drawHills(){
    // FAR HILL

    ctx.fillStyle="#8BE4A1";

    ctx.beginPath();

    ctx.moveTo(0,height*0.70);

    ctx.bezierCurveTo(
      width*0.25,height*0.58,
      width*0.48,height*0.77,
      width*0.65,height*0.68
    );

    ctx.bezierCurveTo(
      width*0.82,height*0.58,
      width*0.92,height*0.65,
      width,height*0.62
    );

    ctx.lineTo(width,height);
    ctx.lineTo(0,height);

    ctx.closePath();
    ctx.fill();

    // NEAR HILL

    const grass=ctx.createLinearGradient(
      0,height*0.70,
      0,height
    );

    grass.addColorStop(0,"#67D66D");
    grass.addColorStop(1,"#2FAE68");

    ctx.fillStyle=grass;

    ctx.beginPath();

    ctx.moveTo(0,height*0.81);

    ctx.bezierCurveTo(
      width*0.22,height*0.70,
      width*0.45,height*0.84,
      width*0.60,height*0.78
    );

    ctx.bezierCurveTo(
      width*0.78,height*0.69,
      width*0.90,height*0.74,
      width,height*0.70
    );

    ctx.lineTo(width,height);
    ctx.lineTo(0,height);

    ctx.closePath();
    ctx.fill();
  }

  function drawTree(x,y,size){
    ctx.save();

    ctx.translate(x,y);

    // trunk

    ctx.fillStyle="#9A5B35";

    roundedRect(
      -size*0.10,
      -size*0.45,
      size*0.20,
      size*0.55,
      size*0.06
    );

    ctx.fill();

    // leaves

    const leaves=[
      [0,-size*0.70,size*0.36,"#37C96B"],
      [-size*0.22,-size*0.54,size*0.29,"#4AD17D"],
      [size*0.22,-size*0.54,size*0.29,"#29B965"],
      [0,-size*0.40,size*0.30,"#60D987"]
    ];

    leaves.forEach(item=>{
      ctx.fillStyle=item[3];

      ctx.beginPath();

      ctx.arc(
        item[0],
        item[1],
        item[2],
        0,
        Math.PI*2
      );

      ctx.fill();
    });

    ctx.restore();
  }

  function drawFlower(x,y,size,color){
    ctx.save();

    ctx.translate(x,y);

    // stem

    ctx.strokeStyle="#278C4B";
    ctx.lineWidth=1.5;

    ctx.beginPath();

    ctx.moveTo(0,0);
    ctx.lineTo(0,size*3);

    ctx.stroke();

    // petals

    ctx.fillStyle=color;

    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5;

      ctx.beginPath();

      ctx.ellipse(
        Math.cos(a)*size*0.7,
        Math.sin(a)*size*0.7,
        size*0.55,
        size*0.42,
        a,
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    // center

    ctx.fillStyle="#FFD84D";

    ctx.beginPath();

    ctx.arc(0,0,size*0.35,0,Math.PI*2);

    ctx.fill();

    ctx.restore();
  }

  function drawButterfly(b,t){
    const x=b.x*width+
      Math.sin(t*0.001+b.phase)*width*0.025;

    const y=b.y*height+
      Math.sin(t*0.002+b.phase)*height*0.018;

    const flap=Math.abs(
      Math.sin(t*0.012+b.phase)
    );

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
      Math.sin(t*0.001+b.phase)*0.2
    );

    ctx.fillStyle=b.color;

    // left wing

    ctx.beginPath();

    ctx.ellipse(
      -5,-2,
      5+flap*4,
      7,
      -0.3,
      0,
      Math.PI*2
    );

    ctx.fill();

    // right wing

    ctx.beginPath();

    ctx.ellipse(
      5,-2,
      5+flap*4,
      7,
      0.3,
      0,
      Math.PI*2
    );

    ctx.fill();

    // body

    ctx.fillStyle="#5B3B38";

    ctx.beginPath();

    ctx.ellipse(
      0,0,
      1.5,5,
      0,0,Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }

  function drawBackground(t){
    drawSky();

    drawRainbow();

    // clouds move slowly

    clouds.forEach(c=>{
      c.x+=c.speed;

      if(c.x>1.25){
        c.x=-0.25;
      }

      drawCloud(
        c.x*width,
        c.y*height+
          Math.sin(t*0.0005+c.x)*8,
        Math.min(width,height)*0.16*c.s
      );
    });

    drawHills();

    drawTree(
      width*0.08,
      height*0.83,
      Math.min(width,height)*0.18
    );

    drawTree(
      width*0.92,
      height*0.80,
      Math.min(width,height)*0.16
    );

    // flowers

    flowers.forEach(f=>{
      drawFlower(
        f.x*width,
        f.y*height,
        f.size,
        f.color
      );
    });

    // butterflies

    butterflies.forEach(b=>{
      drawButterfly(b,t);
    });
  }

  function animate(t){
    if(document.hidden){
      animationId=0;
      return;
    }

    ctx.clearRect(0,0,width,height);

    drawBackground(t);

    animationId=requestAnimationFrame(animate);
  }

  function start(){
    if(!animationId){
      animationId=requestAnimationFrame(animate);
    }
  }

  document.addEventListener(
    "visibilitychange",
    ()=>{
      if(document.hidden){
        cancelAnimationFrame(animationId);
        animationId=0;
      } else {
        start();
      }
    }
  );

  start();

})();
</script>

    }

    overlay.style.display="flex";

    const savedAge=localStorage.getItem(
      "kidsAgeGroup"
    );

    setTimeout(()=>{
      const destination=!savedAge
        ? "age-select.html"
        : "index-home.html";

      window.location.replace(destination);
    },800);
  },

  error=>{
    console.error("Auth state error:",error);

    overlay.style.display="none";
  }
);

/* GOOGLE LOGIN */

window.handleGoogleLogin=async function(){

  if(googleBtn.disabled){
    return;
  }

  if(navigator.vibrate){
    navigator.vibrate(50);
  }

  const originalHTML=googleBtn.innerHTML;

  googleBtn.disabled=true;

  googleBtn.innerHTML="<span>Connecting...</span>";

  const provider=new GoogleAuthProvider();

  provider.setCustomParameters({
    prompt:"select_account"
  });

  try{
    overlay.style.display="flex";

    await signInWithPopup(
      auth,
      provider
    );

  }catch(error){

    console.error("Google login error:",error);

    overlay.style.display="none";

    googleBtn.innerHTML=originalHTML;

    googleBtn.disabled=false;

    if(
      error.code!==
      "auth/popup-closed-by-user"
    ){
      alert(
        "Login failed. Please try again."
      );
    }
  }
};

/* SERVICE WORKER */

if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker.register(
      "./service-worker.js"
    ).catch(error=>{
      console.error(
        "Service worker error:",
        error
      );
    });

  });

}

</script>
