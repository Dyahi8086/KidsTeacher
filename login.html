<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Parents Login - Kids Teacher</title>
  
  <!-- PWA Links -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      height: 100vh; height: 100dvh; 
      display: flex; flex-direction: column; 
      font-family: 'Nunito', sans-serif; 
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* --- TOP IMAGE (Seamless, No Box) --- */
    .top-image-section {
      width: 100%;
      height: 55vh; /* Screen ka 55% hissa legi */
      /* Background image ko stretch kiya hai taaki koi gap na bache */
      background-image: url('login_bg.png'); 
      background-size: 100% 100%;
      background-position: center top;
      background-repeat: no-repeat;
      flex-shrink: 0;
      position: relative;
    }

    /* --- BOTTOM LOGIN SECTION --- */
    .login-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 10;
      /* Smooth fade-in animation */
      animation: slideUpFade 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- TEXT STYLING --- */
    .app-title { 
      font-family: 'Fredoka', sans-serif; 
      font-size: 34px; 
      color: #1e293b; 
      font-weight: 700; 
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .app-subtitle { 
      font-size: 15px; 
      color: #64748b; 
      font-weight: 700; 
      margin-bottom: 35px; 
    }

    /* --- ULTRA ADVANCED 3D GOOGLE BUTTON --- */
    .btn-google {
      width: 90%; 
      max-width: 340px;
      padding: 18px;
      background: #ffffff;
      color: #1e293b;
      border: 2px solid #e2e8f0;
      border-radius: 50px;
      font-size: 18px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      
      /* Deep 3D Shadow */
      box-shadow: 0 8px 0 #cbd5e1, 0 15px 25px rgba(0,0,0,0.08);
      transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform: translateY(0);
    }
    
    /* Button Shine Effect (Chamak) */
    .btn-google::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    /* Press Animation (Dabne par) */
    .btn-google:active { 
      transform: translateY(8px); 
      box-shadow: 0 0px 0 #cbd5e1, 0 5px 10px rgba(0,0,0,0.05); 
    }
    
    /* Disable state */
    .btn-google:disabled {
      background: #f8fafc;
      color: #94a3b8;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
      border-color: #e2e8f0;
    }

    /* Button ke andar ka spinner */
    .btn-spinner {
      width: 22px; height: 22px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #4285F4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* --- FULL SCREEN LOADER (Login ke time) --- */
    #loadingOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(255, 255, 255, 0.95);
      z-index: 9999; display: none; flex-direction: column;
      justify-content: center; align-items: center;
      backdrop-filter: blur(5px);
    }
    .overlay-spinner {
      width: 60px; height: 60px;
      border: 6px solid #f1f5f9; border-top: 6px solid #4285F4;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    .loading-text { font-family: 'Fredoka'; font-size: 22px; color: #1e293b; font-weight: 600; }

    /* --- FLOATING DECORATIVE STARS --- */
    .floating-star {
      position: absolute;
      background: rgba(241, 245, 249, 0.8);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      z-index: 1;
      animation: float 6s infinite ease-in-out;
    }
    .star-1 { width: 15px; height: 15px; top: 60%; left: 10%; animation-delay: 0s; }
    .star-2 { width: 25px; height: 25px; top: 70%; right: 15%; animation-delay: 1.5s; }
    .star-3 { width: 12px; height: 12px; bottom: 15%; left: 20%; animation-delay: 0.8s; }
    .star-4 { width: 20px; height: 20px; bottom: 25%; right: 10%; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
  </style>
</head>
<body>

  <!-- Top Seamless Image -->
  <div class="top-image-section"></div>

  <!-- Background Floating Elements -->
  <div class="floating-star star-1"></div>
  <div class="floating-star star-2"></div>
  <div class="floating-star star-3"></div>
  <div class="floating-star star-4"></div>

  <!-- Login Section -->
  <div class="login-section">
    <h1 class="app-title">Parents Login</h1>
    <p class="app-subtitle">Continue with Google to guide your child's journey</p>

    <!-- Advanced 3D Button -->
    <button type="button" id="googleBtn" class="btn-google" onclick="handleGoogleLogin()">
      <svg id="googleIcon" width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      <div class="btn-spinner" id="btnSpinner"></div>
      <span id="btnText">Continue with Google</span>
    </button>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="overlay-spinner"></div>
    <div class="loading-text">Logging you in...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    const overlay = document.getElementById('loadingOverlay');
    const googleBtn = document.getElementById('googleBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const googleIcon = document.getElementById('googleIcon');

    // Auto-redirect if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        overlay.style.display = 'flex';
        const savedAge = localStorage.getItem('kidsAgeGroup');
        setTimeout(() => {
            window.location.replace(!savedAge ? "age-select.html" : "index-home.html");
        }, 500); 
      }
    });

    window.handleGoogleLogin = async function() {
      // Haptic Feedback (Phone vibrate)
      if (navigator.vibrate) navigator.vibrate(50);

      // Loading State Start
      googleBtn.disabled = true;
      googleIcon.style.display = 'none';
      btnText.textContent = "Connecting...";
      btnSpinner.style.display = 'block';
      
      const provider = new GoogleAuthProvider(); 
      provider.setCustomParameters({ prompt: 'select_account' });
      
      try { 
        await signInWithPopup(auth, provider); 
        // Redirect will be handled by onAuthStateChanged
      } 
      catch (error) { 
        // Loading State Revert
        googleBtn.disabled = false;
        googleIcon.style.display = 'block';
        btnText.textContent = "Continue with Google";
        btnSpinner.style.display = 'none';
        
        if(error.code !== 'auth/popup-closed-by-user') { 
          alert("Login failed. Please check your internet and try again."); 
        }
      }
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { 
        navigator.serviceWorker.register('./service-worker.js'); 
      });
    }
  </script>
</body>
</html>
