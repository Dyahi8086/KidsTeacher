<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass Button</title>

<style>
body {
    background: #F7EBEF; /* Tumhara login background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
    margin: 0;
}

/* ========================================= */
/* LIQUID GLASS BUTTON (From Uiverse)        */
/* ========================================= */
#poda {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
}

.input {
    background-color: #010201;
    border: none;
    width: 301px;
    height: 56px;
    border-radius: 10px;
    color: white;
    padding-inline: 20px; /* Text left me kiya */
    font-size: 18px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    position: relative;
    z-index: 2;
}

.white,
.border,
.darkBorderBg,
.glow {
    max-height: 70px;
    max-width: 314px;
    height: 100%;
    width: 100%;
    position: absolute;
    overflow: hidden;
    z-index: 1; /* Piche rahega */
    border-radius: 12px;
    filter: blur(3px);
    pointer-events: none;
}

.white {
    max-height: 63px;
    max-width: 307px;
    border-radius: 10px;
    filter: blur(2px);
}

.white::before {
    content: "";
    z-index: -2;
    text-align: center;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(83deg);
    position: absolute;
    width: 600px;
    height: 600px;
    background-repeat: no-repeat;
    background-position: 0 0;
    filter: brightness(1.4);
    background-image: conic-gradient(
        rgba(0, 0, 0, 0) 0%,
        #a099d8,
        rgba(0, 0, 0, 0) 8%,
        rgba(0, 0, 0, 0) 50%,
        #dfa2da,
        rgba(0, 0, 0, 0) 58%
    );
    transition: all 2s;
}

.border {
    max-height: 59px;
    max-width: 303px;
    border-radius: 11px;
    filter: blur(0.5px);
}

.border::before {
    content: "";
    z-index: -2;
    text-align: center;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(70deg);
    position: absolute;
    width: 600px;
    height: 600px;
    filter: brightness(1.3);
    background-repeat: no-repeat;
    background-position: 0 0;
    background-image: conic-gradient(
        #1c191c,
        #402fb5 5%,
        #1c191c 14%,
        #1c191c 50%,
        #cf30aa 60%,
        #1c191c 64%
    );
    transition: all 2s;
}

.darkBorderBg {
    max-height: 65px;
    max-width: 312px;
}

.darkBorderBg::before {
    content: "";
    z-index: -2;
    text-align: center;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(82deg);
    position: absolute;
    width: 600px;
    height: 600px;
    background-repeat: no-repeat;
    background-position: 0 0;
    background-image: conic-gradient(
        rgba(0, 0, 0, 0),
        #18116a,
        rgba(0, 0, 0, 0) 10%,
        rgba(0, 0, 0, 0) 50%,
        #6e1b60,
        rgba(0, 0, 0, 0) 60%
    );
    transition: all 2s;
}

.glow {
    overflow: hidden;
    filter: blur(30px);
    opacity: 0.4;
    max-height: 130px;
    max-width: 354px;
}

.glow:before {
    content: "";
    z-index: -2;
    text-align: center;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(60deg);
    position: absolute;
    width: 999px;
    height: 999px;
    background-repeat: no-repeat;
    background-position: 0 0;
    background-image: conic-gradient(
        #000,
        #402fb5 5%,
        #000 38%,
        #000 50%,
        #cf30aa 60%,
        #000 87%
    );
    transition: all 2s;
}

/* Hover Effects */
#poda:hover > .darkBorderBg::before { transform: translate(-50%, -50%) rotate(262deg); }
#poda:hover > .glow::before { transform: translate(-50%, -50%) rotate(240deg); }
#poda:hover > .white::before { transform: translate(-50%, -50%) rotate(263deg); }
#poda:hover > .border::before { transform: translate(-50%, -50%) rotate(250deg); }

#poda:active > .darkBorderBg::before { transform: translate(-50%, -50%) rotate(442deg); transition: all 4s; }
#poda:active > .glow::before { transform: translate(-50%, -50%) rotate(420deg); transition: all 4s; }
#poda:active > .white::before { transform: translate(-50%, -50%) rotate(443deg); transition: all 4s; }
#poda:active > .border::before { transform: translate(-50%, -50%) rotate(430deg); transition: all 4s; }
</style>
</head>
<body>

<div id="poda">
    <!-- Glowing Layers -->
    <div class="glow"></div>
    <div class="darkBorderBg"></div>
    <div class="border"></div>
    <div class="white"></div>
    
    <!-- Actual Button -->
    <button class="input" onclick="alert('Login with Email clicked!')">
        Login with Email
    </button>
</div>

</body>
</html>
