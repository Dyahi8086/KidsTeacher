
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#ff6539">

<title>Parents Login - Kids Teacher</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Arial", sans-serif;
    background: #ff6539;
    color: #202333;
}

/* MAIN SCREEN */

.login-screen {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(
        180deg,
        #ff713f 0%,
        #ff6539 55%,
        #f95132 100%
    );
}

/* BACKGROUND CIRCLE */

.background-circle {
    position: absolute;

    width: 75vw;
    height: 75vw;

    max-width: 650px;
    max-height: 650px;

    top: -27%;
    left: -30%;

    border-radius: 50%;

    background: rgba(255, 190, 133, 0.24);

    pointer-events: none;
}

/* BOTTOM SHEET */

.login-sheet {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 55%;
    height: 55dvh;

    min-height: 390px;
    max-height: 650px;

    background: #ffe8e2;

    border-radius: 42px 42px 0 0;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding: 20px 24px 28px;

    box-shadow:
        0 -8px 30px rgba(130, 49, 30, 0.08);

    z-index: 2;
}

/* SHEET HANDLE */

.sheet-handle {
    width: 80px;
    height: 8px;

    background: #cbd3df;

    border-radius: 20px;

    margin-bottom: 48px;

    flex-shrink: 0;
}

/* GRADUATION CAP */

.cap-container {
    width: 100px;
    height: 100px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 20px;

    flex-shrink: 0;
}

.cap-icon {
    width: 100%;
    height: 100%;

    object-fit: contain;

    filter: drop-shadow(
        0 8px 8px rgba(90, 40, 20, 0.12)
    );
}

/* TITLE */

.login-title {
    font-size: clamp(27px, 5vw, 43px);

    font-weight: 900;

    color: #963a1c;

    text-align: center;

    line-height: 1.2;

    margin-bottom: 12px;

    letter-spacing: -1px;
}

/* SUBTITLE */

.login-subtitle {
    font-size: clamp(15px, 3.5vw, 21px);

    font-weight: 600;

    color: #68758b;

    text-align: center;

    margin-bottom: 38px;

    line-height: 1.4;
}

/* GOOGLE BUTTON */

.google-button {
    width: 100%;
    max-width: 520px;

    height: 86px;

    background: #ffffff;

    border: 2px solid #e5eaf1;

    border-radius: 60px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 16px;

    cursor: pointer;

    color: #151c2d;

    font-size: clamp(16px, 3.8vw, 24px);

    font-weight: 800;

    box-shadow:
        0 8px 0 #d8dfe8,
        0 16px 28px rgba(85, 50, 35, 0.12);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

    flex-shrink: 0;
}

.google-button:active {
    transform: translateY(5px);

    box-shadow:
        0 3px 0 #d8dfe8,
        0 8px 15px rgba(85, 50, 35, 0.1);
}

/* GOOGLE LOGO */

.google-logo {
    width: 34px;
    height: 34px;

    flex-shrink: 0;
}

/* FOOTER */

.footer {
    width: 100%;

    margin-top: auto;

    padding-top: 30px;

    text-align: center;

    color: #68758b;

    font-size: 14px;

    font-weight: 600;

    line-height: 1.8;
}

.footer a {
    color: #8f3c24;

    text-decoration: underline;

    font-weight: 800;
}

/* SMALL MOBILE */

@media (max-height: 700px) {

    .login-sheet {
        height: 57%;
        height: 57dvh;

        min-height: 350px;

        padding-top: 15px;
    }

    .sheet-handle {
        margin-bottom: 25px;
    }

    .cap-container {
        width: 75px;
        height: 75px;

        margin-bottom: 12px;
    }

    .login-subtitle {
        margin-bottom: 25px;
    }

    .google-button {
        height: 68px;
    }

    .footer {
        padding-top: 20px;
    }
}

/* VERY SMALL SCREEN */

@media (max-width: 360px) {

    .login-sheet {
        padding-left: 18px;
        padding-right: 18px;

        border-radius: 32px 32px 0 0;
    }

    .login-title {
        font-size: 27px;
    }

    .login-subtitle {
        font-size: 15px;
    }

    .google-button {
        height: 68px;
        font-size: 16px;
        gap: 10px;
    }

    .google-logo {
        width: 28px;
        height: 28px;
    }
}
</style>
</head>

<body>

<div class="login-screen">

    <!-- ORANGE BACKGROUND CIRCLE -->

    <div class="background-circle"></div>

    <!-- LOGIN BOTTOM SHEET -->

    <section class="login-sheet">

        <!-- HANDLE -->

        <div class="sheet-handle"></div>

        <!-- GRADUATION CAP -->

        <div class="cap-container">

            <svg
                class="cap-icon"
                viewBox="0 0 120 120"
                xmlns="http://www.w3.org/2000/svg">

                <!-- Cap top -->

                <path
                    d="M8 42 L60 13 L112 42 L60 72 Z"
                    fill="#292929"/>

                <!-- Cap lower part -->

                <path
                    d="M28 54 L28 73
                       Q60 101 92 73
                       L92 54
                       L60 72 Z"
                    fill="#363636"/>

                <!-- Front edge -->

                <path
                    d="M28 67
                       Q60 91 92 67
                       L92 73
                       Q60 101 28 73 Z"
                    fill="#202020"/>

                <!-- Yellow tassel -->

                <path
                    d="M60 39
                       Q76 43 62 56
                       Q51 62 54 76"
                    fill="none"
                    stroke="#ffca28"
                    stroke-width="5"
                    stroke-linecap="round"/>

                <!-- Tassel -->

                <path
                    d="M54 73
                       L48 99
                       L53 97
                       L56 102
                       L60 77
                       Z"
                    fill="#ffb900"/>

                <path
                    d="M58 73
                       L63 97
                       L67 94
                       L69 98
                       L64 71
                       Z"
                    fill="#ffca28"/>

            </svg>

        </div>

        <!-- TITLE -->

        <h1 class="login-title">
            Parents Login
        </h1>

        <!-- SUBTITLE -->

        <p class="login-subtitle">
            Guide your child's learning journey
        </p>

        <!-- GOOGLE LOGIN -->

        <button
            class="google-button"
            id="googleLogin"
            type="button">

            <svg
                class="google-logo"
                viewBox="0 0 48 48"
                xmlns="http://www.w3.org/2000/svg">

                <path
                    fill="#4285F4"
                    d="M43.6 24.5
                       c0-1.6-.1-3.2-.4-4.7H24v8.9h11
                       c-.5 2.9-2.2 5.3-4.7 6.9v5.8h7.6
                       c4.5-4.1 7.1-10.1 7.1-16.9z"/>

                <path
                    fill="#34A853"
                    d="M24 44
                       c6.5 0 12-2.2 16-6l-7.6-5.8
                       c-2.1 1.4-4.8 2.3-8.4 2.3
                       -6.4 0-11.8-4.3-13.7-10.1H2.5
                       v6C6.5 38.3 14.6 44 24 44z"/>

                <path
                    fill="#FBBC05"
                    d="M10.3 24.4
                       c-.5-1.4-.8-2.9-.8-4.4
                       s.3-3 .8-4.4v-6H2.5
                       C.9 13 .0 16.4 0 20
                       s.9 7 2.5 10.4l7.8-6z"/>

                <path
                    fill="#EA4335"
                    d="M24 8.5
                       c3.5 0 6.7 1.2 9.2 3.6
                       l6.8-6.8C35.9 1.9 30.5 0 24 0
                       14.6 0 6.5 5.7 2.5 13.6l7.8 6
                       C12.2 13.8 17.6 8.5 24 8.5z"/>

            </svg>

            <span>
                Continue with Google
            </span>

        </button>

        <!-- FOOTER -->

        <footer class="footer">

            <p>
                By continuing, you agree to our
            </p>

            <p>

                <a href="privacy.html">
                    Privacy Policy
                </a>

                and

                <a href="terms.html">
                    Terms of Service
                </a>

            </p>

        </footer>

    </section>

</div>

<script>

// GOOGLE LOGIN BUTTON

document.getElementById("googleLogin")
    .addEventListener("click", function () {

        /*
        Connect your existing Google authentication here.

        If Firebase Google authentication is already
        configured in your project, call that existing
        login function from here.

        Example:

        signInWithGoogle();

        */

        console.log("Google login button clicked");

    });

</script>

</body>
</html>
