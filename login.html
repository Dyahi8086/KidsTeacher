<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parents Login - Kids Teacher</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('kids_teacher_login_background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #fce8d5;
      padding: 16px;
      font-family: 'Quicksand', sans-serif;
    }

    /* True Frosted Glassmorphism Card */
    .login-card {
      width: min(92%, 410px);
      max-height: 94vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.55) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      border-radius: 36px;
      padding: 28px 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .brand-header {
      margin-bottom: 18px;
    }

    /* Combined 3D Star Book Emblem */
    .logo-3d-container {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 10px rgba(255, 126, 95, 0.3));
    }

    .app-title {
      font-family: 'Baloo 2', cursive, sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.1;
      letter-spacing: 0.2px;
    }

    .app-subtitle {
      font-size: 13.5px;
      color: #334155;
      font-weight: 700;
      margin-top: 3px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .input-box-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      font-size: 16px;
      color: #64748b;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      padding-left: 46px;
      padding-right: 46px;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid rgba(226, 232, 240, 0.85);
      border-radius: 18px;
      font-size: 14px;
      color: #1e293b;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #ff7e33;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 4px rgba(255, 126, 51, 0.15);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #64748b;
    }

    .forgot-container {
      text-align: right;
      margin-top: 2px;
      margin-bottom: 16px;
    }

    .forgot-link {
      font-size: 13px;
      color: #1e293b;
      text-decoration: none;
      font-weight: 700;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Orange Gradient Button */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff7e5f, #f97316);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-size: 17px;
      font-family: 'Baloo 2', cursive, sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c2410c, 0 10px 20px rgba(249, 115, 22, 0.35);
      transition: transform 0.1s ease;
      margin-bottom: 14px;
    }

    .btn-login:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c2410c;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 14px 0;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1.5px solid rgba(203, 213, 225, 0.8);
    }

    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }

    .btn-google {
      width: 100%;
      padding: 13px;
      background: rgba(255, 255, 255, 0.85);
      color: #334155;
      border: 2px solid rgba(226, 232, 240, 0.9);
      border-radius: 18px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: transform 0.1s ease;
      margin-bottom: 16px;
      text-decoration: none;
    }

    .btn-google:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    .create-account-text {
      text-align: center;
      font-size: 13.5px;
      color: #334155;
      font-weight: 700;
    }

    .create-account-link {
      color: #f97316;
      text-decoration: none;
      font-weight: 800;
    }

    .create-account-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="logo-3d-container">⭐📖</div>
      <h1 class="app-title">Parents Login</h1>
      <p class="app-subtitle">Manage your child’s learning journey</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <div class="input-box-wrapper">
          <span class="input-icon">✉️</span>
          <input type="text" id="email" class="form-input" placeholder="Email Address" required>
        </div>
      </div>

      <div class="form-group">
        <div class="input-box-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" class="form-input" placeholder="Password" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
        </div>
      </div>

      <div class="forgot-container">
        <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-login">Log In ➔</button>
    </form>

    <div class="divider">— OR —</div>

    <button type="button" class="btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>

    <div class="create-account-text">
      New here? <a href="#" class="create-account-link" onclick="handleCreateAccount(event)">Create Account</a>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      alert("Login feature will be active once Firebase authentication is configured.");
    }

    function handleForgotPassword(event) {
      event.preventDefault();
      alert("Password reset instructions will be sent to your email.");
    }

    function handleGoogleLogin() {
      alert("Google Sign-In requires Firebase authorized domain configuration.");
    }

    function handleCreateAccount(event) {
      event.preventDefault();
      alert("Account creation workflow will be connected with Firebase.");
    }
  </script>
</body>
</html>
