<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9f2fb"><title>Parents Login | Kids Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#172554;--purple:#6738f5;--muted:#68758c}*{box-sizing:border-box}
html{min-height:100%;background:#eaf6fa}body{margin:0;min-height:100vh;min-height:100dvh;font-family:Nunito,system-ui,sans-serif;color:var(--navy);background:url("kids_teacher_login_background.png") center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vh,28px) 14px;overflow-x:hidden}
.card{width:min(100%,430px);margin:auto;padding:clamp(20px,3.5vh,32px) clamp(17px,5vw,34px) 24px;border:1px solid rgba(255,255,255,.95);border-radius:34px;background:rgba(255,255,255,.91);box-shadow:0 18px 55px #2b4b732b,inset 0 1px #fff;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);text-align:center}
.icon{font-size:clamp(38px,8vw,52px);line-height:1.1;margin-bottom:7px;filter:drop-shadow(0 5px 5px #f2d9a9)}h1{margin:0;font-size:clamp(29px,7vw,39px);line-height:1.12;font-weight:900;letter-spacing:-.8px;color:#172554}.tag{margin:7px 0 22px;color:#71809a;font-size:16px;font-weight:800}
.field{display:flex;align-items:center;gap:12px;width:100%;min-height:57px;padding:0 15px;margin:0 0 12px;border:2px solid #e2e8f0;border-radius:20px;background:#f8fafcf2;transition:border-color .2s,box-shadow .2s}.field:focus-within{border-color:#8b79ff;box-shadow:0 0 0 4px #6f5bf51c}.field-icon{flex:0 0 auto;font-size:21px;color:#7b8da9}.field input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:#26334c;font:700 16px Nunito,sans-serif}.field input::placeholder{color:#778399;opacity:1}.eye{border:0;background:transparent;padding:5px;font-size:19px;cursor:pointer}.forgot{display:flex;justify-content:flex-end;margin:2px 1px 17px}a{color:#5145d8;font-weight:900;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid #9b8cff;outline-offset:3px}
.primary,.google{width:100%;min-height:59px;border-radius:20px;font:900 18px Nunito,sans-serif;cursor:pointer}.primary{color:#fff;border:0;background:linear-gradient(105deg,#159ef5,#6334f5);box-shadow:0 6px 0 #4630c9,0 12px 22px #5a3de133}.primary:active,.google:active{transform:translateY(2px)}.divider{display:flex;align-items:center;gap:12px;color:#94a0b2;font-weight:900;margin:23px 0 16px}.divider:before,.divider:after{content:"";flex:1;height:2px;background:#e4e9f0}.google{display:flex;align-items:center;justify-content:center;gap:12px;color:#24304a;background:#fff;border:2px solid #e3e8ef;box-shadow:0 4px 0 #d2d9e4;font-size:16px}.g{font:900 26px Arial,sans-serif;background:conic-gradient(from -45deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 70%,#ea4335 0 85%,#4285f4 0);color:transparent;background-clip:text;-webkit-background-clip:text}.create{margin:21px 0 0;color:#758197;font-weight:800;font-size:15px}.status{display:none;margin:14px 0 0;padding:10px 12px;border-radius:12px;background:#fff2e8;color:#9a3412;font-size:14px;font-weight:800;overflow-wrap:anywhere}.status.show{display:block}button:disabled{opacity:.65;cursor:wait}
@media(max-height:740px){body{padding-top:10px;padding-bottom:10px}.card{padding-top:18px;padding-bottom:18px;border-radius:28px}.tag{margin-bottom:15px}.field{min-height:51px;margin-bottom:9px}.forgot{margin-bottom:12px}.primary,.google{min-height:52px}.divider{margin:17px 0 12px}.create{margin-top:16px}}
@media(max-width:360px){body{padding-left:9px;padding-right:9px}.card{padding-left:15px;padding-right:15px}h1{font-size:28px}.field input{font-size:15px}.google{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main class="card" aria-labelledby="title">
<div class="icon" aria-hidden="true">📖✨</div><h1 id="title">Parents Login</h1><p class="tag">Learn, Play &amp; Grow!</p>
<form id="form">
<label class="field"><span class="field-icon" aria-hidden="true">✉</span><input id="email" type="email" autocomplete="username" placeholder="Email address" aria-label="Email address" required></label>
<label class="field"><span class="field-icon" aria-hidden="true">🔒</span><input id="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" minlength="6" required><button class="eye" type="button" id="toggle" aria-label="Show password">👁</button></label>
<div class="forgot"><a href="#" id="forgot">Forgot Password?</a></div><button class="primary" id="login" type="submit">Log In&nbsp; →</button>
</form><div class="divider"><span>OR</span></div><button class="google" id="google" type="button"><span class="g" aria-hidden="true">G</span> Continue with Google</button>
<p class="create">New here? <a href="#" id="create">Create Account</a></p><div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",authDomain:"kids-teacher-4387e.firebaseapp.com",projectId:"kids-teacher-4387e",storageBucket:"kids-teacher-4387e.firebasestorage.app",messagingSenderId:"420221167346",appId:"1:420221167346:web:da7ac80acdfd52339d526b",measurementId:"G-VJVS2ZMNLY"};
const auth=getAuth(initializeApp(firebaseConfig)),provider=new GoogleAuthProvider(),form=document.querySelector("#form"),email=document.querySelector("#email"),password=document.querySelector("#password"),statusBox=document.querySelector("#status"),login=document.querySelector("#login");let createMode=false;
function msg(t,ok=false){statusBox.textContent=t;statusBox.classList.add("show");statusBox.style.background=ok?"#e8fff1":"#fff2e8";statusBox.style.color=ok?"#166534":"#9a3412"}
function err(e){return({"auth/invalid-email":"Email address sahi nahi hai.","auth/user-not-found":"Is email se account nahi mila.","auth/wrong-password":"Password galat hai.","auth/invalid-credential":"Email ya password galat hai.","auth/email-already-in-use":"Is email ka account pehle se hai.","auth/weak-password":"Password kam se kam 6 characters ka rakhein.","auth/popup-closed-by-user":"Google login window band ho gayi. Dobara try karein.","auth/operation-not-allowed":"Firebase Console mein Email/Password ya Google sign-in enable karein.","auth/unauthorized-domain":"Firebase Authentication ke Authorized domains mein apna GitHub Pages domain add karein.","auth/network-request-failed":"Internet connection check karke dobara try karein."})[e.code]||("Login nahi ho paya: "+(e.message||"Dobara try karein."))}
document.querySelector("#toggle").onclick=()=>{password.type=password.type==="password"?"text":"password"};
document.querySelector("#create").onclick=e=>{e.preventDefault();createMode=!createMode;document.querySelector("#title").textContent=createMode?"Create Parent Account":"Parents Login";login.innerHTML=createMode?"Create Account&nbsp; →":"Log In&nbsp; →";document.querySelector("#create").textContent=createMode?"Log In":"Create Account";statusBox.classList.remove("show")};
document.querySelector("#forgot").onclick=async e=>{e.preventDefault();if(!email.value.trim()){msg("Password reset ke liye pehle apna email likhein.");email.focus();return}try{await sendPasswordResetEmail(auth,email.value.trim());msg("Reset link email par bhej diya gaya hai. Inbox aur spam check karein.",true)}catch(x){msg(err(x))}};
form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;login.disabled=true;login.textContent=createMode?"Creating account…":"Logging in…";try{if(createMode){await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);msg("Account ban gaya! Aap login ho gaye hain.",true)}else{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);msg("Login successful!",true)}}catch(x){msg(err(x))}finally{login.disabled=false;login.innerHTML=createMode?"Create Account&nbsp; →":"Log In&nbsp; →"}};
document.querySelector("#google").onclick=async()=>{try{await signInWithPopup(auth,provider);msg("Google login successful!",true)}catch(x){msg(err(x))}};
</script></body></html>
