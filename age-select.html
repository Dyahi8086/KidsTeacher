<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fff7ed">
    <title>Select Age - Kids Teacher</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            font-family: 'Nunito', sans-serif;
            /* Premium Soft Peach/Orange Gradient */
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fed7aa 100%);
            overflow: hidden;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            width: 100%;
            z-index: 10;
        }

        .back-btn, .skip-btn {
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #9a3412;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Text Content */
        .text-content {
            text-align: center;
            padding: 0 20px;
            z-index: 10;
        }

        .title {
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            font-weight: 700;
        }

        /* --- VERTICAL SLIDER CONTAINER --- */
        .slider-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }

        /* Dotted Line */
        .dotted-line {
            position: absolute;
            height: 60%;
            width: 4px;
            background-image: linear-gradient(to bottom, #cbd5e1 50%, transparent 50%);
            background-size: 4px 12px; /* Dots banane ke liye */
            z-index: 1;
        }

        /* Numbers Wrapper */
        .numbers-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 2;
            position: relative;
        }

        .age-number {
            font-family: 'Fredoka', sans-serif;
            font-size: 44px;
            font-weight: 700;
            color: #fdba74; /* Halka orange */
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.5;
        }

        /* Selected Number (Beech wala) */
        .age-number.active {
            font-size: 64px;
            color: #f97316; /* Gehra orange */
            opacity: 1;
            /* Glowing Ring */
            background: #ffffff;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.2), inset 0 0 10px rgba(255,255,255,0.8);
            border: 4px solid #ffedd5;
            transform: scale(1.1);
            /* 3D Text Shadow */
            text-shadow: 0px 4px 0px #fed7aa;
        }

        /* Bottom Button Area */
        .bottom-area {
            padding: 20px 20px 40px 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .continue-btn {
            width: 100%;
            max-width: 350px;
            padding: 18px;
            background: linear-gradient(135deg, #FF8C42, #FF5E3A);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #C2410C, 0 10px 20px rgba(255, 94, 58, 0.3);
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: pulseBtn 2s infinite;
        }

        .continue-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #C2410C, 0 4px 10px rgba(0,0,0,0.2);
            animation: none;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Haptic class for animation */
        .active-scale {
            transform: scale(1.1);
        }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="window.history.back()">←</button>
        <button class="skip-btn" onclick="skipSelection()">Skip</button>
    </div>

    <!-- Text -->
    <div class="text-content">
        <h1 class="title">How old are they?</h1>
        <p class="subtitle">Select the age to personalize your experience.</p>
    </div>

    <!-- Vertical Slider -->
    <div class="slider-container">
        <div class="dotted-line"></div>
        
        <div class="numbers-wrapper" id="numbersWrapper">
            <!-- JavaScript se numbers generate honge ya hardcode kar sakte hain -->
            <button class="age-number" onclick="selectAge(2, this)">2</button>
            <button class="age-number active" onclick="selectAge(4, this)">4</button>
            <button class="age-number" onclick="selectAge(6, this)">6</button>
        </div>
    </div>

    <!-- Continue Button -->
    <div class="bottom-area">
        <button class="continue-btn" onclick="confirmAge()">Continue</button>
    </div>

    <script>
        let selectedAge = 4; // Default selected age

        function selectAge(age, element) {
            // Haptic feedback
            if (navigator.vibrate) navigator.vibrate(40);

            // Saare numbers se 'active' class hatao
            const numbers = document.querySelectorAll('.age-number');
            numbers.forEach(num => num.classList.remove('active'));

            // Jis par click kiya usko 'active' karo
            element.classList.add('active');

            // Age update karo
            selectedAge = age;
        }

        function confirmAge() {
            // Age ko localStorage me save karo
            localStorage.setItem('kidsAgeGroup', selectedAge);
            
            // Haptic
            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);

            // Redirect to Home Page
            window.location.href = "index-home.html";
        }

        function skipSelection() {
            localStorage.setItem('kidsAgeGroup', '4'); // Default
            window.location.href = "index-home.html";
        }
    </script>
</body>
</html>
