<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Select Age Group - Kids Teacher</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fef08a, #fed7aa, #fbcfe8);
      padding: 16px;
      font-family: 'Quicksand', sans-serif;
    }

    .card {
      width: min(92%, 420px);
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 36px;
      padding: 30px 22px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .title {
      font-family: 'Baloo 2', cursive;
      font-size: 28px;
      color: #9a3412;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #475569;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .age-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .age-btn {
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #fed7aa;
      border-radius: 20px;
      font-size: 18px;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      box-shadow: 0 6px 0 #fdba74;
      transition: transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .age-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #fdba74;
    }

    .age-btn:hover {
      background: #fff;
      border-color: #f97316;
      color: #f97316;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Select Age Group 🎈</h1>
    <p class="subtitle">Choose your little learner's age</p>

    <div class="age-options">
      <button class="age-btn" onclick="selectAge('2-4')">🧸 2 - 4 Years (Toddlers)</button>
      <button class="age-btn" onclick="selectAge('4-6')">🎨 4 - 6 Years (Preschool)</button>
      <button class="age-btn" onclick="selectAge('6-8')">🚀 6 - 8 Years (Juniors)</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",
      authDomain: "kids-teacher-4387e.firebaseapp.com",
      projectId: "kids-teacher-4387e",
      storageBucket: "kids-teacher-4387e.firebasestorage.app",
      messagingSenderId: "420221167346",
      appId: "1:420221167346:web:da7ac80acdfd52339d526b",
      measurementId: "G-VJVS2ZMNLY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("login.html");
      }
    });

    window.selectAge = function(ageGroup) {
      localStorage.setItem('kidsAgeGroup', ageGroup);
      window.location.replace("index-home.html");
    }
  </script>
</body>
</html>
