<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<title>Child's Name • Kids Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900;1000&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:'Nunito',sans-serif}
body{visibility:visible;min-height:100dvh;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;background:#fffdf7;color:#29233b}
.doodles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.doodle{position:absolute;font-size:clamp(25px,7vw,54px);filter:drop-shadow(0 3px 1px rgba(0,0,0,.08));animation:bob 4s ease-in-out infinite}
.d1{top:3%;left:4%;transform:rotate(-15deg)}.d2{top:4%;right:5%;animation-delay:-1s}.d3{top:23%;left:-3%;font-size:48px;animation-delay:-2s}.d4{top:24%;right:2%;font-size:42px;animation-delay:-.5s}.d5{bottom:18%;left:3%;font-size:42px;animation-delay:-1.5s}.d6{bottom:17%;right:3%;font-size:46px;animation-delay:-2.5s}.d7{bottom:2%;left:15%;font-size:34px}.d8{bottom:3%;right:15%;font-size:35px}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -9px}}
.scene{position:relative;z-index:1;width:min(100%,430px);text-align:center;padding:12px 8px}
h1{font-size:clamp(37px,9.5vw,54px);line-height:1.02;letter-spacing:-1.7px;font-weight:1000;margin:0 auto 24px;color:#f05b68;text-shadow:0 4px 0 #713d54,0 7px 0 rgba(0,0,0,.08);-webkit-text-stroke:1.5px #47314b;paint-order:stroke fill}
h1 span{display:block}
h1 .your{color:#ffad35;text-shadow:0 4px 0 #9b592d,0 7px 0 rgba(0,0,0,.08)}
h1 .name{color:#53cba0;text-shadow:0 4px 0 #34765f,0 7px 0 rgba(0,0,0,.08)}
.paper{position:relative;margin:0 auto 24px;width:91%;min-height:155px;padding:35px 18px 24px;background:#fffced;border:3px solid #443b48;border-radius:18px 8px 18px 8px;box-shadow:7px 8px 0 rgba(68,59,72,.14);transform:rotate(-.7deg)}
.paper:before{content:"";position:absolute;top:-3px;right:28px;width:44px;height:16px;background:#fffced;border-left:3px solid #443b48;border-bottom:3px solid #443b48;border-radius:0 0 0 14px;transform:skewX(25deg)}
.paper:after{content:"";position:absolute;bottom:13px;left:18px;right:18px;border-bottom:3px dotted #766b78;opacity:.5}
input{position:relative;z-index:1;width:100%;height:62px;border:0;outline:0;background:transparent;text-align:center;font:800 27px Nunito,sans-serif;color:#1674ee}
input::placeholder{color:#827987;font-weight:700;font-size:24px}
button{position:relative;width:88%;height:76px;border:4px solid #45364d;border-radius:19px;background:linear-gradient(90deg,#ff6268 0 20%,#ffb43f 20% 40%,#58c98e 40% 60%,#40b9e9 60% 80%,#a477e8 80%);color:#fff;font:1000 27px Nunito,sans-serif;letter-spacing:1px;text-shadow:0 3px 0 #53415d,1px 4px 0 #53415d;-webkit-text-stroke:.5px #493b51;box-shadow:0 8px 0 #45364d,0 13px 18px rgba(55,45,68,.16);transition:transform .12s,box-shadow .12s}
button:active{transform:translateY(6px);box-shadow:0 2px 0 #45364d,0 5px 10px rgba(55,45,68,.14)}
button:disabled{opacity:.6}
button .letter{display:inline-block}
button.name-entered .letter{animation:letterBounce .65s ease-in-out infinite alternate}
button.name-entered .letter:nth-child(2){animation-delay:.06s}
button.name-entered .letter:nth-child(3){animation-delay:.12s}
button.name-entered .letter:nth-child(4){animation-delay:.18s}
button.name-entered .letter:nth-child(5){animation-delay:.24s}
button.name-entered .letter:nth-child(6){animation-delay:.30s}
button.name-entered .letter:nth-child(7){animation-delay:.36s}
button.name-entered .letter:nth-child(8){animation-delay:.42s}
@keyframes letterBounce{from{transform:translateY(0) rotate(0)}to{transform:translateY(-7px) rotate(-4deg)}}
#status{min-height:18px;margin:16px 0 0;color:#b33d68;font-size:13px;font-weight:800}
@media(max-height:700px){h1{font-size:44px;margin-bottom:17px}.paper{min-height:125px;padding-top:24px;margin-bottom:18px}input{height:54px}button{height:65px}}


/* KIDS TEACHER — unified playful purple + pastel design system */

body{background:radial-gradient(ellipse at 10% 8%,#f0eaff 0%,transparent 35%),radial-gradient(ellipse at 90% 82%,#e6f4ff 0%,transparent 38%),linear-gradient(145deg,#fff 0%,#faf8ff 58%,#f2edff 100%);color:#30234e}
.doodle{filter:drop-shadow(0 4px 5px rgba(126,88,207,.16))}
h1{color:#8557e8;text-shadow:0 3px 0 #e6dcff,0 7px 12px rgba(94,64,155,.10);-webkit-text-stroke:0 transparent}
h1 .your{color:#f5a940;text-shadow:0 3px 0 #ffe2ad,0 7px 12px rgba(94,64,155,.08)}
h1 .name{color:#48bd91;text-shadow:0 3px 0 #c8f1df,0 7px 12px rgba(94,64,155,.08)}
.paper{background:linear-gradient(145deg,#fff,#f5f0ff);border:1.5px solid #fff;border-radius:26px;box-shadow:0 12px 28px rgba(95,70,148,.12),inset 0 1px 0 #fff;transform:none}
.paper:before{background:#eee7ff;border:0;border-radius:0 0 10px 10px}
.paper:after{border-bottom-color:#d8cef1}
input{color:#7449d2}
input::placeholder{color:#aaa2bb}
button{border:1px solid rgba(255,255,255,.92);border-radius:22px;background:linear-gradient(135deg,#a17aff 0%,#895cf3 52%,#7049d5 100%);color:#fff;text-shadow:0 2px 4px rgba(55,35,105,.18);-webkit-text-stroke:0;box-shadow:0 6px 0 #6240bd,0 13px 24px rgba(113,75,202,.20),inset 0 2px 0 rgba(255,255,255,.4)}
button:active{box-shadow:0 2px 0 #6240bd,0 5px 10px rgba(55,45,68,.12)}
#status{color:#a34b86}

</style>
</head>
<body>
<div class="doodles" aria-hidden="true">
<span class="doodle d1">⭐</span><span class="doodle d2">🪐</span><span class="doodle d3">☁️</span><span class="doodle d4">🌟</span><span class="doodle d5">✏️</span><span class="doodle d6">🐰</span><span class="doodle d7">🌈</span><span class="doodle d8">🚗</span>
</div>
<main class="scene">
<h1><span>What's</span><span class="your">your child's</span><span class="name">name?</span></h1>
<form id="nameForm">
<div class="paper"><input id="childName" type="text" maxlength="24" autocomplete="given-name" placeholder="Type here..." required></div>
<button id="saveBtn" type="submit"><span class="letter">C</span><span class="letter">O</span><span class="letter">N</span><span class="letter">T</span><span class="letter">I</span><span class="letter">N</span><span class="letter">U</span><span class="letter">E</span></button>
</form>
<p id="status" role="status"></p>
</main>
<script type="module">
import { supabase } from "./supabase-client.js";

const form=document.getElementById("nameForm");
const input=document.getElementById("childName");
const button=document.getElementById("saveBtn");
const status=document.getElementById("status");

function updateContinueAnimation(){
  button.classList.toggle("name-entered",input.value.trim().length>0);
}
input.addEventListener("input",updateContinueAnimation);
let user=null;
let submitting=false;

const {data:sessionData,error:sessionError}=await supabase.auth.getSession();
if(sessionError) console.error("Supabase session check:",sessionError);
user=sessionData.session?.user||null;

if(!user){
  location.replace("./login.html");
}else{
  document.body.style.visibility="visible";
  const {data:profile,error}=await supabase
    .from("profiles")
    .select("child_name,buddy")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    console.error("Supabase profile lookup failed:",error);
    status.textContent="Profile load nahi hua. Internet check karke refresh karo.";
  }else if(profile?.child_name){
    input.value=profile.child_name;
    location.replace(profile.buddy?.id ? "./index-home.html" : "./buddy-selection.html");
  }
}

form.addEventListener("submit",async event=>{
  event.preventDefault();
  if(submitting)return;

  const name=input.value.trim().replace(/\s+/g," ");
  if(!name){status.textContent="Please enter your child's name.";return;}
  if(!user){status.textContent="Login is still loading. Please try again.";return;}

  submitting=true;
  button.disabled=true;
  button.textContent="Saving...";
  status.textContent="";

  const {data:savedProfile,error}=await supabase
    .from("profiles")
    .upsert({
      id:user.id,
      child_name:name,
      display_name:user.user_metadata?.full_name||user.user_metadata?.name||"",
      email:user.email||"",
      updated_at:new Date().toISOString()
    },{onConflict:"id"})
    .select("id,child_name")
    .single();

  if(error||!savedProfile?.id){
    console.error("Supabase child name save failed:",error||"Saved profile was not confirmed");
    status.textContent="Name save nahi hua. Dobara try karo.";
    submitting=false;
    button.disabled=false;
    button.innerHTML='<span class="letter">C</span><span class="letter">O</span><span class="letter">N</span><span class="letter">T</span><span class="letter">I</span><span class="letter">N</span><span class="letter">U</span><span class="letter">E</span>';
    updateContinueAnimation();
    return;
  }

  location.replace("./buddy-selection.html");
});
</script>
</body>
</html>
