<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff2f7">
<title>Child's Name • Kids Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 12% 8%,#fff 0,transparent 34%),linear-gradient(145deg,#fff5f8,#f8dce8 55%,#f4cbdc);font-family:Nunito,sans-serif;color:#30232b}
.panel{width:min(100%,440px);padding:34px 24px 28px;border:1px solid rgba(255,255,255,.9);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(255,247,250,.62));box-shadow:0 24px 60px rgba(157,91,119,.16),inset 0 1px 0 #fff;backdrop-filter:blur(28px);text-align:center}
.icon{font-size:58px;margin-bottom:12px}
h1{font-size:30px;line-height:1.1;margin:0 0 10px;font-weight:900}
p{font-size:14px;line-height:1.55;color:#78616e;font-weight:700;margin:0 0 24px}
input{width:100%;height:58px;border:1.5px solid rgba(190,120,150,.28);border-radius:18px;padding:0 17px;background:rgba(255,255,255,.82);font:800 17px Nunito;color:#30232b;outline:none}
input:focus{border-color:#dc83a7;box-shadow:0 0 0 4px rgba(220,131,167,.13)}
button{width:100%;margin-top:18px;border:0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#ef9fbe,#d96f9a);color:white;font:900 16px Nunito;box-shadow:0 8px 20px rgba(200,100,145,.22)}
button:disabled{opacity:.5}
#status{min-height:18px;margin:12px 0 0;color:#a0446d;font-size:12px}
</style>
</head>
<body>
<main class="panel">
<div class="icon">🧒🏻</div>
<h1>What is your child's name?</h1>
<p>First, tell us your little learner's name. Then choose a buddy who will be named after your child! ✨</p>
<form id="nameForm">
<input id="childName" type="text" maxlength="24" autocomplete="given-name" placeholder="Enter child's name" required>
<button id="saveBtn" type="submit">Continue →</button>
</form>
<p id="status" role="status"></p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const config={apiKey:"AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",authDomain:"kids-teacher-4387e.firebaseapp.com",projectId:"kids-teacher-4387e",storageBucket:"kids-teacher-4387e.firebasestorage.app",messagingSenderId:"420221167346",appId:"1:420221167346:web:da7ac80acdfd52339d526b",measurementId:"G-VJVS2ZMNLY"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const form=document.getElementById("nameForm"),input=document.getElementById("childName"),button=document.getElementById("saveBtn"),status=document.getElementById("status");
let user=null,existingBuddy=null;
onAuthStateChanged(auth,async u=>{if(!u){location.replace("./login.html");return}user=u;try{const snap=await getDoc(doc(db,"users",u.uid));if(snap.exists()){const data=snap.data();if(data.childName)input.value=data.childName;existingBuddy=data.buddy||null;}}catch(e){console.error(e)}});
form.addEventListener("submit",async e=>{e.preventDefault();const name=input.value.trim().replace(/\s+/g," ");if(!user||name.length<1){status.textContent="Please enter your child's name.";return}button.disabled=true;button.textContent="Saving…";status.textContent="";try{const update={childName:name,updatedAt:serverTimestamp()};if(existingBuddy?.id)update.buddy={...existingBuddy,name};await setDoc(doc(db,"users",user.uid),update,{merge:true});location.replace(existingBuddy?.id?"./index-home.html":"./buddy-selection.html")}catch(err){console.error(err);status.textContent="Could not save name. Please try again.";button.disabled=false;button.textContent="Continue →"}});
</script>
</body>
</html>
