<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff5f8">
<title>Child's Name • Kids Teacher</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100dvh;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;padding:0;background:radial-gradient(ellipse at 12% 10%,#fff 0%,transparent 32%),radial-gradient(ellipse at 88% 22%,rgba(255,205,222,.78) 0%,transparent 38%),radial-gradient(ellipse at 14% 88%,rgba(255,185,211,.58) 0%,transparent 40%),linear-gradient(145deg,#fff5f8 0%,#f9dce7 48%,#f4c9d9 100%);font-family:'Plus Jakarta Sans',sans-serif;color:#30232b}
.panel{position:relative;width:100%;max-width:500px;min-height:390px;padding:76px 27px max(34px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(255,247,250,.68) 48%,rgba(255,230,239,.62));border:1px solid rgba(255,255,255,.92);border-bottom:0;border-radius:42px 42px 0 0;box-shadow:0 -24px 65px rgba(157,91,119,.18),inset 0 2px 2px rgba(255,255,255,.98),inset 0 -5px 18px rgba(210,145,170,.12);backdrop-filter:blur(42px) saturate(160%);-webkit-backdrop-filter:blur(42px) saturate(160%);animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
.panel:before{content:"";position:absolute;top:18px;left:50%;transform:translateX(-50%);width:66px;height:6px;border-radius:20px;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(157,91,119,.12)}
@keyframes rise{from{transform:translateY(35px);opacity:0}to{transform:translateY(0);opacity:1}}
h1{font-family:Outfit,sans-serif;font-size:clamp(31px,8vw,40px);line-height:1.12;letter-spacing:-1.2px;font-weight:800;color:#30232b;margin:0 0 34px}
input{width:100%;height:62px;border:1.5px solid rgba(190,120,150,.28);border-radius:18px;padding:0 20px;background:rgba(255,255,255,.88);font:700 17px 'Plus Jakarta Sans',sans-serif;color:#30232b;outline:none;box-shadow:inset 0 2px 5px rgba(120,70,95,.035);transition:.2s}
input::placeholder{color:#9a8791;font-weight:600}
input:focus{border-color:#dc83a7;box-shadow:0 0 0 4px rgba(220,131,167,.13),inset 0 2px 5px rgba(120,70,95,.035)}
button{width:100%;height:62px;margin-top:17px;border:1px solid rgba(255,255,255,.55);border-radius:19px;background:linear-gradient(135deg,#e98fb3,#d96f9a);color:#fff;font:800 18px Outfit,sans-serif;letter-spacing:.1px;box-shadow:0 12px 26px rgba(200,100,145,.23),inset 0 1px 1px rgba(255,255,255,.42);transition:transform .16s,filter .16s}
button:active{transform:scale(.98);filter:brightness(1.04)}
button:disabled{opacity:.55}
#status{min-height:17px;margin:12px 0 0;color:#a0446d;font-size:12px;font-weight:700}
@media(min-height:850px){.panel{min-height:440px;padding-top:86px}}
@media(max-height:650px){.panel{min-height:340px;padding-top:65px}h1{margin-bottom:24px}input,button{height:56px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.panel{background:rgba(255,248,251,.97)}}
</style>
</head>
<body>
<main class="panel">
<h1>What is your child's name?</h1>
<form id="nameForm">
<input id="childName" type="text" maxlength="24" autocomplete="given-name" placeholder="Enter child's name" required>
<button id="saveBtn" type="submit">Continue</button>
</form>
<p id="status" role="status"></p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const config={apiKey:"AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",authDomain:"kids-teacher-4387e.firebaseapp.com",projectId:"kids-teacher-4387e",storageBucket:"kids-teacher-4387e.firebasestorage.app",messagingSenderId:"420221167346",appId:"1:420221167346:web:da7ac80acdfd52339d526b",measurementId:"G-VJVS2ZMNLY"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const form=document.getElementById("nameForm"),input=document.getElementById("childName"),button=document.getElementById("saveBtn"),status=document.getElementById("status");
let user=null,existingBuddy=null;
onAuthStateChanged(auth,async u=>{if(!u){location.replace("./login.html");return}user=u;try{const snap=await getDoc(doc(db,"users",u.uid));if(snap.exists()){const data=snap.data();if(data.childName)input.value=data.childName;existingBuddy=data.buddy||null;}}catch(e){console.error(e)}});
form.addEventListener("submit",async e=>{e.preventDefault();const name=input.value.trim().replace(/\s+/g," ");if(!user||name.length<1){status.textContent="Please enter your child's name.";return}button.disabled=true;button.textContent="Saving…";status.textContent="";try{const update={childName:name,updatedAt:serverTimestamp()};if(existingBuddy?.id)update.buddy={...existingBuddy,name};await setDoc(doc(db,"users",user.uid),update,{merge:true});location.replace(existingBuddy?.id?"./index-home.html":"./buddy-selection.html")}catch(err){console.error(err);status.textContent="Could not save name. Please try again.";button.disabled=false;button.textContent="Continue"}}); 
</script>
</body>
</html>
