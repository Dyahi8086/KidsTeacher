 const d=document.createElement("span"),r=document.createElement("span");d.className="sheet direction";r.className="sheet reaction";
 d.style.backgroundImage='url("'+base+name+'-directions.webp")';r.style.backgroundImage='url("'+base+name+'-reactions.webp")';
 r.style.opacity="0";inner.append(d,r);b.append(inner);
 let reactionTimer=null,reactionIndex=0,lastBoop=0;
 function cell(i){return ((i%3)*50)+"% "+(Math.floor(i/3)*50)+"%"}
 function showDirection(i){d.style.backgroundPosition=cell(i);d.style.opacity="1";r.style.opacity="0"}
 function playReaction(i,duration=720){if(reactionTimer)clearTimeout(reactionTimer);r.style.backgroundPosition=cell(i);r.style.opacity="1";d.style.opacity="0";reactionTimer=setTimeout(()=>{r.style.opacity="0";d.style.opacity="1"},duration)}
 function boop(){const now=Date.now();reactionIndex=now-lastBoop<1800?(reactionIndex+1)%reactions.length:8;lastBoop=now;playReaction(reactionIndex,reactionIndex===6?1250:850);if(!matchMedia("(prefers-reduced-motion: reduce)").matches)inner.animate([{transform:"scale(1,1)"},{transform:"scale(1.09,.88)",offset:.2},{transform:"scale(.96,1.06)",offset:.48},{transform:"scale(1.02,.98)",offset:.76},{transform:"scale(1,1)"}],{duration:460,easing:"cubic-bezier(.2,.8,.2,1)"})}
 showDirection(4);
 b.addEventListener("pointermove",event=>{if(event.pointerType==="touch")return;const rect=b.getBoundingClientRect();const x=Math.max(0,Math.min(2,Math.floor((event.clientX-rect.left)/rect.width*3)));const y=Math.max(0,Math.min(2,Math.floor((event.clientY-rect.top)/rect.height*3)));showDirection(y*3+x)});
 b.addEventListener("pointerleave",()=>showDirection(4));b.addEventListener("click",boop);
 if(isPreview){if(previewIdleTimer)clearInterval(previewIdleTimer);if(previewIdleTimeout)clearTimeout(previewIdleTimeout);let idleIndex=0;const idleFrames=[0,4,5,8,1,7,2,6,3];previewIdleTimer=setInterval(()=>{if(document.hidden)return;const frame=idleFrames[idleIndex++%idleFrames.length];playReaction(frame,frame===6?950:540)},2800)}
 return b;
}
const initialBig=sprite("bunny",136,"preview",true);initialBig.id="bigMascot";big.replaceWith(initialBig);big=initialBig;
function choose(name){selected=name;const label=name==="sheep"?"Sheep":name.charAt(0).toUpperCase()+name.slice(1);const next=sprite(name,136,label,true);next.id="bigMascot";big.replaceWith(next);big=next;document.getElementById("previewTitle").textContent=label.charAt(0).toUpperCase()+label.slice(1)+" is your Buddy!";document.getElementById("previewText").textContent="Tap your Buddy to see its reaction.";button.disabled=false;button.style.display="block";render()}
function render(){grid.innerHTML="";names.forEach(name=>{const card=document.createElement("button");card.type="button";card.className="buddy"+(selected===name?" selected":"");const m=sprite(name,82,name);m.tabIndex=-1;card.append(m);const n=document.createElement("span");n.className="mascot-name";n.textContent=name.replace(/-/g," ");const s=document.createElement("span");s.className="selected-label";s.textContent="";card.append(n,s);card.addEventListener("click",()=>{if(selected===name){selected=null;const reset=sprite("bunny",136,"preview",true);reset.id="bigMascot";big.replaceWith(reset);big=reset;document.getElementById("previewTitle").textContent="Choose your favourite character";document.getElementById("previewText").textContent="Tap a character to meet your new friend!";button.disabled=true;button.style.display="none";status.textContent="";render()}else{choose(name)}});grid.append(card)})}
render();
const {data:sessionData,error:sessionError}=await supabase.auth.getSession();
if(sessionError)console.error("Supabase session check:",sessionError);
user=sessionData.session?.user||null;
if(!user){location.replace("./login.html");}
else{
 const {data:profile,error}=await supabase.from("profiles").select("child_name,buddy").eq("id",user.id).maybeSingle();
 document.body.style.visibility="visible";
 if(error){
  console.error("Supabase buddy profile lookup failed:",error);
  status.textContent="Profile load nahi hua. Internet check karke refresh karo.";
 }else if(!profile?.child_name){
  location.replace("./child-name.html");
 }else{
  childName=profile.child_name;
  if(profile.buddy?.id){
   localStorage.setItem("kt_buddy_"+user.id,JSON.stringify(profile.buddy));
   location.replace("./index-home.html");
  }
 }
}

button.addEventListener("click",async()=>{
 if(!selected)return;
 const label=(childName||"").trim();
 if(!label){status.textContent="Please enter your child's name first.";return}
 if(!user){status.textContent="Login session not ready. Please wait and try again.";return}
 const selectedBuddy={id:selected,name:label,character:selected,emoji:"",directions:base+selected+"-directions.webp",reactions:base+selected+"-reactions.webp"};
 button.disabled=true;button.textContent="Continue →";status.textContent="";
 const {data:savedProfile,error}=await supabase.from("profiles").upsert({
  id:user.id,
  email:user.email||"",
  display_name:user.user_metadata?.full_name||user.user_metadata?.name||"",
  child_name:label,
  buddy:selectedBuddy,
  updated_at:new Date().toISOString()
 },{onConflict:"id"}).select("id,child_name,buddy").single();
 if(error||!savedProfile?.buddy?.id){
  console.error("Supabase buddy save failed:",error||"Buddy was not confirmed in saved profile");
  status.textContent="Save error: "+(error?.message||"Buddy data confirm nahi hua");
  button.disabled=false;button.textContent="Next →";return;
 }
 localStorage.setItem("kt_child_name_"+user.id,savedProfile.child_name);
 localStorage.setItem("kt_buddy_"+user.id,JSON.stringify(savedProfile.buddy));
 location.replace("./index-home.html");
});
