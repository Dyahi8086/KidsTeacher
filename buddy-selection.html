const reactions=["blink","heart","sparkle","surprised","wink","bashful","sleepy","dizzy","delighted"];
function sprite(name,size,label,isPreview=false){const b=document.createElement("div");b.className="mascot";b.style.width=size+"px";b.style.height=size+"px";b.setAttribute("aria-label","Boop "+label);const inner=document.createElement("span");inner.className="mascot-inner";const d=document.createElement("span"),r=document.createElement("span");d.className="sheet direction";r.className="sheet reaction";d.style.backgroundImage='url("'+base+name+'-directions.webp")';r.style.backgroundImage='url("'+base+name+'-reactions.webp")';r.style.opacity="0";inner.append(d,r);b.append(inner);let timer=[],boops=0,last=0,sector=-1;function cell(i){return ((i%3)*50)+"% "+(Math.floor(i/3)*50)+"%"}d.style.backgroundPosition=cell(4);r.style.backgroundPosition=cell(0);function boop(){timer.forEach(clearTimeout);timer=[];const now=Date.now();boops=now-last<1600?boops+1:1;last=now;const idx=boops>=4?7:[1,2,8][(boops-1)%3];if(boops>=4)boops=0;r.style.backgroundPosition=cell(idx);r.style.opacity="1";d.style.opacity="0";timer.push(setTimeout(()=>{r.style.opacity="0";d.style.opacity="1"},idx===7?1100:560));if(!matchMedia("(prefers-reduced-motion: reduce)").matches){inner.animate([{transform:"scale(1,1)"},{transform:"scale(1.1,.86)",offset:.18},{transform:"scale(.95,1.08)",offset:.45},{transform:"scale(1.03,.97)",offset:.72},{transform:"scale(1,1)"}],{duration:420})}}
if(isPreview){
 let idleTimer=null;
 let idleIndex=0;
 const idleFrames=[1,2,5,8];
 function idle(){if(!document.hidden){const frame=idleFrames[idleIndex++%idleFrames.length];r.style.backgroundPosition=cell(frame);r.style.opacity="1";d.style.opacity="0";setTimeout(()=>{r.style.opacity="0";d.style.opacity="1"},420)}}
 idleTimer=setInterval(idle,2600);
 b.addEventListener("DOMNodeRemoved",()=>clearInterval(idleTimer),{once:true});
}
b.addEventListener("click",boop);return b}
const initialBig=sprite("bunny",136,"preview",true);initialBig.id="bigMascot";big.replaceWith(initialBig);big=initialBig;
function choose(name){selected=name;const label=name==="sheep"?"Sheep":name.charAt(0).toUpperCase()+name.slice(1);const next=sprite(name,136,label,true);next.id="bigMascot";big.replaceWith(next);big=next;document.getElementById("previewTitle").textContent=label.charAt(0).toUpperCase()+label.slice(1)+" is your Buddy!";document.getElementById("previewText").textContent="Tap your Buddy to see its reaction.";button.disabled=false;button.style.display="block";render()}
function render(){grid.innerHTML="";names.forEach(name=>{const card=document.createElement("button");card.type="button";card.className="buddy"+(selected===name?" selected":"");const m=sprite(name,82,name);m.tabIndex=-1;card.append(m);const n=document.createElement("span");n.className="mascot-name";n.textContent=name.replace(/-/g," ");const s=document.createElement("span");s.className="selected-label";s.textContent=selected===name?"✓ SELECTED":"";card.append(n,s);card.addEventListener("click",()=>choose(name));grid.append(card)})}
render();
const {data:sessionData,error:sessionError}=await supabase.auth.getSession();
if(sessionError)console.error("Supabase session check:",sessionError);
user=sessionData.session?.user||null;
if(!user){location.replace("./login.html");}
else{
 const {data:profile,error}=await supabase.from("profiles").select("child_name,buddy").eq("id",user.id).maybeSingle();
 document.body.style.visibility="visible";
 if(error){
  console.error("Supabase buddy profile lookup failed:",error);
  status.textContent="Profile load nahi hua. Internet check karke refresh karo.";
 }else if(!profile?.child_name){
  location.replace("./child-name.html");
 }else{
  childName=profile.child_name;
  if(profile.buddy?.id){
   localStorage.setItem("kt_buddy_"+user.id,JSON.stringify(profile.buddy));
   location.replace("./index-home.html");
  }
 }
}

button.addEventListener("click",async()=>{
 if(!selected)return;
 const label=(childName||"").trim();
 if(!label){status.textContent="Please enter your child's name first.";return}
 if(!user){status.textContent="Login session not ready. Please wait and try again.";return}
 const selectedBuddy={id:selected,name:label,character:selected,emoji:"",directions:base+selected+"-directions.webp",reactions:base+selected+"-reactions.webp"};
 button.disabled=true;button.textContent="Continue →";status.textContent="";
 const {data:savedProfile,error}=await supabase.from("profiles").upsert({
  id:user.id,
  email:user.email||"",
  display_name:user.user_metadata?.full_name||user.user_metadata?.name||"",
  child_name:label,
  buddy:selectedBuddy,
  updated_at:new Date().toISOString()
 },{onConflict:"id"}).select("id,child_name,buddy").single();
 if(error||!savedProfile?.buddy?.id){
  console.error("Supabase buddy save failed:",error||"Buddy was not confirmed in saved profile");
  status.textContent="Save error: "+(error?.message||"Buddy data confirm nahi hua");
  button.disabled=false;button.textContent="Next →";return;
 }
 localStorage.setItem("kt_child_name_"+user.id,savedProfile.child_name);
 localStorage.setItem("kt_buddy_"+user.id,JSON.stringify(savedProfile.buddy));
 location.replace("./index-home.html");
});
</script></body></html>
