<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff8f2">
<title>Choose Your Buddy • Kids Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#292321;--muted:#877b75;--orange:#ff6a3d;--cream:#fff8f2;--line:#f0e6df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
body{min-height:100dvh;background:radial-gradient(circle at 8% 4%,#ffe8d9 0,transparent 30%),radial-gradient(circle at 95% 28%,#ffeede 0,transparent 28%),var(--cream);padding:calc(16px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900;font-size:15px;letter-spacing:1.6px}.step{font-size:12px;font-weight:900;color:#b36b50;background:#ffeadf;padding:8px 12px;border-radius:30px}
h1{font-size:clamp(29px,8vw,40px);line-height:1.06;margin:8px 0;font-weight:900;letter-spacing:-1.2px}.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.5;font-weight:700}
.preview{display:flex;align-items:center;gap:12px;margin:18px 0 16px;padding:12px 15px;background:#fff;border:1px solid #f3e7df;border-radius:22px;box-shadow:0 8px 24px #8c5a3510}
#bigMascot{width:100px;height:100px;flex:0 0 100px}.preview strong{display:block;font-size:15px}.preview small{color:var(--muted);font-weight:700}
.grid-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px;font-weight:900;font-size:14px}.grid-title span:last-child{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.buddy{border:1.5px solid var(--line);border-radius:19px;background:#fff;padding:7px 5px 9px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;box-shadow:0 5px 14px #8c5a3508;transition:transform .16s,border-color .16s,background .16s}
.buddy:active{transform:scale(.96)}.buddy.selected{border:2px solid var(--orange);background:#fff1e9;box-shadow:0 0 0 3px #ff6a3d18}
.mascot{position:relative;display:block;width:82px;height:82px;flex-shrink:0;border:0;padding:0;background:transparent;appearance:none;cursor:pointer;user-select:none}
.mascot-inner{position:relative;display:block;width:100%;height:100%;transform-origin:50% 78%}
.sheet{position:absolute;inset:0;background-size:300% 300%;background-repeat:no-repeat;pointer-events:none}
.mascot-name{font-size:12px;font-weight:900;text-transform:capitalize}.selected-label{min-height:12px;font-size:9px;font-weight:900;color:var(--orange)}
.buddy .mascot{pointer-events:none}
.footer{position:sticky;bottom:0;padding:16px 0 calc(8px + env(safe-area-inset-bottom));margin-top:10px;background:linear-gradient(transparent,var(--cream) 20%)}
#continue{width:100%;border:0;border-radius:18px;background:linear-gradient(135deg,#ff8158,#f45124);color:#fff;padding:16px;font:900 16px Nunito,sans-serif;box-shadow:0 6px 0 #d9421b,0 12px 22px #f4512430;cursor:pointer}
#continue:disabled{opacity:.42;box-shadow:none;cursor:not-allowed}.status{text-align:center;min-height:20px;margin:10px 0 0;color:#a34d32;font-size:12px;font-weight:800}
@media(min-width:480px){.grid{gap:12px}.buddy{min-height:132px}.mascot{width:92px;height:92px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">KIDS TEACHER</div><div class="step">CHOOSE YOUR BUDDY</div></div>
<h1>Choose your Buddy!</h1><p class="sub">Pick a character you love. Your Buddy will stay with your profile.</p>
<div class="preview"><button id="bigMascot" class="mascot" type="button" aria-label="Boop your selected buddy"></button><div><strong id="previewTitle">Choose your favourite character</strong><small id="previewText">Your buddy will follow your cursor, blink and react when tapped.</small></div></div>
<div class="grid-title"><span>Meet the characters</span><span>58 CHARACTERS</span></div>
<section class="grid" id="buddyGrid" aria-label="Choose a buddy"></section>
<div class="footer"><button id="continue" disabled>Choose this Buddy →</button><p class="status" id="status" role="status"></p></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDidxkZQGLjJO4_Ido5FI6Q0s9vay0E3mA",authDomain:"kids-teacher-4387e.firebaseapp.com",projectId:"kids-teacher-4387e",storageBucket:"kids-teacher-4387e.firebasestorage.app",messagingSenderId:"420221167346",appId:"1:420221167346:web:da7ac80acdfd52339d526b",measurementId:"G-VJVS2ZMNLY"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const names=["afro","astronaut","bald","ballerina","bear","beard","builder","bunny","cap","cat","chef","clockwork","crt","cube","deer","dino","drone","fox","fox-ink","fox-paper","fox-pixel","fox-riso","fox-sketch","frog","gearbot","glasses","grandpa","granny","hamster","hedgehog","hijabi","kamran","knight","koala","lantern","mouse","nurse","otter","owl","panda","penguin","pirate","postbot","pug","raccoon","radio","redpanda","rocket","scientist","scout","sheep","sikh","skater","sloth","tiger","toaster","tv","wizard"];
const base="https://raw.githubusercontent.com/nilbuild/page-mascot/main/public/mascots/";
const grid=document.getElementById("buddyGrid");let big=document.getElementById("bigMascot"),button=document.getElementById("continue"),status=document.getElementById("status");
let user=null,selected=null;
const directions=["up-left","up","up-right","left","center","right","down-left","down","down-right"];
const clockwise=["right","down-right","down","down-left","left","up-left","up","up-right"];
const reactions=["blink","heart","sparkle","surprised","wink","bashful","sleepy","dizzy","delighted"];
function sprite(name,size,label){const b=document.createElement("div");b.className="mascot";b.style.width=size+"px";b.style.height=size+"px";b.setAttribute("aria-label","Boop "+label);const inner=document.createElement("span");inner.className="mascot-inner";const d=document.createElement("span"),r=document.createElement("span");d.className="sheet direction";r.className="sheet reaction";d.style.backgroundImage='url("'+base+name+'-directions.webp")';r.style.backgroundImage='url("'+base+name+'-reactions.webp")';r.style.opacity="0";inner.append(d,r);b.append(inner);let timer=[],boops=0,last=0,sector=-1;function cell(i){return ((i%3)*50)+"% "+(Math.floor(i/3)*50)+"%"}d.style.backgroundPosition=cell(4);r.style.backgroundPosition=cell(0);function boop(){timer.forEach(clearTimeout);timer=[];const now=Date.now();boops=now-last<1600?boops+1:1;last=now;const idx=boops>=4?7:[1,2,8][(boops-1)%3];if(boops>=4)boops=0;r.style.backgroundPosition=cell(idx);r.style.opacity="1";d.style.opacity="0";timer.push(setTimeout(()=>{r.style.opacity="0";d.style.opacity="1"},idx===7?1100:560));if(!matchMedia("(prefers-reduced-motion: reduce)").matches){inner.animate([{transform:"scale(1,1)"},{transform:"scale(1.1,.86)",offset:.18},{transform:"scale(.95,1.08)",offset:.45},{transform:"scale(1.03,.97)",offset:.72},{transform:"scale(1,1)"}],{duration:420})}}
b.addEventListener("click",boop);if(matchMedia("(hover: hover) and (pointer: fine)").matches){window.addEventListener("pointermove",e=>{const box=b.getBoundingClientRect(),dx=e.clientX-(box.left+box.width/2),dy=e.clientY-(box.top+box.height/2);if(Math.hypot(dx,dy)<70){sector=-1;d.style.backgroundPosition=cell(4);return}const angle=Math.atan2(dy,dx),step=Math.PI*2/8;if(sector!==-1&&Math.abs(Math.atan2(Math.sin(angle-sector*step),Math.cos(angle-sector*step)))<step/2+.12)return;sector=(Math.round(angle/step)+8)%8;d.style.backgroundPosition=cell(directions.indexOf(clockwise[sector]))},{passive:true})}return b}
function choose(name){selected=name;const label=name.replace(/-/g," ");big.replaceWith(sprite(name,100,label));big=document.getElementById("bigMascot");document.getElementById("previewTitle").textContent=label.charAt(0).toUpperCase()+label.slice(1)+" is your Buddy!";document.getElementById("previewText").textContent="Tap your Buddy to see its reaction.";button.disabled=false;render()}
function render(){grid.innerHTML="";names.forEach(name=>{const card=document.createElement("button");card.type="button";card.className="buddy"+(selected===name?" selected":"");const m=sprite(name,82,name);m.tabIndex=-1;card.append(m);const n=document.createElement("span");n.className="mascot-name";n.textContent=name.replace(/-/g," ");const s=document.createElement("span");s.className="selected-label";s.textContent=selected===name?"✓ SELECTED":"";card.append(n,s);card.addEventListener("click",()=>choose(name));grid.append(card)})}
render();
onAuthStateChanged(auth,async u=>{if(!u){location.replace("./login.html");return}user=u;try{const snap=await getDoc(doc(db,"users",u.uid));if(snap.exists()&&snap.data().buddy?.id){location.replace("./index-home.html");return}}catch(e){console.error(e);status.textContent="Profile cloud check failed. You can still choose; saving needs Firestore access."}});
button.addEventListener("click",async()=>{if(!user||!selected)return;button.disabled=true;button.textContent="Saving your Buddy…";status.textContent="";try{const label=selected.replace(/-/g," ");await setDoc(doc(db,"users",user.uid),{buddy:{id:selected,name:label,emoji:"",directions:base+selected+"-directions.webp",reactions:base+selected+"-reactions.webp"},displayName:user.displayName||"",email:user.email||"",updatedAt:serverTimestamp()},{merge:true});location.replace("./index-home.html")}catch(e){console.error(e);status.textContent=e.code==="permission-denied"?"Firestore permission denied. Publish firestore.rules in Firebase Console.":"Could not save Buddy: "+(e.code||e.message);button.disabled=false;button.textContent="Choose this Buddy →"}});
</script></body></html>
